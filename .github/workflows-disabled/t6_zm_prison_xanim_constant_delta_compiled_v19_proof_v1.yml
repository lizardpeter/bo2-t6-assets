name: T6 zm_prison constant delta compiled v19 proof v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_zm_prison_xanim_constant_delta_compiled_v19_proof_v1.py'
      - 'tools/t6_xanim_retail_delta_branch_census_v1.py'
      - 'tools/t6_xanim_normalize_v1.py'
      - 'tools/t6_xanim_serialized_walker.py'
      - 'tools/t6_compiled_xanim_v19_delta_v1.py'
      - 'tools/t6_fastfile_expand_pc_v1.c'
      - '.github/workflows/t6_zm_prison_xanim_constant_delta_compiled_v19_proof_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build exact FastFile expander
        run: cc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_ff_expand -lz -lcrypto
      - name: Recover exact retail zm_prison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6_prison proof/xanim
          curl -fL --retry 4 --retry-delay 2 -o /tmp/t6_prison/zm_prison.ff https://r2.houseofkublai.com/bo2/zone/all/zm_prison.ff
          echo 'ebfd53156542bc61e842087879475c7515851ddcc6d4f0ae743099590177dcb1  /tmp/t6_prison/zm_prison.ff' | sha256sum -c -
          /tmp/t6_ff_expand /tmp/t6_prison/zm_prison.ff /tmp/t6_prison/zm_prison.expanded zm_prison
          echo 'e9d334a173d05b2854370822bc2cb16c9d5eb6226254aaf28b726cfedc340487  /tmp/t6_prison/zm_prison.expanded' | sha256sum -c -
          test "$(stat -c %s /tmp/t6_prison/zm_prison.expanded)" -eq 344067743
      - name: Roundtrip every constant translation and quat2 branch
        env:
          PYTHONPATH: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_zm_prison_xanim_constant_delta_compiled_v19_proof_v1.py             --expanded /tmp/t6_prison/zm_prison.expanded             --out proof/xanim/T6_ZM_PRISON_XANIM_CONSTANT_DELTA_COMPILED_V19_PROOF_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/xanim/T6_ZM_PRISON_XANIM_CONSTANT_DELTA_COMPILED_V19_PROOF_V1.json'));s=d['summary']
          assert s['constantTranslationBranchCount']==38
          assert s['constantQuat2BranchCount']==43
          assert s['allSelectedFlatPoolsExhausted'] is True
          assert s['walkerBlockerCount']==0
          assert s['allConstantTranslationsFloat32Exact'] is True
          assert s['allConstantQuat2StoredComponentsExact'] is True
          assert s['allConstantQuat2RotationsEquivalent'] is True
          assert s['maxConstantQuat2RotationOneMinusAbsDot'] <= 2e-7
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/xanim/T6_ZM_PRISON_XANIM_CONSTANT_DELTA_COMPILED_V19_PROOF_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist prison constant-delta compiled-v19 proof'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_ZM_PRISON_XANIM_CONSTANT_DELTA_COMPILED_V19_PROOF_V1
          path: proof/xanim/T6_ZM_PRISON_XANIM_CONSTANT_DELTA_COMPILED_V19_PROOF_V1.json
          if-no-files-found: warn
