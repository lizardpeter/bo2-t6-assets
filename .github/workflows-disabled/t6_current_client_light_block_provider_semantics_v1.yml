name: T6 current client light block provider semantics v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_light_block_provider_semantics_v1.py'
      - 'proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_CODE_MATRIX_GETTER_SEMANTICS_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_LIGHT_CONST_VERSION_WRITER_XREFS_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_LIGHT_WRITER_786210_PROBE_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_LIGHT_WRITER_786210_CALLERS_V1.json'
      - '.github/workflows/t6_current_client_light_block_provider_semantics_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Project exact 12-light provider family
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_light_block_provider_semantics_v1.py             --denominator proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json             --getter proof/current_client/T6_CURRENT_CLIENT_CODE_MATRIX_GETTER_SEMANTICS_V1.json             --version-xrefs proof/current_client/T6_CURRENT_CLIENT_LIGHT_CONST_VERSION_WRITER_XREFS_V1.json             --writer proof/current_client/T6_CURRENT_CLIENT_LIGHT_WRITER_786210_PROBE_V1.json             --callers proof/current_client/T6_CURRENT_CLIENT_LIGHT_WRITER_786210_CALLERS_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_LIGHT_BLOCK_PROVIDER_SEMANTICS_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_LIGHT_BLOCK_PROVIDER_SEMANTICS_V1.json'))
          s=d['summary']
          assert s['currentClientProviderClosed'] is True
          assert s['runtimeInputCount']==12
          assert s['retainedSpecialOccurrenceCount']==1189
          assert s['allValueLanesHaveExactWriter'] is True
          assert s['allVersionSlotsHaveExactWriter'] is True
          assert s['selectedRuntimeRecordStrideBytes']==0x160
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_LIGHT_BLOCK_PROVIDER_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact 12-light provider semantics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_LIGHT_BLOCK_PROVIDER_SEMANTICS_V1
          path: proof/current_client/T6_CURRENT_CLIENT_LIGHT_BLOCK_PROVIDER_SEMANTICS_V1.json
          if-no-files-found: error
