name: T6 zero-asset Secondary dependency join v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_sndalias_zero_secondary_join_v1.py'
      - 'tools/test_t6_sndalias_zero_secondary_join_v1.py'
      - '.github/workflows/t6_sndalias_zero_secondary_join_v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZERO_RUN: '34178852305'
      ZERO_ARTIFACT: T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1
      ALIAS_RUN: '34177086929'
      ALIAS_ARTIFACT: T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1
      PHYSICAL_JOIN_RUN: '34178324098'
      PHYSICAL_JOIN_ARTIFACT: T6_AUDIO_ALIAS_PHYSICAL_JOIN_V1
    steps:
      - uses: actions/checkout@v4

      - name: Test fail-closed Secondary join
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/test_t6_sndalias_zero_secondary_join_v1.py

      - name: Download exact retained source artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/zero /tmp/alias /tmp/physical /tmp/proof
          gh run download "$ZERO_RUN" --repo "$GITHUB_REPOSITORY" --name "$ZERO_ARTIFACT" --dir /tmp/zero
          gh run download "$ALIAS_RUN" --repo "$GITHUB_REPOSITORY" --name "$ALIAS_ARTIFACT" --dir /tmp/alias
          gh run download "$PHYSICAL_JOIN_RUN" --repo "$GITHUB_REPOSITORY" --name "$PHYSICAL_JOIN_ARTIFACT" --dir /tmp/physical
          test -f /tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json
          test -f /tmp/alias/T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1.json
          test -f /tmp/physical/T6_AUDIO_ALIAS_PHYSICAL_JOIN_V1.json
          sha256sum /tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json | tee /tmp/proof/zero_manifest_sha256.txt
          sha256sum /tmp/alias/T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1.json | tee /tmp/proof/alias_manifest_sha256.txt
          sha256sum /tmp/physical/T6_AUDIO_ALIAS_PHYSICAL_JOIN_V1.json | tee /tmp/proof/physical_join_sha256.txt
          cat > /tmp/proof/source_artifacts.txt <<EOF
          zero_run=$ZERO_RUN
          zero_artifact=$ZERO_ARTIFACT
          zero_artifact_digest=sha256:12be3d7b1fbfacdc0a46fc8912355721815202a34c720f14ef5d932b09019483
          alias_run=$ALIAS_RUN
          alias_artifact=$ALIAS_ARTIFACT
          alias_artifact_digest=sha256:7aa3a37ac803a49d0b629cad446c1475edd682a328d2d39cce07c1fce19eac8a
          physical_join_run=$PHYSICAL_JOIN_RUN
          physical_join_artifact=$PHYSICAL_JOIN_ARTIFACT
          physical_join_artifact_digest=sha256:3ab090b1b4518bd34c5d6808c95b80ca1da540010036188dc82f90a59bda28b5
          EOF

      - name: Join inline Secondary names to complete alias and physical-backed universe
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/t6_sndalias_zero_secondary_join_v1.py \
            --zero /tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json \
            --aliases /tmp/alias/T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1.json \
            --physical-join /tmp/physical/T6_AUDIO_ALIAS_PHYSICAL_JOIN_V1.json \
            --out /tmp/proof/T6_SNDALIAS_ZERO_SECONDARY_JOIN_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/proof/T6_SNDALIAS_ZERO_SECONDARY_JOIN_V1.json',encoding='utf-8'))
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          print('TARGETS')
          for row in d['secondaryTargets']:
              print(row['classification'], row['occurrenceCount'], row['secondaryAliasIdHex'], row['secondaryName'])
          PY

      - name: Upload exact Secondary join
        uses: actions/upload-artifact@v4
        with:
          name: T6_SNDALIAS_ZERO_SECONDARY_JOIN_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
