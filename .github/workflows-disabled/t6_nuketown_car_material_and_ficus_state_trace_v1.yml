name: T6 Nuketown car material and Ficus state trace v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_nuketown_car_material_and_ficus_state_trace_v1.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and expand exact retail FastFile
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 -o /tmp/mp_nuketown_2020.ff https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/mp_nuketown_2020.ff' | sha256sum -c -
          gcc -O2 tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_expand -lz -lcrypto
          /tmp/t6_expand /tmp/mp_nuketown_2020.ff /tmp/mp_nuketown_2020.expanded.bin mp_nuketown_2020
          echo '7e791fb90a085f3bff9e0df895e5a232fa91cc43bcd0027225fe811f7891d505  /tmp/mp_nuketown_2020.expanded.bin' | sha256sum -c -
      - name: Trace exact LOD0 Material handles and Ficus GfxStateBits
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 - <<'PY'
          import base64,hashlib,json,struct,zlib
          from pathlib import Path
          from t6_xmodel_serialized_walker import XModelWalker
          from t6_xmodel_mesh_normalize_v2 import Normalizer
          from t6_clipmap_normalize_v5 import parse_top_level_xasset_table
          from t6_clipmap_normalize_v6 import walk_map_prefix_stringtable

          data=Path('/tmp/mp_nuketown_2020.expanded.bin').read_bytes()
          table=parse_top_level_xasset_table(data); prefix=walk_map_prefix_stringtable(data,table); logical=prefix['logicalToText']
          targets={'ficus':24530208,'car01':44523322,'car02':41469954}
          report={'format':'t6-nuketown-car-material-and-ficus-state-trace-v1','expandedSha256':hashlib.sha256(data).hexdigest(),'models':{}}

          def decode_state(w0,w1):
            src=w0&0xF; dst=(w0>>4)&0xF; op=(w0>>8)&0x7
            at_disabled=(w0>>11)&1; at_mode=(w0>>12)&1; cull=(w0>>14)&0x3
            srca=(w0>>16)&0xF; dsta=(w0>>20)&0xF; opa=(w0>>24)&0x7
            nontrivial=(op!=0) and not (src==2 and dst==1)
            if nontrivial: alpha='BLEND'; cutoff=None; reason='nontrivial-retail-blend'
            elif not at_disabled: alpha='MASK'; cutoff=0.5 if at_mode else 1/255; reason='retail-alpha-test-ge128' if at_mode else 'retail-alpha-test-gt0'
            else: alpha='OPAQUE'; cutoff=None; reason='retail-alpha-test-disabled-and-no-blend'
            return {'srcBlendRgb':src,'dstBlendRgb':dst,'blendOpRgb':op,'alphaTestDisabled':bool(at_disabled),'alphaTestMode':at_mode,'cullFace':cull,
                    'srcBlendAlpha':srca,'dstBlendAlpha':dsta,'blendOpAlpha':opa,'alphaMode':alpha,'alphaCutoff':cutoff,'doubleSided':cull==1,'reason':reason}

          def choose_state(fixed,state_count):
            entries=list(data[fixed+48:fixed+84])
            lit=[x for x in entries[4:26] if x!=255]
            if lit:
              bad=[x for x in lit if x>=state_count]
              if bad: raise SystemExit(f'state entries out of range: {bad} / {state_count}')
              uniq=sorted(set(lit))
              if len(uniq)!=1: return None,'lit-disagree',entries
              return uniq[0],'lit-technique-consensus',entries
            u,e=entries[2],entries[3]
            if u!=255 and e!=255 and u<state_count and e<state_count and u==e:
              return u,'unlit-emissive-consensus',entries
            return None,'no-visible-color-consensus',entries

          walks={}
          for key,start in targets.items():
            d=XModelWalker(data,start).walk_xmodel(); walks[key]=d; x=d['xmodel']
            if d['blockers']: raise SystemExit(f'{key}: blockers {d["blockers"]}')
            mesh=Normalizer(data,start,logical_to_text=logical).normalize()
            if mesh['identity']['name']!=x['name']: raise SystemExit(f'{key}: walker/normalizer identity drift')
            lod0=mesh['xmodel']['lods'][0]; si=int(lod0['surfIndex']); sn=int(lod0['numSurfs']); handles=x['materialHandles']
            bysec={s['name']:s for s in d['sections']}
            inline=[]
            for m in (d.get('details') or {}).get('inlineMaterials',[]):
              mm=dict(m); fs=bysec.get(m['label']+'.Material.fixed'); ts=bysec.get(m['label']+'.Material.textureTable.fixed'); ss=bysec.get(m['label']+'.Material.stateBitsTable')
              mm['fixedStart']=fs['start'] if fs else None; mm['textureTableStart']=ts['start'] if ts else None; mm['stateBitsTableStart']=ss['start'] if ss else None
              tex=[]
              if ts:
                for j in range(m['textureCount']):
                  b=ts['start']+16*j; p=struct.unpack_from('<I',data,b+12)[0]
                  rec={'slot':j,'nameHash':struct.unpack_from('<I',data,b)[0],'nameStart':data[b+4],'nameEnd':data[b+5],'samplerState':data[b+6],'semantic':data[b+7],'imagePointerRaw':f'0x{p:08X}'}
                  if p not in (0,0xFFFFFFFF,0xFFFFFFFE):
                    enc=(p-1)&0xffffffff; rec['imagePointer']={'kind':'packed','block':enc>>29,'offset':enc&0x1fffffff}
                  else: rec['imagePointer']={'kind':'null' if p==0 else 'following' if p==0xffffffff else 'insert'}
                  prefix2=f"{m['label']}.Material.textureTable[{j}].image.GfxImage"; ns=bysec.get(prefix2+'.name')
                  if ns:
                    a=ns['start']; e=data.index(b'\0',a); rec['inlineImageName']=data[a:e].decode('latin1')
                  tex.append(rec)
              mm['textures']=tex; inline.append(mm)
            row={'name':x['name'],'fixedSourceStart':start,'numSurfs':x['numSurfs'],'lod0':lod0,'lod0MaterialHandles':[],'inlineMaterials':inline}
            for i in range(si,si+sn): row['lod0MaterialHandles'].append({'surfaceIndex':i,'handle':handles[i]})
            report['models'][key]=row
            print('MODEL',key,x['name'],'LOD0',si,sn)
            for rr in row['lod0MaterialHandles']: print('HANDLE',key,json.dumps(rr,sort_keys=True))
            for m in inline: print('INLINE_MAT',key,json.dumps(m,sort_keys=True))

          fd=walks['ficus']; bysec={s['name']:s for s in fd['sections']}; fdetails=(fd.get('details') or {}).get('inlineMaterials',[])
          want={'mlv/mtl_p6_tree_ficus_lrg_01_bark1','mlv/t5_foliage_tree_standard_gobo_128','mlv/mtl_p6_tree_ficus_lrg_01_foliage_noshadow_sway'}
          states=[]
          for m in fdetails:
            if m['name'] not in want: continue
            fs=bysec[m['label']+'.Material.fixed']['start']; ss=bysec.get(m['label']+'.Material.stateBitsTable')
            if not ss: raise SystemExit(f"{m['name']}: missing inline state table")
            idx,selection,entries=choose_state(fs,int(m['stateBitsCount']))
            row={'material':m['name'],'materialFixedStart':fs,'stateBitsCount':m['stateBitsCount'],'selection':selection,'stateBitsEntry':entries,'stateBitsTableStart':ss['start']}
            if idx is not None:
              q=ss['start']+20*idx; w0,w1=struct.unpack_from('<II',data,q); row.update({'stateBitsIndex':idx,'loadBits0':f'0x{w0:08X}','loadBits1':f'0x{w1:08X}',**decode_state(w0,w1)})
            states.append(row); print('FICUS_STATE',json.dumps(row,sort_keys=True))
          if {r['material'] for r in states}!=want: raise SystemExit('did not recover all Ficus LOD0 states')
          report['ficusRenderStates']=states

          p=Path('manifests/maps/mp_nuketown_2020/T6_NUKETOWN_PACKED_MATERIAL_IMAGE_BINDINGS_V1.json.zlib.b64')
          bind=json.loads(zlib.decompress(base64.b64decode(p.read_bytes().strip())))
          print('PACKED_BIND_SUMMARY',json.dumps(bind['summary'],sort_keys=True))
          print('PACKED_BIND_FIRST',json.dumps(bind['materials'][:3],sort_keys=True))
          offs=[]
          for key in ('car01','car02'):
            for rr in report['models'][key]['lod0MaterialHandles']:
              h=rr['handle']
              if h.get('kind')=='packed' and h.get('block')==5: offs.append(int(h['offset']))
          report['carLod0PackedMaterialOffsets']=sorted(set(offs)); report['packedBindingManifestSummary']=bind['summary']
          Path('/tmp/trace.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_CAR_MATERIAL_AND_FICUS_STATE_TRACE_V1
          path: /tmp/trace.json
          if-no-files-found: error
