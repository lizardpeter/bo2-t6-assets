name: T6 current Plutonium XAudio2 BufferEnd probe v4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_current_plutonium_xaudio2_bufferend_probe_v4.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PE/disassembly helpers
        run: python3 -m pip install --disable-pip-version-check 'pefile==2024.8.26' 'capstone==5.0.6'
      - name: Resolve BufferEnd callback state and callees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof
          python3 - <<'PY'
          import hashlib,json,struct,urllib.request
          from pathlib import Path
          import pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_REG_INVALID

          REV=5346; SIZE=13263640
          SHA1='f101e28c3a18ce1ffe37a40d23cd04f7f57925d3'; SHA256='770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf'
          INFO='https://cdn.plutoniummod.com/updater/prod/info.json'
          EXPECT={'voiceVtable':0x00C5E724,'onBufferEnd':0x00479280,'bufferEndSignalCallee':0x00651C30,'engineCriticalCallee':0x00674FD0,'callbackObject':0x01016B04,'signalObject':0x01016B08,'pendingCount':0x01016B0C}
          def req(c,m):
            if not c: raise RuntimeError(m)
          def get(url,t=180):
            q=urllib.request.Request(url,headers={'User-Agent':'bo2-t6-assets-xaudio2-bufferend-v4/1'})
            with urllib.request.urlopen(q,timeout=t) as f: req(f.status==200,f'HTTP {f.status}'); return f.read()
          info=json.loads(get(INFO,60).decode()); req(info.get('revision')==REV,'revision changed')
          fs=[x for x in info.get('files',[]) if isinstance(x,dict) and str(x.get('name','')).replace('\\','/').lower()=='games/t6mp.exe']
          req(len(fs)==1 and int(fs[0]['size'])==SIZE and str(fs[0]['hash']).lower()==SHA1,'manifest client changed')
          raw=get(info['baseUrl']+SHA1); req(len(raw)==SIZE and hashlib.sha1(raw).hexdigest()==SHA1 and hashlib.sha256(raw).hexdigest()==SHA256,'client bytes changed')
          pe=pefile.PE(data=raw,fast_load=False); base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:
            secs.append({'name':s.Name.rstrip(b'\0').decode('ascii','replace'),'rawOffset':s.PointerToRawData,'rawSize':s.SizeOfRawData,'rva':s.VirtualAddress,'va':base+s.VirtualAddress,'virtualSize':s.Misc_VirtualSize,'characteristics':s.Characteristics})
          def vaoff(v):
            for s in secs:
              if s['va']<=v<s['va']+s['rawSize']: return s['rawOffset']+v-s['va']
            return None
          def offloc(o):
            for s in secs:
              if s['rawOffset']<=o<s['rawOffset']+s['rawSize']: return {'fileOffset':o,'section':s['name'],'rva':s['rva']+o-s['rawOffset'],'va':s['va']+o-s['rawOffset']}
            return {'fileOffset':o}
          def u32o(o): return struct.unpack_from('<I',raw,o)[0]
          def ptr(v):
            o=vaoff(v); req(o is not None,f'VA not raw-backed: {v:#x}'); return u32o(o)
          # Reassert exact voice vtable recovered in v3.
          vto=vaoff(EXPECT['voiceVtable']); req(vto is not None,'voice vtable not raw-backed')
          vt=[u32o(vto+4*i) for i in range(7)]
          req(vt==[0x006CD320,0x00569CD0,0x00569CD0,0x006CD320,0x00479280,0x006CD320,0x005069C0],f'voice vtable changed: {vt}')
          # Global callback object begins with its exact vptr.
          req(ptr(EXPECT['callbackObject'])==EXPECT['voiceVtable'],'global callback object vptr mismatch')

          imports={}
          if hasattr(pe,'DIRECTORY_ENTRY_IMPORT'):
            for d in pe.DIRECTORY_ENTRY_IMPORT:
              dll=d.dll.decode('ascii','replace') if d.dll else ''
              for imp in d.imports:
                imports[imp.address]={'dll':dll,'name':imp.name.decode('ascii','replace') if imp.name else None,'ordinal':imp.ordinal,'iatVa':imp.address}

          md=Cs(CS_ARCH_X86,CS_MODE_32); md.detail=True
          def maybe_string(v):
            o=vaoff(v)
            if o is None: return None
            b=raw[o:o+160]
            z=b.find(b'\0')
            if z<=0: return None
            q=b[:z]
            if len(q)<4 or any(c<0x20 or c>0x7e for c in q): return None
            try:return q.decode('ascii')
            except:return None
          def disasm_window(v,n=192):
            o=vaoff(v); req(o is not None,f'code VA not raw-backed {v:#x}')
            rows=[]
            for ins in md.disasm(raw[o:o+n],v):
              r={'va':ins.address,'bytes':bytes(ins.bytes).hex(),'mnemonic':ins.mnemonic,'opStr':ins.op_str,'resolvedImports':[],'resolvedStrings':[]}
              seen=set()
              for op in ins.operands:
                vals=[]
                if op.type==X86_OP_IMM: vals.append(op.imm&0xffffffff)
                elif op.type==X86_OP_MEM and op.mem.base==X86_REG_INVALID and op.mem.index==X86_REG_INVALID: vals.append(op.mem.disp&0xffffffff)
                for x in vals:
                  if x in imports: r['resolvedImports'].append(imports[x])
                  st=maybe_string(x)
                  if st and (x,st) not in seen: r['resolvedStrings'].append({'va':x,'text':st}); seen.add((x,st))
              rows.append(r)
            return rows

          targets=set(EXPECT.values()); xrefs={v:[] for v in targets}
          for s in secs:
            if not(s['characteristics']&0x20000000) or not s['rawSize']: continue
            for ins in md.disasm(raw[s['rawOffset']:s['rawOffset']+s['rawSize']],s['va']):
              hs=set()
              for op in ins.operands:
                if op.type==X86_OP_IMM and (op.imm&0xffffffff) in targets: hs.add(op.imm&0xffffffff)
                elif op.type==X86_OP_MEM and op.mem.base==X86_REG_INVALID and op.mem.index==X86_REG_INVALID and (op.mem.disp&0xffffffff) in targets: hs.add(op.mem.disp&0xffffffff)
              for h in hs: xrefs[h].append({'instructionVa':ins.address,'bytes':bytes(ins.bytes).hex(),'mnemonic':ins.mnemonic,'opStr':ins.op_str})

          globals_dump=[]
          for v in [EXPECT['callbackObject'],EXPECT['signalObject'],EXPECT['pendingCount']]:
            o=vaoff(v); globals_dump.append({'va':v,'location':offloc(o) if o is not None else None,'u32':u32o(o) if o is not None else None,'xrefs':xrefs[v]})

          result={'format':'t6-current-plutonium-xaudio2-bufferend-probe-v4','authority':'exact current Plutonium revision 5346 client only; not historical retail-equivalent','client':{'revision':REV,'bytes':SIZE,'sha1':SHA1,'sha256':SHA256},'voiceCallback':{'vtableVa':EXPECT['voiceVtable'],'vtableEntries':vt,'onBufferEndVa':EXPECT['onBufferEnd'],'onBufferEndDisassembly':disasm_window(EXPECT['onBufferEnd'],48),'onBufferEndXrefs':xrefs[EXPECT['onBufferEnd']]},'globalCallbackState':globals_dump,'bufferEndSignalCallee':{'va':EXPECT['bufferEndSignalCallee'],'xrefs':xrefs[EXPECT['bufferEndSignalCallee']],'disassembly':disasm_window(EXPECT['bufferEndSignalCallee'],192)},'engineCriticalCallee':{'va':EXPECT['engineCriticalCallee'],'xrefs':xrefs[EXPECT['engineCriticalCallee']],'disassembly':disasm_window(EXPECT['engineCriticalCallee'],192)},'summary':{'callbackObjectVptr':ptr(EXPECT['callbackObject']),'signalObjectInitialU32':ptr(EXPECT['signalObject']),'pendingCountInitialU32':ptr(EXPECT['pendingCount']),'signalCalleeImportNames':sorted({i['name'] for r in disasm_window(EXPECT['bufferEndSignalCallee'],192) for i in r['resolvedImports'] if i['name']}),'criticalCalleeImportNames':sorted({i['name'] for r in disasm_window(EXPECT['engineCriticalCallee'],192) for i in r['resolvedImports'] if i['name']})},'proofBoundary':'The callback object/vtable, OnBufferEnd atomic decrement, adjacent global addresses and directly referenced callee machine code are exact for the current client. A callee is named as a platform primitive only if its machine code resolves an exact PE import; otherwise it remains address-labelled.'}
          out=Path('/tmp/proof/T6_CURRENT_PLUTONIUM_XAUDIO2_BUFFEREND_PROBE_V4.json'); out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'summary':result['summary'],'globalXrefs':{hex(g['va']):g['xrefs'] for g in globals_dump},'signalHead':result['bufferEndSignalCallee']['disassembly'][:16],'criticalHead':result['engineCriticalCallee']['disassembly'][:16]},indent=2,sort_keys=True))
          print('result_sha256',hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_PLUTONIUM_XAUDIO2_BUFFEREND_PROBE_V4
          path: /tmp/proof/T6_CURRENT_PLUTONIUM_XAUDIO2_BUFFEREND_PROBE_V4.json
          if-no-files-found: error
          compression-level: 9
