name: T6 Blender Runtime

on:
  workflow_dispatch:

jobs:
  blender-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender 4.5.13 LTS
        shell: bash
        run: |
          set -euxo pipefail
          archive="$RUNNER_TEMP/blender.tar.xz"
          urls=(
            "https://mirror.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz"
            "https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz"
            "https://mirrors.nju.edu.cn/blender/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz"
          )
          ok=0
          for url in "${urls[@]}"; do
            if curl --fail --location --retry 3 --retry-delay 2 --output "$archive" "$url"; then
              ok=1
              break
            fi
          done
          test "$ok" -eq 1
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          blender="$RUNNER_TEMP/blender-4.5.13-linux-x64/blender"
          test -x "$blender"
          "$blender" --version
          echo "BLENDER=$blender" >> "$GITHUB_ENV"

      - name: Run v3 actual Blender importer and adapter regression
        shell: bash
        run: |
          set -euxo pipefail
          "$BLENDER" --background --factory-startup \
            --python tools/test_t6_blender_generated_layer_preview_runtime_v3.py

      - name: Run v4 actual Blender vN DAG importer and adapter regression
        shell: bash
        run: |
          set -euxo pipefail
          "$BLENDER" --background --factory-startup \
            --python tools/test_t6_blender_generated_layer_preview_runtime_v4.py

      - name: Run v7 actual Blender layered-normal importer and adapter regression
        shell: bash
        run: |
          set -euxo pipefail
          "$BLENDER" --background --factory-startup \
            --python tools/test_t6_blender_generated_layer_preview_runtime_v7.py

      - name: Run v8 actual Blender directional-lightmap state regression
        shell: bash
        run: |
          set -euxo pipefail
          "$BLENDER" --background --factory-startup \
            --python tools/test_t6_blender_generated_layer_preview_runtime_v8.py
