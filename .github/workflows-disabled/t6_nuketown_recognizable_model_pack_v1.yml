name: T6 Nuketown recognizable model pack v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_nuketown_recognizable_model_pack_v1.yml'
      - 'tools/t6_xmodel_mesh_normalize_v2.py'
      - 'tools/t6_xmodel_skeleton_normalize_v2.py'
      - 'tools/t6_xanim_skinned_gltf_export_v7.py'
      - 'tools/t6_embedded_gltf_to_glb_v1.py'
      - 'tools/t6_fastfile_expand_pc_v1.c'
      - 'manifests/xmodels/german_shepherd_skin_expectation_v1.json'
      - 'manifests/models/xmodel_skeleton_retail_proof_v1.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and expand exact retail Nuketown FastFile
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 -o /tmp/mp_nuketown_2020.ff https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/mp_nuketown_2020.ff' | sha256sum -c -
          gcc -O2 tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_expand -lz -lcrypto
          /tmp/t6_expand /tmp/mp_nuketown_2020.ff /tmp/mp_nuketown_2020.expanded.bin mp_nuketown_2020
          echo '7e791fb90a085f3bff9e0df895e5a232fa91cc43bcd0027225fe811f7891d505  /tmp/mp_nuketown_2020.expanded.bin' | sha256sum -c -

      - name: Export mannequin and 56-bone German shepherd
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=tools python - <<'PY'
          import hashlib,json,pathlib,zipfile
          from t6_clipmap_normalize_v5 import parse_top_level_xasset_table
          from t6_clipmap_normalize_v6 import walk_map_prefix_stringtable
          from t6_embedded_gltf_to_glb_v1 import convert_gltf_dict,parse_glb
          from t6_xanim_skinned_gltf_export_v7 import export as export_gltf
          from t6_xmodel_mesh_normalize_v2 import Normalizer
          from t6_xmodel_skeleton_normalize_v2 import normalize_skeleton
          from t6_xmodel_serialized_walker import XModelWalker

          EXP='7e791fb90a085f3bff9e0df895e5a232fa91cc43bcd0027225fe811f7891d505'
          data=pathlib.Path('/tmp/mp_nuketown_2020.expanded.bin').read_bytes()
          if hashlib.sha256(data).hexdigest()!=EXP: raise SystemExit('expanded SHA mismatch')
          skel_proof=json.loads(pathlib.Path('manifests/models/xmodel_skeleton_retail_proof_v1.json').read_text())
          if skel_proof['sourceExpandedSha256']!=EXP: raise SystemExit('skeleton proof source drift')
          proof_by_idx={int(x['xassetIndex']):x for x in skel_proof['fixtures']}
          dog_expect=json.loads(pathlib.Path('manifests/xmodels/german_shepherd_skin_expectation_v1.json').read_text())
          expected_dog=dog_expect['expected']

          targets={
            273:{'name':'dest_nt_nuked_female_02_d0','fixedStart':26256479,'kind':'destructible_mannequin'},
            447:{'name':'german_shepherd','fixedStart':35578229,'kind':'skinned_character_fixture'},
          }
          for idx in targets:
            p=proof_by_idx.get(idx)
            if p is None or p['name']!=targets[idx]['name'] or int(p['fixedStart'])!=targets[idx]['fixedStart']:
              raise SystemExit(f'XAsset {idx}: retail skeleton proof mismatch')

          table=parse_top_level_xasset_table(data); prefix=walk_map_prefix_stringtable(data,table); logical=prefix['logicalToText']
          root=pathlib.Path('/tmp/T6_NUKETOWN_RECOGNIZABLE_MODEL_PACK_V1'); root.mkdir(parents=True,exist_ok=True)
          report=[]
          for idx in sorted(targets):
            t=targets[idx]; name=t['name']; start=t['fixedStart']
            walk=XModelWalker(data,start).walk_xmodel()
            if walk['blockers']: raise SystemExit(f'{name}: walker blockers {walk["blockers"]}')
            mesh=Normalizer(data,start,logical_to_text=logical).normalize(); mesh['expandedSha256']=EXP
            if mesh['identity']['name']!=name: raise SystemExit(f'{name}: mesh identity mismatch {mesh["identity"]}')
            skel=normalize_skeleton(data,start,xasset_index=idx,identity_name=name)
            if skel.get('identity',{}).get('name')!=name: raise SystemExit(f'{name}: skeleton identity mismatch')
            gltf=export_gltf(mesh,skel,None,lod=0); glb,glb_stats=convert_gltf_dict(gltf); parsed,_=parse_glb(glb)
            if len(parsed.get('meshes',[]))!=1 or len(parsed.get('skins',[]))!=1: raise SystemExit(f'{name}: GLB cardinality failure')
            skin=gltf['extras']['T6']['skinValidation']; lod0=next(x for x in mesh['xmodel']['lods'] if int(x['index'])==0)
            metrics={
              'bones':len(skel['skeleton']['bones']),'surfaces':int(lod0['numSurfs']),'vertices':int(skin['vertices']),'triangles':int(skin['triangles']),
              'rigidVertices':int(skin['rigidVertices']),'blendedVertices':int(skin['blendedVertices']),'unweightedVertices':int(skin['unweightedVertices']),
              'influenceHistogram':{k:int(v) for k,v in skin['influenceHistogram'].items()},
            }
            if idx==447:
              expected={
                'bones':int(expected_dog['bones']),'surfaces':int(expected_dog['surfaces']),'vertices':int(expected_dog['vertices']),'triangles':int(expected_dog['triangles']),
                'rigidVertices':int(expected_dog['rigidVertices']),'blendedVertices':int(expected_dog['blendedVertices']),'unweightedVertices':int(expected_dog['unweightedVertices']),
                'influenceHistogram':{k:int(v) for k,v in expected_dog['influenceHistogram'].items()},
              }
              if metrics!=expected: raise SystemExit(f'german_shepherd retail skin census mismatch: actual={metrics} expected={expected}')
            stem=name; d=root/stem; d.mkdir(parents=True,exist_ok=True)
            mb=(json.dumps(mesh,indent=2,sort_keys=True)+'\n').encode(); sb=(json.dumps(skel,indent=2,sort_keys=True)+'\n').encode(); gb=(json.dumps(gltf,indent=2,sort_keys=True)+'\n').encode()
            (d/'mesh.normalized.json').write_bytes(mb); (d/'skeleton.normalized.json').write_bytes(sb); (d/f'{stem}_lod0.gltf').write_bytes(gb); (d/f'{stem}_lod0.glb').write_bytes(glb)
            r={'xassetIndex':idx,'name':name,'kind':t['kind'],'fixedSourceStart':start,'serialized':{'bytes':walk['assetSerializedBytes'],'sha256':walk['assetSerializedSha256']},
               'lod0':metrics,'meshNormalized':{'bytes':len(mb),'sha256':hashlib.sha256(mb).hexdigest()},'skeletonNormalized':{'bytes':len(sb),'sha256':hashlib.sha256(sb).hexdigest()},
               'gltf':{'bytes':len(gb),'sha256':hashlib.sha256(gb).hexdigest()},'glb':glb_stats,
               'validation':{'walkerBlockers':0,'allVerticesWeighted':bool(skin['allVerticesWeighted']),'gltfExporterValidationPassed':True,'glbRoundTripValidationPassed':True,'retailExpectedCensusMatched':idx==447}}
            report.append(r); print('MODEL_OK',json.dumps(r,sort_keys=True))

          manifest={'format':'t6-nuketown-recognizable-model-pack-v1','sourceExpandedSha256':EXP,'modelCount':len(report),'models':report,
                    'proofBoundary':'Exact retail expanded bytes + pre-existing retail skeleton fixtures + exact packed/inline name resolution + unchanged mesh decoder + strict skin validation + deterministic GLB container conversion.',
                    'materialsAttached':False}
          man=(json.dumps(manifest,indent=2,sort_keys=True)+'\n').encode(); (root/'T6_NUKETOWN_RECOGNIZABLE_MODEL_PACK_V1.json').write_bytes(man)
          pathlib.Path('manifests/maps/mp_nuketown_2020/T6_NUKETOWN_RECOGNIZABLE_MODEL_PACK_V1.json').write_bytes(man)
          dog=next(r for r in report if r['xassetIndex']==447)
          dogproof={'format':'t6-german-shepherd-bindpose-glb-proof-v1','sourceExpandedSha256':EXP,'expectationManifest':'manifests/xmodels/german_shepherd_skin_expectation_v1.json','result':dog,
                    'expectedCensusMatchedExactly':True,'independentLoaderValidation':'pending-external-loader-check'}
          pathlib.Path('manifests/xmodels/german_shepherd_bindpose_glb_proof_v1.json').write_text(json.dumps(dogproof,indent=2,sort_keys=True)+'\n')
          cp=pathlib.Path('checkpoints/T6_NUKETOWN_RECOGNIZABLE_MODEL_PACK_V1_2026-09-06.md')
          lines=['# T6 Nuketown recognizable model pack v1 — 2026-09-06','',
                 'A destructible Nuketown mannequin and the full 56-bone retail German shepherd now export as standalone LOD0 GLBs from the exact map FastFile.','',
                 '## Result','',f'- models exported: **{len(report)} / 2**','- source/walker/skin/export/GLB failures: **0**','']
          for r in report:
            m=r['lod0']; lines += [f"### `{r['name']}`",'',f"- XAsset: **{r['xassetIndex']}**; bones: **{m['bones']}**; LOD0 surfaces: **{m['surfaces']}**",
              f"- vertices / triangles: **{m['vertices']:,} / {m['triangles']:,}**",f"- rigid / blended / unweighted vertices: **{m['rigidVertices']:,} / {m['blendedVertices']:,} / {m['unweightedVertices']}**",
              f"- GLB bytes: **{r['glb']['glbBytes']:,}**",f"- GLB SHA-256: `{r['glb']['glbSha256']}`",'']
          lines += ['## German shepherd closure','',
                    'The regenerated shepherd matches the previously retained retail census exactly: **56 bones, 3 LOD0 surfaces, 5,731 vertices, 7,123 triangles, 1,177 rigid vertices, 4,554 blended vertices, 0 unweighted vertices**, with the exact stored 1/2/3/4-influence histogram. This closes the deterministic regeneration and strict skin-binding part of the earlier pending fixture requirement.','',
                    'An independent loader check is intentionally recorded separately rather than claimed by this exporter workflow.','',
                    '## Material boundary','', 'Materials/textures are not yet attached to these GLBs; that remains a separate exact Material/Image provenance pass.','',
                    f'- manifest SHA-256: `{hashlib.sha256(man).hexdigest()}`','']
          cp.write_text('\n'.join(lines),encoding='utf-8')
          zp=pathlib.Path('/tmp/T6_NUKETOWN_RECOGNIZABLE_MODEL_PACK_V1.zip')
          with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              zi=zipfile.ZipInfo(p.relative_to(root).as_posix(),date_time=(1980,1,1,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16
              z.writestr(zi,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          print(json.dumps({'zipBytes':zp.stat().st_size,'zipSha256':hashlib.sha256(zp.read_bytes()).hexdigest(),'models':report},indent=2,sort_keys=True))
          PY

      - name: Commit recognizable-model checkpoint
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifests/maps/mp_nuketown_2020/T6_NUKETOWN_RECOGNIZABLE_MODEL_PACK_V1.json \
                  manifests/xmodels/german_shepherd_bindpose_glb_proof_v1.json \
                  checkpoints/T6_NUKETOWN_RECOGNIZABLE_MODEL_PACK_V1_2026-09-06.md
          if git diff --cached --quiet; then echo 'No generated changes to commit.'; else
            git commit -m 'Export Nuketown mannequin and German shepherd models'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_RECOGNIZABLE_MODEL_PACK_V1
          path: /tmp/T6_NUKETOWN_RECOGNIZABLE_MODEL_PACK_V1.zip
          if-no-files-found: error
          compression-level: 0
