name: T6 Material_CreateLayered semantic probe v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_material_create_layered_semantics_probe_v1.yml'
      - 'tools/t6_pc_server_material_create_layered_probe_v1.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXE_ID: 1NhLTmevZ5HPKRByj1ok8BpwbvX_5rc1n
      MAP_ID: 1kcCFEDP-gubgUyN6R_WjlJpFGoeZNEmd
      EXE_SHA256: f67eb68a494b93b5b229985205bdc94e26fdfe677663410e2207c25f6f27a55d
      MAP_SHA256: 34e16e517072031629307ffa0520d59f3c586539b943d081f60c59ee9ce1c3bf
    steps:
      - uses: actions/checkout@v4

      - name: Download exact PC dedicated-server references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref /tmp/probe
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.exe "https://drive.usercontent.google.com/download?id=$EXE_ID&export=download&confirm=t"
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.map "https://drive.usercontent.google.com/download?id=$MAP_ID&export=download&confirm=t"
          echo "$EXE_SHA256  /tmp/ref/CoDMPServer_PC.exe" | sha256sum -c -
          echo "$MAP_SHA256  /tmp/ref/CoDMPServer_PC.map" | sha256sum -c -

      - name: Install pinned disassembler
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6

      - name: Probe exact Material_CreateLayered body
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_pc_server_material_create_layered_probe_v1.py \
            /tmp/ref/CoDMPServer_PC.exe \
            /tmp/ref/CoDMPServer_PC.map \
            /tmp/probe/T6_PC_SERVER_MATERIAL_CREATE_LAYERED_PROBE_V1.json \
            | tee /tmp/probe/summary.txt
          sha256sum /tmp/probe/T6_PC_SERVER_MATERIAL_CREATE_LAYERED_PROBE_V1.json \
            | tee /tmp/probe/result_sha256.txt

      - name: Emit exact call and string census
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/probe/call_string_census.txt
          import json
          p='/tmp/probe/T6_PC_SERVER_MATERIAL_CREATE_LAYERED_PROBE_V1.json'
          d=json.load(open(p))
          print('FUNCTION', d['function'])
          print('CALLS')
          for row in d['calls']:
              print(row)
          print('ASCII_REFS')
          for row in d['asciiReferences']:
              print(row)
          print('ABSOLUTE_REFS')
          for row in d['absoluteReferences']:
              print(row)
          PY

      - name: Emit exact semantic instruction windows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/probe/semantic_windows.txt
          import json
          p='/tmp/probe/T6_PC_SERVER_MATERIAL_CREATE_LAYERED_PROBE_V1.json'
          d=json.load(open(p))
          rows=d['instructions']
          interesting_calls={
              '0x0078DFD0':'I_strncpyz',
              '0x0078E510':'I_strncat',
              '0x00A2A710':'R_HashString',
              '0x00A4D980':'Material_CreateLayeredStateBitsTable',
              '0x00A4D220':'Material_SetStateBits',
              '0x00A4C8C0':'Material_SetMaterialDrawRegion',
              '0x00A4D550':'Material_Validate',
              '0x00AAE500':'strncpy',
              '0x00AAFB40':'strstr',
              '0x00AAD640':'memset',
              '0x00AAE010':'qsort',
          }
          interesting_strings={
              '0x00D1C9C4':'_mature',
              '0x00D1C9D0':'constant-count assertion',
              '0x00D1CA60':'texture-count assertion',
              '0x00D1CAE4':'layer-count assertion',
              '0x00D1CB00':'colorTint',
              '0x00C67D50':'colorWhite',
              '0x00C67D54':'colorWhite.y',
              '0x00C67D58':'colorWhite.z',
              '0x00C67D5C':'colorWhite.w',
          }
          hits=[]
          for i,row in enumerate(rows):
              labels=[]
              for t in row.get('directTargets',[]):
                  if t['va'] in interesting_calls:
                      labels.append(interesting_calls[t['va']])
              for op in row.get('operands',[]):
                  va=op.get('value') if op.get('type')=='imm' else op.get('dispU32') if op.get('type')=='mem' and op.get('absolute') else None
                  if va in interesting_strings:
                      labels.append(interesting_strings[va])
              if labels:
                  hits.append((i,sorted(set(labels))))
          if not hits:
              raise SystemExit('no semantic-window anchors')
          print('SEMANTIC_ANCHOR_COUNT',len(hits))
          for ordinal,(i,labels) in enumerate(hits,1):
              print(f'\n=== WINDOW {ordinal}: {", ".join(labels)} @ {rows[i]["address"]} ===')
              lo=max(0,i-12); hi=min(len(rows),i+17)
              for j in range(lo,hi):
                  r=rows[j]
                  mark='>>' if j==i else '  '
                  print(f'{mark} {r["address"]} {r["bytes"]:<30} {r["mnemonic"]:<8} {r["opStr"]}')

          # Also expose accesses to the already-proven generated Material table/count
          # fields and nearby small structure offsets without assigning semantics.
          exact_disps={0x54,0x55,0x60,0x64}
          print('\n=== EXACT MATERIAL FIELD ACCESS CENSUS ===')
          field_hits=0
          for r in rows:
              matched=[]
              for op in r.get('operands',[]):
                  if op.get('type')=='mem' and not op.get('absolute') and op.get('dispSigned') in exact_disps:
                      matched.append(op.get('dispSigned'))
              if matched:
                  field_hits+=1
                  print(r['address'],r['bytes'],r['mnemonic'],r['opStr'],'DISPS',matched)
          print('EXACT_MATERIAL_FIELD_HIT_COUNT',field_hits)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_PC_SERVER_MATERIAL_CREATE_LAYERED_PROBE_V1
          path: /tmp/probe
          if-no-files-found: error
          compression-level: 9
