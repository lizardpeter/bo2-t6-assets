name: T6 native OAT zero Secondary common canary v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_oat_zero_secondary_resolver_v1.py'
      - 'tools/test_t6_oat_zero_secondary_resolver_v1.py'
      - 'tools/t6_oat_9dca_gcc_compat_patch_v3.py'
      - '.github/workflows/t6_oat_zero_secondary_common_canary_v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Test native resolver adapter
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/test_t6_oat_zero_secondary_resolver_v1.py

      - name: Restore exact pinned OAT Unlinker cache
        id: oat-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug

      - name: Build or verify pinned OAT Unlinker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof /tmp/game/zone/all /tmp/oat-unlinker-cache
          CACHE_BIN=/tmp/oat-unlinker-cache/Unlinker
          CACHE_META=/tmp/oat-unlinker-cache/source_identity.txt
          EXPECTED_COMMIT=9dca965366541504b71fa8cfb7ac049cb9b717e1
          PATCH_SHA=$(sha256sum tools/t6_oat_9dca_gcc_compat_patch_v3.py | awk '{print $1}')
          if test "${{ steps.oat-cache.outputs.cache-hit }}" = 'true'; then
            test -x "$CACHE_BIN"
            test -f "$CACHE_META"
            grep -qx "oat_commit=$EXPECTED_COMMIT" "$CACHE_META"
            grep -qx "compat_patch_sha256=$PATCH_SHA" "$CACHE_META"
            echo cache_hit=true | tee /tmp/proof/oat_cache.txt
          else
            echo cache_hit=false | tee /tmp/proof/oat_cache.txt
            sudo apt-get update -qq
            sudo apt-get install -y -qq g++-multilib >/dev/null
            git clone -q --recursive https://github.com/Laupetin/OpenAssetTools.git /tmp/oat
            git -C /tmp/oat checkout -q "$EXPECTED_COMMIT"
            test "$(git -C /tmp/oat rev-parse HEAD)" = "$EXPECTED_COMMIT"
            git -C /tmp/oat submodule update -q --init --recursive
            python3 tools/t6_oat_9dca_gcc_compat_patch_v3.py /tmp/oat
            git -C /tmp/oat diff --check
            cd /tmp/oat
            PREMAKE_NO_PROMPT=1 ./generate.sh
            make -C build -j2 config=debug_x86 UnlinkerCli 2>&1 | tee /tmp/proof/oat_build.log
            BIN=$(find build/bin -type f \( -name Unlinker -o -name unlinker \) | head -1)
            test -n "$BIN"
            install -m 0755 "$BIN" "$CACHE_BIN"
            printf 'oat_commit=%s\ncompat_patch_sha256=%s\n' "$EXPECTED_COMMIT" "$PATCH_SHA" > "$CACHE_META"
          fi
          printf 'oat_commit=%s\ncompat_patch_sha256=%s\n' "$EXPECTED_COMMIT" "$PATCH_SHA" > /tmp/proof/oat_source_identity.txt
          sha256sum "$CACHE_BIN" | tee /tmp/proof/unlinker_sha256.txt
          printf '%s\n' "$CACHE_BIN" > /tmp/unlinker_path

      - name: Save exact pinned OAT Unlinker cache
        if: steps.oat-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug

      - name: Download SHA-pinned common_mp FastFile
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 -o /tmp/game/zone/all/common_mp.ff https://r2.houseofkublai.com/bo2/zone/all/common_mp.ff
          echo '93fe48b0f0d8cc6844be875ccad94e0cfcf635f62eeff00ac33f2f668a77cb77  /tmp/game/zone/all/common_mp.ff' | sha256sum -c -
          sha256sum /tmp/game/zone/all/common_mp.ff | tee /tmp/proof/common_mp_ff_sha256.txt

      - name: Download complete retained zero-asset census
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/zero
          gh run download 34178852305 --repo "$GITHUB_REPOSITORY" --name T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1 --dir /tmp/zero
          test -f /tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json
          echo '6a05d394c591c074570751e68429c47ba6f801701826199780994326ae125fed  /tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json' | sha256sum -c -

      - name: Native OAT dump common_mp SoundBank
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(cat /tmp/unlinker_path)
          mkdir -p /tmp/oat_out /tmp/proof
          set +e
          "$BIN" --no-color --verbose --include-assets soundbank --output-folder /tmp/oat_out /tmp/game/zone/all/common_mp.ff \
            2>&1 | tee /tmp/proof/common_mp_soundbank_dump.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "common_mp_soundbank_dump rc=$rc" | tee /tmp/proof/native_dump_return_code.txt
          test "$rc" -eq 0
          CSV=/tmp/oat_out/soundbank/mpl_common.all.aliases.csv
          test -f "$CSV"
          sha256sum "$CSV" | tee /tmp/proof/mpl_common_aliases_csv_sha256.txt
          wc -l "$CSV" | tee /tmp/proof/mpl_common_aliases_csv_line_count.txt

      - name: Resolve common zero-asset Secondary strings from loaded OAT SndBank
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/t6_oat_zero_secondary_resolver_v1.py \
            --zero /tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json \
            --bank-csv mpl_common.all=/tmp/oat_out/soundbank/mpl_common.all.aliases.csv \
            --out /tmp/proof/T6_OAT_ZERO_SECONDARY_COMMON_CANARY_V1.json
          python3 - <<'PY'
          import json
          p='/tmp/proof/T6_OAT_ZERO_SECONDARY_COMMON_CANARY_V1.json'
          d=json.load(open(p,encoding='utf-8'))
          s=d['summary']
          assert s['coveredBankCount']==1
          assert s['coveredZeroAssetOccurrenceCount']==25
          assert s['nonInlineSecondaryPointerOccurrenceCount']==3
          assert s['nonInlineSecondaryResolvedEmptyCount']==0
          assert s['nonInlineSecondaryResolvedNonemptyCount']==3
          print(json.dumps(s,indent=2,sort_keys=True))
          print('NON-INLINE RESOLUTIONS')
          for r in d['rows']:
              if r['rawSecondaryPointerState']=='other_u32':
                  print(r['aliasIdHex'],r['aliasNameResolved'],'->',r['resolvedSecondaryName'],r['resolvedSecondaryAliasIdHex'])
          PY
          sha256sum /tmp/proof/T6_OAT_ZERO_SECONDARY_COMMON_CANARY_V1.json | tee /tmp/proof/resolver_json_sha256.txt

      - name: Upload native common zero Secondary proof
        uses: actions/upload-artifact@v4
        with:
          name: T6_OAT_ZERO_SECONDARY_COMMON_CANARY_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
