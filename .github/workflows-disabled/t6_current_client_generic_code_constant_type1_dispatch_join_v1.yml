name: T6 current client generic code constant type1 dispatch join v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_generic_code_constant_type1_dispatch_join_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_GENERIC_CODE_CONSTANT_SETTER_INDIRECT_DISPATCH_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_GENERIC_CODE_CONSTANT_SETTER_SEMANTICS_V1.json'
      - '.github/workflows/t6_current_client_generic_code_constant_type1_dispatch_join_v1.yml'
permissions:
  contents: write
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Join type1 dispatch contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_generic_code_constant_type1_dispatch_join_v1.py \
            --dispatch proof/current_client/T6_CURRENT_CLIENT_GENERIC_CODE_CONSTANT_SETTER_INDIRECT_DISPATCH_V1.json \
            --setter proof/current_client/T6_CURRENT_CLIENT_GENERIC_CODE_CONSTANT_SETTER_SEMANTICS_V1.json \
            --out proof/current_client/T6_CURRENT_CLIENT_GENERIC_CODE_CONSTANT_TYPE1_DISPATCH_JOIN_V1.json
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_GENERIC_CODE_CONSTANT_TYPE1_DISPATCH_JOIN_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist type1 generic constant dispatch join'
            ok=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_GENERIC_CODE_CONSTANT_TYPE1_DISPATCH_JOIN_V1
          path: proof/current_client/T6_CURRENT_CLIENT_GENERIC_CODE_CONSTANT_TYPE1_DISPATCH_JOIN_V1.json
          if-no-files-found: error
          compression-level: 9
