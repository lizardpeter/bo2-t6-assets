name: T6 current client render target table semantics v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_render_target_table_semantics_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_RENDER_TARGET_HANDLER_PROBE_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_RENDER_COMMAND_TABLE_LOCATOR_V1.json'
      - '.github/workflows/t6_current_client_render_target_table_semantics_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Project exact render-target table geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_render_target_table_semantics_v1.py             --probe proof/current_client/T6_CURRENT_CLIENT_RENDER_TARGET_HANDLER_PROBE_V1.json             --command-table proof/current_client/T6_CURRENT_CLIENT_RENDER_COMMAND_TABLE_LOCATOR_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_RENDER_TARGET_TABLE_SEMANTICS_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_RENDER_TARGET_TABLE_SEMANTICS_V1.json'))
          s=d['summary']
          assert s['recordStrideBytes']==20
          assert s['tableBaseExact'] and s['widthHeightOffsetsExact']
          assert s['record25FirstDwordCallbackExact'] and s['record8FirstDwordAddressDerivedExactly']
          assert d['recordTable']['derivedRecord8FirstDwordVa']=='0x03a267c0'
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_RENDER_TARGET_TABLE_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact render-target table semantics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_RENDER_TARGET_TABLE_SEMANTICS_V1
          path: proof/current_client/T6_CURRENT_CLIENT_RENDER_TARGET_TABLE_SEMANTICS_V1.json
          if-no-files-found: error
