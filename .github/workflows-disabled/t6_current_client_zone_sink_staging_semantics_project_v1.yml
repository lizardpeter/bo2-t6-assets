name: T6 current client zone sink staging semantics proof v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_zone_sink_staging_semantics_project_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_STAGING_WINDOW_PROBE_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_ARGFIELD_PROOF_V1.json'
      - '.github/workflows/t6_current_client_zone_sink_staging_semantics_project_v1.yml'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact current-client staging semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/t6_current_client_zone_sink_staging_semantics_project_v1.py
          python3 tools/t6_current_client_zone_sink_staging_semantics_project_v1.py             --staging proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_STAGING_WINDOW_PROBE_V1.json             --arg-proof proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_ARGFIELD_PROOF_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_STAGING_SEMANTICS_PROOF_V1.json             | tee /tmp/summary.log
          git diff --check
          sha256sum proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_STAGING_SEMANTICS_PROOF_V1.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_STAGING_SEMANTICS_PROOF_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact current-client staging semantics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_ZONE_SINK_STAGING_SEMANTICS_PROOF_V1
          path: |
            proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_STAGING_SEMANTICS_PROOF_V1.json
            /tmp/summary.log
          if-no-files-found: error
          compression-level: 9
