name: T6 Nuketown generated Material texture-table relation v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/t6_generated_material_texture_table_relation_v1.py'
      - '.github/workflows/t6_nuketown_generated_material_texture_relation_v1.yml'

permissions:
  contents: read

jobs:
  relation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblzo2-2 >/dev/null

      - name: Restore exact pinned OAT Unlinker cache
        id: oat-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug

      - name: Require exact pinned OAT Unlinker cache
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.oat-cache.outputs.cache-hit }}" = 'true'
          test -x /tmp/oat-unlinker-cache/Unlinker

      - name: Fetch and expand exact retail Nuketown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source /tmp/proof
          curl -fL --retry 4 -o /tmp/source/mp_nuketown_2020.ff https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/source/mp_nuketown_2020.ff' | sha256sum -c -
          cc -O2 -Wall -Wextra -o /tmp/t6_expand tools/t6_fastfile_expand_pc_v1.c -lz -lcrypto
          /tmp/t6_expand /tmp/source/mp_nuketown_2020.ff /tmp/source/mp_nuketown_2020.expanded.bin mp_nuketown_2020
          echo '7e791fb90a085f3bff9e0df895e5a232fa91cc43bcd0027225fe811f7891d505  /tmp/source/mp_nuketown_2020.expanded.bin' | sha256sum -c -

      - name: Rebuild exact source-derived world catalog
        env:
          PYTHONPATH: tools
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/Laupetin/OpenAssetTools.git /tmp/oat_source
          git -C /tmp/oat_source checkout -q 9dca965366541504b71fa8cfb7ac049cb9b717e1
          python3 tools/t6_nuketown_material_memory_ownership_v1.py \
            --expanded /tmp/source/mp_nuketown_2020.expanded.bin \
            --oat-root /tmp/oat_source \
            --out /tmp/proof/T6_NUKETOWN_MATERIAL_MEMORY_OWNERSHIP_V1.json
          python3 tools/t6_nuketown_world_source_sidecars_v3.py \
            --expanded /tmp/source/mp_nuketown_2020.expanded.bin \
            --ownership-proof /tmp/proof/T6_NUKETOWN_MATERIAL_MEMORY_OWNERSHIP_V1.json \
            --out-dir /tmp/proof/sidecars_v3

      - name: Dump exact native Nuketown Materials
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/oat_map
          mkdir -p /tmp/oat_map
          /tmp/oat-unlinker-cache/Unlinker --no-color --include-assets material --output-folder /tmp/oat_map /tmp/source/mp_nuketown_2020.ff 2>&1 | tee /tmp/proof/oat_material_dump_map.log
          MATROOT=$(find /tmp/oat_map -type d -name materials -print -quit)
          test -n "$MATROOT"
          echo "$MATROOT" >/tmp/material_root
          test "$(find "$MATROOT" -type f -name '*.json' | wc -l)" -eq 822

      - name: Classify exact generated texture-table relations
        env:
          PYTHONPATH: tools
        shell: bash
        run: |
          set -euo pipefail
          MATROOT=$(cat /tmp/material_root)
          python3 tools/t6_generated_material_texture_table_relation_v1.py \
            --catalog /tmp/proof/sidecars_v3/mp_nuketown_2020.material_catalog_source_v3.json \
            --material-root "$MATROOT" \
            --out /tmp/proof/T6_NUKETOWN_GENERATED_MATERIAL_TEXTURE_TABLE_RELATION_V1.json \
            2>&1 | tee /tmp/proof/generated_texture_relation.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_NUKETOWN_GENERATED_MATERIAL_TEXTURE_TABLE_RELATION_V1
          path: /tmp/proof
          if-no-files-found: error
