name: T6 packed special PS symbolic coverage v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_retail_special_packed_ps_symbolic_coverage_v1.py'
      - 'proof/render/T6_RETAIL_SPECIAL_OAT_SAME_ZONE_CHILD_RESOLUTION_V1.json'
      - 'proof/render/T6_RETAIL_SPECIAL_SYMBOLIC_FULL_ROWS_V2.json'
      - 'proof/render/T6_RETAIL_SPECIAL_MISSING_DIRECT_SYMBOLIC_V1.json'
      - 'manifests/render/T6_NUKETOWN_SPECIAL_FULL_OUTPUT_SYMBOLIC_V1.json'
      - 'proof/render/T6_RETAIL_SPECIAL_DIRECT_SYMBOLIC_COVERAGE_V2.json'
      - 'proof/render/T6_RETAIL_SPECIAL_MISSING_PACKED_PS_SYMBOLIC_V1.json'
      - '.github/workflows/t6_packed_special_ps_symbolic_coverage_v1.yml'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Project exact symbolic semantics by CSO SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_retail_special_packed_ps_symbolic_coverage_v1.py \
            --resolution proof/render/T6_RETAIL_SPECIAL_OAT_SAME_ZONE_CHILD_RESOLUTION_V1.json \
            --full-rows proof/render/T6_RETAIL_SPECIAL_SYMBOLIC_FULL_ROWS_V2.json \
            --missing proof/render/T6_RETAIL_SPECIAL_MISSING_DIRECT_SYMBOLIC_V1.json \
            --nuketown manifests/render/T6_NUKETOWN_SPECIAL_FULL_OUTPUT_SYMBOLIC_V1.json \
            --direct-coverage proof/render/T6_RETAIL_SPECIAL_DIRECT_SYMBOLIC_COVERAGE_V2.json \
            --missing-packed proof/render/T6_RETAIL_SPECIAL_MISSING_PACKED_PS_SYMBOLIC_V1.json \
            --out proof/render/T6_RETAIL_SPECIAL_PACKED_PS_SYMBOLIC_COVERAGE_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/render/T6_RETAIL_SPECIAL_PACKED_PS_SYMBOLIC_COVERAGE_V1.json'))
          s=d['summary']
          assert s['packedPixelShaderOccurrenceCount']==281
          assert s['projectedOccurrenceCount']==281
          assert s['uniqueResolvedPixelShaderSha256Count']==31
          assert s['symbolicCoveredOccurrenceCount']==281
          assert s['symbolicCoveredUniqueShaderCount']==31
          assert s['symbolicMissingOccurrenceCount']==0
          assert s['symbolicMissingUniqueShaderCount']==0
          assert s['symbolicCoveragePercentByOccurrence']==100.0
          assert s['symbolicCoveragePercentByUniqueShader']==100.0
          assert s['invalidSameZoneResolutionRowCount']==0
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/render/T6_RETAIL_SPECIAL_PACKED_PS_SYMBOLIC_COVERAGE_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist complete packed special PS symbolic coverage'
            pushed=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep "$attempt"
            done
            test "$pushed" = 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_RETAIL_SPECIAL_PACKED_PS_SYMBOLIC_COVERAGE_V1
          path: proof/render/T6_RETAIL_SPECIAL_PACKED_PS_SYMBOLIC_COVERAGE_V1.json
          if-no-files-found: error
          compression-level: 9
