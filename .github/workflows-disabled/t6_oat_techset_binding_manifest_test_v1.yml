name: T6 OAT TechniqueSet binding manifest parser test v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_oat_techset_binding_manifest_test_v1.yml'
      - 'tools/t6_oat_techset_binding_manifest_v1.py'
      - 'tools/test_t6_oat_techset_binding_manifest_v1.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed OAT dump parser tests
        run: python3 tools/test_t6_oat_techset_binding_manifest_v1.py -v
