name: T6 persist five-root conflict census v1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_persist_five_root_conflict_census_v1.yml'
permissions:
  actions: read
  contents: write
jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact green five-root artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/five manifests/material
          curl -fL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10037272717/zip"             -o /tmp/five/artifact.zip
          echo "fcf52ea7d6cedec03866beea397197f3c7ffea8a854119ecd63024868b624b06  /tmp/five/artifact.zip" | sha256sum -c -
          unzip -q /tmp/five/artifact.zip -d /tmp/five/out
          cp /tmp/five/out/T6_NUKETOWN_PARENT_DEPENDENCY_CONFLICT_CENSUS_V2_FIVE_ROOT.json              manifests/material/T6_NUKETOWN_PARENT_DEPENDENCY_CONFLICT_CENSUS_V2_FIVE_ROOT.json
          cp /tmp/five/out/T6_NUKETOWN_PC_SERVER_CONFLICT_PROJECTION_V2_FIVE_ROOT.json              manifests/material/T6_NUKETOWN_PC_SERVER_CONFLICT_PROJECTION_V2_FIVE_ROOT.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          c=Path('manifests/material/T6_NUKETOWN_PARENT_DEPENDENCY_CONFLICT_CENSUS_V2_FIVE_ROOT.json')
          p=Path('manifests/material/T6_NUKETOWN_PC_SERVER_CONFLICT_PROJECTION_V2_FIVE_ROOT.json')
          d=json.loads(c.read_text()); q=json.loads(p.read_text())
          assert d['format']=='t6-oat-parent-dependency-conflict-census-v1'
          assert d['authoritativeWinnerSelection'] is False
          s=d['summary']
          assert s['unresolvedConflictCount']==58
          assert s['divergentParentOwnedChildConflictCount']==58
          assert s['missingParentTechniqueSetOwnerConflictCount']==0
          assert s['missingParentOwnedChildConflictCount']==0
          from collections import Counter
          owners=Counter(tuple(x['parentOwners']) for x in d['conflicts'])
          assert owners=={
            ('/tmp/map_out','/tmp/patch_out'):57,
            ('/tmp/common_out','/tmp/patch_out'):1,
          }
          mats={m for x in d['conflicts'] for m in x.get('materials',[]) if isinstance(m,str)}
          assert len(mats)==269
          assert q['format']=='t6-oat-conflict-pc-server-projection-v2'
          assert q['authoritativeForRetailClient'] is False
          assert q['summary']['sourceConflictCount']==58
          print(json.dumps({
            'conflictBytes':c.stat().st_size,'conflictSha256':hashlib.sha256(c.read_bytes()).hexdigest(),
            'serverProjectionBytes':p.stat().st_size,'serverProjectionSha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'conflicts':58,'materials':269,'ownerDistribution':{'+'.join(k):v for k,v in owners.items()}
          },indent=2,sort_keys=True))
          PY
          sha256sum manifests/material/T6_NUKETOWN_*FIVE_ROOT.json | tee /tmp/five/SHA256SUMS
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifests/material/T6_NUKETOWN_PARENT_DEPENDENCY_CONFLICT_CENSUS_V2_FIVE_ROOT.json                   manifests/material/T6_NUKETOWN_PC_SERVER_CONFLICT_PROJECTION_V2_FIVE_ROOT.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact five-root Nuketown conflict census'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_PERSISTED_FIVE_ROOT_CONFLICT_CENSUS_V1
          path: |
            manifests/material/T6_NUKETOWN_PARENT_DEPENDENCY_CONFLICT_CENSUS_V2_FIVE_ROOT.json
            manifests/material/T6_NUKETOWN_PC_SERVER_CONFLICT_PROJECTION_V2_FIVE_ROOT.json
            /tmp/five/SHA256SUMS
          if-no-files-found: error
          compression-level: 9
