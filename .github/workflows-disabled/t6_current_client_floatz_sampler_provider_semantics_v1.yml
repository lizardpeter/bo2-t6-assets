name: T6 current client floatZ sampler provider semantics v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_floatz_sampler_provider_semantics_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_UNRESOLVED_SAMPLER_STORAGE_XREFS_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_CODE_PIXEL_SAMPLER_ARRAY_SEMANTICS_V1.json'
      - 'proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json'
      - '.github/workflows/t6_current_client_floatz_sampler_provider_semantics_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Project exact floatZ sampler provider
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_floatz_sampler_provider_semantics_v1.py             --xrefs proof/current_client/T6_CURRENT_CLIENT_UNRESOLVED_SAMPLER_STORAGE_XREFS_V1.json             --array proof/current_client/T6_CURRENT_CLIENT_CODE_PIXEL_SAMPLER_ARRAY_SEMANTICS_V1.json             --denominator proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_FLOATZ_SAMPLER_PROVIDER_SEMANTICS_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_FLOATZ_SAMPLER_PROVIDER_SEMANTICS_V1.json'))
          assert d['summary']['currentClientProviderClosed'] is True
          assert d['runtimeInput']['accessor']=='floatZSampler'
          assert d['runtimeInput']['enumValue']==18
          assert d['summary']['samplerStateByte']==0x61
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_FLOATZ_SAMPLER_PROVIDER_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact floatZ sampler provider'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_FLOATZ_SAMPLER_PROVIDER_SEMANTICS_V1
          path: proof/current_client/T6_CURRENT_CLIENT_FLOATZ_SAMPLER_PROVIDER_SEMANTICS_V1.json
          if-no-files-found: error
