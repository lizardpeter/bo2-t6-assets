name: T6 current client shadow builder callers stack alloc v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_shadow_builder_callers_stack_alloc_v1.py'
      - 'tools/t6_current_client_fetch_exact_v1.py'
      - '.github/workflows/t6_current_client_shadow_builder_callers_stack_alloc_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q capstone==5.0.6
      - name: Recover exact current client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/client proof/current_client
          python3 tools/t6_current_client_fetch_exact_v1.py --out-exe /tmp/client/t6mp.exe --out-identity /tmp/client/identity.json
      - name: Freeze builder callers and stack transform
        shell: bash
        run: |
          set -euo pipefail
          rev=$(python3 -c "import json;print(json.load(open('/tmp/client/identity.json'))['observedCdnRevision'])")
          python3 tools/t6_current_client_shadow_builder_callers_stack_alloc_v1.py \
            /tmp/client/t6mp.exe --revision "$rev" \
            --out proof/current_client/T6_CURRENT_CLIENT_SHADOW_BUILDER_CALLERS_STACK_ALLOC_V1.json
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_SHADOW_BUILDER_CALLERS_STACK_ALLOC_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist shadow builder caller stack proof'
            ok=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          fi
          rm -f /tmp/client/t6mp.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_SHADOW_BUILDER_CALLERS_STACK_ALLOC_V1
          path: proof/current_client/T6_CURRENT_CLIENT_SHADOW_BUILDER_CALLERS_STACK_ALLOC_V1.json
          if-no-files-found: error
          compression-level: 9
