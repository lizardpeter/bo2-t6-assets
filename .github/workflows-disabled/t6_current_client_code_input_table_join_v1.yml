name: T6 current client code input table join v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_code_input_table_join_v1.py'
      - 'tools/t6_code_sampler_source_table_v1.py'
      - 'tools/t6_code_constant_source_table_v1.py'
      - '.github/workflows/t6_current_client_code_input_table_join_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Recover SHA-classified current client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/client proof/current_client
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          eps=['https://cdn.plutoniummod.com/updater/prod/info.json','https://cdn.plutonium.pw/updater/prod/info.json']
          def get(u):
              q=urllib.request.Request(u,headers={'User-Agent':'bo2-t6-assets-code-input-table/1'})
              with urllib.request.urlopen(q,timeout=180) as r:return r.read()
          info=None
          for ep in eps:
              try:info=json.loads(get(ep));break
              except Exception:pass
          if info is None:raise SystemExit('no CDN info')
          rows=[x for x in info['files'] if x.get('name','').replace('\\','/').lower()=='games/t6mp.exe']
          if len(rows)!=1:raise SystemExit(f'expected one t6mp.exe row, got {len(rows)}')
          rec=rows[0];raw=get(info['baseUrl']+rec['hash']);sha=hashlib.sha256(raw).hexdigest()
          if str(info.get('revision'))!='5346' or sha!='770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf':
              raise SystemExit(f'classified client changed revision={info.get("revision")} sha={sha}')
          Path('/tmp/client/t6mp.exe').write_bytes(raw);Path('/tmp/client/revision').write_text(str(info['revision']))
          PY
      - name: Recover exact pinned OAT source tables
        env:
          PYTHONPATH: tools
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/Laupetin/OpenAssetTools.git /tmp/oat
          git -C /tmp/oat checkout -q 2ca512abe7cb82d70a94d5ad7846043c3978862d
          test "$(git -C /tmp/oat rev-parse HEAD)" = 2ca512abe7cb82d70a94d5ad7846043c3978862d
          python3 tools/t6_code_sampler_source_table_v1.py --oat-source-root /tmp/oat --out /tmp/samplers.json
          python3 tools/t6_code_constant_source_table_v1.py --oat-source-root /tmp/oat --out /tmp/constants.json
      - name: Join exact current-client rows
        env:
          PYTHONPATH: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_code_input_table_join_v1.py             /tmp/client/t6mp.exe --revision "$(cat /tmp/client/revision)"             --samplers /tmp/samplers.json --constants /tmp/constants.json             --out proof/current_client/T6_CURRENT_CLIENT_CODE_INPUT_TABLE_JOIN_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_CODE_INPUT_TABLE_JOIN_V1.json'))
          s=d['summary']
          assert s['requiredRendererRowCount']==7
          assert all(len(d['requiredRendererRows'][k]) for k in d['requiredRendererRows'])
          # Global duplicate exact rows are retained as static-copy evidence;
          # only the seven renderer rows above are required to be unique.
          assert s['samplerSourceRowCount']==55
          assert s['samplerUniqueExactRowCount']==43
          assert s['samplerAbsentRowCount']==0
          assert s['samplerAmbiguousRowCount']==12
          assert s['constantSourceRowCount']==220
          assert s['constantUniqueExactRowCount']==217
          assert s['constantAbsentRowCount']==3
          assert s['constantAmbiguousRowCount']==0
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_CODE_INPUT_TABLE_JOIN_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist current-client code input table join'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          rm -f /tmp/client/t6mp.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_CODE_INPUT_TABLE_JOIN_V1
          path: proof/current_client/T6_CURRENT_CLIENT_CODE_INPUT_TABLE_JOIN_V1.json
          if-no-files-found: error
          compression-level: 9
