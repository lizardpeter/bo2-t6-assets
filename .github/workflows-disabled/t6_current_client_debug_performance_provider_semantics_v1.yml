name: T6 current client debugPerformance provider semantics v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_debug_performance_provider_semantics_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_GAMETIME_UPSTREAM_HELPER_PROBE_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_CODE_MATRIX_GETTER_SEMANTICS_V1.json'
      - 'proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json'
      - '.github/workflows/t6_current_client_debug_performance_provider_semantics_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Project exact debugPerformance provider
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_debug_performance_provider_semantics_v1.py             --helper proof/current_client/T6_CURRENT_CLIENT_GAMETIME_UPSTREAM_HELPER_PROBE_V1.json             --matrix proof/current_client/T6_CURRENT_CLIENT_CODE_MATRIX_GETTER_SEMANTICS_V1.json             --denominator proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_DEBUG_PERFORMANCE_PROVIDER_SEMANTICS_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_DEBUG_PERFORMANCE_PROVIDER_SEMANTICS_V1.json'))
          assert d['summary']['currentClientProviderClosed'] is True
          assert d['summary']['exactValue']==[0.0,0.0,0.0,0.0]
          assert d['runtimeInput']['enumValue']==45
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_DEBUG_PERFORMANCE_PROVIDER_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact debugPerformance provider'
            ok=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_DEBUG_PERFORMANCE_PROVIDER_SEMANTICS_V1
          path: proof/current_client/T6_CURRENT_CLIENT_DEBUG_PERFORMANCE_PROVIDER_SEMANTICS_V1.json
          if-no-files-found: error
