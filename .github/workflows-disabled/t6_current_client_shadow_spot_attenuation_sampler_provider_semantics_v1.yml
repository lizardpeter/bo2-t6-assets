name: T6 current client spot-shadow attenuation sampler providers v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_shadow_spot_attenuation_sampler_provider_semantics_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_CODE_PIXEL_SAMPLER_ARRAY_SEMANTICS_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_LIGHT_BLOCK_PROVIDER_SEMANTICS_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_CODE_SAMPLER_SLOT_PAIR_LOCATOR_V1.json'
      - 'proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json'
      - '.github/workflows/t6_current_client_shadow_spot_attenuation_sampler_provider_semantics_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Project exact slot-7/15 providers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_shadow_spot_attenuation_sampler_provider_semantics_v1.py             --array proof/current_client/T6_CURRENT_CLIENT_CODE_PIXEL_SAMPLER_ARRAY_SEMANTICS_V1.json             --light-provider proof/current_client/T6_CURRENT_CLIENT_LIGHT_BLOCK_PROVIDER_SEMANTICS_V1.json             --slot-pairs proof/current_client/T6_CURRENT_CLIENT_CODE_SAMPLER_SLOT_PAIR_LOCATOR_V1.json             --denominator proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_SHADOW_SPOT_ATTENUATION_SAMPLER_PROVIDER_SEMANTICS_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_SHADOW_SPOT_ATTENUATION_SAMPLER_PROVIDER_SEMANTICS_V1.json'))
          s=d['summary']
          assert s['currentClientProviderClosed'] is True
          assert s['runtimeInputCount']==2
          assert s['retainedSpecialOccurrenceCount']==165
          assert s['slot7ProviderClosed'] is True
          assert s['slot15ProviderClosed'] is True
          assert {(x['accessor'],x['enumValue']) for x in d['runtimeInputs']}=={('shadowmapSamplerSpot',7),('attenuationSampler',15)}
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_SHADOW_SPOT_ATTENUATION_SAMPLER_PROVIDER_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist spot-shadow and attenuation sampler providers'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_SHADOW_SPOT_ATTENUATION_SAMPLER_PROVIDER_SEMANTICS_V1
          path: proof/current_client/T6_CURRENT_CLIENT_SHADOW_SPOT_ATTENUATION_SAMPLER_PROVIDER_SEMANTICS_V1.json
          if-no-files-found: error
          compression-level: 9
