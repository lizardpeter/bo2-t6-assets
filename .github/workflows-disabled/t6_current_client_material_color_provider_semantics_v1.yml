name: T6 current client materialColor provider semantics v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_material_color_provider_semantics_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_CUSTOM_CONSTANT_MATERIAL_COLOR_PROBE_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_RENDER_COMMAND_TABLE_LOCATOR_V1.json'
      - 'proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json'
      - '.github/workflows/t6_current_client_material_color_provider_semantics_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Project exact materialColor provider semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_material_color_provider_semantics_v1.py             --probe proof/current_client/T6_CURRENT_CLIENT_CUSTOM_CONSTANT_MATERIAL_COLOR_PROBE_V1.json             --command-table proof/current_client/T6_CURRENT_CLIENT_RENDER_COMMAND_TABLE_LOCATOR_V1.json             --static-inputs proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_MATERIAL_COLOR_PROVIDER_SEMANTICS_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_MATERIAL_COLOR_PROVIDER_SEMANTICS_V1.json'))
          s=d['summary']
          assert s=={
            'commandAdvanceExact':True,
            'componentCount':4,
            'currentClientProviderClosed':True,
            'enumValue':46,
            'valueAddressRelationExact':True,
            'versionAddressRelationExact':True,
          }
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_MATERIAL_COLOR_PROVIDER_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact materialColor provider semantics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_MATERIAL_COLOR_PROVIDER_SEMANTICS_V1
          path: proof/current_client/T6_CURRENT_CLIENT_MATERIAL_COLOR_PROVIDER_SEMANTICS_V1.json
          if-no-files-found: error
