name: T6 Material texture sort runtime probe v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_material_texture_sort_runtime_probe_v1.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXE_ID: 1NhLTmevZ5HPKRByj1ok8BpwbvX_5rc1n
      MAP_ID: 1kcCFEDP-gubgUyN6R_WjlJpFGoeZNEmd
      EXE_SHA256: f67eb68a494b93b5b229985205bdc94e26fdfe677663410e2207c25f6f27a55d
      MAP_SHA256: 34e16e517072031629307ffa0520d59f3c586539b943d081f60c59ee9ce1c3bf
    steps:
      - uses: actions/checkout@v4

      - name: Download exact PC dedicated-server references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref /tmp/probe
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.exe "https://drive.usercontent.google.com/download?id=$EXE_ID&export=download&confirm=t"
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.map "https://drive.usercontent.google.com/download?id=$MAP_ID&export=download&confirm=t"
          echo "$EXE_SHA256  /tmp/ref/CoDMPServer_PC.exe" | sha256sum -c -
          echo "$MAP_SHA256  /tmp/ref/CoDMPServer_PC.map" | sha256sum -c -

      - name: Install exact disassembler dependency
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6

      - name: Prove comparator identity and enumerate every executable xref
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import bisect, hashlib, json, re, struct
          from pathlib import Path
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32, CS_OPT_DETAIL
          from capstone.x86 import X86_OP_IMM

          EXE_SHA='f67eb68a494b93b5b229985205bdc94e26fdfe677663410e2207c25f6f27a55d'
          MAP_SHA='34e16e517072031629307ffa0520d59f3c586539b943d081f60c59ee9ce1c3bf'
          CMP=0x00A4D630
          CMP_SIZE=21
          CMP_SHA='89c3ef79d0956caceb677fd742d376f28895d8788fd9ad7c1e88a4535d840952'
          BASE=0x00400000

          exe_path=Path('/tmp/ref/CoDMPServer_PC.exe')
          map_path=Path('/tmp/ref/CoDMPServer_PC.map')
          exe=exe_path.read_bytes()
          mt=map_path.read_text('ascii', errors='replace')
          if hashlib.sha256(exe).hexdigest()!=EXE_SHA: raise SystemExit('EXE SHA gate failed')
          if hashlib.sha256(map_path.read_bytes()).hexdigest()!=MAP_SHA: raise SystemExit('MAP SHA gate failed')

          pe=struct.unpack_from('<I',exe,0x3c)[0]
          coff=pe+4
          _,ns,_,_,_,osz,_=struct.unpack_from('<HHIIIHH',exe,coff)
          opt=coff+20
          st=opt+osz
          secs=[]
          for i in range(ns):
              o=st+i*40
              name=exe[o:o+8].split(b'\0',1)[0].decode('ascii','replace')
              vs,rva,rs,ro=struct.unpack_from('<IIII',exe,o+8)
              chars=struct.unpack_from('<I',exe,o+36)[0]
              secs.append({'name':name,'va':BASE+rva,'virtualSize':vs,'rawSize':rs,'rawOffset':ro,'characteristics':chars})

          def file_off(va):
              for s in secs:
                  if s['va'] <= va < s['va'] + s['rawSize']:
                      return s['rawOffset'] + va - s['va']
              raise ValueError(hex(va))

          # Exact MAP symbol parser used only for provenance/containing-function labels.
          syms=[]
          for line in mt.splitlines():
              m=re.search(r'\s([0-9A-Fa-f]{8})\s+(?:f\s+)?(.+?)\s+([^\s]+\.obj)\s*$', line)
              if m:
                  syms.append((int(m.group(1),16),m.group(2).strip(),m.group(3),line.strip()))
          syms.sort(key=lambda x:(x[0],x[1],x[2]))
          vas=sorted(set(v for v,_,_,_ in syms))
          by_va={}
          for row in syms: by_va.setdefault(row[0],[]).append(row)

          cmp_alias_lines=[line.strip() for line in mt.splitlines() if 'CompareHashedMaterialTextures' in line or 'CompareHashedMaterialConstants' in line]
          if not cmp_alias_lines:
              raise SystemExit('MAP contains no comparator alias names')
          bad_alias=[line for line in cmp_alias_lines if f'{CMP:08x}' not in line.lower()]
          if bad_alias:
              raise SystemExit('comparator alias moved: '+repr(bad_alias))

          cmp_bytes=exe[file_off(CMP):file_off(CMP)+CMP_SIZE]
          if hashlib.sha256(cmp_bytes).hexdigest()!=CMP_SHA:
              raise SystemExit('comparator machine-byte SHA changed')

          md=Cs(CS_ARCH_X86,CS_MODE_32)
          md.detail=True
          cmp_ins=[]
          for ins in md.disasm(cmp_bytes,CMP):
              cmp_ins.append(f'{ins.address:08X}: {ins.bytes.hex():<24} {ins.mnemonic:<8} {ins.op_str}')
          if sum(len(i.bytes) for i in md.disasm(cmp_bytes,CMP)) != CMP_SIZE:
              raise SystemExit('comparator disassembly does not exactly cover 21 bytes')

          # Search all executable PE sections for instructions carrying the comparator VA
          # as an immediate operand. This is stronger than a raw byte search and avoids
          # treating embedded data as code xrefs.
          xrefs=[]
          for s in secs:
              if not (s['characteristics'] & 0x20000000):
                  continue
              raw=exe[s['rawOffset']:s['rawOffset']+s['rawSize']]
              for ins in md.disasm(raw,s['va']):
                  imm_hits=[]
                  for op in ins.operands:
                      if op.type==X86_OP_IMM and (op.imm & 0xffffffff)==CMP:
                          imm_hits.append(CMP)
                  if not imm_hits:
                      continue
                  pos=bisect.bisect_right(vas,ins.address)-1
                  owner_va=vas[pos] if pos>=0 else None
                  owner_rows=by_va.get(owner_va,[]) if owner_va is not None else []
                  next_pos=bisect.bisect_right(vas,owner_va) if owner_va is not None else 0
                  owner_end=vas[next_pos] if owner_va is not None and next_pos<len(vas) else None
                  xrefs.append({
                      'address':f'0x{ins.address:08X}',
                      'bytes':ins.bytes.hex(),
                      'mnemonic':ins.mnemonic,
                      'opStr':ins.op_str,
                      'containingSymbolVa':None if owner_va is None else f'0x{owner_va:08X}',
                      'containingSymbolEnd':None if owner_end is None else f'0x{owner_end:08X}',
                      'containingSymbols':[r[3] for r in owner_rows],
                  })

          # Retain exact disassembly of every containing symbol. Do not infer semantics here.
          owners=[]
          for owner_va in sorted({int(x['containingSymbolVa'],16) for x in xrefs if x['containingSymbolVa']}):
              np=bisect.bisect_right(vas,owner_va)
              end=vas[np] if np<len(vas) else owner_va+0x400
              if end-owner_va>0x4000:
                  end=owner_va+0x4000
              try:
                  rb=exe[file_off(owner_va):file_off(owner_va)+(end-owner_va)]
              except Exception:
                  continue
              insns=[f'{i.address:08X}: {i.bytes.hex():<24} {i.mnemonic:<8} {i.op_str}' for i in md.disasm(rb,owner_va)]
              owners.append({
                  'start':f'0x{owner_va:08X}',
                  'end':f'0x{end:08X}',
                  'sha256':hashlib.sha256(rb).hexdigest(),
                  'mapSymbols':[r[3] for r in by_va.get(owner_va,[])],
                  'instructions':insns,
              })

          raw_pat=struct.pack('<I',CMP)
          raw_hits=[]
          start=0
          while True:
              p=exe.find(raw_pat,start)
              if p<0: break
              raw_hits.append(p)
              start=p+1

          out={
              'format':'t6-material-texture-sort-runtime-probe-v1',
              'authority':{
                  'executable':'CoDMPServer_PC.exe','executableSha256':EXE_SHA,
                  'map':'CoDMPServer_PC.map','mapSha256':MAP_SHA,
              },
              'comparator':{
                  'va':f'0x{CMP:08X}','size':CMP_SIZE,'sha256':CMP_SHA,
                  'mapAliasLines':cmp_alias_lines,'instructions':cmp_ins,
                  'provisionalFieldMeaning':'first uint32; PDB aliases include CompareHashedMaterialTextures and CompareHashedMaterialConstants',
              },
              'executableImmediateXrefs':xrefs,
              'rawLittleEndianVaFileOffsets':[f'0x{x:08X}' for x in raw_hits],
              'containingSymbols':owners,
              'summary':{
                  'mapAliasLineCount':len(cmp_alias_lines),
                  'executableImmediateXrefCount':len(xrefs),
                  'rawVaOccurrenceCount':len(raw_hits),
                  'containingSymbolCount':len(owners),
              },
              'proofBoundary':'Exact dedicated-server byte/xref census only. It does not by itself prove every retail Material texture table is sorted or establish retail-client equivalence.',
          }
          payload=(json.dumps(out,indent=2,sort_keys=True)+'\n').encode()
          Path('/tmp/probe/T6_MATERIAL_TEXTURE_SORT_RUNTIME_PROBE_V1.json').write_bytes(payload)
          Path('/tmp/probe/result_sha256.txt').write_text(hashlib.sha256(payload).hexdigest()+'  T6_MATERIAL_TEXTURE_SORT_RUNTIME_PROBE_V1.json\n')
          print(json.dumps(out['summary'],sort_keys=True))
          print('RESULT_SHA256',hashlib.sha256(payload).hexdigest())
          for x in xrefs:
              print('XREF',x['address'],x['mnemonic'],x['opStr'],x['containingSymbols'])
          PY

      - name: Upload exact probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_MATERIAL_TEXTURE_SORT_RUNTIME_PROBE_V1
          path: /tmp/probe
          if-no-files-found: error
          compression-level: 9
