name: T6 Nuketown generated runtime sampler surface binding v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_nuketown_generated_runtime_sampler_surface_binding_v1.py'
      - 'tools/t6_nuketown_world_source_sidecars_v3.py'
      - 'tools/t6_nuketown_material_memory_ownership_v1.py'
      - 'proof/render/T6_NUKETOWN_GENERATED_FINAL_OUTPUT_RUNTIME_INPUT_CENSUS_V1.json'
      - 'manifests/maps/mp_nuketown_2020/T6_NUKETOWN_GFXWORLD_LIGHTMAP_CATALOG_V3.json'
      - 'manifests/maps/mp_nuketown_2020/T6_NUKETOWN_GFXWORLD_REFLECTION_PROBE_CATALOG_V3.json'
      - '.github/workflows/t6_nuketown_generated_runtime_sampler_surface_binding_v1.yml'
permissions:
  contents: write
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build source-closed FastFile expander
        run: cc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_ff_expand -lz -lcrypto
      - name: Recover exact retail Nuketown expanded source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6_sampler /tmp/t6_sampler/sidecars proof/render
          curl -fL --retry 4 --retry-delay 2 -o /tmp/t6_sampler/mp_nuketown_2020.ff https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/t6_sampler/mp_nuketown_2020.ff' | sha256sum -c -
          /tmp/t6_ff_expand /tmp/t6_sampler/mp_nuketown_2020.ff /tmp/t6_sampler/mp_nuketown_2020.expanded.bin mp_nuketown_2020
          echo '7e791fb90a085f3bff9e0df895e5a232fa91cc43bcd0027225fe811f7891d505  /tmp/t6_sampler/mp_nuketown_2020.expanded.bin' | sha256sum -c -
      - name: Re-derive exact MaterialMemory ownership and v3 surface sidecars
        env:
          PYTHONPATH: tools
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/Laupetin/OpenAssetTools.git /tmp/oat
          git -C /tmp/oat checkout -q 9dca965366541504b71fa8cfb7ac049cb9b717e1
          python3 tools/t6_nuketown_material_memory_ownership_v1.py             --expanded /tmp/t6_sampler/mp_nuketown_2020.expanded.bin             --oat-root /tmp/oat             --out /tmp/t6_sampler/ownership.json
          python3 tools/t6_nuketown_world_source_sidecars_v3.py             --expanded /tmp/t6_sampler/mp_nuketown_2020.expanded.bin             --ownership-proof /tmp/t6_sampler/ownership.json             --out-dir /tmp/t6_sampler/sidecars
      - name: Bind exact generated runtime sampler resources per surface
        env:
          PYTHONPATH: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_nuketown_generated_runtime_sampler_surface_binding_v1.py             --surfaces /tmp/t6_sampler/sidecars/mp_nuketown_2020.surfaces_source_v3.json             --catalog /tmp/t6_sampler/sidecars/mp_nuketown_2020.material_catalog_source_v3.json             --runtime proof/render/T6_NUKETOWN_GENERATED_FINAL_OUTPUT_RUNTIME_INPUT_CENSUS_V1.json             --lightmaps manifests/maps/mp_nuketown_2020/T6_NUKETOWN_GFXWORLD_LIGHTMAP_CATALOG_V3.json             --probes manifests/maps/mp_nuketown_2020/T6_NUKETOWN_GFXWORLD_REFLECTION_PROBE_CATALOG_V3.json             --out proof/render/T6_NUKETOWN_GENERATED_RUNTIME_SAMPLER_SURFACE_BINDING_V1.json             --strict
          python3 - <<'PY'
          import json
          d=json.load(open('proof/render/T6_NUKETOWN_GENERATED_RUNTIME_SAMPLER_SURFACE_BINDING_V1.json'))
          s=d['summary']
          assert s['generatedMaterialCount']==120
          assert s['generatedMaterialSurfaceCoverageCount']==120
          assert s['allSampledRuntimeResourceIdentitiesResolved'] is True
          assert s['runtimeSamplerBlockerCounts']=={}
          assert s['resolvedSecondaryLightmapSurfaceBindingCount'] > 0
          assert s['resolvedReflectionProbeSurfaceBindingCount'] > 0
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/render/T6_NUKETOWN_GENERATED_RUNTIME_SAMPLER_SURFACE_BINDING_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist generated per-surface runtime sampler bindings'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_GENERATED_RUNTIME_SAMPLER_SURFACE_BINDING_V1
          path: proof/render/T6_NUKETOWN_GENERATED_RUNTIME_SAMPLER_SURFACE_BINDING_V1.json
          if-no-files-found: error
