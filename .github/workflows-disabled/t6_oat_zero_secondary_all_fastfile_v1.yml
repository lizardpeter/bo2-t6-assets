name: T6 native OAT zero Secondary all-FastFile v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_oat_zero_secondary_resolver_v1.py'
      - 'tools/test_t6_oat_zero_secondary_resolver_v1.py'
      - 'tools/t6_oat_zero_secondary_aggregate_v1.py'
      - 'tools/test_t6_oat_zero_secondary_aggregate_v1.py'
      - 'tools/t6_remote_zip_range_v1.py'
      - 'tools/t6_oat_9dca_gcc_compat_patch_v3.py'
      - '.github/workflows/t6_oat_zero_secondary_all_fastfile_v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test native resolver and aggregate gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/test_t6_oat_zero_secondary_resolver_v1.py
          PYTHONPATH=tools python3 tools/test_t6_oat_zero_secondary_aggregate_v1.py

  native-shard:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ZIP_URL: https://cdn.jordanlindsay.com.au/pluto_t6_full_game.zip
      SHARD: ${{ matrix.shard }}
      SHARD_COUNT: '8'
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact pinned OAT Unlinker cache
        id: oat-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug

      - name: Build or verify pinned OAT Unlinker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof /tmp/oat-unlinker-cache
          CACHE_BIN=/tmp/oat-unlinker-cache/Unlinker
          CACHE_META=/tmp/oat-unlinker-cache/source_identity.txt
          EXPECTED_COMMIT=9dca965366541504b71fa8cfb7ac049cb9b717e1
          PATCH_SHA=$(sha256sum tools/t6_oat_9dca_gcc_compat_patch_v3.py | awk '{print $1}')
          if test "${{ steps.oat-cache.outputs.cache-hit }}" = 'true'; then
            test -x "$CACHE_BIN"
            test -f "$CACHE_META"
            grep -qx "oat_commit=$EXPECTED_COMMIT" "$CACHE_META"
            grep -qx "compat_patch_sha256=$PATCH_SHA" "$CACHE_META"
            echo cache_hit=true | tee /tmp/proof/oat_cache.txt
          else
            echo cache_hit=false | tee /tmp/proof/oat_cache.txt
            sudo apt-get update -qq
            sudo apt-get install -y -qq g++-multilib >/dev/null
            git clone -q --recursive https://github.com/Laupetin/OpenAssetTools.git /tmp/oat
            git -C /tmp/oat checkout -q "$EXPECTED_COMMIT"
            test "$(git -C /tmp/oat rev-parse HEAD)" = "$EXPECTED_COMMIT"
            git -C /tmp/oat submodule update -q --init --recursive
            python3 tools/t6_oat_9dca_gcc_compat_patch_v3.py /tmp/oat
            git -C /tmp/oat diff --check
            cd /tmp/oat
            PREMAKE_NO_PROMPT=1 ./generate.sh
            make -C build -j2 config=debug_x86 UnlinkerCli 2>&1 | tee /tmp/proof/oat_build.log
            BIN=$(find build/bin -type f \( -name Unlinker -o -name unlinker \) | head -1)
            test -n "$BIN"
            install -m 0755 "$BIN" "$CACHE_BIN"
            printf 'oat_commit=%s\ncompat_patch_sha256=%s\n' "$EXPECTED_COMMIT" "$PATCH_SHA" > "$CACHE_META"
          fi
          printf 'oat_commit=%s\ncompat_patch_sha256=%s\n' "$EXPECTED_COMMIT" "$PATCH_SHA" > /tmp/proof/oat_source_identity.txt
          sha256sum "$CACHE_BIN" | tee /tmp/proof/unlinker_sha256.txt
          printf '%s\n' "$CACHE_BIN" > /tmp/unlinker_path

      - name: Save exact pinned OAT Unlinker cache
        if: steps.oat-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug

      - name: Download complete retained zero-asset census
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/zero /tmp/proof
          gh run download 34178852305 --repo "$GITHUB_REPOSITORY" --name T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1 --dir /tmp/zero
          test -f /tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json
          echo '6a05d394c591c074570751e68429c47ba6f801701826199780994326ae125fed  /tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json' | sha256sum -c -
          sha256sum /tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json | tee /tmp/proof/zero_manifest_sha256.txt

      - name: Extract exact zero-bearing FastFiles and dump native SoundBanks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/game/zone/all /tmp/oat_roots /tmp/proof/native_csv /tmp/proof/logs
          BIN=$(cat /tmp/unlinker_path)
          export BIN
          PYTHONPATH=tools python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          from t6_remote_zip_range_v1 import RemoteZip

          zero=json.load(open('/tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json',encoding='utf-8'))
          shard=int(os.environ['SHARD']); shard_count=int(os.environ['SHARD_COUNT'])
          # Exact one-bank -> one-source relationship in the retained zero population.
          bank_source={}
          for row in zero['zeroRows']:
              b=row['bankName']; s=row['source']
              old=bank_source.get(b)
              if old is not None and old!=s:
                  raise SystemExit(f'{b}: multiple zero-bearing source FastFiles: {old} vs {s}')
              bank_source[b]=s
          if len(bank_source)!=37:
              raise SystemExit(f'zero-bearing bank population changed: {len(bank_source)} != 37')

          source_meta={r['zipPath']:r for r in zero['rows']}
          plan=sorted(bank_source.items(), key=lambda kv:(kv[1].lower(),kv[0].lower()))
          selected=[(i,b,s) for i,(b,s) in enumerate(plan) if i % shard_count == shard]
          rz=RemoteZip(os.environ['ZIP_URL'],f'bo2-t6-assets-oat-zero-secondary/{shard}',timeout=180,retries=7)
          entries,meta=rz.central_directory()
          by_name={e['name']:e for e in entries}
          result_plan=[]
          for global_index,bank,source in selected:
              entry=by_name.get(source)
              if entry is None:
                  raise SystemExit(f'archive missing exact FastFile {source}')
              raw=rz.extract(entry,verify_crc=True)
              sha=hashlib.sha256(raw).hexdigest()
              expected=source_meta[source]['fastFileSha256']
              if sha!=expected:
                  raise SystemExit(f'{source}: SHA mismatch {sha} != {expected}')
              basename=pathlib.PurePosixPath(source).name
              ff=pathlib.Path('/tmp/game/zone/all')/basename
              ff.write_bytes(raw)
              root=pathlib.Path('/tmp/oat_roots')/f'{global_index:02d}'
              root.mkdir(parents=True,exist_ok=True)
              log=pathlib.Path('/tmp/proof/logs')/f'{global_index:02d}_{basename}.log'
              with log.open('wb') as lf:
                  proc=subprocess.run([
                      os.environ['BIN'],'--no-color','--verbose','--include-assets','soundbank',
                      '--output-folder',str(root),str(ff)
                  ],stdout=lf,stderr=subprocess.STDOUT)
              if proc.returncode!=0:
                  raise SystemExit(f'{source}: OAT soundbank dump failed rc={proc.returncode}')
              csv_path=root/'soundbank'/f'{bank}.aliases.csv'
              if not csv_path.is_file():
                  raise SystemExit(f'{source}: expected native alias CSV missing: {csv_path}')
              csv_sha=hashlib.sha256(csv_path.read_bytes()).hexdigest()
              retained=pathlib.Path('/tmp/proof/native_csv')/f'{bank}.aliases.csv'
              retained.write_bytes(csv_path.read_bytes())
              result_plan.append({
                  'globalPlanIndex':global_index,
                  'bankName':bank,
                  'sourceFastFile':source,
                  'fastFileSha256':sha,
                  'zipCrc32':f"{int(entry['crc32']):08x}",
                  'oatAliasCsvSha256':csv_sha,
                  'oatRoot':str(root),
                  'csvPath':str(csv_path),
              })
              print(global_index,bank,source,sha,csv_sha,flush=True)
              ff.unlink(missing_ok=True)
          out={
              'format':'t6-oat-zero-secondary-native-shard-plan-v1',
              'shard':shard,
              'shardCount':shard_count,
              'allZeroBearingBankCount':37,
              'remoteZip':meta,
              'selected':result_plan,
          }
          pathlib.Path(f'/tmp/proof/T6_OAT_ZERO_SECONDARY_PLAN_SHARD_{shard}_V1.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          pathlib.Path('/tmp/bank_csv_specs.txt').write_text('\n'.join(f"{r['bankName']}={r['csvPath']}" for r in result_plan)+'\n')
          PY

      - name: Resolve shard zero-asset Secondary strings from native loaded SndBanks
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r spec; do
            test -n "$spec" || continue
            args+=(--bank-csv "$spec")
          done < /tmp/bank_csv_specs.txt
          test "${#args[@]}" -gt 0
          PYTHONPATH=tools python3 tools/t6_oat_zero_secondary_resolver_v1.py \
            --zero /tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json \
            "${args[@]}" \
            --out "/tmp/proof/T6_OAT_ZERO_SECONDARY_SHARD_${SHARD}_V1.json"
          sha256sum "/tmp/proof/T6_OAT_ZERO_SECONDARY_SHARD_${SHARD}_V1.json" | tee "/tmp/proof/shard_${SHARD}_json_sha256.txt"
          python3 - <<'PY'
          import json,os
          p=f"/tmp/proof/T6_OAT_ZERO_SECONDARY_SHARD_{os.environ['SHARD']}_V1.json"
          d=json.load(open(p,encoding='utf-8'))
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY

      - name: Upload native shard proof
        uses: actions/upload-artifact@v4
        with:
          name: T6_OAT_ZERO_SECONDARY_SHARD_${{ matrix.shard }}_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9

  aggregate:
    needs: native-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: T6_OAT_ZERO_SECONDARY_SHARD_*_V1
          path: /tmp/shards

      - name: Download complete retained zero-asset census
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/zero /tmp/proof
          gh run download 34178852305 --repo "$GITHUB_REPOSITORY" --name T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1 --dir /tmp/zero
          test -f /tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json
          echo '6a05d394c591c074570751e68429c47ba6f801701826199780994326ae125fed  /tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json' | sha256sum -c -

      - name: Require exact 37-bank / 4094-row native coverage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shard_files < <(find /tmp/shards -type f -name 'T6_OAT_ZERO_SECONDARY_SHARD_*_V1.json' | sort)
          test "${#shard_files[@]}" -eq 8
          args=()
          for p in "${shard_files[@]}"; do args+=(--shard "$p"); done
          PYTHONPATH=tools python3 tools/t6_oat_zero_secondary_aggregate_v1.py \
            --zero /tmp/zero/T6_SNDALIAS_ZERO_ASSET_ALL_FASTFILE_V1.json \
            "${args[@]}" \
            --expected-zero-count 4094 \
            --expected-bank-count 37 \
            --out /tmp/proof/T6_OAT_ZERO_SECONDARY_ALL_FASTFILE_V1.json
          sha256sum /tmp/proof/T6_OAT_ZERO_SECONDARY_ALL_FASTFILE_V1.json | tee /tmp/proof/aggregate_json_sha256.txt
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/proof/T6_OAT_ZERO_SECONDARY_ALL_FASTFILE_V1.json',encoding='utf-8'))
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          print('UNRESOLVED NON-INLINE ROWS',len(d['nonInlineSecondaryUnresolvedRows']))
          for row in d['nonInlineSecondaryUnresolvedRows'][:50]:
              print(row)
          PY

      - name: Upload complete native Secondary resolution
        uses: actions/upload-artifact@v4
        with:
          name: T6_OAT_ZERO_SECONDARY_ALL_FASTFILE_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
