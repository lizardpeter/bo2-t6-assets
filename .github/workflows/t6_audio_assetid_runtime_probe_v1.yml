name: T6 audio assetId runtime probe v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_audio_assetid_runtime_probe_v1.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXE_ID: 1NhLTmevZ5HPKRByj1ok8BpwbvX_5rc1n
      MAP_ID: 1kcCFEDP-gubgUyN6R_WjlJpFGoeZNEmd
      EXE_SHA256: f67eb68a494b93b5b229985205bdc94e26fdfe677663410e2207c25f6f27a55d
      MAP_SHA256: 34e16e517072031629307ffa0520d59f3c586539b943d081f60c59ee9ce1c3bf
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify exact active references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref /tmp/probe
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.exe "https://drive.usercontent.google.com/download?id=$EXE_ID&export=download&confirm=t"
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.map "https://drive.usercontent.google.com/download?id=$MAP_ID&export=download&confirm=t"
          echo "$EXE_SHA256  /tmp/ref/CoDMPServer_PC.exe" | sha256sum -c -
          echo "$MAP_SHA256  /tmp/ref/CoDMPServer_PC.map" | sha256sum -c -
      - name: Install disassembler
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Extract exact sound runtime slices
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re,struct
          from pathlib import Path
          from capstone import Cs,CS_ARCH_X86,CS_MODE_32
          exe=Path('/tmp/ref/CoDMPServer_PC.exe').read_bytes(); mt=Path('/tmp/ref/CoDMPServer_PC.map').read_text('ascii')
          BASE=0x400000; pe=struct.unpack_from('<I',exe,0x3c)[0]; coff=pe+4
          _,ns,_,_,_,osz,_=struct.unpack_from('<HHIIIHH',exe,coff); opt=coff+20; assert struct.unpack_from('<I',exe,opt+28)[0]==BASE
          secs=[]; st=opt+osz
          for i in range(ns):
            o=st+i*40; vs,rva,rs,ro=struct.unpack_from('<IIII',exe,o+8); secs.append((BASE+rva,rs,ro))
          def off(va):
            for b,rs,ro in secs:
              if b<=va<b+rs:return ro+va-b
            raise ValueError(hex(va))
          def raw(a,b):return exe[off(a):off(a)+(b-a)]
          md=Cs(CS_ARCH_X86,CS_MODE_32)
          addrs=[0x8B4060,0x8B4100,0x8B41B0,0x8B41C0,0x8B41D0,0x8B41E0,0x8B48A0,0x8B4960,0x8B4980,0x8B94C0,0x8B1A40,0x8BA310,0x8BA4D0,0x8BA610,0x8BA620]
          print('=== EXACT MAP ADDRESS LINES ===')
          for a in addrs:
            tok=f'{a:08x}'
            hits=[ln for ln in mt.splitlines() if re.search(rf'(?i)(?<![0-9a-f]){tok}(?![0-9a-f])',ln)]
            print(f'-- 0x{a:08X} --'); [print(x) for x in hits[:12]]
          ranges={
            'find_entry':(0x8B4060,0x8B4100),
            'entry_helpers':(0x8B4100,0x8B4230),
            'find_streamed_generic':(0x8B48A0,0x8B4960),
            'find_streamed_wrapper':(0x8B4960,0x8B4980),
            'find_loaded':(0x8B4980,0x8B4B00),
            'sd_start_alias':(0x8B94C0,0x8B9801),
            'voice_allocate_ram':(0x8BA310,0x8BA4D0),
            'voice_allocate_stream':(0x8BA4D0,0x8BA610),
            'voice_post_alloc':(0x8BA610,0x8BA680),
          }
          meta={}
          for k,(a,b) in ranges.items():
            rb=raw(a,b); lines=[f'{i.address:08X}: {i.bytes.hex():<24} {i.mnemonic:<8} {i.op_str}' for i in md.disasm(rb,a)]
            Path('/tmp/probe',k+'.asm').write_text('\n'.join(lines)+'\n')
            meta[k]={'start':f'0x{a:08X}','endExclusive':f'0x{b:08X}','bytes':len(rb),'sha256':hashlib.sha256(rb).hexdigest(),'instructions':len(lines)}
          Path('/tmp/probe/ranges.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          print('=== RANGE IDENTITIES ==='); print(json.dumps(meta,indent=2,sort_keys=True))
          for k in ranges:
            print('===',k,'===')
            ls=Path('/tmp/probe',k+'.asm').read_text().splitlines()
            if k in ('find_loaded','voice_allocate_ram','voice_allocate_stream','voice_post_alloc'):
              [print(x) for x in ls]
            else:
              for x in ls:
                if any(n in x.lower() for n in ('call','0xbb80','0xffffffff','[ebp + 8]','[eax + 0x10]','[edx + 8]')): print(x)
          PY
      - name: Upload exact probe
        uses: actions/upload-artifact@v4
        with:
          name: T6_AUDIO_ASSETID_RUNTIME_PROBE_V2
          path: /tmp/probe
          if-no-files-found: error
          compression-level: 9
