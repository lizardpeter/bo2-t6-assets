name: T6 current client DB priority signature probe v1
on:
  push:
    paths:
      - 'tools/t6_current_client_db_priority_signature_probe_v1.py'
      - '.github/workflows/t6_current_client_db_priority_signature_probe_v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q capstone==5.0.6
      - name: Recover SHA-pinned current client and probe address-free DB signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/client /tmp/proof
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          EXPECT='770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf'
          ua='bo2-t6-assets-db-priority-signature/1'
          def get(u):
              q=urllib.request.Request(u,headers={'User-Agent':ua})
              with urllib.request.urlopen(q,timeout=180) as r:return r.read()
          info=None
          for ep in ['https://cdn.plutoniummod.com/updater/prod/info.json','https://cdn.plutonium.pw/updater/prod/info.json']:
              try: info=json.loads(get(ep)); break
              except Exception: pass
          if info is None: raise SystemExit('no current CDN info endpoint')
          m=[x for x in info['files'] if x.get('name','').replace('\\','/').lower()=='games/t6mp.exe']
          if len(m)!=1: raise SystemExit(f'expected one games/t6mp.exe, got {len(m)}')
          rec=m[0]; raw=get(info['baseUrl']+rec['hash'])
          if len(raw)!=int(rec['size']): raise SystemExit('size mismatch')
          if hashlib.sha1(raw).hexdigest()!=rec['hash'].lower(): raise SystemExit('SHA1 mismatch')
          sha=hashlib.sha256(raw).hexdigest()
          if sha!=EXPECT: raise SystemExit(f'current CDN object changed: {sha}; require a new explicitly classified probe')
          Path('/tmp/client/t6mp.exe').write_bytes(raw); Path('/tmp/client/revision').write_text(str(info.get('revision')))
          print(json.dumps({'revision':info.get('revision'),'bytes':len(raw),'sha1':rec['hash'],'sha256':sha}))
          PY
          python3 tools/t6_current_client_db_priority_signature_probe_v1.py /tmp/client/t6mp.exe --revision "$(cat /tmp/client/revision)" --out /tmp/proof/T6_CURRENT_CLIENT_DB_PRIORITY_SIGNATURE_PROBE_V1.json
          rm -f /tmp/client/t6mp.exe
          test ! -e /tmp/client/t6mp.exe
          sha256sum /tmp/proof/T6_CURRENT_CLIENT_DB_PRIORITY_SIGNATURE_PROBE_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_DB_PRIORITY_SIGNATURE_PROBE_V1
          path: /tmp/proof/T6_CURRENT_CLIENT_DB_PRIORITY_SIGNATURE_PROBE_V1.json
          if-no-files-found: error
          compression-level: 9
