name: T6 current client floatZ layout locator v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_floatz_layout_locator_v2.py'
      - 'tools/t6_current_client_fetch_exact_v1.py'
      - '.github/workflows/t6_current_client_floatz_layout_locator_v2.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q capstone==5.0.6
      - name: Recover exact SHA-classified current client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/client proof/current_client
          python3 tools/t6_current_client_fetch_exact_v1.py \
            --out-exe /tmp/client/t6mp.exe \
            --out-identity /tmp/client/identity.json
          python3 -c "import json; print(json.load(open('/tmp/client/identity.json'))['observedCdnRevision'])" > /tmp/client/revision
      - name: Locate floatZ input-layout candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_floatz_layout_locator_v2.py \
            /tmp/client/t6mp.exe --revision "$(cat /tmp/client/revision)" \
            --out proof/current_client/T6_CURRENT_CLIENT_FLOATZ_LAYOUT_LOCATOR_V2.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_FLOATZ_LAYOUT_LOCATOR_V2.json'))
          assert d['client']['sha256']=='770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf'
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_FLOATZ_LAYOUT_LOCATOR_V2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist current-client floatZ layout locator'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          rm -f /tmp/client/t6mp.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_FLOATZ_LAYOUT_LOCATOR_V2
          path: proof/current_client/T6_CURRENT_CLIENT_FLOATZ_LAYOUT_LOCATOR_V2.json
          if-no-files-found: error
          compression-level: 9
