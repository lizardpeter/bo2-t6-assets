name: FalkorDB native Windows POC

on:
  push:
    branches:
      - chatgpt/falkordb-native-win
    paths:
      - 'falkordb-native-win/**'
      - '.github/workflows/falkordb-native-windows-poc.yml'
  workflow_dispatch:

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Rust/MSVC toolchain
        shell: pwsh
        run: |
          rustc -Vv
          cargo -V
          cmake --version
          git --version

      - name: Bootstrap native dependencies
        shell: pwsh
        working-directory: falkordb-native-win
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\scripts\bootstrap_windows.ps1

      - name: Compile, link, and execute smoke
        shell: pwsh
        working-directory: falkordb-native-win
        run: .\scripts\diagnose.ps1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-diagnostics
          path: falkordb-native-win/build/logs
          if-no-files-found: ignore
