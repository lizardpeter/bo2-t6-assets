name: T6 current-client whole-image inventory one-shot
# graph-ingest-chunks: 2000-efficient-rel-v5

on:
  push:
    paths:
      - '.github/workflows/t6_current_client_whole_image_inventory_one_shot.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check -q capstone==5.0.6 pefile
      - name: Recover exact current client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/client proof/current_client/whole_image_inventory_v1
          python3 tools/t6_current_client_fetch_exact_v1.py             --out-exe /tmp/client/t6mp.exe             --out-identity /tmp/client/identity.json
      - name: Build graph-ready inventory
        shell: bash
        run: |
          set -euo pipefail
          rev=$(python3 -c "import json;print(json.load(open('/tmp/client/identity.json'))['observedCdnRevision'])")
          rm -rf proof/current_client/whole_image_inventory_v1
          mkdir -p proof/current_client/whole_image_inventory_v1
          python3 tools/t6_current_client_whole_image_mechanical_inventory_v1.py             /tmp/client/t6mp.exe             --revision "$rev"             --out-dir proof/current_client/whole_image_inventory_v1
          cat proof/current_client/whole_image_inventory_v1/manifest.json
          git diff --check
          git config user.name uregraph-re-bot
          git config user.email uregraph-re-bot@users.noreply.github.com
          git add proof/current_client/whole_image_inventory_v1
          if ! git diff --cached --quiet; then
            git commit -m "Inventory exact T6 current client for UREGraph"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          rm -f /tmp/client/t6mp.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_WHOLE_IMAGE_INVENTORY_V1
          path: proof/current_client/whole_image_inventory_v1
          if-no-files-found: error
