name: T6 Nuketown generated runtime sampler payload binding v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_nuketown_generated_runtime_sampler_payload_binding_v1.py'
      - 'proof/render/T6_NUKETOWN_GENERATED_RUNTIME_SAMPLER_SURFACE_BINDING_V1.json'
      - 'proof/T6_NUKETOWN_LIGHTMAP_INLINE_PAYLOAD_PROOF_V1.json'
      - 'proof/T6_NUKETOWN_REFLECTION_INLINE_PAYLOAD_PROBE_V1.json'
      - 'proof/T6_NUKETOWN_PRODUCTION_TEXTURE_PAYLOAD_COVERAGE_V1.json'
      - 'proof/T6_NUKETOWN_PRODUCTION_TEXTURE_PAYLOAD_COVERAGE_V2.json'
      - '.github/workflows/t6_nuketown_generated_runtime_sampler_payload_binding_v1.yml'
permissions:
  contents: write
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bind every generated runtime sampler use to exact retail payload bytes
        env:
          PYTHONPATH: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_nuketown_generated_runtime_sampler_payload_binding_v1.py             --binding proof/render/T6_NUKETOWN_GENERATED_RUNTIME_SAMPLER_SURFACE_BINDING_V1.json             --lightmap-payload proof/T6_NUKETOWN_LIGHTMAP_INLINE_PAYLOAD_PROOF_V1.json             --reflection-payload proof/T6_NUKETOWN_REFLECTION_INLINE_PAYLOAD_PROBE_V1.json             --coverage-v1 proof/T6_NUKETOWN_PRODUCTION_TEXTURE_PAYLOAD_COVERAGE_V1.json             --coverage-v2 proof/T6_NUKETOWN_PRODUCTION_TEXTURE_PAYLOAD_COVERAGE_V2.json             --out proof/render/T6_NUKETOWN_GENERATED_RUNTIME_SAMPLER_PAYLOAD_BINDING_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/render/T6_NUKETOWN_GENERATED_RUNTIME_SAMPLER_PAYLOAD_BINDING_V1.json'))
          s=d['summary']
          assert s['generatedSurfaceCount']==507
          assert s['secondaryLightmapPayloadBindingCount']==507
          assert s['reflectionProbePayloadBindingCount']==473
          assert s['surfaceSamplerPayloadBindingCount']==980
          assert s['uniqueSecondaryLightmapPayloadResourceCount']==2
          assert s['uniqueReflectionProbePayloadResourceCount']==23
          assert s['uniquePayloadResourceCount']==25
          assert s['allRuntimeSamplerPayloadsExact'] is True
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/render/T6_NUKETOWN_GENERATED_RUNTIME_SAMPLER_PAYLOAD_BINDING_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist generated runtime sampler payload bindings'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_GENERATED_RUNTIME_SAMPLER_PAYLOAD_BINDING_V1
          path: proof/render/T6_NUKETOWN_GENERATED_RUNTIME_SAMPLER_PAYLOAD_BINDING_V1.json
          if-no-files-found: error
