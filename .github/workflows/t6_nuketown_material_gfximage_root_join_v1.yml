name: T6 Nuketown Material GfxImage root join v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_nuketown_material_gfximage_root_join_v1.py'
      - 'proof/T6_NUKETOWN_MATERIAL_GFXIMAGE_ROOT_PROBE_V1.json'
      - '.github/workflows/t6_nuketown_material_gfximage_root_join_v1.yml'
permissions:
  contents: write
jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact identity visibility join only
        run: |
          set -euo pipefail
          python3 tools/t6_nuketown_material_gfximage_root_join_v1.py --payload proof/T6_NUKETOWN_PRODUCTION_TEXTURE_PAYLOAD_COVERAGE_V1.json --probe proof/T6_NUKETOWN_MATERIAL_GFXIMAGE_ROOT_PROBE_V1.json --out proof/T6_NUKETOWN_MATERIAL_GFXIMAGE_ROOT_JOIN_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/T6_NUKETOWN_MATERIAL_GFXIMAGE_ROOT_JOIN_V1.json')); s=d['summary']
          assert s['unresolvedMaterialImageCount']==347
          assert s['exactIdentityVisibilityJoinCount']+s['noExactIdentityVisibilityJoinCount']==347
          assert s['visibleButOatPayloadMissingCount']+s['visibleWithNonMissingOatPathCount']==s['exactIdentityVisibilityJoinCount']
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/T6_NUKETOWN_MATERIAL_GFXIMAGE_ROOT_JOIN_V1.json
          git commit -m 'Persist exact Material GfxImage visibility join' || exit 0
          git pull --rebase origin main; git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_MATERIAL_GFXIMAGE_ROOT_JOIN_V1
          path: proof/T6_NUKETOWN_MATERIAL_GFXIMAGE_ROOT_JOIN_V1.json
