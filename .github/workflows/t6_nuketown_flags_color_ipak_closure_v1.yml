name: T6 Nuketown flags color IPAK closure v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_nuketown_flags_color_ipak_closure_v1.py'
      - '.github/workflows/t6_nuketown_flags_color_ipak_closure_v1.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact source-proven flags color pair
        env:
          PYTHONPATH: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_nuketown_flags_color_ipak_closure_v1.py             --v12 manifests/maps/mp_nuketown_2020/T6_NUKETOWN_PRIMARY_V12_THREE_MATERIAL_TEXTURE_CLOSURE_V1.json             --out proof/T6_NUKETOWN_FLAGS_COLOR_IPAK_CLOSURE_V1.json             https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ipak             https://r2.houseofkublai.com/bo2/zone/all/dlc0.ipak             https://r2.houseofkublai.com/bo2/zone/all/dlc0_load_mp.ipak             https://r2.houseofkublai.com/bo2/zone/all/mp.ipak             https://r2.houseofkublai.com/bo2/zone/all/base.ipak             https://r2.houseofkublai.com/bo2/zone/all/patch_mp.ipak             https://r2.houseofkublai.com/bo2/zone/all/so.ipak             https://r2.houseofkublai.com/bo2/zone/english/en_base.ipak
          python3 - <<'PY'
          import json
          d=json.load(open('proof/T6_NUKETOWN_FLAGS_COLOR_IPAK_CLOSURE_V1.json'))
          assert d['target']['material']=='mc/mtl_nt_2020_flags_01'
          assert d['target']['image']=='~-gnt_2020_flags_01_c'
          assert d['target']['nameHash']==584722835
          assert d['target']['dataHash']==147283182
          assert d['status'] in {'resolved','missing','conflict'}
          if d['status']=='resolved':
              assert d['matches'] and len({x['sha256'] for x in d['matches']})==1
              assert d['payloadSha256']==d['matches'][0]['sha256']
          print(json.dumps({'status':d['status'],'matches':len(d['matches']),'payloadSha256':d['payloadSha256']},indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/T6_NUKETOWN_FLAGS_COLOR_IPAK_CLOSURE_V1.json
          git commit -m 'Persist exact Nuketown flags color IPAK closure' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_FLAGS_COLOR_IPAK_CLOSURE_V1
          path: proof/T6_NUKETOWN_FLAGS_COLOR_IPAK_CLOSURE_V1.json
