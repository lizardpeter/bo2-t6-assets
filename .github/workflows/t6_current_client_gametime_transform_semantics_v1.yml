name: T6 current client gameTime transform semantics v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_gametime_transform_semantics_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_GAMETIME_ARITHMETIC_PROBE_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_GAMETIME_WRITE_CLUSTER_V1.json'
      - '.github/workflows/t6_current_client_gametime_transform_semantics_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove exact gameTime transform
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_gametime_transform_semantics_v1.py             --arithmetic proof/current_client/T6_CURRENT_CLIENT_GAMETIME_ARITHMETIC_PROBE_V1.json             --writes proof/current_client/T6_CURRENT_CLIENT_GAMETIME_WRITE_CLUSTER_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_GAMETIME_TRANSFORM_SEMANTICS_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_GAMETIME_TRANSFORM_SEMANTICS_V1.json'))
          assert d['summary']['currentClientTransformClosed'] is True
          assert d['summary']['currentClientProviderClosed'] is False
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_GAMETIME_TRANSFORM_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact current-client gameTime transform'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_GAMETIME_TRANSFORM_SEMANTICS_V1
          path: proof/current_client/T6_CURRENT_CLIENT_GAMETIME_TRANSFORM_SEMANTICS_V1.json
          if-no-files-found: error
