name: nuketown-static-exact43-texture-integration
on:
  push:
    branches: [base-ipak-r2-recovery]
    paths:
      - .github/workflows/nuketown-static-exact43-texture-integration.yml
      - tools/t6_base_ipak_exact43_r2_extract_v1.py
      - tools/t6_nuketown_static_exact43_texture_apply_v1.py
      - tools/t6_nuketown_exact_alias_role_plan_v1.py
      - tools/t6_oat_gfxworld_layout_probe.cpp
      - tools/t6_oat_external_gfxworld_scan.py
      - tools/t6_nuketown_playable_static_bounds_filter_v1.py
      - tools/t6_nuketown_oat_static_scene_assemble_v1.py
      - tools/t6_nuketown_static_scene_acceptance_v1.py
      - manifests/maps/mp_nuketown_2020/NUKETOWN_PACKED_IMAGE_CROSSFAMILY_ALIAS_BANK_V1.json.zlib.b64
      - manifests/maps/mp_nuketown_2020/NUKETOWN_BASE_IPAK_EXACT43_PROOF_V1.json.zlib.b64
      - manifests/maps/mp_nuketown_2020/T6_NUKETOWN_PLAYABLE_STATIC_MATERIAL_PROOF_V2.json.zlib.b64
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install exact reconstruction dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-multilib gcc-multilib liblzo2-2
          python -m pip install --disable-pip-version-check gdown pillow

      - name: Fetch pinned retail FF, OAT source and OAT binary
        run: |
          git clone --branch v0.33.0 --depth 1 https://github.com/Laupetin/OpenAssetTools.git oat-src
          test "$(git -C oat-src rev-parse HEAD)" = "7d027e8f89118196713e955b0e11f8404149c54d"
          gdown 1NuNJcsDBDwvIyaRDTLvYO4ySVWPeQYCh -O mp_nuketown_2020.ff
          test "$(stat -c %s mp_nuketown_2020.ff)" = "38472064"
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  mp_nuketown_2020.ff' | sha256sum -c -
          curl -L --fail --retry 3 -o oat-linux.tar.gz https://github.com/Laupetin/OpenAssetTools/releases/download/v0.33.0/oat-linux.tar.gz
          echo 'aa0b80f633c50d656b26d28b4899fd76bd994024ff0c669303ed5db52cc9e864  oat-linux.tar.gz' | sha256sum -c -
          mkdir oat
          tar -xzf oat-linux.tar.gz -C oat
          UNLINKER=$(find oat -type f -name Unlinker | head -1)
          test -n "$UNLINKER"
          chmod +x "$UNLINKER"
          echo "$UNLINKER" > unlinker-path.txt

      - name: Derive pinned x86 retail layout
        run: |
          g++ -m32 -std=c++23 -DARCH_x86 -Ioat-src/src/Common tools/t6_oat_gfxworld_layout_probe.cpp -o gfxworld-layout-probe
          ./gfxworld-layout-probe > gfxworld-layout.json
          python - <<'PY'
          import json
          p=json.load(open('gfxworld-layout.json'))
          expected={
            'GfxWorld': {'size':1028,'name':0,'surfaceCount':16,'dpvs':784},
            'GfxWorldDpvsStatic': {'size':116,'smodelCount':0,'smodelInsts':84,'smodelDrawInsts':92},
            'GfxStaticModelInst': {'size':36,'mins':0,'maxs':12,'lightingOrigin':24},
            'GfxStaticModelDrawInst': {'size':152,'cullDist':0,'placement':4,'model':56,'flags':60,'lightingHandle':68,'colorsIndex':70,'primaryLightIndex':96,'visibility':97,'reflectionProbeIndex':98,'smid':100},
            'GfxPackedPlacement': {'size':52,'origin':0,'axis':12,'scale':48},
            'XModel': {'size':248,'name':0},
          }
          assert p['ptrSize']==4
          for s,fields in expected.items():
            for k,v in fields.items(): assert p[s][k]==v,(s,k,p[s][k],v)
          PY

      - name: Recover authoritative GfxWorld placements and OAT model/material corpus
        run: |
          UNLINKER=$(cat unlinker-path.txt)
          mkdir -p probe_out
          python tools/t6_oat_external_gfxworld_scan.py \
            --layout gfxworld-layout.json \
            --out GFXWORLD_STATIC_PLACEMENTS_2992_V1.json \
            --diag GFXWORLD_EXTERNAL_SCAN_DIAGNOSTICS_V1.json \
            --timeout 30 \
            -- "$UNLINKER" mp_nuketown_2020.ff --output-folder probe_out --model-format GLB --verbose
          python - <<'PY'
          import json,math
          p=json.load(open('GFXWORLD_STATIC_PLACEMENTS_2992_V1.json'))
          assert p['worldName']=='maps/mp/mp_nuketown_2020.d3dbsp'
          assert p['surfaceCount']==5614 and p['smodelCount']==2992 and len(p['placements'])==2992
          assert all(r['model'] for r in p['placements'])
          for r in p['placements']:
            assert math.isfinite(r['scale']) and r['scale']>0
          PY
          test "$(find probe_out/model_export -type f -name '*_lod0.glb' | wc -l)" = "433"

      - name: Reproduce exact 1943 playable placement partition
        run: |
          python - <<'PY'
          import base64,hashlib,json,zlib
          from pathlib import Path
          src=Path('GFXWORLD_STATIC_PLACEMENTS_2992_V1.json')
          world=json.loads(src.read_text())
          pp=Path('manifests/maps/mp_nuketown_2020/T6_NUKETOWN_PLAYABLE_STATIC_MATERIAL_PROOF_V2.json.zlib.b64')
          proof=json.loads(zlib.decompress(base64.b64decode(pp.read_text())).decode())
          names={r['xmodelName'] for r in proof['models']}
          assert len(names)==297 and len(proof['models'])==297
          assert len({m for r in proof['models'] for m in r['materials']})==344
          rows=[r for r in world['placements'] if r['model'] in names]
          assert len(rows)==2303 and {r['model'] for r in rows}==names
          out={'format':'t6-nuketown-playable-identity-placement-candidates-v1','sourcePlacementSha256':hashlib.sha256(src.read_bytes()).hexdigest(),'playableIdentityCount':297,'count':2303,'placements':rows}
          target=Path('NUKETOWN_PLAYABLE_IDENTITY_CANDIDATES_2303_V1.json')
          target.write_text(json.dumps(out,separators=(',',':'))+'\n')
          assert hashlib.sha256(target.read_bytes()).hexdigest()=='1816ca5a84795a29b749d600573269dac0f06dc690c3cbcce8e19ecc33bd23cf'
          PY
          python tools/t6_nuketown_playable_static_bounds_filter_v1.py \
            --source NUKETOWN_PLAYABLE_IDENTITY_CANDIDATES_2303_V1.json \
            --selected-out NUKETOWN_PLAYABLE_STATIC_PLACEMENTS_1943_V1.json \
            --excluded-out NUKETOWN_PLAYABLE_STATIC_EXCLUDED_360_V1.json \
            --manifest-out NUKETOWN_PLAYABLE_STATIC_BOUNDS_FILTER_PROOF_V1.json \
            --half-extent 2500 --expected-source 2303 --expected-selected 1943 --expected-identities 297
          echo 'b04aea6f480fe3c6b38648f99bba7b6c43a8541903e9d813ebef18d77e1cd85b  NUKETOWN_PLAYABLE_STATIC_PLACEMENTS_1943_V1.json' | sha256sum -c -

      - name: Assemble and verify authoritative 1943 static GLB
        run: |
          python tools/t6_nuketown_oat_static_scene_assemble_v1.py \
            --placements NUKETOWN_PLAYABLE_STATIC_PLACEMENTS_1943_V1.json \
            --proof manifests/maps/mp_nuketown_2020/T6_NUKETOWN_PLAYABLE_STATIC_MATERIAL_PROOF_V2.json.zlib.b64 \
            --model-dir probe_out/model_export \
            --out mp_nuketown_2020_PLAYABLE_STATIC_OAT_RECOVERED_v1.glb \
            --manifest NUKETOWN_PLAYABLE_STATIC_OAT_RECOVERED_V1.json \
            --expected 1943 --full-smodel-count 2992
          python tools/t6_nuketown_static_scene_acceptance_v1.py \
            mp_nuketown_2020_PLAYABLE_STATIC_OAT_RECOVERED_v1.glb \
            --summary NUKETOWN_PLAYABLE_STATIC_OAT_RECOVERED_ACCEPTANCE_V1.json
          test "$(stat -c %s mp_nuketown_2020_PLAYABLE_STATIC_OAT_RECOVERED_v1.glb)" = "17263196"
          echo 'bc8f0c14518ccd15fabcdc0dd283dbecea410e0383c5057e4036ad1e95d8835b  mp_nuketown_2020_PLAYABLE_STATIC_OAT_RECOVERED_v1.glb' | sha256sum -c -

      - name: Derive exact 78/41 first-semantic role plan
        run: |
          python tools/t6_nuketown_exact_alias_role_plan_v1.py \
            --material-root probe_out/materials \
            --proof manifests/maps/mp_nuketown_2020/T6_NUKETOWN_PLAYABLE_STATIC_MATERIAL_PROOF_V2.json.zlib.b64 \
            --alias-bank manifests/maps/mp_nuketown_2020/NUKETOWN_PACKED_IMAGE_CROSSFAMILY_ALIAS_BANK_V1.json.zlib.b64 \
            --exact43-proof manifests/maps/mp_nuketown_2020/NUKETOWN_BASE_IPAK_EXACT43_PROOF_V1.json.zlib.b64 \
            --out NUKETOWN_EXACT_ALIAS_ROLE_PLAN_V1.json
          python - <<'PY'
          import json
          p=json.load(open('NUKETOWN_EXACT_ALIAS_ROLE_PLAN_V1.json'))
          a=p['aliasBackedFirstSemanticRoleCount']; e=p['baseIpakExact43FirstSemanticRoleCount']
          assert (a['bindings'],a['baseColorTexture'],a['normalTexture'])==(78,52,26),a
          assert (e['bindings'],e['baseColorTexture'],e['normalTexture'],e['uniqueImages'])==(41,28,13,30),e
          assert p['validation']['all344RetainedMaterialsResolvedExactly'] is True
          PY

      - name: Re-extract all 43 exact base.ipak payloads with 0xCF support
        run: |
          python tools/t6_base_ipak_exact43_r2_extract_v1.py \
            --alias-bank manifests/maps/mp_nuketown_2020/NUKETOWN_PACKED_IMAGE_CROSSFAMILY_ALIAS_BANK_V1.json.zlib.b64 \
            --out-dir exact43
          python - <<'PY'
          import json
          p=json.load(open('exact43/BASE_IPAK_EXACT_ALIAS_CF_SKIP_V1.json'))
          assert p['sourceBytes']==2614362112 and p['indexEntryCount']==13366
          assert p['candidateCount']==43
          assert p['summary']['validated']==43 and p['summary']['validatedWithCfSkip']==9
          assert p['summary'].get('rejected',0)==0
          assert sum(1 for r in p['rows'] if r.get('pngFile'))==43
          PY

      - name: Apply only the 41 exact43 first-semantic bindings
        run: |
          python tools/t6_nuketown_static_exact43_texture_apply_v1.py \
            --glb mp_nuketown_2020_PLAYABLE_STATIC_OAT_RECOVERED_v1.glb \
            --role-plan NUKETOWN_EXACT_ALIAS_ROLE_PLAN_V1.json \
            --exact43-report exact43/BASE_IPAK_EXACT_ALIAS_CF_SKIP_V1.json \
            --payload-dir exact43 \
            --out mp_nuketown_2020.recovered_1943_static_scene_exact43_textured_v1.glb \
            --manifest NUKETOWN_STATIC_EXACT43_TEXTURE_APPLY_V1.json

      - name: Independently accept append-only textured output
        run: |
          python - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          def read_glb(path):
            b=Path(path).read_bytes(); magic,ver,total=struct.unpack_from('<4sII',b,0)
            assert magic==b'glTF' and ver==2 and total==len(b)
            off=12; js=None; binbuf=None
            while off<len(b):
              n,t=struct.unpack_from('<I4s',b,off); off+=8; chunk=b[off:off+n]; off+=n
              if t==b'JSON': js=json.loads(chunk.rstrip(b' \0'))
              elif t==b'BIN\0': binbuf=bytes(chunk)
            assert js is not None and binbuf is not None
            return b,js,binbuf
          ib,ij,ibin=read_glb('mp_nuketown_2020_PLAYABLE_STATIC_OAT_RECOVERED_v1.glb')
          ob,oj,obin=read_glb('mp_nuketown_2020.recovered_1943_static_scene_exact43_textured_v1.glb')
          assert hashlib.sha256(ib).hexdigest()=='bc8f0c14518ccd15fabcdc0dd283dbecea410e0383c5057e4036ad1e95d8835b'
          assert oj['nodes']==ij['nodes'] and oj['meshes']==ij['meshes'] and oj['accessors']==ij['accessors']
          assert oj['bufferViews'][:len(ij['bufferViews'])]==ij['bufferViews']
          assert obin[:len(ibin)]==ibin
          assert [m.get('name') for m in oj['materials']]==[m.get('name') for m in ij['materials']]
          assert len(oj['materials'])==344 and len(oj['meshes'])==297
          assert len([n for n in oj['nodes'] if 'mesh' in n])==1943
          assert len(oj.get('images',[]))==30 and len(oj.get('textures',[]))==30
          manifest=json.load(open('NUKETOWN_STATIC_EXACT43_TEXTURE_APPLY_V1.json'))
          s=manifest['summary']; assert (s['promotionCount'],s['colorPromotions'],s['normalPromotions'],s['uniqueImageCount'])==(41,28,13,30),s
          validation={
            'format':'t6-nuketown-static-exact43-texture-acceptance-v1',
            'inputGlbSha256':hashlib.sha256(ib).hexdigest(),
            'outputGlb':{'bytes':len(ob),'sha256':hashlib.sha256(ob).hexdigest()},
            'counts':{'materials':344,'meshDefinitions':297,'meshInstances':1943,'promotions':41,'colors':28,'normals':13,'uniqueImages':30},
            'validation':{'nodesIdentity':'pass','meshesIdentity':'pass','accessorsIdentity':'pass','preexistingBufferViewsIdentity':'pass','originalBinExactPrefix':'pass','materialNameOrderIdentity':'pass','outputReparse':'pass'}
          }
          Path('NUKETOWN_STATIC_EXACT43_TEXTURE_ACCEPTANCE_V1.json').write_text(json.dumps(validation,indent=2,sort_keys=True)+'\n')
          print(json.dumps(validation,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuketown-recovered-1943-static-scene-exact43-textured-v1
          path: |
            mp_nuketown_2020.recovered_1943_static_scene_exact43_textured_v1.glb
            NUKETOWN_STATIC_EXACT43_TEXTURE_APPLY_V1.json
            NUKETOWN_STATIC_EXACT43_TEXTURE_ACCEPTANCE_V1.json
            NUKETOWN_EXACT_ALIAS_ROLE_PLAN_V1.json
            exact43/BASE_IPAK_EXACT_ALIAS_CF_SKIP_V1.json
            NUKETOWN_PLAYABLE_STATIC_OAT_RECOVERED_V1.json
            NUKETOWN_PLAYABLE_STATIC_OAT_RECOVERED_ACCEPTANCE_V1.json
          if-no-files-found: warn
          retention-days: 7
