name: T6 layered Material construction closure v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_layered_material_construction_closure_v1.yml'
      - 'tools/t6_pc_server_material_create_layered_probe_v1.py'
      - 'tools/t6_pc_server_layered_material_construction_proof_v1.py'
      - 'manifests/materials/T6_PC_SERVER_LAYERED_MATERIAL_SORT_V1.json'

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXE_ID: 1NhLTmevZ5HPKRByj1ok8BpwbvX_5rc1n
      MAP_ID: 1kcCFEDP-gubgUyN6R_WjlJpFGoeZNEmd
      EXE_SHA256: f67eb68a494b93b5b229985205bdc94e26fdfe677663410e2207c25f6f27a55d
      MAP_SHA256: 34e16e517072031629307ffa0520d59f3c586539b943d081f60c59ee9ce1c3bf
      OAT_COMMIT: 9dca965366541504b71fa8cfb7ac049cb9b717e1
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref /tmp/proof
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.exe \
            "https://drive.usercontent.google.com/download?id=$EXE_ID&export=download&confirm=t"
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.map \
            "https://drive.usercontent.google.com/download?id=$MAP_ID&export=download&confirm=t"
          echo "$EXE_SHA256  /tmp/ref/CoDMPServer_PC.exe" | sha256sum -c -
          echo "$MAP_SHA256  /tmp/ref/CoDMPServer_PC.map" | sha256sum -c -
          curl --fail --location --retry 5 --retry-all-errors \
            -o /tmp/ref/T6_Assets.h \
            "https://raw.githubusercontent.com/Laupetin/OpenAssetTools/$OAT_COMMIT/src/Common/Game/T6/T6_Assets.h"
          test -s /tmp/ref/T6_Assets.h
          sha256sum /tmp/ref/T6_Assets.h | tee /tmp/proof/oat_header_sha256.txt

      - name: Install pinned disassembler
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6

      - name: Rebuild exact complete constructor structural IR
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_pc_server_material_create_layered_probe_v1.py \
            /tmp/ref/CoDMPServer_PC.exe \
            /tmp/ref/CoDMPServer_PC.map \
            /tmp/proof/T6_PC_SERVER_MATERIAL_CREATE_LAYERED_PROBE_V1.json \
            | tee /tmp/proof/structural_probe.log

      - name: Promote exact construction semantics fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_pc_server_layered_material_construction_proof_v1.py \
            --probe /tmp/proof/T6_PC_SERVER_MATERIAL_CREATE_LAYERED_PROBE_V1.json \
            --exe /tmp/ref/CoDMPServer_PC.exe \
            --oat-header /tmp/ref/T6_Assets.h \
            --sort-manifest manifests/materials/T6_PC_SERVER_LAYERED_MATERIAL_SORT_V1.json \
            --out /tmp/proof/T6_PC_SERVER_LAYERED_MATERIAL_CONSTRUCTION_V1.json \
            | tee /tmp/proof/construction_closure.log
          sha256sum /tmp/proof/T6_PC_SERVER_LAYERED_MATERIAL_CONSTRUCTION_V1.json \
            | tee /tmp/proof/result_sha256.txt

      - name: Assert promoted closure surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/proof/closure_assertions.txt
          import json
          p='/tmp/proof/T6_PC_SERVER_LAYERED_MATERIAL_CONSTRUCTION_V1.json'
          d=json.load(open(p))
          assert d['format']=='t6-pc-server-layered-material-construction-v1'
          s=d['summary']
          for k in [
              'generatedNameConstructionClosed',
              'layerSuffixConstructionClosed',
              'textureRecordConstructionClosed',
              'constantRecordConstructionClosed',
              'defaultColorTintConstructionClosed',
              'finalTextureSortClosed',
              'finalConstantSortClosed',
          ]:
              assert s[k] is True, (k,s[k])
          assert s['historicalStandaloneSerializationRecovered'] is False
          assert s['retailClientExecutableEquivalenceClaimed'] is False
          assert d['constantConstruction']['colorTint']['colorWhiteVec4']==[1.0,1.0,1.0,1.0]
          assert d['generatedMaterialName']['rule'].startswith("baseName + '('")
          print('GREEN exact layered Material construction closure')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_PC_SERVER_LAYERED_MATERIAL_CONSTRUCTION_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
