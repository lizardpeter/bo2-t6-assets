name: T6 current client shadowmap sampler sun provider semantics v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_shadowmap_sampler_sun_provider_semantics_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_SHADOWMAP_SUN_PARENT_CALLERS_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_SHADOWMAP_SUN_IMAGE_CALLER_STACK_PROVENANCE_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_SHADOWMAP_SUN_IMAGE_WRITER_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_SHADOWMAP_SAMPLER_SUN_ALL_WRITER_STATE_BYTE_SEMANTICS_V1.json'
      - '.github/workflows/t6_current_client_shadowmap_sampler_sun_provider_semantics_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Join exact provider proof
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_shadowmap_sampler_sun_provider_semantics_v1.py \
            --denominator proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json \
            --array proof/current_client/T6_CURRENT_CLIENT_CODE_PIXEL_SAMPLER_ARRAY_SEMANTICS_V1.json \
            --image proof/current_client/T6_CURRENT_CLIENT_SHADOWMAP_SUN_IMAGE_WRITER_V1.json \
            --stack proof/current_client/T6_CURRENT_CLIENT_SHADOWMAP_SUN_IMAGE_CALLER_STACK_PROVENANCE_V1.json \
            --parent proof/current_client/T6_CURRENT_CLIENT_SHADOWMAP_SUN_PARENT_CALLERS_V1.json \
            --state proof/current_client/T6_CURRENT_CLIENT_SHADOWMAP_SAMPLER_SUN_ALL_WRITER_STATE_BYTE_SEMANTICS_V1.json \
            --out proof/current_client/T6_CURRENT_CLIENT_SHADOWMAP_SAMPLER_SUN_PROVIDER_SEMANTICS_V1.json
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_SHADOWMAP_SAMPLER_SUN_PROVIDER_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist sun shadow sampler provider semantics'
            ok=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_SHADOWMAP_SAMPLER_SUN_PROVIDER_SEMANTICS_V1
          path: proof/current_client/T6_CURRENT_CLIENT_SHADOWMAP_SAMPLER_SUN_PROVIDER_SEMANTICS_V1.json
          if-no-files-found: error
          compression-level: 9
