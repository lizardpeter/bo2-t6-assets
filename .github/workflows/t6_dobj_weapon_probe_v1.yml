name: T6 DObj weapon probe v1

on:
  push:
    branches:
      - probe-t6-character-xassets
    paths:
      - ".github/workflows/t6_dobj_weapon_probe_v1.yml"
      - "tools/ghidra_scripts/ExportT6NamedFunctions.java"
  workflow_dispatch:

permissions:
  contents: read

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  SERVER_CACHE_KEY: t6-server-ghidra-12.1.3-f67eb68a-7874efc2-pdb-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors             -o /tmp/ghidra.zip             https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Restore exact PDB-backed server project
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-server-ghidra/projects
          key: ${{ env.SERVER_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Select DObj and viewmodel construction functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-dobj-probe
          cat >/tmp/t6-dobj-probe/selection.tsv <<'EOF'
          function_id	requested_name	tier
          G_CreateDObj	G_CreateDObj	dobj-construction
          CG_CreateDObj	CG_CreateDObj	dobj-construction
          DObjCreateDuplicateParts	DObjCreateDuplicateParts	dobj-bone-map
          DObjGetNumModels	DObjGetNumModels	dobj-layout
          DObjGetParentBone	DObjGetParentBone	dobj-bone-map
          DObjGetXModel	DObjGetXModel	dobj-layout
          DObjGetBoneIndex	DObjGetBoneIndex	dobj-bone-map
          Com_ClientDObjCreate	Com_ClientDObjCreate	dobj-construction
          Com_ServerDObjCreate	Com_ServerDObjCreate	dobj-construction
          DObjCalcBaseSkel	DObjCalcBaseSkel	dobj-skeleton
          DObjCalcSkel	DObjCalcSkel	dobj-skeleton
          DObjCalcBaseAnim	DObjCalcBaseAnim	dobj-skeleton
          DObjGetModelParentBoneName	DObjGetModelParentBoneName	dobj-skeleton
          AddViewmodelWeaponAttachments	AddViewmodelWeaponAttachments	weapon-viewmodel
          ChangeViewmodelDobj	ChangeViewmodelDobj	weapon-viewmodel
          SV_DObjGetBoneIndex	SV_DObjGetBoneIndex	dobj-bone-map
          SV_DObjGetParentBoneIndex	SV_DObjGetParentBoneIndex	dobj-bone-map
          EOF

      - name: Export exact PDB-backed functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-dobj-probe/out /tmp/t6-server-ghidra/config-dobj /tmp/t6-server-ghidra/cache-dobj
          export XDG_CONFIG_HOME=/tmp/t6-server-ghidra/config-dobj
          export XDG_CACHE_HOME=/tmp/t6-server-ghidra/cache-dobj
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless"             /tmp/t6-server-ghidra/projects t6-server-pdb             -process CoDMPServer_PC.exe -noanalysis -readOnly             -postScript ExportT6NamedFunctions.java               /tmp/t6-dobj-probe/selection.tsv /tmp/t6-dobj-probe/out 30             -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 2
          cat /tmp/t6-dobj-probe/out/results.tsv
          for f in /tmp/t6-dobj-probe/out/decompile/*.c; do
            echo "=== $(basename "$f") ==="
            cat "$f"
          done

      - name: Upload exact DObj evidence
        uses: actions/upload-artifact@v4
        with:
          name: T6_DOBJ_WEAPON_PROBE_V1
          path: /tmp/t6-dobj-probe
          if-no-files-found: error
          retention-days: 7
