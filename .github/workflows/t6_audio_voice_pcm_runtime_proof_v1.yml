name: T6 audio voice PCM runtime proof v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_pc_server_sound_voice_pcm_runtime_proof_v1.py'
      - '.github/workflows/t6_audio_voice_pcm_runtime_proof_v1.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXE_ID: 1NhLTmevZ5HPKRByj1ok8BpwbvX_5rc1n
      MAP_ID: 1kcCFEDP-gubgUyN6R_WjlJpFGoeZNEmd
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact PC server references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref /tmp/proof
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.exe "https://drive.usercontent.google.com/download?id=$EXE_ID&export=download&confirm=t"
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.map "https://drive.usercontent.google.com/download?id=$MAP_ID&export=download&confirm=t"
      - name: Prove decoder source voice handoff
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 - <<'PY'
          import json
          from pathlib import Path
          import t6_pc_server_sound_voice_pcm_runtime_proof_v1 as p
          exe=Path('/tmp/ref/CoDMPServer_PC.exe').read_bytes()
          with open('/tmp/ref/CoDMPServer_PC.map','r',encoding='ascii',newline='') as f:
              map_text=f.read()
          result=p.prove(exe,map_text)
          out=Path('/tmp/proof/T6_AUDIO_PC_SERVER_VOICE_PCM_RUNTIME_V1.json')
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          sha256sum /tmp/proof/T6_AUDIO_PC_SERVER_VOICE_PCM_RUNTIME_V1.json
      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: T6_AUDIO_PC_SERVER_VOICE_PCM_RUNTIME_V1
          path: /tmp/proof/T6_AUDIO_PC_SERVER_VOICE_PCM_RUNTIME_V1.json
          if-no-files-found: error
          compression-level: 9
