name: SEAL6 downloadable build

on:
  push:
    branches: [r2-fetch-test]
    paths: ['.github/workflows/seal6-download-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reversal/nonmap-assets
      - name: Fetch exact retail source
        run: |
          mkdir -p work/seal6
          curl --fail --location --retry 3 -o work/faction_seals_mp.ff https://r2.houseofkublai.com/bo2/zone/all/faction_seals_mp.ff
          echo '1a075434760751551158b7d62cc2761649e2d2c7606b27b3bbe066b998b77c88  work/faction_seals_mp.ff' | sha256sum -c -
      - name: Expand retail FastFile
        run: python tools/t6_pc_fastfile_expand_v1.py work/faction_seals_mp.ff work/faction_seals_mp.expanded
      - name: Normalize exact retail SEAL6 skeleton
        run: |
          python tools/t6_xmodel_skeleton_normalize_v3.py work/faction_seals_mp.expanded \
            --asset-start 0x45CCF1 --xasset-index 64 --name c_usa_mp_seal6_smg_fb \
            --out work/seal6/xmodel_skeleton_normalized_v3.json
      - name: Normalize exact retail SEAL6 mesh
        run: |
          python tools/t6_xmodel_mesh_normalize_v1.py work/faction_seals_mp.expanded \
            --asset-start 0x45CCF1 --out work/seal6/xmodel_mesh_normalized_v1.json
          sha256sum work/seal6/*.json
      - name: Package normalized exact body
        uses: actions/upload-artifact@v4
        with:
          name: seal6-normalized-body
          path: work/seal6/*.json
          retention-days: 1
          compression-level: 0
