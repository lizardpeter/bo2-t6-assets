name: TEMP Webkinz Mini Arcade quick fetch
on:
  push:
    paths:
      - '.github/workflows/t6_nuketown_sprinkler_fx_decompile_v1.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch Mini Arcade family
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wkq
          cat > /tmp/fetch.py <<'PY'
          import concurrent.futures, hashlib, json, pathlib, ssl, urllib.parse, urllib.request
          root=pathlib.Path('/tmp/wkq')
          targets={
            'miniarcade.swf':'http://www.webkinz.com/SWF/miniarcade/miniarcade.swf',
            'cashCow.swf':'http://www.webkinz.com/SWF/ARCADE/GAMES/cashCow.swf',
            'bananza.swf':'http://www.webkinz.com/SWF/ARCADE/GAMES/bananza.swf',
            'wheresWacky.swf':'http://www.webkinz.com/SWF/ARCADE/GAMES/wheresWacky.swf',
          }
          ctx=ssl.create_default_context(); headers={'User-Agent':'Mozilla/5.0 (Webkinz preservation research)'}
          def get(url,t=20):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=t,context=ctx) as r: return r.read(),r.geturl(),r.status,r.headers.get('Content-Type')
          def one(item):
            name,url=item; out={'url':url}
            q=urllib.parse.urlencode({'url':url,'output':'json','filter':'statuscode:200','fl':'timestamp,original,digest,length,mimetype','collapse':'digest'})
            try:
              raw,final,status,ct=get('https://web.archive.org/cdx/search/cdx?'+q,20)
              (root/(name+'.cdx.json')).write_bytes(raw)
              rows=json.loads(raw)
              out['captures']=max(0,len(rows)-1)
              if len(rows)>1:
                hdr=rows[0]; recs=[dict(zip(hdr,r)) for r in rows[1:]]; out['records']=recs
                for rec in reversed(recs):
                  wb=f"https://web.archive.org/web/{rec['timestamp']}id_/{rec['original']}"
                  try:
                    data,final,status,ct=get(wb,30)
                    (root/name).write_bytes(data)
                    out['download']={'ok':True,'url':wb,'final':final,'status':status,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'content_type':ct,'signature':data[:8].hex()}
                    break
                  except Exception as e: out.setdefault('download_errors',[]).append(repr(e))
            except Exception as e: out['cdx_error']=repr(e)
            return name,out
          report={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
            for name,out in ex.map(one,targets.items()):
              report[name]=out; print(name,json.dumps(out,sort_keys=True))
          (root/'report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          python3 /tmp/fetch.py
          file /tmp/wkq/*.swf 2>/dev/null || true
          sha256sum /tmp/wkq/*.swf 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WEBKINZ_MINI_ARCADE_QUICK
          path: /tmp/wkq
          if-no-files-found: error
