name: Temporary Webkinz root and lazy-chunk probe

on:
  pull_request:
    branches: [main]

concurrency:
  group: webkinz-root-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch live play chunks and test legacy roots
        shell: bash
        run: |
          set +e
          mkdir -p out/chunks out/roots out/maps

          fetch() {
            name="$1"; url="$2"; dir="$3"
            (
              echo "$url" > "$dir/$name.url"
              curl -L -sS --connect-timeout 8 --max-time 45 -A "Mozilla/5.0"                 -D "$dir/$name.headers" -o "$dir/$name.body" "$url"
              echo $? > "$dir/$name.exit"
              wc -c "$dir/$name.body" > "$dir/$name.size" 2>/dev/null || true
              file "$dir/$name.body" > "$dir/$name.file" 2>/dev/null || true
              sha256sum "$dir/$name.body" > "$dir/$name.sha256" 2>/dev/null || true
            ) &
          }

          # Lazy chunks required by PlayPageModule according to runtime bundle.
          fetch common_js "https://play.webkinz.com/common.8cba702ee7ffc4f0306f.js" out/chunks
          fetch chunk11_js "https://play.webkinz.com/11.b248ee40ed2bc7ca5fb2.js" out/chunks
          fetch play22_js "https://play.webkinz.com/22.6dcadeecc981526283f8.js" out/chunks

          # Source-map candidates for main/runtime/lazy chunks.
          fetch main_map "https://play.webkinz.com/main.f0803e1f17ed9e88d9ce.js.map" out/maps
          fetch runtime_map "https://play.webkinz.com/runtime.4fd09af43b6bc8d95a03.js.map" out/maps
          fetch play22_map "https://play.webkinz.com/22.6dcadeecc981526283f8.js.map" out/maps
          fetch chunk11_map "https://play.webkinz.com/11.b248ee40ed2bc7ca5fb2.js.map" out/maps
          fetch common_map "https://play.webkinz.com/common.8cba702ee7ffc4f0306f.js.map" out/maps

          version="v390_249"
          for host in play.webkinz.com www.webkinz.com assets.webkinz.com; do
            tag=$(echo "$host" | tr '.' '_')
            fetch "${tag}_webkinz" "https://$host/Webkinz.swf?$version" out/roots
            fetch "${tag}_main2" "https://$host/SWF/main2.swf?v=$version" out/roots
            fetch "${tag}_main2xml" "https://$host/main2.xml?v=$version" out/roots
            fetch "${tag}_viewsxml" "https://$host/xml/views.xml?v=$version" out/roots
            fetch "${tag}_translist" "https://$host/XML/L10N/TransList.xml?v=$version" out/roots
            fetch "${tag}_items" "https://$host/items.swf?v=$version" out/roots
            fetch "${tag}_petclasses" "https://$host/petclasses.swf?v=$version" out/roots
            fetch "${tag}_webkinzxml" "https://$host/SWF/server/webkinzXML.swf?v=$version" out/roots
          done
          wait

          python3 - <<'PY'
          from pathlib import Path
          import re, json
          rows=[]
          for d in (Path("out/chunks"),Path("out/maps"),Path("out/roots")):
              for uf in sorted(d.glob("*.url")):
                  k=uf.stem
                  hdr=(d/(k+".headers")).read_text(errors="ignore") if (d/(k+".headers")).exists() else ""
                  body=d/(k+".body")
                  sts=re.findall(r'^HTTP/\S+\s+(\d+)',hdr,re.M)
                  ct=re.findall(r'^content-type:\s*(.+)$',hdr,re.I|re.M)
                  rows.append({
                    "name":k,"url":uf.read_text(errors="ignore").strip(),
                    "status":int(sts[-1]) if sts else None,
                    "size":body.stat().st_size if body.exists() else 0,
                    "type":ct[-1].strip() if ct else ""
                  })
          Path("out/status.json").write_text(json.dumps(rows,indent=2))
          with open("out/status.tsv","w") as f:
              for r in rows:
                  f.write(f'{r["status"]}\t{r["size"]}\t{r["type"]}\t{r["name"]}\t{r["url"]}\n')

          # Search chunks and any source maps for game bootstrap logic.
          pats=re.compile(rb'Webkinz|main2|\.swf|flashvars|ASSETSDomain|WAPIDomain|application\.v|service\.assets|service\.site|wconf|FlashVars|wkFlash',re.I)
          with open("out/chunk-interesting.txt","w",encoding="utf-8") as out:
              for p in list(Path("out/chunks").glob("*.body"))+list(Path("out/maps").glob("*.body")):
                  b=p.read_bytes()
                  for line in re.findall(rb'[ -~]{5,}',b):
                      if pats.search(line):
                          out.write(p.name+": "+line.decode("latin1","ignore")+"\n")
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-root-probe
          path: out/
          retention-days: 7
