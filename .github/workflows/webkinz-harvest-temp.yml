name: Temporary Webkinz secondary decompile

on:
  pull_request:
    branches: [main]

concurrency:
  group: webkinz-secondary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secondary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch FFDec and current secondary resources
        shell: bash
        run: |
          set +e
          mkdir -p input out/files out/meta out/source

          curl -L --fail --retry 3 --connect-timeout 15 --max-time 180             -o ffdec.zip             "https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip"
          unzip -q ffdec.zip -d ffdec

          version="v390_249"

          fetch() {
            name="$1"
            url="$2"
            (
              echo "$url" > "out/meta/$name.url"
              curl -L -sS --connect-timeout 8 --max-time 75                 -A "Mozilla/5.0"                 -D "out/meta/$name.headers"                 -o "input/$name" "$url"
              rc=$?
              echo "$rc" > "out/meta/$name.exit"
              if [ -f "input/$name" ]; then
                wc -c "input/$name" > "out/meta/$name.size"
                file "input/$name" > "out/meta/$name.file" 2>&1 || true
                sha256sum "input/$name" > "out/meta/$name.sha256" 2>&1 || true
              fi
            ) &
          }

          P="https://play.webkinz.com"
          A="https://assets.webkinz.com"

          fetch tips.swf "$P/SWF/staticdata/tips.swf?v=$version"
          fetch items_US_EN.swf "$P/SWF/staticdata/US_EN/items.swf?v=$version"
          fetch views.swf "$P/SWF/staticdata/views.swf?v=$version"
          fetch envMain.swf "$P/SWF/staticdata/envMain.swf?v=$version"
          fetch webkinzXML.swf "$P/SWF/server/webkinzXML.swf?v=$version"
          fetch EventDispatcherScopeResolver.swf "$P/SWF/EventDispatcherScopeResolver.swf?v=$version"
          fetch as3bridgeService.swf "$P/SWF/server/as3bridgeService.swf?v=$version"
          fetch adBridge.swf "$P/SWF/server/adBridge.swf?v=$version"
          fetch TopBar.swf "$P/SWF/TopBar.swf?v=$version"
          fetch SocialHub.swf "$P/SWF/SocialHub/SocialHub.swf?v=$version"
          fetch MAPI.swf "$P/SWF/VIEWS/MU2/MAPI.swf?v=$version"
          fetch WebkinzClickTracker.swf "$P/SWF/ClickTracker/WebkinzClickTracker.swf?v=$version"

          fetch petclasses.swf "$A/swf/pet/petclasses.swf?v=$version"
          fetch crossAccess.swf "$A/swf/pet/crossAccess.swf?v=$version"

          fetch subApplications.xml "$P/subApplications/subApplications.xml?v=$version"
          fetch pdict.xml "$P/SWF/VIEWS/Chat/xml/pdict.xml?v=$version"
          fetch DictionaryIndexAS3.xml "$P/SWF/VIEWS/Chat/xml/DictionaryIndexAS3.xml?v=$version"
          fetch word-bubble-service.swf "$P/lib/assets/word-bubble-service.swf?v=$version"
          fetch answer-button.swf "$P/lib/web-assets/kinzchat-service/answer-button.swf?v=$version"
          fetch emoticons.swf "$P/lib/web-assets/kinzchat-service/emoticons.swf?v=$version"
          fetch default-skin.swf "$P/lib/web-assets/kinzchat-service/default-skin.swf?v=$version"
          wait

          python3 - <<'PY'
          from pathlib import Path
          import re, json
          rows=[]
          for uf in sorted(Path("out/meta").glob("*.url")):
              k=uf.stem
              h=Path("out/meta")/(k+".headers")
              f=Path("input")/k
              hdr=h.read_text(errors="ignore") if h.exists() else ""
              sts=re.findall(r'^HTTP/\S+\s+(\d+)',hdr,re.M)
              ct=re.findall(r'^content-type:\s*(.+)$',hdr,re.I|re.M)
              rows.append({
                "name":k,
                "url":uf.read_text(errors="ignore").strip(),
                "status":int(sts[-1]) if sts else None,
                "size":f.stat().st_size if f.exists() else 0,
                "type":ct[-1].strip() if ct else ""
              })
          Path("out/status.json").write_text(json.dumps(rows,indent=2))
          Path("out/status.tsv").write_text("\n".join(
              f'{r["status"]}\t{r["size"]}\t{r["type"]}\t{r["name"]}\t{r["url"]}' for r in rows
          )+"\n")
          PY

      - name: Decompile every fetched SWF
        shell: bash
        run: |
          set +e
          for f in input/*.swf; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .swf)
            # Skip obvious HTML/404 bodies.
            sig=$(head -c 3 "$f" 2>/dev/null)
            case "$sig" in
              FWS|CWS|ZWS)
                mkdir -p "out/source/$name"
                java -Xmx3g -jar ffdec/ffdec.jar -cli                   -timeout 45 -exportTimeout 420 -onerror ignore                   -export script "out/source/$name" "$f"                   > "out/meta/$name.ffdec.log" 2>&1
                echo "$?" > "out/meta/$name.ffdec.exit"
                ;;
              *) echo "not-swf signature: $sig" > "out/meta/$name.ffdec.log" ;;
            esac
          done

          find out/source -type f -printf '%p\t%s\n' | sort > out/meta/source-files.tsv

      - name: Mine recursive dependencies
        shell: bash
        run: |
          set +e
          : > out/all-urls.txt
          : > out/all-resource-refs.txt
          : > out/all-api-methods.txt

          grep -RhaoE 'https?://[^"'"'"' <>)]+' out/source input             >> out/all-urls.txt 2>/dev/null || true

          grep -RhaoE '([A-Za-z0-9_.%+ -]+/)+[A-Za-z0-9_.%+?=&-]+\.(swf|xml|php|jpg|jpeg|png|gif|mp3|wav|flv|json|js|txt)(\?[^"'"'"' <>)]*)?'             out/source input >> out/all-resource-refs.txt 2>/dev/null || true

          grep -RhaoE '[A-Za-z][A-Za-z0-9_]*(Service|Controller|Manager)\.[A-Za-z][A-Za-z0-9_]+'             out/source >> out/all-api-methods.txt 2>/dev/null || true

          sort -u -o out/all-urls.txt out/all-urls.txt
          sort -u -o out/all-resource-refs.txt out/all-resource-refs.txt
          sort -u -o out/all-api-methods.txt out/all-api-methods.txt

          {
            echo "=== FETCH STATUS ==="
            cat out/status.tsv
            echo
            echo "=== DECOMPILED FILE COUNT ==="
            find out/source -type f | wc -l
            echo
            echo "=== URLS ==="
            cat out/all-urls.txt
            echo
            echo "=== RESOURCE REFS ==="
            cat out/all-resource-refs.txt
            echo
            echo "=== API METHODS ==="
            cat out/all-api-methods.txt
          } > out/SUMMARY.txt

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-secondary-decompile
          path: out/
          if-no-files-found: error
          retention-days: 7
