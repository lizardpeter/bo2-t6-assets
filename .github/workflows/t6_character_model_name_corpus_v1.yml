name: T6 character model name corpus v1

on:
  push:
    branches:
      - probe-t6-character-xassets
    paths:
      - ".github/workflows/t6_character_model_name_corpus_v1.yml"
      - "tools/t6_character_xasset_probe_v1.py"
      - "tools/t6_oat_all_xasset_ordinal_name_trace_patch_v1.py"
      - "tools/t6_oat_all_xasset_ordinal_name_binding_v1.py"
      - "tools/t6_oat_9dca_gcc_compat_patch_v3.py"
      - "tools/t6_fastfile_expand_pc_v1.c"

permissions:
  contents: read
  actions: read

jobs:
  bind-character-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build source-closed FastFile expander
        shell: bash
        run: |
          set -euo pipefail
          cc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_ff_expand -lz -lcrypto

      - name: Restore instrumented pinned OAT cache
        id: oat-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/oat-all-xasset-name-cache
          key: oat-unlinker-t6-9dca965-compat-v3-all-xasset-name-v1-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py', 'tools/t6_oat_all_xasset_ordinal_name_trace_patch_v1.py') }}-ubuntu24-x86-debug

      - name: Build or verify instrumented pinned OAT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oat-all-xasset-name-cache /tmp/proof
          CACHE_BIN=/tmp/oat-all-xasset-name-cache/Unlinker
          CACHE_META=/tmp/oat-all-xasset-name-cache/source_identity.txt
          EXPECTED_COMMIT=9dca965366541504b71fa8cfb7ac049cb9b717e1
          COMPAT_SHA=$(sha256sum tools/t6_oat_9dca_gcc_compat_patch_v3.py | awk '{print $1}')
          TRACE_SHA=$(sha256sum tools/t6_oat_all_xasset_ordinal_name_trace_patch_v1.py | awk '{print $1}')
          if test "${{ steps.oat-cache.outputs.cache-hit }}" = 'true'; then
            test -x "$CACHE_BIN"
            test -f "$CACHE_META"
            grep -qx "oat_commit=$EXPECTED_COMMIT" "$CACHE_META"
            grep -qx "compat_patch_sha256=$COMPAT_SHA" "$CACHE_META"
            grep -qx "trace_patch_sha256=$TRACE_SHA" "$CACHE_META"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq g++-multilib >/dev/null
            git clone -q --recursive https://github.com/Laupetin/OpenAssetTools.git /tmp/oat
            git -C /tmp/oat checkout -q "$EXPECTED_COMMIT"
            git -C /tmp/oat submodule update -q --init --recursive
            python3 tools/t6_oat_9dca_gcc_compat_patch_v3.py /tmp/oat
            python3 tools/t6_oat_all_xasset_ordinal_name_trace_patch_v1.py /tmp/oat
            git -C /tmp/oat diff --check
            cd /tmp/oat
            PREMAKE_NO_PROMPT=1 ./generate.sh
            make -C build -j2 config=debug_x86 UnlinkerCli
            BIN=$(find build/bin -type f \( -name Unlinker -o -name unlinker \) | head -1)
            test -n "$BIN"
            install -m 0755 "$BIN" "$CACHE_BIN"
            printf 'oat_commit=%s\ncompat_patch_sha256=%s\ntrace_patch_sha256=%s\n' "$EXPECTED_COMMIT" "$COMPAT_SHA" "$TRACE_SHA" > "$CACHE_META"
          fi
          printf '%s\n' "$CACHE_BIN" > /tmp/unlinker_path

      - name: Save OAT cache
        if: steps.oat-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/oat-all-xasset-name-cache
          key: oat-unlinker-t6-9dca965-compat-v3-all-xasset-name-v1-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py', 'tools/t6_oat_all_xasset_ordinal_name_trace_patch_v1.py') }}-ubuntu24-x86-debug

      - name: Build exact target list from retained 215-FastFile corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/game/zone/all /tmp/expanded /tmp/front /tmp/native /tmp/bind /tmp/summary
          python3 - <<'PY'
          import json, pathlib
          src = json.load(open('proof/xanim/T6_ALL_FASTFILE_XANIM_BRANCH_CORPUS_V1.json', encoding='utf-8'))
          zombies = {'zm_transit.ff','zm_nuked.ff','zm_highrise.ff','zm_prison.ff','zm_buried.ff','zm_tomb.ff'}
          rows = []
          for r in src['rows']:
              f = r['file']
              if (f.startswith('faction_') and f.endswith('_mp.ff')) or f in zombies:
                  rows.append({
                      'file': f,
                      'zone': r['zoneName'],
                      'rawSha256': r['fastFileSha256'],
                      'expandedSha256': r['expandedSha256'],
                      'xassetCount': r['xassetCount'],
                  })
          wanted_factions = sorted(r['file'] for r in rows if r['file'].startswith('faction_'))
          if not wanted_factions:
              raise SystemExit('no faction files selected')
          if {r['file'] for r in rows if r['file'] in zombies} != zombies:
              raise SystemExit('missing one or more Zombies world FastFiles from retained corpus')
          pathlib.Path('/tmp/targets.json').write_text(json.dumps(rows, indent=2, sort_keys=True)+'\n')
          print(json.dumps({'targetCount':len(rows),'factionCount':len(wanted_factions),'zombiesCount':6,'files':[r['file'] for r in rows]}, indent=2))
          PY

      - name: Fetch, expand, front-probe, and native-bind every target
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(cat /tmp/unlinker_path)
          python3 - <<'PY' > /tmp/targets.tsv
          import json
          for r in json.load(open('/tmp/targets.json')):
              print('\t'.join([r['file'],r['zone'],r['rawSha256'],r['expandedSha256'],str(r['xassetCount'])]))
          PY

          while IFS=$'\t' read -r file zone raw_sha expanded_sha xasset_count; do
            echo "=== $zone ($file) ==="
            curl -fL --retry 5 --retry-delay 2               -o "/tmp/game/zone/all/$file"               "https://r2.houseofkublai.com/bo2/zone/all/$file"
            echo "$raw_sha  /tmp/game/zone/all/$file" | sha256sum -c -
            /tmp/t6_ff_expand "/tmp/game/zone/all/$file" "/tmp/expanded/$zone.bin" "$zone"
            echo "$expanded_sha  /tmp/expanded/$zone.bin" | sha256sum -c -

            python3 tools/t6_character_xasset_probe_v1.py               "/tmp/expanded/$zone.bin" --zone "$zone" --source-sha256 "$raw_sha"               --out "/tmp/front/$zone.json"

            unsupported=$(python3 - "$zone" <<'PY'
          import json,sys
          d=json.load(open('/tmp/front/'+sys.argv[1]+'.json'))
          print(sum(d['characterOwnershipCounts'].values()))
          PY
            )
            if test "$unsupported" -ne 0; then
              echo "UNSUPPORTED_CHARACTER_OWNERSHIP_PRESENT zone=$zone count=$unsupported" | tee "/tmp/native/$zone.log"
              continue
            fi

            mkdir -p "/tmp/oat_out/$zone"
            set +e
            "$BIN" --no-color --verbose --include-assets soundbank               --output-folder "/tmp/oat_out/$zone" "/tmp/game/zone/all/$file"               2>&1 | tee "/tmp/native/$zone.log"
            rc=${PIPESTATUS[0]}
            set -e
            test "$rc" -eq 0
            test "$(grep -c '^T6_XASSET_ORDINAL_NAME' "/tmp/native/$zone.log")" -eq "$xasset_count"
            python3 tools/t6_oat_all_xasset_ordinal_name_binding_v1.py               --expanded "/tmp/expanded/$zone.bin"               --native-log "/tmp/native/$zone.log"               --oat-commit 9dca965366541504b71fa8cfb7ac049cb9b717e1               --out "/tmp/bind/$zone.json"
          done < /tmp/targets.tsv

      - name: Summarize exact character/model corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, collections
          targets={r['zone']:r for r in json.load(open('/tmp/targets.json'))}
          zones=[]
          all_models=[]
          all_weapons=[]
          for zone,meta in sorted(targets.items()):
              front=json.load(open(f'/tmp/front/{zone}.json'))
              binding_path=pathlib.Path(f'/tmp/bind/{zone}.json')
              row={
                  'zone':zone,
                  'file':meta['file'],
                  'sourceFastFileSha256':meta['rawSha256'],
                  'expandedSha256':meta['expandedSha256'],
                  'assetCount':front['assetCount'],
                  'characterOwnershipCounts':front['characterOwnershipCounts'],
                  'xmodels':[],
                  'weapons':[],
                  'xanims':[],
              }
              if binding_path.exists():
                  b=json.load(open(binding_path))
                  for a in b['rows']:
                      name=a['nativeResolvedName']
                      typ=a['assetTypeName']
                      if typ=='XMODEL':
                          row['xmodels'].append(name)
                          all_models.append((zone,name))
                      elif typ=='WEAPON':
                          row['weapons'].append(name)
                          all_weapons.append((zone,name))
                      elif typ=='XANIMPARTS':
                          row['xanims'].append(name)
              zones.append(row)
          def dedup(rows):
              owners=collections.defaultdict(list)
              for zone,name in rows: owners[name].append(zone)
              return [{'name':n,'zones':sorted(set(zs))} for n,zs in sorted(owners.items())]
          out={
              'format':'t6-character-model-name-corpus-v1',
              'authority':'exact retail FastFiles + source-closed expansion + pinned OAT native canonical XAsset name accessors',
              'zones':zones,
              'uniqueXModels':dedup(all_models),
              'uniqueWeapons':dedup(all_weapons),
              'summary':{
                  'zoneCount':len(zones),
                  'factionZoneCount':sum(z['file'].startswith('faction_') for z in zones),
                  'zombiesWorldCount':sum(z['file'].startswith('zm_') for z in zones),
                  'xmodelOccurrences':sum(len(z['xmodels']) for z in zones),
                  'uniqueXModelCount':len({n for _,n in all_models}),
                  'weaponOccurrences':sum(len(z['weapons']) for z in zones),
                  'uniqueWeaponCount':len({n for _,n in all_weapons}),
                  'zonesWithUnsupportedCharacterOwnership':[z['zone'] for z in zones if sum(z['characterOwnershipCounts'].values())],
              },
          }
          p=pathlib.Path('/tmp/summary/T6_CHARACTER_MODEL_NAME_CORPUS_V1.json')
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out['summary'],indent=2,sort_keys=True))
          for z in zones:
              print('ZONE',z['zone'],'XMODELS',len(z['xmodels']),'WEAPONS',len(z['weapons']),'XANIMS',len(z['xanims']))
              for name in z['xmodels']:
                  print('XMODEL',z['zone'],name)
          PY

      - name: Upload exact character/model corpus
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CHARACTER_MODEL_NAME_CORPUS_V1
          path: |
            /tmp/targets.json
            /tmp/front
            /tmp/bind
            /tmp/summary
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
