name: T6 map metadata probe v1

on:
  push:
    branches:
      - probe-t6-character-xassets
    paths:
      - ".github/workflows/t6_map_metadata_probe_v1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  SERVER_EXE_SHA256: f67eb68a494b93b5b229985205bdc94e26fdfe677663410e2207c25f6f27a55d
  SERVER_PDB_SHA256: 7874efc2c9992467a72dbf48cc6f66d8cfa3c9a701275e41df1f8483a3d971fc
  SERVER_CACHE_KEY: t6-server-ghidra-12.1.3-f67eb68a-7874efc2-pdb-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors             -o /tmp/ghidra.zip             https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Fetch exact server EXE and PDB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-server-ref
          curl --fail --location --retry 5 --retry-all-errors             -o /tmp/t6-server-ref/CoDMPServer_PC.exe             'https://drive.usercontent.google.com/download?id=1NhLTmevZ5HPKRByj1ok8BpwbvX_5rc1n&export=download&confirm=t'
          curl --fail --location --retry 5 --retry-all-errors             -o /tmp/t6-server-ref/CoDMPServer_PC.pdb             'https://drive.usercontent.google.com/download?id=1HLGAl3Pbeyv7FDx39vSncy-iRHa4-oCR&export=download&confirm=t'
          echo "$SERVER_EXE_SHA256  /tmp/t6-server-ref/CoDMPServer_PC.exe" | sha256sum --check
          echo "$SERVER_PDB_SHA256  /tmp/t6-server-ref/CoDMPServer_PC.pdb" | sha256sum --check

      - name: Restore PDB-backed server project
        id: server-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-server-ghidra/projects
          key: ${{ env.SERVER_CACHE_KEY }}

      - name: Import and analyze exact server if needed
        if: steps.server-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-server-ghidra/projects /tmp/t6-server-ghidra/config /tmp/t6-server-ghidra/cache
          export XDG_CONFIG_HOME=/tmp/t6-server-ghidra/config
          export XDG_CACHE_HOME=/tmp/t6-server-ghidra/cache
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless"             /tmp/t6-server-ghidra/projects t6-server-pdb             -import /tmp/t6-server-ref/CoDMPServer_PC.exe -overwrite             -preScript ConfigureT6ServerPdbAnalysis.java             -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts"             -analysisTimeoutPerFile 3600 -max-cpu 4

      - name: Build exact UI map selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-map-meta
          cat >/tmp/t6-map-meta/selection.tsv <<'EOF'
          pair_id	va
          UI_GetMapTableName	00717420
          UI_GetMapName	00717440
          EOF

      - name: Export exact function neighborhoods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-map-meta/out /tmp/t6-server-ghidra/config-meta /tmp/t6-server-ghidra/cache-meta
          export XDG_CONFIG_HOME=/tmp/t6-server-ghidra/config-meta
          export XDG_CACHE_HOME=/tmp/t6-server-ghidra/cache-meta
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless"             /tmp/t6-server-ghidra/projects t6-server-pdb             -process CoDMPServer_PC.exe -noanalysis -readOnly             -postScript ExportT6CandidateDetails.java               /tmp/t6-map-meta/selection.tsv /tmp/t6-map-meta/out             -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 2

      - name: Extract table/name evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('/tmp/t6-map-meta/out')
          def rows(name):
              p=root/name
              if not p.exists(): return []
              with p.open(encoding='utf-8',newline='') as f:
                  return list(csv.DictReader(f,dialect='excel-tab'))
          doc={
            'format':'t6-map-metadata-probe-v1',
            'functions':rows('functions.tsv'),
            'calls':rows('calls.tsv'),
            'strings':rows('strings.tsv'),
            'data_refs':rows('data_refs.tsv'),
          }
          pathlib.Path('/tmp/t6-map-meta/result.json').write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n')
          print(json.dumps(doc,indent=2,sort_keys=True))
          PY

      - name: Upload exact metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: T6_MAP_METADATA_PROBE_V1
          path: /tmp/t6-map-meta
          if-no-files-found: error
          retention-days: 3
