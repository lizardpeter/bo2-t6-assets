          """Deterministic Webkinz Eager Beaver original AS2 source tests."""
          import os
          from pathlib import Path
          import pytest
          from tools.eager_beaver_wordlist import parse_wordlist
          from tools.eager_beaver_scoring import (
              LETTER_POINTS,LETTER_FREQUENCY,LEVEL_TARGETS,
              HAZARD_STRENGTH_INTERVAL,INITIAL_HAZARD_STRENGTH,
              BONUS_EXCLUDED,HAZARD_EXCLUDED,Tile,board_tiles,
              generated_letter,word_points,hazard_prevents_submission,
              progress_increment,level_percent,kinzcash,next_hazard_level,hazard_warning_stage,
          )
          
          
          def test_dictionary_literal_and_bracket_keyword_entries():
              d=parse_wordlist('wa.webkinz = 1;\nwa["break"] = 1;\nwa.webkinz = 1;\n')
              assert d.assignments==3 and len(d.words)==2
              assert d.duplicates=={'webkinz':2}
              assert d.explicit_lookup('WEBKINZ') and d.explicit_lookup('break')
              assert not d.explicit_lookup('brand_new_fabricated_word')
          
          
          def test_dictionary_strict_no_silent_loss():
              with pytest.raises(ValueError):
                  parse_wordlist('wa.aardvark = 1;\nwa[varname] = 1;')
          
          
          def test_full_recovered_dictionary_when_mounted():
              path=os.environ.get('WEBKINZ_EAGER_WORDLIST_AS')
              if not path:
                  pytest.skip('Set WEBKINZ_EAGER_WORDLIST_AS to original FFDec frame_3/DoAction.as')
              d=parse_wordlist(Path(path).read_text(encoding='utf-8'))
              assert d.assignments==79108
              assert len(d.words)==79104
              assert d.duplicates=={'realtor':2,'march':2,'may':2,'august':2}
              assert d.explicit_lookup('webkinz') and d.explicit_lookup('kinzcash')
              assert d.explicit_lookup('september')
              assert not d.explicit_lookup('xylophone')
          
          
          def test_board_52_staggered_source_order():
              p=board_tiles()
              assert len(p)==52
              assert p[0]==(0,0,30,0,30)
              assert p[6]==(0,6,30,0,402)
              assert p[7]==(1,0,0,62,0)
              assert p[14]==(1,7,0,62,434)
              assert p[-1]==(6,6,30,372,402)
          
          
          def test_letter_bag_and_two_character_qu():
              assert LETTER_POINTS['Qu']==80
              assert generated_letter('Q')=='Qu'
              assert generated_letter('K')=='K'
              assert LETTER_FREQUENCY.count('Q')==1
              assert sum(LETTER_FREQUENCY.count(x) for x in 'ABCDEFGHIJKLMNOPQRSTUVWXYZ')==len(LETTER_FREQUENCY)
          
          
          def test_level_arrays_and_hazard_exclusions():
              assert len(LEVEL_TARGETS)==16
              assert LEVEL_TARGETS[1:]==(7,8,9,9,10,10,11,11,12,12,13,13,14,15,18)
              assert HAZARD_STRENGTH_INTERVAL[1:8]==(5,5,4,4,4,3,3)
              assert INITIAL_HAZARD_STRENGTH[7]==1 and INITIAL_HAZARD_STRENGTH[8]==2
              assert 'Qu' in BONUS_EXCLUDED and 'Qu' in HAZARD_EXCLUDED
              assert 'K' not in BONUS_EXCLUDED and 'K' in HAZARD_EXCLUDED
          
          
          def test_score_three_tile_word():
              tiles=[Tile('C',25),Tile('A',15),Tile('T',20)]
              assert word_points(tiles,1)==75
          
          
          def test_score_five_tiles_level_three_bonus():
              tiles=[Tile('C',25,bonus_level=2),Tile('A',15),Tile('T',20),Tile('E',15),Tile('R',20)]
              # letters 95 + length bonus 200 + level base 75 + bonus 240
              assert word_points(tiles,3)==610
          
          
          def test_qu_word_character_count_distinct_from_tile_count():
              tiles=[Tile('Qu',80),Tile('A',15)]
              assert word_points(tiles,1)==80+15+(-20*2)+(5*2)
          
          
          def test_short_word_worth_zero():
              assert word_points([Tile('A',15),Tile('B',40)],1)==0
              with pytest.raises(ValueError):
                  word_points([Tile('C',25),Tile('A',15),Tile('T',20)],16)
          
          
          def test_hazard_checks_character_count():
              assert hazard_prevents_submission([Tile('C',25, hazard_level=2),Tile('A',15),Tile('T',20)])
              assert not hazard_prevents_submission([Tile('Qu',80,hazard_level=2),Tile('A',15),Tile('T',20)])
              assert not hazard_prevents_submission([Tile('C',25),Tile('A',15),Tile('T',20)])
          
          
          def test_progress_is_fraction_and_cash_floor():
              assert [progress_increment(x) for x in range(2,10)]==[0,1,1.5,2,3,3,4,0]
              assert level_percent(7,1)==100
              assert level_percent(1,15)==100/18
              assert kinzcash(149)==0 and kinzcash(150)==1
          
          
          def test_hazard_strength_cycle_and_cap():
              assert next_hazard_level(1,4,1)==(1,5)
              assert next_hazard_level(1,5,1)==(2,1)
              assert next_hazard_level(3,5,1)==(3,1)
              assert next_hazard_level(2,5,8)==(2,6)
              assert next_hazard_level(2,6,8)==(3,1)
          
          
          
          def test_bottom_row_hazard_stage_differs_by_column_parity():
              assert hazard_warning_stage([])==0
              assert hazard_warning_stage([(0,3),(1,4)])==0
              assert hazard_warning_stage([(0,4),(1,5)])==1
              assert hazard_warning_stage([(0,5),(1,6)])==2
              assert hazard_warning_stage([(0,6),(1,6)])==3
              assert hazard_warning_stage([(1,7)])==3
          
          
          def test_hazard_stage_is_max_of_selected_tiles():
              assert hazard_warning_stage([(0,4),(3,7),(5,5)])==3
              assert hazard_warning_stage([(0,4),(1,6)])==2
