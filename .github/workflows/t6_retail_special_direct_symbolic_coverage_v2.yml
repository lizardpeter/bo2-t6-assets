name: T6 direct special shader symbolic coverage v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_retail_special_direct_symbolic_coverage_v2.py'
      - 'proof/render/T6_RETAIL_SPECIAL_DIRECT_SYMBOLIC_COVERAGE_V1.json'
      - 'proof/render/T6_RETAIL_SPECIAL_MISSING_DIRECT_SYMBOLIC_V1.json'
      - '.github/workflows/t6_retail_special_direct_symbolic_coverage_v2.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Join exact direct shader symbolic proofs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_retail_special_direct_symbolic_coverage_v2.py \
            --out proof/render/T6_RETAIL_SPECIAL_DIRECT_SYMBOLIC_COVERAGE_V2.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/render/T6_RETAIL_SPECIAL_DIRECT_SYMBOLIC_COVERAGE_V2.json'))
          s=d['summary']
          assert s['directPixelShaderCount']==176
          assert s['priorCoveredDirectPixelShaderCount']==157
          assert s['newFullOutputSymbolicShaderCount']==19
          assert s['coveredDirectPixelShaderCount']==176
          assert s['missingDirectPixelShaderCount']==0
          assert s['completeDirectPixelShaderSymbolicCoverage'] is True
          assert d['missingDirectPixelShaders']==[]
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/render/T6_RETAIL_SPECIAL_DIRECT_SYMBOLIC_COVERAGE_V2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist complete direct special shader symbolic coverage'
            pushed=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep "$attempt"
            done
            test "$pushed" = 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_RETAIL_SPECIAL_DIRECT_SYMBOLIC_COVERAGE_V2
          path: proof/render/T6_RETAIL_SPECIAL_DIRECT_SYMBOLIC_COVERAGE_V2.json
          if-no-files-found: error
