name: T6 current client zone sink fieldflow probe v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_zone_sink_fieldflow_probe_v1.py'
      - '.github/workflows/t6_current_client_zone_sink_fieldflow_probe_v1.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q capstone==5.0.6
      - name: Recover classified client and trace sink field flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof /tmp/client
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          ua='bo2-t6-assets-zone-sink-fieldflow/1'; eps=['https://cdn.plutoniummod.com/updater/prod/info.json','https://cdn.plutonium.pw/updater/prod/info.json']
          def get(u):
              q=urllib.request.Request(u,headers={'User-Agent':ua})
              with urllib.request.urlopen(q,timeout=180) as r:return r.read()
          info=None
          for ep in eps:
              try: info=json.loads(get(ep)); break
              except Exception: pass
          if info is None: raise SystemExit('no current CDN info endpoint')
          rows=[x for x in info['files'] if x.get('name','').replace('\\','/').lower()=='games/t6mp.exe']
          if len(rows)!=1: raise SystemExit(f'expected one games/t6mp.exe, got {len(rows)}')
          rec=rows[0]; raw=get(info['baseUrl']+rec['hash']); s1=hashlib.sha1(raw).hexdigest(); s256=hashlib.sha256(raw).hexdigest()
          if len(raw)!=int(rec['size']) or s1!=rec['hash'].lower(): raise SystemExit('CDN identity mismatch')
          if str(info.get('revision'))!='5346' or s256!='770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf': raise SystemExit(f'client changed revision={info.get("revision")} sha256={s256}')
          Path('/tmp/client/t6mp.exe').write_bytes(raw); Path('/tmp/client/revision').write_text(str(info.get('revision')))
          print(json.dumps({'revision':info.get('revision'),'bytes':len(raw),'sha1':s1,'sha256':s256},sort_keys=True))
          PY
          python3 -m py_compile tools/t6_current_client_candidate_cfg_dataflow_probe_v1.py tools/t6_current_client_zone_sink_fieldflow_probe_v1.py
          python3 tools/t6_current_client_zone_sink_fieldflow_probe_v1.py /tmp/client/t6mp.exe --revision "$(cat /tmp/client/revision)" --out /tmp/proof/T6_CURRENT_CLIENT_ZONE_SINK_FIELDFLOW_PROBE_V1.json | tee /tmp/proof/summary.log
          rm -f /tmp/client/t6mp.exe
          test ! -e /tmp/client/t6mp.exe
          sha256sum /tmp/proof/* | sort | tee /tmp/proof/SHA256SUMS
      - name: Persist exact derived proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/current_client
          cp /tmp/proof/T6_CURRENT_CLIENT_ZONE_SINK_FIELDFLOW_PROBE_V1.json proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_FIELDFLOW_PROBE_V1.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_FIELDFLOW_PROBE_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist exact current-client zone sink field flow'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_ZONE_SINK_FIELDFLOW_PROBE_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
