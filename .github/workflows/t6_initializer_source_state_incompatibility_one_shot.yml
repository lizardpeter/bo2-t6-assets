# gate-fix-rerun
name: T6 initializer source-state incompatibility one-shot

on:
  push:
    paths:
      - '.github/workflows/t6_initializer_source_state_incompatibility_one_shot.yml'

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check -q capstone==5.0.6
      - name: Recover exact current client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/client proof/current_client
          python3 tools/t6_current_client_fetch_exact_v1.py --out-exe /tmp/client/t6mp.exe --out-identity /tmp/client/identity.json
      - name: Prove source-state incompatibility
        shell: bash
        run: |
          set -euo pipefail
          rev=$(python3 -c "import json;print(json.load(open('/tmp/client/identity.json'))['observedCdnRevision'])")
          python3 tools/t6_current_client_initializer_source_state_incompatibility_v1.py             /tmp/client/t6mp.exe --revision "$rev"             --initializer-proof proof/current_client/T6_CURRENT_CLIENT_SAMPLER_STATE_INITIALIZER_BOUNDARY_FIX_V2.json             --layout-proof proof/current_client/T6_CURRENT_CLIENT_LIGHT_BLOCK_PROVIDER_SEMANTICS_V1.json             --input-table-proof proof/current_client/T6_CURRENT_CLIENT_CODE_INPUT_TABLE_JOIN_V1.json             --object-proof proof/current_client/T6_CURRENT_CLIENT_SAMPLER_INITIALIZER_OBJECT_PROVENANCE_V2.json             --out proof/current_client/T6_CURRENT_CLIENT_INITIALIZER_SOURCE_STATE_INCOMPATIBILITY_V1.json
          python3 - <<'PY'
          import json
          p='proof/current_client/T6_CURRENT_CLIENT_INITIALIZER_SOURCE_STATE_INCOMPATIBILITY_V1.json'
          d=json.load(open(p))
          assert d['summary']['conflictCount']==5
          assert d['summary']['directObservedInitializerOccurrencesStructurallyIncompatibleWithGenericSourceState'] is True
          assert d['summary']['samplerOverlapInstructionHasAcceptedDirectSourceStateOccurrence'] is False
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name uregraph-re-bot
          git config user.email uregraph-re-bot@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_INITIALIZER_SOURCE_STATE_INCOMPATIBILITY_V1.json
          if ! git diff --cached --quiet; then
            git commit -m "Exclude T6 initializer from direct source-state sampler writers"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          rm -f /tmp/client/t6mp.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_INITIALIZER_SOURCE_STATE_INCOMPATIBILITY_V1
          path: proof/current_client/T6_CURRENT_CLIENT_INITIALIZER_SOURCE_STATE_INCOMPATIBILITY_V1.json
          if-no-files-found: error
