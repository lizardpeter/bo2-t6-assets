name: T6 character ownership XAsset census v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_remote_zip_range_v1.py'
      - 'tools/t6_fastfile_expand_pc_v1.c'
      - 'tools/t6_raw_xasset_inventory.py'
      - '.github/workflows/t6_character_ownership_census_v1.yml'

permissions:
  contents: write

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build source-closed FastFile expander
        run: gcc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_expand -lcrypto -lz

      - name: Census exact character-ownership XAsset classes
        env:
          SHARD: \${{ matrix.shard }}
          SHARDS: '8'
          ZIP_URL: https://cdn.jordanlindsay.com.au/pluto_t6_full_game.zip
          PYTHONPATH: tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof /tmp/work
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          from t6_remote_zip_range_v1 import RemoteZip

          TARGETS=('AITYPE','MPTYPE','MPBODY','MPHEAD','CHARACTER','XMODELALIAS')
          GAMEPLAY=('XANIMPARTS','XMODEL','MAP_ENTS','WEAPON','ATTACHMENT','ATTACHMENT_UNIQUE','WEAPON_CAMO','VEHICLEDEF','SKINNEDVERTS')
          shard=int(os.environ['SHARD']); n=int(os.environ['SHARDS'])
          rz=RemoteZip(os.environ['ZIP_URL'],f'bo2-t6-character-ownership/{shard}',timeout=180,retries=7)
          entries,meta=rz.central_directory()
          ff=sorted((e for e in entries if e['name'].lower().endswith('.ff')),key=lambda e:e['name'].lower())
          if len(ff)!=215:
              raise SystemExit(f'archive FastFile count {len(ff)} != 215')
          selected=[(i,e) for i,e in enumerate(ff) if i % n == shard]
          rows=[]
          for local,(gi,e) in enumerate(selected):
              name=e['name']; fname=name.rsplit('/',1)[-1]; zone=fname[:-3]
              row={
                  'globalIndex':gi,'shardIndex':local,'zipPath':name,'file':fname,'zoneName':zone,
                  'zipCrc32':f"{e['crc32']:08x}",'zipUncompressedBytes':e['uncompressedSize'],
              }
              ffp=pathlib.Path('/tmp/work')/f'{gi:03d}.ff'
              exp=pathlib.Path('/tmp/work')/f'{gi:03d}.expanded'
              inv=pathlib.Path('/tmp/work')/f'{gi:03d}.inventory.json'
              try:
                  raw=rz.extract(e,verify_crc=True); ffp.write_bytes(raw)
                  row.update(fastFileBytes=len(raw),fastFileSha256=hashlib.sha256(raw).hexdigest())
                  p=subprocess.run(['/tmp/t6_expand',str(ffp),str(exp),zone],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,text=True)
                  row['expandRc']=p.returncode
                  if p.returncode!=0 or not exp.is_file():
                      row.update(status='expand_failed',error=p.stderr[-1200:])
                  else:
                      subprocess.run(
                          ['python3','tools/t6_raw_xasset_inventory.py',str(exp),'--out',str(inv)],
                          check=True,stdout=subprocess.DEVNULL,
                      )
                      doc=json.loads(inv.read_text())
                      counts=doc['asset_type_counts']
                      owners={k:int(counts.get(k,0)) for k in TARGETS}
                      gameplay={k:int(counts.get(k,0)) for k in GAMEPLAY}
                      row.update(
                          status='green',
                          expandedBytes=doc['expanded_bytes'],
                          expandedSha256=doc['expanded_sha256'],
                          xassetCount=doc['asset_count'],
                          assetArrayRawOffset=doc['asset_array_raw_offset'],
                          assetBodyStreamRawOffset=doc['asset_body_stream_raw_offset'],
                          characterOwnershipCounts=owners,
                          characterOwnershipAssetCount=sum(owners.values()),
                          gameplayCounts=gameplay,
                      )
              except Exception as exc:
                  if row.get('status')!='green':
                      row.update(status='exception',error=repr(exc))
                  else:
                      raise
              finally:
                  ffp.unlink(missing_ok=True); exp.unlink(missing_ok=True); inv.unlink(missing_ok=True)
              rows.append(row)
              print(gi,row['status'],fname,row.get('characterOwnershipCounts'),flush=True)

          doc={
              'format':'t6-character-ownership-xasset-census-shard-v1',
              'shard':shard,'shardCount':n,'archiveFastFileCount':len(ff),'remoteZip':meta,'rows':rows,
              'summary':{
                  'selectedCount':len(rows),
                  'green':sum(r['status']=='green' for r in rows),
                  'failed':sum(r['status']!='green' for r in rows),
                  'zonesWithCharacterOwnership':sum(r.get('characterOwnershipAssetCount',0)>0 for r in rows),
                  'characterOwnershipAssetCount':sum(r.get('characterOwnershipAssetCount',0) for r in rows),
              },
              'proofBoundary':'Exact raw XAsset-front census over a deterministic shard of the complete 215-FastFile public archive. Character ownership is only the physical XAsset type identity/count at this stage; no type-35..40 layout or semantic ownership is inferred.',
          }
          pathlib.Path(f'/tmp/proof/T6_CHARACTER_OWNERSHIP_XASSET_CENSUS_SHARD_{shard}_V1.json').write_text(
              json.dumps(doc,indent=2,sort_keys=True)+'\n'
          )
          if doc['summary']['failed']:
              raise SystemExit('one or more expansion/inventory failures in shard')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: T6_CHARACTER_OWNERSHIP_XASSET_CENSUS_SHARD_\${{ matrix.shard }}_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9

  aggregate:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: T6_CHARACTER_OWNERSHIP_XASSET_CENSUS_SHARD_*_V1
          path: /tmp/shards
          merge-multiple: true

      - name: Aggregate exact 215-FastFile character ownership census
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,json,pathlib
          docs=[json.loads(p.read_text()) for p in sorted(pathlib.Path('/tmp/shards').glob('*.json'))]
          if len(docs)!=8: raise SystemExit(f'expected 8 shard docs, got {len(docs)}')
          rows=[]
          for d in docs:
              if d.get('format')!='t6-character-ownership-xasset-census-shard-v1':
                  raise SystemExit('shard format drift')
              rows.extend(d['rows'])
          rows.sort(key=lambda r:r['globalIndex'])
          if len(rows)!=215 or [r['globalIndex'] for r in rows] != list(range(215)):
              raise SystemExit('215-row global-index closure failed')
          failed=[r for r in rows if r.get('status')!='green']
          if failed: raise SystemExit(f'{len(failed)} FastFiles failed expansion/inventory')
          targets=('AITYPE','MPTYPE','MPBODY','MPHEAD','CHARACTER','XMODELALIAS')
          totals=collections.Counter()
          zones=[]
          for r in rows:
              for k,v in r['characterOwnershipCounts'].items(): totals[k]+=v
              if r['characterOwnershipAssetCount']:
                  zones.append({
                      'globalIndex':r['globalIndex'],'zoneName':r['zoneName'],'zipPath':r['zipPath'],
                      'fastFileSha256':r['fastFileSha256'],'expandedSha256':r['expandedSha256'],
                      'xassetCount':r['xassetCount'],
                      'characterOwnershipCounts':r['characterOwnershipCounts'],
                      'characterOwnershipAssetCount':r['characterOwnershipAssetCount'],
                      'assetArrayRawOffset':r['assetArrayRawOffset'],
                      'assetBodyStreamRawOffset':r['assetBodyStreamRawOffset'],
                  })
          out={
              'format':'t6-all-fastfile-character-ownership-xasset-census-v1',
              'authority':'complete 215-FastFile public archive universe; CRC-verified range extraction; SHA-pinned FastFiles and expanded XFiles; exact raw XAsset-front type census',
              'remoteZip':docs[0]['remoteZip'],
              'archiveFastFileCount':215,
              'characterOwnershipTypes':list(targets),
              'characterOwnershipTotals':dict(sorted(totals.items())),
              'characterOwnershipAssetCount':sum(totals.values()),
              'zoneCountWithCharacterOwnership':len(zones),
              'zonesWithCharacterOwnership':zones,
              'rows':rows,
              'proofBoundary':'This proves physical occurrence and count of T6 XAsset classes 35-40 in the referenced 215-FastFile archive only. It does not infer layouts, names, model selection, faction ownership, or runtime character semantics. Those require separate executable/serialized-layout proof.',
          }
          outp=pathlib.Path('proof/characters/T6_ALL_FASTFILE_CHARACTER_OWNERSHIP_XASSET_CENSUS_V1.json')
          outp.parent.mkdir(parents=True,exist_ok=True)
          outp.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'zoneCountWithCharacterOwnership':len(zones),
              'characterOwnershipTotals':dict(sorted(totals.items())),
              'zones':[z['zoneName'] for z in zones],
          },indent=2))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/characters/T6_ALL_FASTFILE_CHARACTER_OWNERSHIP_XASSET_CENSUS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist complete T6 character ownership XAsset census'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: T6_ALL_FASTFILE_CHARACTER_OWNERSHIP_XASSET_CENSUS_V1
          path: proof/characters/T6_ALL_FASTFILE_CHARACTER_OWNERSHIP_XASSET_CENSUS_V1.json
          if-no-files-found: error
          compression-level: 9
