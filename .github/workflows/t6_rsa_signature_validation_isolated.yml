name: T6 isolated retail RSA signature validation

on:
  workflow_dispatch:
  push:
    branches:
      - t6-rsa-signature-validation-isolated
    paths:
      - 'tools/t6_signature_verify_isolated/**'
      - '.github/workflows/t6_rsa_signature_validation_isolated.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned retail Nuketown FastFile
        run: |
          set -euo pipefail
          curl -fL --retry 4 -o /tmp/mp_nuketown_2020.ff https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/mp_nuketown_2020.ff' | sha256sum -c -

      - name: Reproduce final signed hash table
        run: |
          set -euo pipefail
          gcc -O3 -Wall -Wextra tools/t6_signature_verify_isolated/t6_expand_hash.c -o /tmp/t6_expand_hash -lcrypto -lz
          /tmp/t6_expand_hash /tmp/mp_nuketown_2020.ff /tmp/nuketown.expanded mp_nuketown_2020 /tmp/final_hash_table.bin
          test "$(stat -c '%s' /tmp/final_hash_table.bin)" = 16000

      - name: Verify retail signature in Rust
        run: |
          set -euo pipefail
          cargo run --quiet --release --manifest-path tools/t6_signature_verify_isolated/Cargo.toml -- /tmp/mp_nuketown_2020.ff /tmp/final_hash_table.bin | tee /tmp/rsa_result.txt
          grep -q '^T6_RSA_SIGNATURE_VALID ' /tmp/rsa_result.txt
