name: Temporary Webkinz final room item reverse

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  room:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch and decompile room stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input ffdec out/source out/meta
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 180 -o ffdec.zip "https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip"
          unzip -q ffdec.zip -d ffdec
          cat > out/seeds.txt <<'EOF'
https://play.webkinz.com/subApplications/webkinz-house/webkinz-house.swf
https://play.webkinz.com/SWF/VIEWS/Room/RoomSession.swf
https://play.webkinz.com/SWF/VIEWS/Room/RoomSession1.swf
https://play.webkinz.com/SWF/VIEWS/Room/RoomSession2.swf
https://play.webkinz.com/SWF/ROOM/buildmap1024.swf
https://play.webkinz.com/SWF/ROOM/RoomInter.xml
https://play.webkinz.com/subApplications/subApplications.xml?v=v390_249
https://play.webkinz.com/SWF/staticdata/envMain.swf?v=v390_249
https://play.webkinz.com/SWF/staticdata/US_EN/items.swf?v=v390_249
https://play.webkinz.com/SWF/staticdata/views.swf?v=v390_249
EOF
          i=0
          while IFS= read -r url; do
            i=$((i+1)); name=$(printf "%03d" "$i"); ext=.bin
            path=$(printf '%s' "$url" | cut -d'?' -f1)
            case "$path" in *.swf) ext=.swf;; *.xml) ext=.xml;; esac
            target="input/$name$ext"
            echo "$url" > "out/meta/$name.url"
            curl -L -sS --fail-with-body --retry 2 --retry-all-errors --connect-timeout 10 --max-time 90 -A "Mozilla/5.0" -D "out/meta/$name.headers" -o "$target" "$url" || true
            if [ -f "$target" ]; then
              wc -c "$target" > "out/meta/$name.size"
              file "$target" > "out/meta/$name.file" 2>&1 || true
              sha256sum "$target" > "out/meta/$name.sha256" 2>&1 || true
            fi
          done < out/seeds.txt
          for f in input/*.swf; do
            [ -f "$f" ] || continue
            sig=$(head -c 3 "$f" || true)
            case "$sig" in
              FWS|CWS|ZWS)
                n=$(basename "$f" .swf); mkdir -p "out/source/$n"
                java -Xmx4g -jar ffdec/ffdec.jar -cli -timeout 60 -exportTimeout 600 -onerror ignore -export script "out/source/$n" "$f" > "out/meta/$n.ffdec.log" 2>&1 || true
                ;;
            esac
          done
          cp input/*.xml out/ 2>/dev/null || true

      - name: Mine room item formulas and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
from pathlib import Path
import re, json
root=Path("out/source")
files=list(root.rglob("*.as"))
urls=set(); refs=set(); formulas=[]; hits=[]; related=[]
abs_rx=re.compile(r'https?://[^\s"\'<>\\)]+',re.I)
ref_rx=re.compile(r'(?i)(?:[A-Za-z0-9_.%+() -]+/)+[A-Za-z0-9_.%+() -]+\.(?:swf|xml|json|js|css|jpg|jpeg|png|gif|mp3|wav|flv|txt|dat|bin)(?:\?[^\s"\'<>\\)]*)?')
terms=("itemtype","itemclass","wallpaper","flooring","floor","roomtype","interaction","interactive","export","items/","swf/items","catalog.swf","icon.swf","loadclip","loadmovie","moviecliploader","assetloader","itempath","itemurl","wallpath","floorpath")
for p in files:
    text=p.read_text(errors="ignore")
    urls.update(abs_rx.findall(text)); refs.update(x.strip() for x in ref_rx.findall(text))
    if "ITEMS/" in text or "itemType" in text or "wallpaper" in text.lower() or "floor" in text.lower(): related.append(str(p))
    for ln,line in enumerate(text.splitlines(),1):
        low=line.lower()
        if any(t in low for t in terms):
            rec=f"{p}:{ln}:{line.strip()}"
            if len(rec)<3000: hits.append(rec)
        if any(ext in low for ext in (".swf",".xml",".png",".jpg",".mp3",".wav")) and any(ch in line for ch in ("+","item","wall","floor","class","type")):
            rec=f"{p}:{ln}:{line.strip()}"
            if len(rec)<3000: formulas.append(rec)
Path("out/all-absolute-urls.txt").write_text("\n".join(sorted(urls))+"\n")
Path("out/all-resource-refs.txt").write_text("\n".join(sorted(refs))+"\n")
Path("out/room-item-hits.txt").write_text("\n".join(hits)+"\n")
Path("out/dynamic-formulas.txt").write_text("\n".join(formulas)+"\n")
Path("out/item-related-source-files.txt").write_text("\n".join(sorted(set(related)))+"\n")
summary={"as_files":len(files),"absolute_urls":len(urls),"resource_refs":len(refs),"room_item_hits":len(hits),"dynamic_formula_lines":len(formulas),"item_related_source_files":len(set(related))}
Path("out/summary.json").write_text(json.dumps(summary,indent=2))
print(json.dumps(summary,indent=2))
PY

      - name: Upload room reverse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-room-item-reverse
          path: out/
          if-no-files-found: error
          retention-days: 7
