name: T6 current client shadow debug constant cluster summary v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_shadow_debug_constant_cluster_summary_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_SHADOW_DEBUG_CONSTANT_STORAGE_XREFS_V1.json'
      - '.github/workflows/t6_current_client_shadow_debug_constant_cluster_summary_v1.yml'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Persist compact exact cluster projection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/current_client
          python3 tools/t6_current_client_shadow_debug_constant_cluster_summary_v1.py             --source proof/current_client/T6_CURRENT_CLIENT_SHADOW_DEBUG_CONSTANT_STORAGE_XREFS_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_SHADOW_DEBUG_CONSTANT_CLUSTER_SUMMARY_V1.json
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_SHADOW_DEBUG_CONSTANT_CLUSTER_SUMMARY_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist compact shadow debug constant clusters'
            ok=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_SHADOW_DEBUG_CONSTANT_CLUSTER_SUMMARY_V1
          path: proof/current_client/T6_CURRENT_CLIENT_SHADOW_DEBUG_CONSTANT_CLUSTER_SUMMARY_V1.json
          if-no-files-found: error
