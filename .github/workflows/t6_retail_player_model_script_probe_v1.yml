name: T6 retail player model script probe v1

on:
  push:
    branches:
      - probe-t6-character-xassets
    paths:
      - ".github/workflows/t6_retail_player_model_script_probe_v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Restore exactly pinned OAT
        id: oat-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug
          restore-keys: |
            oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-

      - name: Build exact pinned OAT when cache is absent
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x /tmp/oat-unlinker-cache/Unlinker ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq g++-multilib >/dev/null
            rm -rf /tmp/oat_build
            git clone -q --recursive https://github.com/Laupetin/OpenAssetTools.git /tmp/oat_build
            git -C /tmp/oat_build checkout -q 9dca965366541504b71fa8cfb7ac049cb9b717e1
            test "$(git -C /tmp/oat_build rev-parse HEAD)" = 9dca965366541504b71fa8cfb7ac049cb9b717e1
            git -C /tmp/oat_build submodule update -q --init --recursive
            python3 tools/t6_oat_9dca_gcc_compat_patch_v3.py /tmp/oat_build
            git -C /tmp/oat_build diff --check
            (
              cd /tmp/oat_build
              PREMAKE_NO_PROMPT=1 ./generate.sh
              make -C build -j2 config=debug_x86 UnlinkerCli
            )
            BIN="$(find /tmp/oat_build/build/bin -type f \( -name Unlinker -o -name unlinker \) -perm -111 | head -1)"
            test -n "$BIN"
            mkdir -p /tmp/oat-unlinker-cache
            install -m 0755 "$BIN" /tmp/oat-unlinker-cache/Unlinker
          fi
          test -x /tmp/oat-unlinker-cache/Unlinker
          sha256sum /tmp/oat-unlinker-cache/Unlinker

      - name: Dump exact MP ScriptParseTree ownership layers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblzo2-2 >/dev/null
          BIN=/tmp/oat-unlinker-cache/Unlinker
          test -x "$BIN"
          mkdir -p /tmp/source /tmp/oatout /tmp/proof
          cat >/tmp/proof/source_fastfiles.tsv <<'EOF'
          code_post_gfx_mp.ff	b7bce1dbe94692b1668ae9a1c83a4dcf008979ee5d5f79b3d2e619c23a1002b3
          common_mp.ff	93fe48b0f0d8cc6844be875ccad94e0cfcf635f62eeff00ac33f2f668a77cb77
          patch_mp.ff	459077cda8e4a1457f7ee7d8f6c5e0abf30f41767a21ff6744df6a4307cbce1e
          mp_raid.ff	bca3b74d8df5a27b82e77f39ef82cbd87a19dedf30884600b73eb563acba5888
          EOF
          while IFS=$'\t' read -r file sha; do
            zone="${file%.ff}"
            curl -fL --retry 5 --retry-delay 2               -o "/tmp/source/$file"               "https://r2.houseofkublai.com/bo2/zone/all/$file"
            echo "$sha  /tmp/source/$file" | sha256sum -c -
            mkdir -p "/tmp/oatout/$zone"
            "$BIN" --no-color --verbose --include-assets script               --output-folder "/tmp/oatout/$zone" "/tmp/source/$file"               >"/tmp/proof/unlinker_${zone}.log" 2>&1
          done </tmp/proof/source_fastfiles.tsv
          find /tmp/oatout -type f | sort >/tmp/proof/script_inventory.txt
          grep -Ei '(^|/)(_teams|_teamset|_weapons|_class|_loadout|_bot_loadout|_globallogic|_spawning|_utility|_player).*\.(gsc|csc)$'             /tmp/proof/script_inventory.txt | tee /tmp/proof/candidate_scripts.txt || true
          echo "candidate_count=$(wc -l </tmp/proof/candidate_scripts.txt)" | tee /tmp/proof/candidate_count.txt
          test -s /tmp/proof/candidate_scripts.txt

      - name: Build pinned gsc-tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 wget >/dev/null
          git clone -q --recursive https://github.com/xensik/gsc-tool.git /tmp/gsc-tool
          git -C /tmp/gsc-tool checkout -q cd304ac752fe52ae1cd6726e5edb56e5f838595c
          git -C /tmp/gsc-tool submodule update -q --init --recursive
          wget -q https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-linux.tar.gz -O /tmp/premake.tgz
          mkdir -p /tmp/premake
          tar -xzf /tmp/premake.tgz -C /tmp/premake
          chmod +x /tmp/premake/premake5
          cd /tmp/gsc-tool
          /tmp/premake/premake5 gmake
          CC=clang-18 CXX=clang++-18 make -C build config=release_amd64 -j2
          test -x build/bin/amd64/release/gsc-tool
          sha256sum build/bin/amd64/release/gsc-tool >/tmp/proof/gsc_tool_sha256.txt

      - name: Decompile exact retail team and loadout scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/decomp/in /tmp/decomp/out
          python3 - <<'PY'
          from pathlib import Path
          import shutil,re,json,hashlib
          root=Path('/tmp/oatout')
          priority=[
            re.compile(r'(^|/)maps/mp/teams/_teams[.]gsc$',re.I),
            re.compile(r'(^|/)maps/mp/teams/_teamset[.]gsc$',re.I),
            re.compile(r'(^|/)maps/mp/gametypes/_weapons[.]gsc$',re.I),
            re.compile(r'(^|/)maps/mp/gametypes/_class[.]gsc$',re.I),
            re.compile(r'(^|/)maps/mp/gametypes/_loadout[.]gsc$',re.I),
            re.compile(r'(^|/)maps/mp/bots/_bot_loadout[.]gsc$',re.I),
            re.compile(r'(^|/)maps/mp/_player[.]gsc$',re.I),
            re.compile(r'(^|/)maps/mp/_utility[.]gsc$',re.I),
          ]
          candidates=[]
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              rel=p.relative_to(root).as_posix()
              # rel begins with physical FastFile owner because every zone is
              # dumped to its own subdirectory.
              inner='/'.join(rel.split('/')[1:])
              if any(rx.search(inner) for rx in priority):
                  candidates.append((rel,p))
          if not candidates:
              raise SystemExit('no target retail team/loadout scripts found across exact MP ownership layers')
          manifest=[]
          for i,(rel,p) in enumerate(sorted(candidates)):
              safe=rel.replace('/','__')
              out=Path('/tmp/decomp/in')/(f'{i:03d}__{safe}')
              shutil.copy2(p,out)
              manifest.append({
                  'input':str(out),
                  'retailOwnerAndPath':rel,
                  'bytes':p.stat().st_size,
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              })
          Path('/tmp/proof/input_manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY

          find /tmp/decomp/in -maxdepth 1 -type f -name '*.gsc' | sort | while read -r f; do
            base="$(basename "$f")"
            work="/tmp/decomp/work_$base"
            mkdir -p "$work"
            cp "$f" "$work/$base"
            (
              cd "$work"
              /tmp/gsc-tool/build/bin/amd64/release/gsc-tool -m decomp -g t6 -s pc "$base" >>/tmp/proof/decompile.log 2>&1
              out="$(find decompiled -type f -name '*.gsc' | head -1)"
              test -n "$out"
              stem="$(basename "$base" .gsc)"
              cp "$out" "/tmp/decomp/out/$stem.decompiled.gsc"
            )
          done

          grep -RniE 'setviewmodel|setmodel|viewhands|_fb"|_fb[)]|weaponclass|weapclass|assault|sniper|shotgun|smg|lmg|faction|team|model' /tmp/decomp/out | tee /tmp/proof/model_selection_hits.txt || true
          test -s /tmp/proof/model_selection_hits.txt

          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,re
          manifest=json.loads(Path('/tmp/proof/input_manifest.json').read_text())
          rows=[]
          for p in sorted(Path('/tmp/decomp/out').glob('*.gsc')):
              text=p.read_text(errors='replace')
              hits=[]
              for i,line in enumerate(text.splitlines()):
                  if re.search(r'(?i)setviewmodel|setmodel|viewhands|_fb\b|weaponclass|weapclass|assault|sniper|shotgun|smg|lmg|faction|team',line):
                      hits.append({'line':i+1,'text':line.strip()})
              rows.append({'file':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'hits':hits})
          doc={
            'format':'t6-retail-player-model-script-probe-v1',
            'authority':'SHA-pinned retail MP ownership layers -> pinned OAT ScriptParseTree bytes -> pinned xensik/gsc-tool T6 PC decompiler',
            'sourceFastFiles':Path('/tmp/proof/source_fastfiles.tsv').read_text().splitlines(),
            'oatCommit':'9dca965366541504b71fa8cfb7ac049cb9b717e1',
            'gscToolCommit':'cd304ac752fe52ae1cd6726e5edb56e5f838595c',
            'inputs':manifest,
            'decompiled':rows,
            'proofBoundary':'Exact retail script decompilation evidence. Semantic model-selection rules are promoted only from explicit decompiled control/data flow, not filename adjacency.'
          }
          Path('/tmp/proof/T6_RETAIL_PLAYER_MODEL_SCRIPT_PROBE_V1.json').write_text(json.dumps(doc,indent=2)+'\n')
          print(json.dumps({'files':len(rows),'hitCounts':{r['file']:len(r['hits']) for r in rows}},indent=2))
          PY

      - name: Upload exact script-selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_RETAIL_PLAYER_MODEL_SCRIPT_PROBE_V1
          path: |
            /tmp/proof
            /tmp/decomp/out
          if-no-files-found: error
          retention-days: 7
