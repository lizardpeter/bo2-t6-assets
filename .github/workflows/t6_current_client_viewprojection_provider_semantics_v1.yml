name: T6 current client viewProjectionMatrix provider semantics v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_viewprojection_provider_semantics_v1.py'
      - 'proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_CODE_MATRIX_GETTER_SEMANTICS_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_CODE_MATRIX_DERIVE_DISPATCH_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_VIEWPROJECTION_HELPER_PROBE_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_VIEWPROJECTION_MATH_HELPER_PROBE_V1.json'
      - '.github/workflows/t6_current_client_viewprojection_provider_semantics_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compose exact provider proof
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_viewprojection_provider_semantics_v1.py             --denominator proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json             --getter proof/current_client/T6_CURRENT_CLIENT_CODE_MATRIX_GETTER_SEMANTICS_V1.json             --dispatch proof/current_client/T6_CURRENT_CLIENT_CODE_MATRIX_DERIVE_DISPATCH_V1.json             --helper proof/current_client/T6_CURRENT_CLIENT_VIEWPROJECTION_HELPER_PROBE_V1.json             --math proof/current_client/T6_CURRENT_CLIENT_VIEWPROJECTION_MATH_HELPER_PROBE_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_VIEWPROJECTION_PROVIDER_SEMANTICS_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_VIEWPROJECTION_PROVIDER_SEMANTICS_V1.json'))
          s=d['summary']
          assert s['currentClientProviderClosed'] is True
          assert s['enumValue']==227 and s['matrixIndex']==16
          assert s['branchFormulaClosed'] is True
          assert s['matrixMultiplyHelperClosed'] is True
          assert s['vectorTransformHelperClosed'] is True
          assert s['versionUpdateClosed'] is True
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_VIEWPROJECTION_PROVIDER_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact viewProjectionMatrix provider semantics'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              test "$attempt" -lt 4
              sleep 2
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_VIEWPROJECTION_PROVIDER_SEMANTICS_V1
          path: proof/current_client/T6_CURRENT_CLIENT_VIEWPROJECTION_PROVIDER_SEMANTICS_V1.json
          if-no-files-found: error
          compression-level: 9
