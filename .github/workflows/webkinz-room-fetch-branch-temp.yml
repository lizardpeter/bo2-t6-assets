name: Temporary Webkinz house asset map fetch

on:
  push:
    branches:
      - webkinz-room-final-trigger

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch house asset maps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L -sS --connect-timeout 10 --max-time 60 -A "Mozilla/5.0" -D out/web.headers -o out/web.json "https://play.webkinz.com/subApplications/webkinz-house/web.json" || true
          curl -L -sS --connect-timeout 10 --max-time 60 -A "Mozilla/5.0" -D out/web1024.headers -o out/web1024.json "https://play.webkinz.com/subApplications/webkinz-house/web1024.json" || true
          curl -L -sS --connect-timeout 10 --max-time 60 -A "Mozilla/5.0" -D out/web1280.headers -o out/web1280.json "https://play.webkinz.com/subApplications/webkinz-house/web1280.json" || true
          file out/*.json > out/file.txt 2>&1 || true
          wc -c out/*.json > out/size.txt 2>&1 || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-house-asset-map
          path: out/
          retention-days: 7
