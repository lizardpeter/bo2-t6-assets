name: Temporary Webkinz house decompile

on:
  push:
    branches:
      - webkinz-room-final-trigger

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decompile current Webkinz house
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/source
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 180 -o ffdec.zip "https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip"
          unzip -q ffdec.zip -d ffdec
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 180 -A "Mozilla/5.0" -o house.swf "https://play.webkinz.com/subApplications/webkinz-house/webkinz-house.swf"
          java -Xmx3g -jar ffdec/ffdec.jar -cli -timeout 60 -exportTimeout 600 -onerror ignore -export script out/source house.swf > out/ffdec.log 2>&1
          find out/source -type f -printf '%p\t%s\n' | sort > out/source-files.tsv
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-house-decompiled
          path: out/
          retention-days: 7
