name: Temporary Webkinz item base check

on:
  push:
    branches:
      - webkinz-room-final-trigger

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check two candidate roots
        shell: bash
        run: |
          mkdir -p out
          curl -L -sS --connect-timeout 8 --max-time 30 -A "Mozilla/5.0" -D out/lower.headers -o out/lower.body "https://assets.webkinz.com/swf/items/178/sw.png" || true
          curl -L -sS --connect-timeout 8 --max-time 30 -A "Mozilla/5.0" -D out/upper.headers -o out/upper.body "https://assets.webkinz.com/SWF/ITEMS/178/sw.png" || true
          file out/lower.body out/upper.body > out/file.txt 2>&1 || true
          wc -c out/lower.body out/upper.body > out/size.txt 2>&1 || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-item-base-check
          path: out/
          retention-days: 7
