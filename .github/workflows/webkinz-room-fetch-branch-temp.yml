name: Temporary Webkinz full room asset validation

on:
  push:
    branches:
      - webkinz-room-final-trigger

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary probe
        uses: actions/checkout@v4

      - name: Prepare current item database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/items-source out
          python3 -m pip install -q aiohttp
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 180 -o work/ffdec.zip "https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip"
          unzip -q work/ffdec.zip -d work/ffdec
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 180 -A "Mozilla/5.0" -o work/items.swf "https://play.webkinz.com/SWF/staticdata/US_EN/items.swf?v=v390_249"
          java -Xmx3g -jar work/ffdec/ffdec.jar -cli -timeout 60 -exportTimeout 600 -onerror ignore -export script work/items-source work/items.swf > out/items-ffdec.log 2>&1

      - name: Validate current room render assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tmp_webkinz_room_asset_probe.py 2>&1 | tee out/run.log

      - name: Upload room asset validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-full-room-assets
          path: out/
          if-no-files-found: error
          retention-days: 7
