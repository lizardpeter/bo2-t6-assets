name: Temporary Webkinz room environment validation

on:
  push:
    branches:
      - webkinz-room-final-trigger

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate room environment backgrounds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          base="https://play.webkinz.com/subApplications/webkinz-house/"
          check() {
            rel="$1"
            code=$(curl -L -sS --connect-timeout 8 --max-time 30 -A "Mozilla/5.0" -o /dev/null -w "%{http_code}" "$base$rel" || true)
            type=$(curl -L -sS -I --connect-timeout 8 --max-time 30 -A "Mozilla/5.0" "$base$rel" | grep -i '^content-type:' | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)
            printf "%s\t%s\t%s%s\n" "$code" "$type" "$base" "$rel"
          }
          check "webkinzHouse/assets/outdoor/fore/spring.png" >> out/results.tsv
          check "webkinzHouse/assets/outdoor/fore/summer.png" >> out/results.tsv
          check "webkinzHouse/assets/outdoor/fore/fall.png" >> out/results.tsv
          check "webkinzHouse/assets/outdoor/fore/winter.png" >> out/results.tsv
          check "webkinzHouse/assets/outdoor/back/dawn.png" >> out/results.tsv
          check "webkinzHouse/assets/outdoor/back/afternoon.png" >> out/results.tsv
          check "webkinzHouse/assets/outdoor/back/dusk.png" >> out/results.tsv
          check "webkinzHouse/assets/outdoor/back/night.png" >> out/results.tsv
          check "webkinzHouse/assets/treetop/spring.png" >> out/results.tsv
          check "webkinzHouse/assets/treetop/summer.png" >> out/results.tsv
          check "webkinzHouse/assets/treetop/fall.png" >> out/results.tsv
          check "webkinzHouse/assets/treetop/winter.png" >> out/results.tsv
          check "webkinzHouse/assets/treetop/dawn.png" >> out/results.tsv
          check "webkinzHouse/assets/treetop/afternoon.png" >> out/results.tsv
          check "webkinzHouse/assets/treetop/dusk.png" >> out/results.tsv
          check "webkinzHouse/assets/treetop/night.png" >> out/results.tsv
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-room-environment
          path: out/
          retention-days: 7
