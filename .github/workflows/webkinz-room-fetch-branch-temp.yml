name: Temporary Webkinz singular item root check

on:
  push:
    branches:
      - webkinz-room-final-trigger

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check authoritative singular room item root
        shell: bash
        run: |
          mkdir -p out
          curl -L -sS --connect-timeout 8 --max-time 30 -A "Mozilla/5.0" -D out/furniture.headers -o out/furniture.body "https://assets.webkinz.com/swf/item/178/sw.png" || true
          curl -L -sS --connect-timeout 8 --max-time 30 -A "Mozilla/5.0" -D out/furniturexml.headers -o out/furniturexml.body "https://assets.webkinz.com/swf/item/178/sw.xml" || true
          curl -L -sS --connect-timeout 8 --max-time 30 -A "Mozilla/5.0" -D out/wall.headers -o out/wall.body "https://assets.webkinz.com/swf/item/184/large.png" || true
          curl -L -sS --connect-timeout 8 --max-time 30 -A "Mozilla/5.0" -D out/wallxml.headers -o out/wallxml.body "https://assets.webkinz.com/swf/item/184/large.xml" || true
          file out/*.body > out/file.txt 2>&1 || true
          wc -c out/*.body > out/size.txt 2>&1 || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-singular-item-root-check
          path: out/
          retention-days: 7
