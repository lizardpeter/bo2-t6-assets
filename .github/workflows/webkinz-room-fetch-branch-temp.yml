name: Temporary Webkinz room fetch branch

on:
  push:
    branches:
      - webkinz-room-final-trigger

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch known public room resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L --fail --retry 3 --connect-timeout 10 --max-time 90 -A "Mozilla/5.0" -o out/webkinz-house.swf "https://play.webkinz.com/subApplications/webkinz-house/webkinz-house.swf"
          curl -L --fail --retry 3 --connect-timeout 10 --max-time 90 -A "Mozilla/5.0" -o out/RoomSession.swf "https://play.webkinz.com/SWF/VIEWS/Room/RoomSession.swf"
          curl -L --fail --retry 3 --connect-timeout 10 --max-time 90 -A "Mozilla/5.0" -o out/RoomSession1.swf "https://play.webkinz.com/SWF/VIEWS/Room/RoomSession1.swf"
          curl -L --fail --retry 3 --connect-timeout 10 --max-time 90 -A "Mozilla/5.0" -o out/RoomSession2.swf "https://play.webkinz.com/SWF/VIEWS/Room/RoomSession2.swf"
          curl -L --fail --retry 3 --connect-timeout 10 --max-time 90 -A "Mozilla/5.0" -o out/buildmap1024.swf "https://play.webkinz.com/SWF/ROOM/buildmap1024.swf"
          curl -L --fail --retry 3 --connect-timeout 10 --max-time 90 -A "Mozilla/5.0" -o out/RoomInter.xml "https://play.webkinz.com/SWF/ROOM/RoomInter.xml"
          curl -L --fail --retry 3 --connect-timeout 10 --max-time 90 -A "Mozilla/5.0" -o out/subApplications.xml "https://play.webkinz.com/subApplications/subApplications.xml?v=v390_249"
          sha256sum out/* > out/SHA256SUMS.txt
      - name: Upload room resources
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-room-resources
          path: out/
          retention-days: 7
