name: Temporary Webkinz dynamic asset expansion

on:
  pull_request:
    branches: [main]

concurrency:
  group: webkinz-dynamic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dynamic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Build databases and probe generated URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/ffdec work/src/items work/src/pets out

          python3 -m pip install -q aiohttp

          curl -L --fail --retry 3 --connect-timeout 15 --max-time 180 \
            -o work/ffdec.zip \
            "https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip"
          unzip -q work/ffdec.zip -d work/ffdec

          version="v390_249"
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 180 \
            -A "Mozilla/5.0" -o work/items.swf \
            "https://play.webkinz.com/SWF/staticdata/US_EN/items.swf?v=$version"
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 180 \
            -A "Mozilla/5.0" -o work/petclasses.swf \
            "https://assets.webkinz.com/swf/pet/petclasses.swf?v=$version"

          java -Xmx3g -jar work/ffdec/ffdec.jar -cli -timeout 60 -exportTimeout 600 -onerror ignore \
            -export script work/src/items work/items.swf >/tmp/items.ffdec.log 2>&1
          java -Xmx3g -jar work/ffdec/ffdec.jar -cli -timeout 60 -exportTimeout 600 -onerror ignore \
            -export script work/src/pets work/petclasses.swf >/tmp/pets.ffdec.log 2>&1

          cat > work/probe.py <<'PY'
          from __future__ import annotations
          import asyncio, aiohttp, csv, json, re, zlib
          from collections import Counter, defaultdict
          from pathlib import Path
          from urllib.parse import quote, urlsplit, urljoin

          OUT=Path("out"); OUT.mkdir(exist_ok=True)

          def find_action(root):
              files=list(Path(root).rglob("DoAction.as"))
              if not files: raise SystemExit(f"DoAction.as missing under {root}")
              return max(files,key=lambda p:p.stat().st_size)

          item_text=find_action("work/src/items").read_text(errors="ignore")
          pet_text=find_action("work/src/pets").read_text(errors="ignore")

          def fields(body):
              return dict(re.findall(r'(\w+):"([^"]*)"',body))

          items=[]
          for m in re.finditer(r'itemObject\.ITM(\d+)\s*=\s*\{([^}]*)\};',item_text):
              d=fields(m.group(2)); d["id"]=int(m.group(1))
              if d.get("itemType_DbId"): items.append(d)

          pets=[]
          for m in re.finditer(r'petClassObject\.PC(\d+)\s*=\s*\{([^}]*)\};',pet_text):
              d=fields(m.group(2)); d["id"]=int(m.group(1))
              if d.get("description"): pets.append(d)

          with (OUT/"items.tsv").open("w",newline="",encoding="utf-8") as f:
              w=csv.writer(f,delimiter="\t"); w.writerow(["id","itemType_DbId","name","status","export","interactive","interaction"])
              for d in items: w.writerow([d["id"],d.get("itemType_DbId",""),d.get("name",""),d.get("status",""),d.get("export",""),d.get("interactive",""),d.get("interaction","")])
          with (OUT/"pets.tsv").open("w",newline="",encoding="utf-8") as f:
              w=csv.writer(f,delimiter="\t"); w.writerow(["id","description","species","skeleton","retired","hidden","sku"])
              for d in pets: w.writerow([d["id"],d.get("description",""),d.get("petSpecies_DbId",""),d.get("skeleton_DbId",""),d.get("retired",""),d.get("hidden",""),d.get("SKU","")])

          candidates={}
          def add(url,kind,entity):
              candidates[url]=(kind,entity)

          # Exact URL formulas recovered from WebkinzEstoreTasks.as.
          for d in items:
              iid=d["id"]; typ=d["itemType_DbId"]
              base=f"https://play.webkinz.com/SWF/ITEMS/{typ}/{iid}/"
              add(base+"icon.swf","item_icon",iid)
              add(base+"catalog.swf","item_catalog",iid)

          # Independently observed live Ganz pet URL layouts.
          for d in pets:
              pid=d["id"]; desc=quote(d["description"],safe="")
              add(f"https://assets.webkinz.com/swf/pets/{pid}/{desc}.swf","pet_main_assets",pid)
              add(f"https://assets.webkinz.com/swf/pet/{pid}/pet.jpg","pet_portrait",pid)
              add(f"https://assets.webkinz.com/swf/pet/{pid}/happy.png","pet_happy",pid)
              # Current closure also proves per-pet SWF/PETS directories exist.
              add(f"https://play.webkinz.com/SWF/PETS/{pid}/{desc}.swf","pet_main_play_probe",pid)
              add(f"https://play.webkinz.com/SWF/PETS/{pid}/charmemotions.swf","pet_charmemotions_probe",pid)

          (OUT/"candidate-counts.json").write_text(json.dumps({
              "items":len(items),"pets":len(pets),"total_candidates":len(candidates),
              "by_kind":dict(Counter(v[0] for v in candidates.values()))
          },indent=2))

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          timeout=aiohttp.ClientTimeout(total=12,connect=6,sock_read=8)

          async def head_one(session,url,kind,entity,sem):
              async with sem:
                  try:
                      async with session.head(url,allow_redirects=True,timeout=timeout) as r:
                          # Some origins dislike HEAD. Fallback to a one-byte ranged GET.
                          if r.status in (403,405,501):
                              async with session.get(url,headers={"Range":"bytes=0-0"},allow_redirects=True,timeout=timeout) as g:
                                  await g.content.read(1)
                                  return (url,kind,entity,g.status,g.headers.get("Content-Length",""),g.headers.get("Content-Type",""),str(g.url))
                          return (url,kind,entity,r.status,r.headers.get("Content-Length",""),r.headers.get("Content-Type",""),str(r.url))
                  except Exception as e:
                      return (url,kind,entity,0,"","",type(e).__name__)

          async def main_probe():
              headers={"User-Agent":UA}
              connector=aiohttp.TCPConnector(limit=24,limit_per_host=12,ttl_dns_cache=300)
              sem=asyncio.Semaphore(24)
              async with aiohttp.ClientSession(headers=headers,connector=connector) as s:
                  tasks=[asyncio.create_task(head_one(s,u,k,e,sem)) for u,(k,e) in candidates.items()]
                  rows=[]
                  done=0
                  for fut in asyncio.as_completed(tasks):
                      rows.append(await fut); done+=1
                      if done%5000==0: print("probed",done,flush=True)
                  return rows

          rows=asyncio.run(main_probe())
          ok=[r for r in rows if r[3] in (200,206)]
          fail=[r for r in rows if r[3] not in (200,206)]

          def write_rows(path,rs):
              with path.open("w",newline="",encoding="utf-8") as f:
                  w=csv.writer(f,delimiter="\t")
                  w.writerow(["url","kind","entity_id","status","content_length","content_type","final_url"])
                  w.writerows(sorted(rs))

          write_rows(OUT/"success.tsv",ok)
          write_rows(OUT/"failures.tsv",fail)
          (OUT/"dynamic-success-urls.txt").write_text("\n".join(sorted({r[0] for r in ok}))+"\n")
          by_kind=Counter(r[1] for r in ok)
          status_by_kind=defaultdict(Counter)
          for r in rows: status_by_kind[r[1]][str(r[3])]+=1

          # Download successful pet main SWFs only; mine their child resource names.
          pet_main=[r for r in ok if r[1] in ("pet_main_assets","pet_main_play_probe") and r[0].lower().endswith(".swf")]
          child_candidates={}
          child_edges=set()
          child_rx=re.compile(rb'(?i)([A-Za-z0-9_.%+() -]{1,180}\.(?:swf|xml|jpg|jpeg|png|gif|mp3|wav|json|js|css))(?:\?[^\x00\s"\'<>\\)]{0,120})?')

          def uncompress(raw):
              if len(raw)>=8 and raw[:3]==b"CWS":
                  try:return b"FWS"+raw[3:8]+zlib.decompress(raw[8:])
                  except Exception:return raw
              return raw

          async def get_bytes(session,url,sem):
                  try:
                      async with session.get(url,allow_redirects=True,timeout=aiohttp.ClientTimeout(total=30,connect=7,sock_read=20)) as r:
                          if r.status!=200:return None
                          cl=int(r.headers.get("Content-Length") or 0)
                          if cl>5_000_000:return None
                          return await r.read()
                  except Exception:return None

          async def mine_pets():
              conn=aiohttp.TCPConnector(limit=12,limit_per_host=8,ttl_dns_cache=300)
              sem2=asyncio.Semaphore(12)
              async with aiohttp.ClientSession(headers={"User-Agent":UA},connector=conn) as s:
                  tasks={asyncio.create_task(get_bytes(s,r[0],sem2)):r for r in pet_main}
                  for fut in asyncio.as_completed(tasks):
                      row=tasks[fut]; raw=await fut
                      if not raw:continue
                      data=uncompress(raw)
                      for m in child_rx.finditer(data):
                          ref=m.group(1).decode("latin1","ignore").strip()
                          if "/" in ref or ref.lower().endswith((".swf",".xml",".jpg",".jpeg",".png",".gif",".mp3",".wav",".json",".js",".css")):
                              cu=urljoin(row[0],ref)
                              if urlsplit(cu).hostname in ("assets.webkinz.com","play.webkinz.com"):
                                  child_candidates[cu]=("pet_child",row[2])
                                  child_edges.add((row[0],cu))
              return

          asyncio.run(mine_pets())

          async def probe_children():
              if not child_candidates:return []
              conn=aiohttp.TCPConnector(limit=20,limit_per_host=10,ttl_dns_cache=300)
              sem3=asyncio.Semaphore(20)
              async with aiohttp.ClientSession(headers={"User-Agent":UA},connector=conn) as s:
                  tasks=[asyncio.create_task(head_one(s,u,k,e,sem3)) for u,(k,e) in child_candidates.items()]
                  return [await f for f in asyncio.as_completed(tasks)]

          child_rows=asyncio.run(probe_children())
          child_ok=[r for r in child_rows if r[3] in (200,206)]
          write_rows(OUT/"pet-child-success.tsv",child_ok)
          write_rows(OUT/"pet-child-failures.tsv",[r for r in child_rows if r[3] not in (200,206)])
          (OUT/"pet-child-edges.tsv").write_text("\n".join(f"{a}\t{b}" for a,b in sorted(child_edges))+"\n")
          (OUT/"pet-child-success-urls.txt").write_text("\n".join(sorted({r[0] for r in child_ok}))+"\n")

          # Try public bucket-style listing APIs. Usually blocked, but if enabled this can supersede probing.
          async def bucket_checks():
              urls=[
                "https://assets.webkinz.com/?list-type=2&prefix=swf/pet/",
                "https://assets.webkinz.com/?list-type=2&prefix=swf/pets/",
                "https://play.webkinz.com/?list-type=2&prefix=SWF/ITEMS/",
              ]
              conn=aiohttp.TCPConnector(limit=3)
              out=[]
              async with aiohttp.ClientSession(headers={"User-Agent":UA},connector=conn) as s:
                  for u in urls:
                      try:
                          async with s.get(u,timeout=aiohttp.ClientTimeout(total=20)) as r:
                              body=(await r.read())[:200000]
                              out.append({"url":u,"status":r.status,"type":r.headers.get("Content-Type",""),"body_prefix":body.decode("utf-8","ignore")[:20000]})
                      except Exception as e:out.append({"url":u,"error":repr(e)})
              return out
          buckets=asyncio.run(bucket_checks())
          (OUT/"bucket-listing-checks.json").write_text(json.dumps(buckets,indent=2))

          summary={
              "version":"v390_249",
              "item_records":len(items),
              "pet_records":len(pets),
              "generated_candidates":len(rows),
              "generated_successes":len(ok),
              "generated_failures":len(fail),
              "success_by_kind":dict(by_kind),
              "status_by_kind":{k:dict(v) for k,v in status_by_kind.items()},
              "successful_pet_main_swfs":len(pet_main),
              "pet_child_candidates":len(child_rows),
              "pet_child_successes":len(child_ok),
              "bucket_listing_checks":[{k:v for k,v in x.items() if k!="body_prefix"} for x in buckets],
          }
          (OUT/"summary.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY

          python3 work/probe.py 2>&1 | tee out/run.log

      - name: Upload dynamic asset report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-dynamic-assets
          path: out/
          if-no-files-found: error
          retention-days: 7
