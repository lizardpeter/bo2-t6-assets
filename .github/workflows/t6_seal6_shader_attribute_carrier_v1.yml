name: T6 SEAL6 full-retail shader attribute carrier v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/seal6-material-closure
    paths:
      - 'tools/t6_gltf_augment_xmodel_shader_attributes_v1.py'
      - 'tools/t6_xmodel_blender_static_bindpose_export_v1.py'
      - 'tools/t6_xmodel_blender_static_bindpose_export_v2.py'
      - 'tools/t6_xmodel_blender_static_bindpose_export_v3.py'
      - 'tools/t6_xmodel_mesh_normalize_v1.py'
      - 'tools/t6_fastfile_expand_pc_v1.c'
      - '.github/workflows/t6_seal6_shader_attribute_carrier_v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  carrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download authoritative full-retail geometry-v3 carrier
        uses: actions/download-artifact@v4
        with:
          name: T6_SEAL6_SMG_LOD0_NATIVE_BLEND_V2_GEOMETRY_V3_REBASED
          run-id: 34170618824
          github-token: ${{ github.token }}
          repository: lizardpeter/bo2-t6-assets
          path: /tmp/carrier

      - name: Regenerate exact shader-attribute authority from faction FastFile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source /tmp/proof /tmp/out
          CARRIER=/tmp/carrier/T6_SEAL6_SMG_LOD0_FULL_RETAIL_GEOMETRY_V3_REBASED.glb
          test -s "$CARRIER"
          echo 'a2d7f9ec55dfdae7baff7dafaca068d63d809564de30f7a50cd32538f4f778f2  '"$CARRIER" | sha256sum -c -

          curl -fL --retry 6 --retry-delay 1 --connect-timeout 30 \
            -o /tmp/source/faction_seals_mp.ff \
            https://r2.houseofkublai.com/bo2/zone/all/faction_seals_mp.ff
          echo '1a075434760751551158b7d62cc2761649e2d2c7606b27b3bbe066b998b77c88  /tmp/source/faction_seals_mp.ff' | sha256sum -c -
          test "$(stat -c %s /tmp/source/faction_seals_mp.ff)" -eq 3095232

          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libssl-dev zlib1g-dev >/dev/null
          gcc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_fastfile_expand -lcrypto -lz
          /tmp/t6_fastfile_expand \
            /tmp/source/faction_seals_mp.ff \
            /tmp/source/faction_seals_mp.expanded \
            faction_seals_mp 2>&1 | tee /tmp/proof/faction_expand.log
          echo '21a11090990417faefa8c39282f499c7bdb87a7acf62f00082aa9b3811cced30  /tmp/source/faction_seals_mp.expanded' | sha256sum -c -
          test "$(stat -c %s /tmp/source/faction_seals_mp.expanded)" -eq 6245916

          python3 tools/t6_xmodel_mesh_normalize_v1.py \
            /tmp/source/faction_seals_mp.expanded \
            --asset-start 0x45CCF1 \
            --out /tmp/source/c_usa_mp_seal6_smg_fb.mesh.v1.json
          python3 - <<'PY'
          import json
          p='/tmp/source/c_usa_mp_seal6_smg_fb.mesh.v1.json'
          d=json.load(open(p))
          assert d['format']=='t6-xmodel-mesh-normalized-v1'
          assert d['identity']['name']=='c_usa_mp_seal6_smg_fb'
          assert d['xmodel']['numLods']==4
          assert len(d['surfaces'])==42
          lod=next(x for x in d['xmodel']['lods'] if int(x['index'])==0)
          rows=d['surfaces'][int(lod['surfIndex']):int(lod['surfIndex'])+int(lod['numSurfs'])]
          assert len(rows)==14
          assert sum(int(x['vertCount']) for x in rows)==13490
          assert sum(int(x['triCount']) for x in rows)==14968
          assert all(all(k in v for k in ('colorRGBA','normal','tangentXYZ','binormalSign','texcoord0')) for s in rows for v in s['vertices'])
          print('mesh-authority-ok',len(rows),sum(x['vertCount'] for x in rows),sum(x['triCount'] for x in rows))
          PY

          python3 tools/t6_xmodel_blender_static_bindpose_export_v3.py \
            /tmp/source/c_usa_mp_seal6_smg_fb.mesh.v1.json \
            /tmp/source/T6_SEAL6_LOD0_SHADER_ATTRIBUTE_AUTHORITY_V3.glb \
            --lod 0
          test -s /tmp/source/T6_SEAL6_LOD0_SHADER_ATTRIBUTE_AUTHORITY_V3.glb
          sha256sum /tmp/source/T6_SEAL6_LOD0_SHADER_ATTRIBUTE_AUTHORITY_V3.glb | tee /tmp/proof/shader_authority_sha256.txt

      - name: Augment full-retail carrier with exact shader attributes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/t6_gltf_augment_xmodel_shader_attributes_v1.py
          python3 tools/t6_gltf_augment_xmodel_shader_attributes_v1.py \
            --carrier /tmp/carrier/T6_SEAL6_SMG_LOD0_FULL_RETAIL_GEOMETRY_V3_REBASED.glb \
            --authority /tmp/source/T6_SEAL6_LOD0_SHADER_ATTRIBUTE_AUTHORITY_V3.glb \
            --output /tmp/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_ATTRIBUTES_V1.glb \
            --report /tmp/proof/T6_SEAL6_SHADER_ATTRIBUTE_CARRIER_V1.json \
            --require-primitives 14
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/proof/T6_SEAL6_SHADER_ATTRIBUTE_CARRIER_V1.json'))
          assert d['primitiveCount']==14
          assert d['vertices']==13490
          assert d['materials']==12
          assert d['animations']==6
          assert d['joints']==102
          assert d['color0Present'] is False
          assert d['standardTangentPresent'] is False
          assert d['allBaseVertexOrdersProven'] is True
          assert d['allCustomShaderAttributesExact'] is True
          assert d['customAttributesPerPrimitive']==[
              '_T6_COLOR_RGBA','_T6_XMODEL_NORMAL','_T6_XMODEL_TANGENT','_T6_TANGENT_HANDEDNESS'
          ]
          print(json.dumps(d,indent=2,sort_keys=True))
          PY

      - name: Install Blender and prove custom shader attributes survive import
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq blender >/dev/null
          blender --version | head -3 | tee /tmp/proof/blender_version.txt
          cat >/tmp/import_shader_carrier.py <<'PY'
          import bpy,json
          from pathlib import Path
          src=Path('/tmp/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_ATTRIBUTES_V1.glb')
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=str(src), import_pack_images=True)
          assert len(bpy.data.armatures)==1, len(bpy.data.armatures)
          assert len(bpy.data.actions)==6, len(bpy.data.actions)
          assert len(bpy.data.materials)==12, len(bpy.data.materials)
          meshes=[o for o in bpy.data.objects if o.type=='MESH']
          main=[o for o in meshes if o.name=='c_usa_mp_seal6_smg_fb_mesh']
          assert len(main)==1, [o.name for o in meshes]
          main=main[0]
          # Blender may create an import helper mesh; remove only non-source helpers,
          # exactly as the already-proven native-blend v2 workflow does.
          for o in list(meshes):
              if o is main: continue
              data=o.data; bpy.data.objects.remove(o,do_unlink=True)
              if data.users==0: bpy.data.meshes.remove(data)
          assert len(main.data.vertices)==13490
          assert len(main.data.polygons)==14968
          attrs={a.name:(a.data_type,a.domain,len(a.data)) for a in main.data.attributes}
          color_attrs={a.name:(a.data_type,a.domain,len(a.data)) for a in main.data.color_attributes}
          required={'_T6_COLOR_RGBA','_T6_XMODEL_NORMAL','_T6_XMODEL_TANGENT','_T6_TANGENT_HANDEDNESS'}
          missing=required-set(attrs)-set(color_attrs)
          if missing:
              raise RuntimeError(f'custom T6 shader attributes did not survive glTF import: missing={sorted(missing)} attrs={attrs} colors={color_attrs}')
          if 'COLOR_0' in attrs or 'COLOR_0' in color_attrs:
              raise RuntimeError('forbidden standard COLOR_0 reappeared in Blender')
          scene=bpy.context.scene
          scene['t6_shader_attribute_carrier']='t6-gltf-augment-xmodel-shader-attributes-v1'
          scene['t6_color0_removed']=True
          scene['t6_exact_shader_custom_attributes']=True
          scene['t6_source_vertices']=13490
          scene['t6_source_triangles']=14968
          scene['t6_source_joints']=102
          scene['t6_source_animations']=6
          notice=bpy.data.texts.new('T6_SHADER_ATTRIBUTE_NOTICE.txt')
          notice.write('Exact T6 shader-only vertex data is carried in custom _T6_* attributes. Standard glTF COLOR_0 remains absent. Do not derive tangent from UVs for retail T6 shader reconstruction.\n')
          out=Path('/tmp/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_ATTRIBUTES_V1.blend')
          bpy.ops.file.pack_all()
          bpy.ops.wm.save_as_mainfile(filepath=str(out),compress=False)
          report={
              'format':'t6-seal6-shader-attribute-blender-import-v1',
              'blenderVersion':bpy.app.version_string,
              'vertices':len(main.data.vertices),'triangles':len(main.data.polygons),
              'armatures':len(bpy.data.armatures),'actions':len(bpy.data.actions),'materials':len(bpy.data.materials),
              'attributes':attrs,'colorAttributes':color_attrs,
              'requiredCustomAttributesPresent':True,'color0Present':False,
          }
          Path('/tmp/proof/T6_SEAL6_SHADER_ATTRIBUTE_BLENDER_IMPORT_V1.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
          blender --background --python /tmp/import_shader_carrier.py 2>&1 | tee /tmp/proof/blender_import.log
          test -s /tmp/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_ATTRIBUTES_V1.blend
          test -s /tmp/proof/T6_SEAL6_SHADER_ATTRIBUTE_BLENDER_IMPORT_V1.json
          sha256sum /tmp/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_ATTRIBUTES_V1.glb \
                    /tmp/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_ATTRIBUTES_V1.blend \
                    | tee /tmp/proof/OUTPUT_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_SEAL6_FULL_RETAIL_SHADER_ATTRIBUTE_CARRIER_V1
          path: |
            /tmp/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_ATTRIBUTES_V1.glb
            /tmp/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_ATTRIBUTES_V1.blend
            /tmp/proof
          if-no-files-found: error
          compression-level: 0
