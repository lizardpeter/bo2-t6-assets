name: nuketown-patch-image-probe
on:
  push:
    branches: [base-ipak-r2-recovery]
    paths:
      - .github/workflows/nuketown-patch-image-probe.yml
      - tools/t6_fastfile_expand_v1.py
      - tools/t6_patch_mp_gfximage_probe_v1.py
      - manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_TEXTURE_COVERAGE_V1.json
      - manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_TEXTURE_IDENTITIES_CANONICAL_V1.json.zlib.b64
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install exact expansion and fetch dependencies
        run: python -m pip install --disable-pip-version-check gdown pycryptodome

      - name: Syntax and negative-control self tests
        run: |
          python -m py_compile tools/t6_fastfile_expand_v1.py tools/t6_patch_mp_gfximage_probe_v1.py
          python tools/t6_patch_mp_gfximage_probe_v1.py --self-test

      - name: Fetch pinned retail patch_mp FastFile
        run: |
          gdown 1dCEslW6kfePKZfnkkmhFbkgMcIkWi1yx -O patch_mp.ff
          test "$(stat -c %s patch_mp.ff)" = "3639168"
          echo '459077cda8e4a1457f7ee7d8f6c5e0abf30f41767a21ff6744df6a4307cbce1e  patch_mp.ff' | sha256sum -c -

      - name: Reproduce the exact retained patch_mp expanded XFile
        run: |
          python tools/t6_fastfile_expand_v1.py patch_mp.ff \
            --zone-name patch_mp \
            --out patch_mp.expanded.bin \
            --manifest PATCH_MP_EXPANSION_V1.json \
            --expected-raw-bytes 3639168 \
            --expected-raw-sha256 459077cda8e4a1457f7ee7d8f6c5e0abf30f41767a21ff6744df6a4307cbce1e \
            --expected-expanded-bytes 14713756 \
            --expected-expanded-sha256 1bd82b0e99fcea3a9cb1c2342634f1da0d699b3fdadfa9f7c7fe15595952a7b9
          test "$(stat -c %s patch_mp.expanded.bin)" = "14713756"
          echo '1bd82b0e99fcea3a9cb1c2342634f1da0d699b3fdadfa9f7c7fe15595952a7b9  patch_mp.expanded.bin' | sha256sum -c -

      - name: Probe all unresolved primary Nuketown identities against raw patch_mp GfxImage records
        run: |
          python tools/t6_patch_mp_gfximage_probe_v1.py \
            --expanded patch_mp.expanded.bin \
            --coverage manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_TEXTURE_COVERAGE_V1.json \
            --canonical manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_TEXTURE_IDENTITIES_CANONICAL_V1.json.zlib.b64 \
            --out PATCH_MP_GFXIMAGE_IDENTITY_PROBE_V1.json \
            --expect-assets 1764 \
            --expect-image-xassets 48 \
            --expect-unresolved 48
          python - <<'PY'
          import json
          p=json.load(open('PATCH_MP_GFXIMAGE_IDENTITY_PROBE_V1.json'))
          assert p['front']['assetCount']==1764
          assert p['front']['imageXassetCount']==48
          assert p['summary']['unresolvedPrimaryCount']==48
          print(json.dumps(p['summary'],indent=2,sort_keys=True))
          PY

      - name: Run pinned OAT only as a diagnostic cross-check
        run: |
          curl -L --fail --retry 3 -o oat-linux.tar.gz https://github.com/Laupetin/OpenAssetTools/releases/download/v0.33.0/oat-linux.tar.gz
          echo 'aa0b80f633c50d656b26d28b4899fd76bd994024ff0c669303ed5db52cc9e864  oat-linux.tar.gz' | sha256sum -c -
          mkdir oat patch_out
          tar -xzf oat-linux.tar.gz -C oat
          UNLINKER=$(find oat -type f -name Unlinker | head -1)
          test -n "$UNLINKER"
          chmod +x "$UNLINKER"
          "$UNLINKER" patch_mp.ff --output-folder patch_out --verbose > oat.log 2>&1
          find patch_out -type f -printf '%P\n' | sort > PATCH_OUT_FILES.txt

      - name: Record non-authoritative OAT literal-name diagnostic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          exact=json.load(open('PATCH_MP_GFXIMAGE_IDENTITY_PROBE_V1.json'))
          names=[r['image'] for r in exact['rows']]
          files=Path('PATCH_OUT_FILES.txt').read_text(errors='ignore').lower()
          log=Path('oat.log').read_text(errors='ignore').lower()
          blob=files+'\n'+log
          rows=[{'image':name,'literalSeenInOatOutput':name.lower() in blob} for name in names]
          out={
            'authority':'diagnostic-only; raw GfxImage probe is authoritative',
            'unresolvedPrimaryIdentities':len(names),
            'literalMatches':sum(r['literalSeenInOatOutput'] for r in rows),
            'rows':rows,
          }
          Path('PATCH_MP_UNRESOLVED_PRIMARY_MATCH_PROBE.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({'literalMatches':out['literalMatches']},indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuketown-patch-image-probe-v2
          path: |
            PATCH_MP_EXPANSION_V1.json
            PATCH_MP_GFXIMAGE_IDENTITY_PROBE_V1.json
            PATCH_MP_UNRESOLVED_PRIMARY_MATCH_PROBE.json
            PATCH_OUT_FILES.txt
            oat.log
          if-no-files-found: warn
          retention-days: 7
