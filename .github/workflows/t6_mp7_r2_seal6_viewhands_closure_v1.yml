name: T6 MP7 R2 SEAL6 viewhands raw closure v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/firstperson-weapons-closure
    paths:
      - '.github/workflows/t6_mp7_r2_seal6_viewhands_closure_v1.yml'
      - 'tools/t6_mp7_r2_seal6_viewhands_closure_v1.py'
      - 'tools/t6_xmodel_mesh_normalize_v3.py'
      - 'tools/t6_xmodel_mesh_normalize_v2.py'
      - 'tools/t6_xmodel_skeleton_normalize_v2.py'
      - 'tools/t6_xmodel_skeleton_normalize_v1.py'
      - 'tools/t6_xmodel_serialized_walker.py'
      - 'tools/t6_fastfile_expand_pc_v1.c'
      - 'manifests/weapons/T6_MP7_R2_SEAL6_VIEWHANDS_MESH_CLOSURE_V1.json'

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compile-check closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/t6_mp7_r2_seal6_viewhands_closure_v1.py \
            tools/t6_xmodel_mesh_normalize_v3.py \
            tools/t6_xmodel_mesh_normalize_v2.py \
            tools/t6_xmodel_skeleton_normalize_v2.py \
            tools/t6_xmodel_skeleton_normalize_v1.py \
            tools/t6_xmodel_serialized_walker.py

      - name: Build source-closed FastFile expander
        shell: bash
        run: |
          set -euo pipefail
          gcc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_expand -lcrypto -lz
          mkdir -p /tmp/game/zone/all /tmp/expanded /tmp/proof
          sha256sum /tmp/t6_expand | tee /tmp/proof/expander_sha256.txt

      - name: Download and pin exact current R2 sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 https://r2.houseofkublai.com/bo2/zone/all/common_mp.ff -o /tmp/game/zone/all/common_mp.ff
          curl -fL --retry 4 https://r2.houseofkublai.com/bo2/zone/all/faction_seals_mp.ff -o /tmp/game/zone/all/faction_seals_mp.ff
          echo '93fe48b0f0d8cc6844be875ccad94e0cfcf635f62eeff00ac33f2f668a77cb77  /tmp/game/zone/all/common_mp.ff' | sha256sum -c -
          echo '1a075434760751551158b7d62cc2761649e2d2c7606b27b3bbe066b998b77c88  /tmp/game/zone/all/faction_seals_mp.ff' | sha256sum -c -
          stat -c '%n %s bytes' /tmp/game/zone/all/*.ff | tee /tmp/proof/source_sizes.txt
          sha256sum /tmp/game/zone/all/*.ff | tee /tmp/proof/source_sha256.txt

      - name: Expand exact sources
        shell: bash
        run: |
          set -euo pipefail
          /tmp/t6_expand /tmp/game/zone/all/common_mp.ff /tmp/expanded/common_mp.bin common_mp > /tmp/proof/common_mp_expand.log 2>&1
          /tmp/t6_expand /tmp/game/zone/all/faction_seals_mp.ff /tmp/expanded/faction_seals_mp.bin faction_seals_mp > /tmp/proof/faction_seals_mp_expand.log 2>&1
          test "$(stat -c%s /tmp/expanded/common_mp.bin)" = '206493911'
          echo 'fbd91d0ede8e27bcaaf7af9638a7118050f27519524be36e9234f980bd6170ce  /tmp/expanded/common_mp.bin' | sha256sum -c -
          test "$(stat -c%s /tmp/expanded/faction_seals_mp.bin)" = '6245916'
          echo '21a11090990417faefa8c39282f499c7bdb87a7acf62f00082aa9b3811cced30  /tmp/expanded/faction_seals_mp.bin' | sha256sum -c -
          stat -c '%n %s bytes' /tmp/expanded/*.bin | tee /tmp/proof/expanded_sizes.txt
          sha256sum /tmp/expanded/*.bin | tee /tmp/proof/expanded_sha256.txt

      - name: Close visible SEAL6 rigs and raw meshes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_mp7_r2_seal6_viewhands_closure_v1.py \
            --common-stream /tmp/expanded/common_mp.bin \
            --faction-stream /tmp/expanded/faction_seals_mp.bin \
            --out /tmp/proof/T6_MP7_R2_SEAL6_VIEWHANDS_CLOSURE_V1.json \
            | tee /tmp/proof/closure.log
          sha256sum /tmp/proof/T6_MP7_R2_SEAL6_VIEWHANDS_CLOSURE_V1.json | tee /tmp/proof/manifest_sha256.txt

      - name: Require retained closure agreement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          fresh=json.load(open('/tmp/proof/T6_MP7_R2_SEAL6_VIEWHANDS_CLOSURE_V1.json',encoding='utf-8'))
          retained=json.load(open('manifests/weapons/T6_MP7_R2_SEAL6_VIEWHANDS_MESH_CLOSURE_V1.json',encoding='utf-8'))
          if fresh['source']['expandedCommonMp'] != retained['source']['expandedCommonMp']:
              raise SystemExit('expanded common_mp identity drift')
          if fresh['source']['expandedFactionSealsMp'] != retained['source']['expandedFactionSealsMp']:
              raise SystemExit('expanded faction_seals_mp identity drift')
          if fresh['summary']['meshAndLocalRigClosureAuthoritative'] is not True:
              raise SystemExit('fresh mesh/local-rig closure is not authoritative')
          if fresh['summary']['finalDObjAssemblySemanticsAuthoritative'] is not False:
              raise SystemExit('DObj gate was crossed unexpectedly')
          if fresh['genericCarrier']['skeletonWitness']['canonicalSha256'] != retained['genericCarrier']['skeletonWitnessCanonicalSha256']:
              raise SystemExit('generic carrier skeleton drift')
          by={m['name']:m for m in retained['models']}
          for row in fresh['targets']:
              old=by.get(row['name'])
              if old is None: raise SystemExit('unexpected visible model '+row['name'])
              checks={
                'assetFixedStart': row['assetFixedStart'],
                'assetSerializedBytes': row['assetSerializedBytes'],
                'assetSerializedSha256': row['assetSerializedSha256'],
                'surfaceCount': row['mesh']['surfaceCount'],
                'vertexCount': row['mesh']['vertexCount'],
                'triangleCount': row['mesh']['triangleCount'],
                'unweightedVertexCount': row['mesh']['unweightedVertexCount'],
                'normalizedMeshCanonicalSha256': row['mesh']['normalizedCanonicalSha256'],
              }
              for k,v in checks.items():
                  if old[k] != v: raise SystemExit(f'{row["name"]} {k} drift: {v!r} != {old[k]!r}')
              if row['skeletonWitness']['canonicalSha256'] != retained['visibleRig']['skeletonWitnessCanonicalSha256']:
                  raise SystemExit(row['name']+' visible skeleton witness drift')
              if row['bindingTo70BoneCarrier']['visibleOnlyBones'] != retained['visibleRig']['visibleOnlyBonesVersusGenericCarrier']:
                  raise SystemExit(row['name']+' visible-only bone drift')
              if row['bindingTo70BoneCarrier']['parentDifferences'] != retained['visibleRig']['retailAuthoredSharedParentDifference']:
                  raise SystemExit(row['name']+' shared-parent difference drift')
          print('retained SEAL6 visible-hands mesh/local-rig closure agrees exactly')
          PY

      - name: Upload SEAL6 visible-hands closure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_MP7_R2_SEAL6_VIEWHANDS_CLOSURE_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
