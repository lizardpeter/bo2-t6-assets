name: T6 MP7 R2 SEAL6 viewhands raw closure v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/firstperson-weapons-closure
    paths:
      - '.github/workflows/t6_mp7_r2_seal6_viewhands_closure_v1.yml'
      - 'tools/t6_mp7_r2_seal6_viewhands_closure_v1.py'
      - 'tools/t6_xmodel_mesh_normalize_v3.py'
      - 'tools/t6_xmodel_mesh_normalize_v2.py'
      - 'tools/t6_xmodel_skeleton_normalize_v2.py'
      - 'tools/t6_xmodel_skeleton_normalize_v1.py'
      - 'tools/t6_xmodel_serialized_walker.py'
      - 'tools/t6_fastfile_expand_pc_v1.c'

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compile-check closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/t6_mp7_r2_seal6_viewhands_closure_v1.py \
            tools/t6_xmodel_mesh_normalize_v3.py \
            tools/t6_xmodel_mesh_normalize_v2.py \
            tools/t6_xmodel_skeleton_normalize_v2.py \
            tools/t6_xmodel_skeleton_normalize_v1.py \
            tools/t6_xmodel_serialized_walker.py

      - name: Build source-closed FastFile expander
        shell: bash
        run: |
          set -euo pipefail
          gcc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_expand -lcrypto -lz
          mkdir -p /tmp/game/zone/all /tmp/expanded /tmp/proof
          sha256sum /tmp/t6_expand | tee /tmp/proof/expander_sha256.txt

      - name: Download and pin exact current R2 sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 https://r2.houseofkublai.com/bo2/zone/all/common_mp.ff -o /tmp/game/zone/all/common_mp.ff
          curl -fL --retry 4 https://r2.houseofkublai.com/bo2/zone/all/faction_seals_mp.ff -o /tmp/game/zone/all/faction_seals_mp.ff
          echo '93fe48b0f0d8cc6844be875ccad94e0cfcf635f62eeff00ac33f2f668a77cb77  /tmp/game/zone/all/common_mp.ff' | sha256sum -c -
          echo '1a075434760751551158b7d62cc2761649e2d2c7606b27b3bbe066b998b77c88  /tmp/game/zone/all/faction_seals_mp.ff' | sha256sum -c -
          stat -c '%n %s bytes' /tmp/game/zone/all/*.ff | tee /tmp/proof/source_sizes.txt
          sha256sum /tmp/game/zone/all/*.ff | tee /tmp/proof/source_sha256.txt

      - name: Expand exact sources
        shell: bash
        run: |
          set -euo pipefail
          /tmp/t6_expand /tmp/game/zone/all/common_mp.ff /tmp/expanded/common_mp.bin common_mp > /tmp/proof/common_mp_expand.log 2>&1
          /tmp/t6_expand /tmp/game/zone/all/faction_seals_mp.ff /tmp/expanded/faction_seals_mp.bin faction_seals_mp > /tmp/proof/faction_seals_mp_expand.log 2>&1
          test "$(stat -c%s /tmp/expanded/common_mp.bin)" = '206493911'
          echo 'fbd91d0ede8e27bcaaf7af9638a7118050f27519524be36e9234f980bd6170ce  /tmp/expanded/common_mp.bin' | sha256sum -c -
          stat -c '%n %s bytes' /tmp/expanded/*.bin | tee /tmp/proof/expanded_sizes.txt
          sha256sum /tmp/expanded/*.bin | tee /tmp/proof/expanded_sha256.txt

      - name: Close visible SEAL6 rigs and raw meshes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_mp7_r2_seal6_viewhands_closure_v1.py \
            --common-stream /tmp/expanded/common_mp.bin \
            --faction-stream /tmp/expanded/faction_seals_mp.bin \
            --out /tmp/proof/T6_MP7_R2_SEAL6_VIEWHANDS_CLOSURE_V1.json \
            | tee /tmp/proof/closure.log
          sha256sum /tmp/proof/T6_MP7_R2_SEAL6_VIEWHANDS_CLOSURE_V1.json | tee /tmp/proof/manifest_sha256.txt

      - name: Upload SEAL6 visible-hands closure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_MP7_R2_SEAL6_VIEWHANDS_CLOSURE_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
