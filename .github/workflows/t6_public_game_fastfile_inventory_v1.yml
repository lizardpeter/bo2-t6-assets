name: T6 public game FastFile inventory v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_remote_zip_range_v1.py'
      - '.github/workflows/t6_public_game_fastfile_inventory_v1.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inventory ZIP64 remote central directory
        shell: bash
        env:
          ZIP_URL: https://cdn.jordanlindsay.com.au/pluto_t6_full_game.zip
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof
          PYTHONPATH=tools python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from t6_remote_zip_range_v1 import RemoteZip

          rz=RemoteZip(os.environ['ZIP_URL'],'bo2-t6-assets-fastfile-inventory/2')
          entries,meta=rz.central_directory()
          rows=[]
          for e in entries:
              name=e['name']
              if not name.lower().endswith('.ff'):
                  continue
              base=name.rsplit('/',1)[-1]
              low=base.lower()
              tags=[tag for tag in ('gfx','common','patch','frontend','ui','mp','zm','code','load','menu') if tag in low]
              rows.append({
                  'path':name,
                  'file':base,
                  'compressedSize':e['compressedSize'],
                  'uncompressedSize':e['uncompressedSize'],
                  'method':e['method'],
                  'flags':e['flags'],
                  'crc32':f"{e['crc32']:08x}",
                  'localHeaderOffset':e['localHeaderOffset'],
                  'nameTags':tags,
              })
          rows.sort(key=lambda x:x['path'].lower())
          manifest={
              'format':'t6-public-game-fastfile-inventory-v2',
              'remoteZip':meta,
              'fastFiles':rows,
              'summary':{
                  'fastFileCount':len(rows),
                  'allZoneCount':sum('/zone/all/' in ('/'+r['path'].lower()) for r in rows),
                  'localizedZoneCount':sum('/zone/english/' in ('/'+r['path'].lower()) for r in rows),
                  'gfxNamedCount':sum('gfx' in r['file'].lower() for r in rows),
                  'commonNamedCount':sum('common' in r['file'].lower() for r in rows),
                  'patchNamedCount':sum('patch' in r['file'].lower() for r in rows),
              },
              'proofBoundary':'Exact ZIP/ZIP64 central-directory inventory for the referenced public full-game archive. This establishes archive entry names, compressed/uncompressed sizes, methods, flags, CRC32 and 64-bit local-header offsets. It does not establish SHA-256 of individual FastFiles until their bytes are separately extracted and hashed, and it does not claim runtime load order or ownership.'
          }
          raw=json.dumps(manifest,indent=2,sort_keys=True)+'\n'
          Path('/tmp/proof/T6_PUBLIC_GAME_FASTFILE_INVENTORY_V2.json').write_text(raw)
          Path('/tmp/proof/fastfiles.txt').write_text(''.join(r['path']+'\n' for r in rows))
          candidates=[r for r in rows if any(k in r['file'].lower() for k in ('gfx','common','patch','frontend','ui'))]
          Path('/tmp/proof/renderer_startup_name_candidates.json').write_text(json.dumps(candidates,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest['summary'],indent=2,sort_keys=True))
          print('eocd_kind',meta['eocdKind'])
          print('manifest_sha256',hashlib.sha256(raw.encode()).hexdigest())
          print('renderer/startup name candidates:')
          for r in candidates: print(r['path'])
          PY
      - name: Upload FastFile inventory
        uses: actions/upload-artifact@v4
        with:
          name: T6_PUBLIC_GAME_FASTFILE_INVENTORY_V2
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
