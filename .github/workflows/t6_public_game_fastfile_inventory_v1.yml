name: T6 public game FastFile inventory v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_public_game_fastfile_inventory_v1.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inventory remote ZIP central directory
        shell: bash
        env:
          ZIP_URL: https://cdn.jordanlindsay.com.au/pluto_t6_full_game.zip
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof
          python3 - <<'PY'
          import hashlib,json,os,struct,urllib.request
          from pathlib import Path

          url=os.environ['ZIP_URL']
          def rr(a,b):
              req=urllib.request.Request(url,headers={'Range':f'bytes={a}-{b}','User-Agent':'bo2-t6-assets-fastfile-inventory/1'})
              r=urllib.request.urlopen(req,timeout=90)
              return r.read(),dict(r.headers),r.status
          _,hdr,status=rr(0,0)
          cr=hdr.get('Content-Range') or hdr.get('content-range')
          if not cr or '/' not in cr: raise SystemExit(f'no Content-Range status={status}')
          total=int(cr.rsplit('/',1)[1])
          n=min(total,4*1024*1024)
          tail,_,_=rr(total-n,total-1)
          p=tail.rfind(b'PK\x05\x06')
          if p<0: raise SystemExit('EOCD not found')
          disk,cd_disk,disk_entries,entries,cd_size,cd_off,comment_len=struct.unpack_from('<4H2LH',tail,p+4)
          if disk or cd_disk or disk_entries!=entries: raise SystemExit('multi-disk ZIP unsupported')
          if cd_off==0xffffffff or cd_size==0xffffffff or entries==0xffff: raise SystemExit('ZIP64 unsupported')
          cd,_,_=rr(cd_off,cd_off+cd_size-1)
          rows=[]; o=0
          while o<len(cd):
              if cd[o:o+4]!=b'PK\x01\x02': raise SystemExit(f'bad central signature {o}')
              vals=struct.unpack_from('<6H3L5H2L',cd,o+4)
              ver_made,ver_need,flags,method,mtime,mdate,crc32,csize,usize,nlen,xlen,clen,disk_start,int_attr,ext_attr,lhoff=vals
              name=cd[o+46:o+46+nlen].decode('utf-8','replace')
              if name.lower().endswith('.ff'):
                  base=name.rsplit('/',1)[-1]
                  low=base.lower()
                  tags=[]
                  for tag in ('gfx','common','patch','frontend','ui','mp','zm','code','load','menu'):
                      if tag in low: tags.append(tag)
                  rows.append({'path':name,'file':base,'compressedSize':csize,'uncompressedSize':usize,'method':method,'flags':flags,'crc32':f'{crc32:08x}','localHeaderOffset':lhoff,'nameTags':tags})
              o+=46+nlen+xlen+clen
          rows.sort(key=lambda x:x['path'].lower())
          manifest={
              'format':'t6-public-game-fastfile-inventory-v1',
              'remoteZip':{'url':url,'bytes':total,'etag':hdr.get('ETag') or hdr.get('etag'),'centralDirectoryBytes':cd_size,'centralDirectoryOffset':cd_off,'entryCount':entries},
              'fastFiles':rows,
              'summary':{
                  'fastFileCount':len(rows),
                  'allZoneCount':sum('/zone/all/' in ('/'+r['path'].lower()) for r in rows),
                  'localizedZoneCount':sum('/zone/english/' in ('/'+r['path'].lower()) for r in rows),
                  'gfxNamedCount':sum('gfx' in r['file'].lower() for r in rows),
                  'commonNamedCount':sum('common' in r['file'].lower() for r in rows),
                  'patchNamedCount':sum('patch' in r['file'].lower() for r in rows),
              },
              'proofBoundary':'Exact ZIP central-directory inventory for the referenced public full-game archive. This establishes archive entry names, compressed/uncompressed sizes, methods, flags, CRC32 and local-header offsets. It does not establish SHA-256 of individual FastFiles until their bytes are separately extracted and hashed, and it does not claim runtime load order or ownership.'
          }
          raw=json.dumps(manifest,indent=2,sort_keys=True)+'\n'
          Path('/tmp/proof/T6_PUBLIC_GAME_FASTFILE_INVENTORY_V1.json').write_text(raw)
          Path('/tmp/proof/fastfiles.txt').write_text(''.join(r['path']+'\n' for r in rows))
          candidates=[r for r in rows if any(k in r['file'].lower() for k in ('gfx','common','patch','frontend','ui'))]
          Path('/tmp/proof/renderer_startup_name_candidates.json').write_text(json.dumps(candidates,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest['summary'],indent=2,sort_keys=True))
          print('manifest_sha256',hashlib.sha256(raw.encode()).hexdigest())
          print('renderer/startup name candidates:')
          for r in candidates: print(r['path'])
          PY
      - name: Upload FastFile inventory
        uses: actions/upload-artifact@v4
        with:
          name: T6_PUBLIC_GAME_FASTFILE_INVENTORY_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
