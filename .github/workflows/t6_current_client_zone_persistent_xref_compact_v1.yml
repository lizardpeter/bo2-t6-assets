name: T6 current client zone persistent xref compact v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_zone_persistent_xref_compact_v1.py'
      - '.github/workflows/t6_current_client_zone_persistent_xref_compact_v1.yml'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Project exact instruction-backed xrefs
        shell: bash
        run: |
          set -euo pipefail; mkdir -p proof/current_client
          python3 tools/t6_current_client_zone_persistent_xref_compact_v1.py proof/current_client/T6_CURRENT_CLIENT_ZONE_PERSISTENT_GLOBAL_XREF_PROBE_V1.json --out proof/current_client/T6_CURRENT_CLIENT_ZONE_PERSISTENT_XREF_COMPACT_V1.json | tee /tmp/summary.log
          sha256sum proof/current_client/T6_CURRENT_CLIENT_ZONE_PERSISTENT_XREF_COMPACT_V1.json; git diff --check
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add proof/current_client/T6_CURRENT_CLIENT_ZONE_PERSISTENT_XREF_COMPACT_V1.json
          if ! git diff --cached --quiet; then git commit -m 'Persist compact exact current-client persistent xrefs'; git pull --rebase origin main; git push origin HEAD:main; fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_ZONE_PERSISTENT_XREF_COMPACT_V1
          path: |
            proof/current_client/T6_CURRENT_CLIENT_ZONE_PERSISTENT_XREF_COMPACT_V1.json
            /tmp/summary.log
          if-no-files-found: error
          compression-level: 9
