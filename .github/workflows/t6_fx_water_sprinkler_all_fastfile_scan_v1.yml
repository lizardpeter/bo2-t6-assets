name: T6 sprinkler FX all-FastFile exact-name scan v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_remote_zip_range_v1.py'
      - 'tools/t6_fastfile_expand_pc_v1.c'
      - '.github/workflows/t6_fx_water_sprinkler_all_fastfile_scan_v1.yml'
permissions:
  contents: write
jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build source-closed expander
        run: gcc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_expand -lcrypto -lz
      - name: Scan deterministic archive shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: '8'
          ZIP_URL: https://cdn.jordanlindsay.com.au/pluto_t6_full_game.zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof /tmp/work
          PYTHONPATH=tools python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          from t6_remote_zip_range_v1 import RemoteZip
          target=b'fx_water_fire_sprinkler_thin\x00'
          shard=int(os.environ['SHARD']); n=int(os.environ['SHARDS'])
          rz=RemoteZip(os.environ['ZIP_URL'],f'bo2-t6-sprinkler-fx/{shard}')
          entries,meta=rz.central_directory()
          ff=sorted([e for e in entries if e['name'].lower().endswith('.ff')],key=lambda e:e['name'].lower())
          selected=[(i,e) for i,e in enumerate(ff) if i%n==shard]
          rows=[]
          for local,(gi,e) in enumerate(selected):
              name=e['name']; fname=name.rsplit('/',1)[-1]; zone=fname[:-3]
              row={'globalIndex':gi,'shardIndex':local,'zipPath':name,'file':fname,'zoneName':zone,'zipCrc32':f"{e['crc32']:08x}",'zipUncompressedBytes':e['uncompressedSize']}
              ffp=pathlib.Path('/tmp/work')/f'{gi:03d}.ff'; exp=pathlib.Path('/tmp/work')/f'{gi:03d}.expanded'
              try:
                  raw=rz.extract(e,verify_crc=True)
                  row['fastFileBytes']=len(raw); row['fastFileSha256']=hashlib.sha256(raw).hexdigest(); ffp.write_bytes(raw)
                  p=subprocess.run(['/tmp/t6_expand',str(ffp),str(exp),zone],stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT)
                  row['expandRc']=p.returncode
                  if p.returncode!=0 or not exp.is_file():
                      row['status']='expand_failed'; row['exactNameOffsets']=[]
                  else:
                      data=exp.read_bytes(); offs=[]; start=0
                      while True:
                          at=data.find(target,start)
                          if at<0: break
                          offs.append(at); start=at+1
                      row.update(status='green',expandedBytes=len(data),expandedSha256=hashlib.sha256(data).hexdigest(),exactNameOffsets=offs)
              except Exception as exc:
                  row['status']='exception'; row['error']=repr(exc); row['exactNameOffsets']=[]
              finally:
                  ffp.unlink(missing_ok=True); exp.unlink(missing_ok=True)
              rows.append(row)
              print(gi,row['status'],fname,len(row['exactNameOffsets']),flush=True)
          doc={'format':'t6-sprinkler-fx-all-fastfile-scan-shard-v1','target':'fx_water_fire_sprinkler_thin','shard':shard,'shardCount':n,'archiveFastFileCount':len(ff),'remoteZip':meta,'rows':rows,'summary':{'selectedCount':len(rows),'green':sum(x['status']=='green' for x in rows),'failed':sum(x['status']!='green' for x in rows),'hitZoneCount':sum(bool(x['exactNameOffsets']) for x in rows)},'proofBoundary':'Exact null-terminated byte-name presence in successfully expanded FastFiles only; this is physical-source evidence, not typed FX ownership.'}
          pathlib.Path(f'/tmp/proof/T6_SPRINKLER_FX_ALL_FASTFILE_SCAN_SHARD_{shard}_V1.json').write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n')
          if doc['summary']['failed']: raise SystemExit('non-green rows in shard')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: T6_SPRINKLER_FX_ALL_FASTFILE_SCAN_SHARD_${{ matrix.shard }}_V1
          path: /tmp/proof
          if-no-files-found: error
  aggregate:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: T6_SPRINKLER_FX_ALL_FASTFILE_SCAN_SHARD_*_V1
          path: /tmp/shards
          merge-multiple: true
      - name: Aggregate complete 215-FastFile census
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json,pathlib
          fs=sorted(glob.glob('/tmp/shards/T6_SPRINKLER_FX_ALL_FASTFILE_SCAN_SHARD_*_V1.json'))
          if len(fs)!=8: raise SystemExit(f'expected 8 shards, got {len(fs)}')
          docs=[json.load(open(x)) for x in fs]; rows=[]
          for d in docs:
              if d.get('format')!='t6-sprinkler-fx-all-fastfile-scan-shard-v1': raise SystemExit('shard format drift')
              rows.extend(d['rows'])
          rows.sort(key=lambda x:x['globalIndex'])
          if len(rows)!=215 or [x['globalIndex'] for x in rows]!=list(range(215)): raise SystemExit('incomplete 215-FastFile coverage')
          bad=[x for x in rows if x['status']!='green']
          if bad: raise SystemExit(f'non-green rows: {[x["zipPath"] for x in bad[:20]]}')
          hits=[x for x in rows if x['exactNameOffsets']]
          doc={'format':'t6-sprinkler-fx-all-fastfile-scan-v1','target':'fx_water_fire_sprinkler_thin','remoteZip':docs[0]['remoteZip'],'summary':{'fastFileCount':215,'greenExpansionCount':215,'failedExpansionCount':0,'exactNameHitZoneCount':len(hits),'exactNameHitZones':[x['zipPath'] for x in hits]},'hits':hits,'rows':rows,'proofBoundary':'Complete exact null-terminated name census over the referenced 215-FastFile public archive. Every row is ZIP-CRC verified, SHA-256 pinned, and successfully expanded. A positive hit proves physical serialized-name presence only; typed FX ownership requires a separate native XAsset binding. A zero count is absence only from this archive universe.'}
          p=pathlib.Path('proof/T6_SPRINKLER_FX_ALL_FASTFILE_SCAN_V1.json'); p.write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n')
          print(json.dumps(doc['summary'],indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/T6_SPRINKLER_FX_ALL_FASTFILE_SCAN_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist complete sprinkler FX FastFile census'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_SPRINKLER_FX_ALL_FASTFILE_SCAN_V1
          path: proof/T6_SPRINKLER_FX_ALL_FASTFILE_SCAN_V1.json
          if-no-files-found: error
