# public-probe-run
name: T6 faction character ownership probe v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_fastfile_expand_pc_v1.c'
      - 'tools/t6_raw_xasset_inventory.py'
      - '.github/workflows/t6_faction_character_probe_v1.yml'
  pull_request:
    paths:
      - 'tools/t6_fastfile_expand_pc_v1.c'
      - 'tools/t6_raw_xasset_inventory.py'
      - '.github/workflows/t6_faction_character_probe_v1.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build exact retail T6 expander
        run: gcc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_expand -lcrypto -lz

      - name: Fetch and expand exact faction_cd_mp retail FastFile
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            -o /tmp/faction_cd_mp.ff \
            https://r2.houseofkublai.com/bo2/zone/all/faction_cd_mp.ff
          echo 'fe890c3336555998914280e47429a8f030baa507471f4e409363d79dd15505e3  /tmp/faction_cd_mp.ff' | sha256sum -c -
          /tmp/t6_expand /tmp/faction_cd_mp.ff /tmp/faction_cd_mp.expanded faction_cd_mp
          echo '29ef228c7aa1e3f012d40231021338a4f7a1922e6a1a0c26fc5b6b34b04798ac  /tmp/faction_cd_mp.expanded' | sha256sum -c -

      - name: Inventory exact XAsset front
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_raw_xasset_inventory.py \
            /tmp/faction_cd_mp.expanded \
            --out /tmp/faction_cd_mp_xasset_inventory.json
          cat /tmp/faction_cd_mp_xasset_inventory.json

      - name: Strict-scan faction XModels from exact expanded bytes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 - <<'PY'
          import json
          from pathlib import Path
          from t6_clipmap_normalize_v5 import parse_top_level_xasset_table, ASSET_TYPE_XMODEL
          from t6_clipmap_normalize_v6 import parse_xmodel_fixed, XMODEL_FIXED_SIZE
          from t6_clipmap_serialized_walker import ptr_kind
          from t6_xmodel_serialized_walker import XModelWalker

          data=Path('/tmp/faction_cd_mp.expanded').read_bytes()
          table=parse_top_level_xasset_table(data)
          top=[
              {
                  'assetIndex':e['index'],
                  'headerPointerRaw':f"0x{e['headerPointerRaw']:08X}",
                  'headerPointer':ptr_kind(e['headerPointerRaw']),
              }
              for e in table['entries'] if e['type']==ASSET_TYPE_XMODEL
          ]
          rows=[]
          pos=table['assetArrayRawEnd']
          limit=len(data)-XMODEL_FIXED_SIZE
          while pos<=limit:
              rec=parse_xmodel_fixed(data,pos,{})
              if rec is None or rec.get('nameSource')!='following':
                  pos+=1
                  continue
              try:
                  walk=XModelWalker(data,pos).walk_xmodel()
              except Exception:
                  pos+=1
                  continue
              if walk.get('blockers'):
                  pos+=1
                  continue
              rows.append({
                  'fixedSourceStart':pos,
                  'name':rec['name'],
                  'numBones':rec['numBones'],
                  'numRootBones':rec['numRootBones'],
                  'numSurfs':rec['numSurfs'],
                  'numLods':rec['numLods'],
                  'numCollSurfs':rec['numCollSurfs'],
                  'numCollmaps':rec['numCollmaps'],
                  'lods':rec['lods'],
                  'serializedEnd':walk.get('end'),
              })
              pos+=XMODEL_FIXED_SIZE

          report={
              'format':'t6-faction-cd-strict-xmodel-scan-v1',
              'topLevelXModelCount':len(top),
              'topLevelXModelEntries':top,
              'strictInlineXModelCount':len(rows),
              'strictInlineXModels':rows,
          }
          Path('/tmp/faction_cd_mp_xmodels.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          if len(top)!=10:
              raise SystemExit(f'expected 10 top-level XMODEL assets, got {len(top)}')
          if len(rows)<10:
              raise SystemExit(f'only recovered {len(rows)} strict inline XModels; packed-name follow-up required')
          PY

      - name: Preserve exact fixture for structure reversal
        uses: actions/upload-artifact@v4
        with:
          name: T6_FACTION_CD_CHARACTER_PROBE_V1
          path: |
            /tmp/faction_cd_mp.ff
            /tmp/faction_cd_mp.expanded
            /tmp/faction_cd_mp_xasset_inventory.json
            /tmp/faction_cd_mp_xmodels.json
          if-no-files-found: error
          compression-level: 9
