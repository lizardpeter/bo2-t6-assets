name: T6 Nuketown v7 production proof dispatch

on:
  push:
    branches:
      - nuketown-layered-runtime-projection-v2
    paths:
      - '.github/workflows/t6_nuketown_v7_render_state_stats_fix.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact production manifest v7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run t6_nuketown_production_material_manifest_v7.yml \
            --repo lizardpeter/bo2-t6-assets \
            --ref nuketown-layered-runtime-projection-v2
