name: T6 current client worldMatrix provider semantics v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_worldmatrix_provider_semantics_v1.py'
      - 'proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_CODE_MATRIX_GETTER_SEMANTICS_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_WORLD_MATRIX_WRITER_FUNCTIONS_V2.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_WORLD_MATRIX_HELPER_PROBE_V1.json'
      - '.github/workflows/t6_current_client_worldmatrix_provider_semantics_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove exhaustive base-zero worldMatrix provider
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_worldmatrix_provider_semantics_v1.py             --denominator proof/render/T6_RETAIL_SPECIAL_OMITTED_CODE_INPUT_STATIC_IDENTITY_V1.json             --getter proof/current_client/T6_CURRENT_CLIENT_CODE_MATRIX_GETTER_SEMANTICS_V1.json             --writers proof/current_client/T6_CURRENT_CLIENT_WORLD_MATRIX_WRITER_FUNCTIONS_V2.json             --helpers proof/current_client/T6_CURRENT_CLIENT_WORLD_MATRIX_HELPER_PROBE_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_WORLDMATRIX_PROVIDER_SEMANTICS_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_WORLDMATRIX_PROVIDER_SEMANTICS_V1.json'))
          s=d['summary']
          assert d['accessor']=='worldMatrix' and d['enumValue']==211 and d['occurrenceCount']==581
          assert s['currentClientProviderClosed'] is True
          assert s['writerFunctionCount']==10
          assert s['copy64RouteCount']==2
          assert s['helper64RouteCount']==5
          assert s['row4x16RouteCount']==3
          assert s['allWriterFunctionsPopulateBaseZeroMatrix'] is True
          assert s['allWriterFunctionsSynchronizeMatrixAndConstVersions'] is True
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_WORLDMATRIX_PROVIDER_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact worldMatrix provider semantics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_WORLDMATRIX_PROVIDER_SEMANTICS_V1
          path: proof/current_client/T6_CURRENT_CLIENT_WORLDMATRIX_PROVIDER_SEMANTICS_V1.json
          if-no-files-found: error
