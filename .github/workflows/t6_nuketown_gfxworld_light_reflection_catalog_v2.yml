name: T6 Nuketown GfxWorld lightmap reflection catalog v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/t6_nuketown_gfxworld_light_reflection_catalog_v2.yml'
      - 'tools/t6_gfxworld_lightmap_oat_patch/**'
      - 'tools/t6_gfxworld_reflection_probe_oat_patch/**'

concurrency:
  group: t6-nuketown-gfxworld-light-reflection-catalog-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned OpenAssetTools Unlinker with exact ownership dumpers
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-multilib >/dev/null
          git clone -q --recursive https://github.com/Laupetin/OpenAssetTools.git /tmp/oat
          git -C /tmp/oat checkout -q 7d027e8f89118196713e955b0e11f8404149c54d
          git -C /tmp/oat submodule update -q --init --recursive
          test "$(git -C /tmp/oat rev-parse HEAD)" = 7d027e8f89118196713e955b0e11f8404149c54d

          mkdir -p /tmp/oat/src/ObjWriting/Game/T6/GfxWorldLightmap
          mkdir -p /tmp/oat/src/ObjWriting/Game/T6/GfxWorldReflectionProbe
          cp tools/t6_gfxworld_lightmap_oat_patch/GfxWorldLightmapDumperT6.h /tmp/oat/src/ObjWriting/Game/T6/GfxWorldLightmap/
          cp tools/t6_gfxworld_lightmap_oat_patch/GfxWorldLightmapDumperT6.cpp /tmp/oat/src/ObjWriting/Game/T6/GfxWorldLightmap/
          cp tools/t6_gfxworld_reflection_probe_oat_patch/GfxWorldReflectionProbeDumperT6.h /tmp/oat/src/ObjWriting/Game/T6/GfxWorldReflectionProbe/
          cp tools/t6_gfxworld_reflection_probe_oat_patch/GfxWorldReflectionProbeDumperT6.cpp /tmp/oat/src/ObjWriting/Game/T6/GfxWorldReflectionProbe/

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/oat/src/ObjWriting/Game/T6/ObjWriterT6.cpp')
          s=p.read_text()
          inc='#include "Game/T6/XModel/XModelDumperT6.h"\n'
          add=inc+'#include "GfxWorldLightmap/GfxWorldLightmapDumperT6.h"\n#include "GfxWorldReflectionProbe/GfxWorldReflectionProbeDumperT6.h"\n'
          if s.count(inc)!=1: raise SystemExit('pinned ObjWriter include anchor drift')
          s=s.replace(inc,add,1)
          old='    // REGISTER_DUMPER(AssetDumperGfxWorld, m_gfx_world)\n'
          new=('    RegisterAssetDumper(std::make_unique<gfx_world_lightmap::DumperT6>());\n'
               '    RegisterAssetDumper(std::make_unique<gfx_world_reflection_probe::DumperT6>());\n')
          if s.count(old)!=1: raise SystemExit('pinned ObjWriter GfxWorld registration anchor drift')
          p.write_text(s.replace(old,new,1))
          PY

          cd /tmp/oat
          PREMAKE_NO_PROMPT=1 ./generate.sh
          make -C build -j2 config=release_x86 UnlinkerCli
          BIN=$(find /tmp/oat/build/bin -type f \( -name Unlinker -o -name unlinker \) | head -1)
          test -n "$BIN"
          printf '%s\n' "$BIN" >/tmp/unlinker_path.txt
          "$BIN" --version | tee /tmp/unlinker_version.txt
          sha256sum tools/t6_gfxworld_lightmap_oat_patch/GfxWorldLightmapDumperT6.* \
                    tools/t6_gfxworld_reflection_probe_oat_patch/GfxWorldReflectionProbeDumperT6.* \
                    | tee /tmp/patch_sha256.txt

      - name: Fetch exact retail zones
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/game/zone/all
          for f in mp_nuketown_2020.ff common_mp.ff common_patch_mp.ff patch_mp.ff; do
            curl -fL --retry 4 -o "/tmp/game/zone/all/$f" "https://r2.houseofkublai.com/bo2/zone/all/$f"
          done
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/game/zone/all/mp_nuketown_2020.ff' | sha256sum -c -
          echo '93fe48b0f0d8cc6844be875ccad94e0cfcf635f62eeff00ac33f2f668a77cb77  /tmp/game/zone/all/common_mp.ff' | sha256sum -c -
          echo '95622d93d4fb761db311a123cd073bed34ea48c9c711d2c11bce4170dd08bae9  /tmp/game/zone/all/common_patch_mp.ff' | sha256sum -c -
          echo '459077cda8e4a1457f7ee7d8f6c5e0abf30f41767a21ff6744df6a4307cbce1e  /tmp/game/zone/all/patch_mp.ff' | sha256sum -c -

      - name: Dump exact GfxWorld ownership catalogs
        shell: bash
        run: |
          set -euxo pipefail
          BIN=$(cat /tmp/unlinker_path.txt)
          mkdir -p /tmp/out /tmp/proof
          "$BIN" --no-color --skip-obj --include-assets gfxworld \
            --output-folder /tmp/out \
            --load /tmp/game/zone/all/common_mp.ff \
            --load /tmp/game/zone/all/common_patch_mp.ff \
            --load /tmp/game/zone/all/patch_mp.ff \
            /tmp/game/zone/all/mp_nuketown_2020.ff \
            2>&1 | tee /tmp/proof/unlinker_dump.log
          LM=$(find /tmp/out -type f -path '*/gfxworld_lightmaps/*' | head -1)
          RP=$(find /tmp/out -type f -path '*/gfxworld_reflection_probes/*' | head -1)
          test -n "$LM" -a -n "$RP"
          cp "$LM" /tmp/proof/T6_NUKETOWN_GFXWORLD_LIGHTMAP_CATALOG_V2.json
          cp "$RP" /tmp/proof/T6_NUKETOWN_GFXWORLD_REFLECTION_PROBE_CATALOG_V2.json

      - name: Fail-closed validate and summarize catalogs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,math
          from pathlib import Path
          lp=Path('/tmp/proof/T6_NUKETOWN_GFXWORLD_LIGHTMAP_CATALOG_V2.json')
          rp=Path('/tmp/proof/T6_NUKETOWN_GFXWORLD_REFLECTION_PROBE_CATALOG_V2.json')
          lm=json.loads(lp.read_text()); rr=json.loads(rp.read_text())
          assert lm['format']=='t6-gfxworld-lightmap-catalog-v1', lm.get('format')
          assert rr['format']=='t6-gfxworld-reflection-probe-catalog-v1', rr.get('format')
          assert lm['lightmapCount']==len(lm['lightmaps'])==2, lm.get('lightmapCount')
          assert rr['reflectionProbeCount']==len(rr['reflectionProbes']), rr.get('reflectionProbeCount')
          assert [x['index'] for x in lm['lightmaps']]==list(range(2))
          assert [x['index'] for x in rr['reflectionProbes']]==list(range(len(rr['reflectionProbes'])))
          def finite(v):
              if isinstance(v,(int,str,type(None),bool)): return True
              if isinstance(v,float): return math.isfinite(v)
              if isinstance(v,list): return all(finite(x) for x in v)
              if isinstance(v,dict): return all(finite(x) for x in v.values())
              return False
          assert finite(rr)
          for p in (lp,rp):
              b=p.read_bytes(); print(p.name,len(b),hashlib.sha256(b).hexdigest())
          refl=sorted({x.get('reflectionImage') for x in rr['reflectionProbes']}, key=lambda x:'' if x is None else x)
          summary={
              'lightmapCount':lm['lightmapCount'],
              'lightmapImages':sorted({y for x in lm['lightmaps'] for y in (x.get('primaryImage'),x.get('secondaryImage')) if y}),
              'reflectionProbeCount':rr['reflectionProbeCount'],
              'distinctNullableReflectionImageCount':len(refl),
              'reflectionImages':refl,
          }
          Path('/tmp/proof/T6_NUKETOWN_GFXWORLD_LIGHT_REFLECTION_SUMMARY_V2.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print('GREEN_LIGHT_REFLECTION_V2 '+json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_NUKETOWN_GFXWORLD_LIGHT_REFLECTION_CATALOG_V2
          path: |
            /tmp/proof
            /tmp/unlinker_version.txt
            /tmp/patch_sha256.txt
          if-no-files-found: error
