name: T6 Nuketown Material GfxImage root probe v1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_nuketown_material_gfximage_root_probe_v1.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned OAT
        id: oat-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug
      - name: Require exact tool and five roots
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.oat-cache.outputs.cache-hit }}" = true
          BIN=/tmp/oat-unlinker-cache/Unlinker; test -x "$BIN"; echo "$BIN" >/tmp/unlinker_path
          mkdir -p /tmp/source /tmp/proof
          for f in mp_nuketown_2020.ff common_mp.ff common_patch_mp.ff patch_mp.ff code_post_gfx_mp.ff; do curl -fL --retry 4 -o "/tmp/source/$f" "https://r2.houseofkublai.com/bo2/zone/all/$f"; done
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/source/mp_nuketown_2020.ff' | sha256sum -c -
          echo '93fe48b0f0d8cc6844be875ccad94e0cfcf635f62eeff00ac33f2f668a77cb77  /tmp/source/common_mp.ff' | sha256sum -c -
          echo '95622d93d4fb761db311a123cd073bed34ea48c9c711d2c11bce4170dd08bae9  /tmp/source/common_patch_mp.ff' | sha256sum -c -
          echo '459077cda8e4a1457f7ee7d8f6c5e0abf30f41767a21ff6744df6a4307cbce1e  /tmp/source/patch_mp.ff' | sha256sum -c -
          echo 'b7bce1dbe94692b1668ae9a1c83a4dcf008979ee5d5f79b3d2e619c23a1002b3  /tmp/source/code_post_gfx_mp.ff' | sha256sum -c -
      - name: Probe native image exports per root
        shell: bash
        run: |
          set -uo pipefail
          BIN=$(cat /tmp/unlinker_path); : >/tmp/proof/results.txt
          for spec in map=mp_nuketown_2020.ff common=common_mp.ff common_patch=common_patch_mp.ff patch=patch_mp.ff code_post=code_post_gfx_mp.ff; do
            label=${spec%%=*}; file=${spec#*=}; root=/tmp/image_$label; mkdir -p "$root"
            set +e; "$BIN" --no-color --verbose --include-assets image --output-folder "$root" "/tmp/source/$file" >"/tmp/proof/$label.log" 2>&1; rc=$?; set -e
            count=$(find "$root" -type f | wc -l); printf '%s rc=%s files=%s\n' "$label" "$rc" "$count" | tee -a /tmp/proof/results.txt
            find "$root" -type f -printf '%P\n' | sort >"/tmp/proof/${label}_files.txt"
          done
          cat /tmp/proof/results.txt
      - name: Persist bounded probe result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,hashlib
          roots={}
          for label in ['map','common','common_patch','patch','code_post']:
              log=pathlib.Path('/tmp/proof/'+label+'.log').read_text(errors='replace')
              files=pathlib.Path('/tmp/proof/'+label+'_files.txt').read_text().splitlines()
              line=next(x for x in pathlib.Path('/tmp/proof/results.txt').read_text().splitlines() if x.startswith(label+' '))
              roots[label]={'result':line,'files':files,'logTail':log.splitlines()[-80:]}
          d={'format':'t6-nuketown-material-gfximage-root-probe-v1','authority':'SHA-pinned five-root FastFiles + pinned OAT diagnostic only','roots':roots,'proofBoundary':'This inventories what pinned OAT emits for explicit image filtering. Filenames or emission alone are not promoted to production identity or payload ownership; any later join must be exact and independently validated.'}
          p=pathlib.Path('proof/T6_NUKETOWN_MATERIAL_GFXIMAGE_ROOT_PROBE_V1.json'); p.parent.mkdir(exist_ok=True); p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/T6_NUKETOWN_MATERIAL_GFXIMAGE_ROOT_PROBE_V1.json
          git commit -m 'Persist five-root Material GfxImage probe' || exit 0
          git pull --rebase origin main; git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_MATERIAL_GFXIMAGE_ROOT_PROBE_V1
          path: /tmp/proof
