name: nuketown-corrected-flat-preview-v2
on:
  push:
    branches: [base-ipak-r2-recovery]
    paths:
      - .github/workflows/nuketown-corrected-flat-preview-v2.yml
      - tools/t6_oat_static_texture_layout_probe.cpp
      - tools/t6_oat_external_static_texture_scan.py
      - tools/t6_nuketown_static_live_exact_texture_apply_v1.py
      - tools/t6_nuketown_validated_texture_preview_v1.py
      - tools/t6_nuketown_xmodel_material_slot_repair_v1.py
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install exact build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblzo2-2 g++-multilib gcc-multilib
          python -m pip install --disable-pip-version-check gdown pillow numpy

      - name: Rebuild exact frozen 5614-surface GfxWorld GLB
        run: |
          mkdir -p input
          gh run download 33940645863 -n nuketown-gfxworld-live-streams-v1 -D input
          test -s input/world_raw/gfxworld.surfaces.json
          test -s input/world_raw/gfxworld.vd0.bin
          test -s input/world_raw/gfxworld.vd1.bin
          test -s input/world_raw/gfxworld.indices.bin
          echo '7a5be06b14564a2dafd065d77204ff808e7cbbaac1ab0f06f1c6ef3f3e29ca76  input/world_raw/gfxworld.vd0.bin' | sha256sum -c -
          echo '77018ac13744f39244f29ce2c4cce0f0eb1204071a679654bd4eb67374537897  input/world_raw/gfxworld.vd1.bin' | sha256sum -c -
          echo '70344c3cfbc8eb12a2e29b37deb55b5767a33b5b97beb3681215bf393c346fa7  input/world_raw/gfxworld.indices.bin' | sha256sum -c -
          python tools/t6_world_vertex_audit_live_v1.py \
            --map mp_nuketown_2020 \
            --surfaces input/world_raw/gfxworld.surfaces.json \
            --vd0 input/world_raw/gfxworld.vd0.bin \
            --vd1 input/world_raw/gfxworld.vd1.bin \
            --out T6_NUKETOWN_WORLD_VERTEX_PROOF_LIVE_V1.json
          python tools/t6_world_mesh_normalize_v1.py \
            --surfaces input/world_raw/gfxworld.surfaces.json \
            --vd0 input/world_raw/gfxworld.vd0.bin \
            --vd1 input/world_raw/gfxworld.vd1.bin \
            --indices input/world_raw/gfxworld.indices.bin \
            --vertex-proof T6_NUKETOWN_WORLD_VERTEX_PROOF_LIVE_V1.json \
            --out mp_nuketown_2020.world_normalized_live_v1.json
          python tools/t6_world_gltf_export_v1.py \
            mp_nuketown_2020.world_normalized_live_v1.json \
            mp_nuketown_2020.GFXWORLD_FULL_GEOMETRY_LIVE_v1.glb
          test "$(stat -c %s mp_nuketown_2020.GFXWORLD_FULL_GEOMETRY_LIVE_v1.glb)" = "16387024"
          echo '4aee1bf27fbd75259da504350d6f5a2e2cf41512b44305cff2c9642e2e14bd02  mp_nuketown_2020.GFXWORLD_FULL_GEOMETRY_LIVE_v1.glb' | sha256sum -c -

      - name: Fetch map IPAK and build exact 171-image world bank
        run: |
          gdown 1c_1AtuWrwlcOuqYfh7R2w8lUxWH1jgCC -O mp_nuketown_2020.ipak
          test "$(stat -c %s mp_nuketown_2020.ipak)" = "165543936"
          echo '53269e39a9cba8c32a09a8ba56977c6483203d88a546cfc2fc66ec82fc383031  mp_nuketown_2020.ipak' | sha256sum -c -
          python tools/t6_nuketown_world_ipak_extract_v1.py \
            --manifest manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_TEXTURE_IDENTITIES_CANONICAL_V1.json.zlib.b64 \
            --census manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_MAP_IPAK_CENSUS_V1.json \
            --ipak mp_nuketown_2020.ipak \
            --out-dir world_map_texture_bank \
            --source-label mp_nuketown_2020.ipak \
            --expected 171
          python - <<'PY'
          import json
          d=json.load(open('world_map_texture_bank/TEXTURE_EXTRACTION_V1.json'))
          assert d['summary']['validatedPayloads']==171
          assert all(r['crc29Validated'] and r['dimensionsValidated'] for r in d['rows'])
          PY

      - name: Range-extract exact 185 additional base-IPAK world textures
        run: |
          python tools/t6_nuketown_world_base_ipak_extract_v1.py \
            --manifest manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_TEXTURE_IDENTITIES_CANONICAL_V1.json.zlib.b64 \
            --base-census manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_BASE_IPAK_CENSUS_V1.json \
            --map-census manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_MAP_IPAK_CENSUS_V1.json \
            --out-dir world_base_texture_bank \
            --expected 185
          python - <<'PY'
          import json
          d=json.load(open('world_base_texture_bank/TEXTURE_EXTRACTION_V1.json'))
          assert d['summary']['validatedPayloads']==185
          assert all(r['crc29Validated'] and r['dimensionsValidated'] for r in d['rows'])
          PY

      - name: Pin OAT, compile x86 layouts and fetch exact Nuketown FastFile
        run: |
          git clone --branch v0.33.0 --depth 1 https://github.com/Laupetin/OpenAssetTools.git oat-src
          test "$(git -C oat-src rev-parse HEAD)" = "7d027e8f89118196713e955b0e11f8404149c54d"
          g++ -m32 -std=c++23 -DARCH_x86 -Ioat-src/src/Common \
            tools/t6_oat_static_texture_layout_probe.cpp -o static-layout-probe
          g++ -m32 -std=c++23 -DARCH_x86 -Ioat-src/src/Common \
            tools/t6_oat_texture_layout_probe.cpp -o texture-layout-probe
          ./static-layout-probe > STATIC_TEXTURE_LAYOUT_X86_V1.json
          ./texture-layout-probe > T6_TEXTURE_LAYOUT_X86_V1.json
          gdown 1NuNJcsDBDwvIyaRDTLvYO4ySVWPeQYCh -O mp_nuketown_2020.ff
          test "$(stat -c %s mp_nuketown_2020.ff)" = "38472064"
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  mp_nuketown_2020.ff' | sha256sum -c -
          curl -L --fail --retry 3 -o oat-linux.tar.gz \
            https://github.com/Laupetin/OpenAssetTools/releases/download/v0.33.0/oat-linux.tar.gz
          echo 'aa0b80f633c50d656b26d28b4899fd76bd994024ff0c669303ed5db52cc9e864  oat-linux.tar.gz' | sha256sum -c -
          mkdir -p oat probe_out
          tar -xzf oat-linux.tar.gz -C oat
          UNLINKER=$(find oat -type f -name Unlinker | head -1)
          test -n "$UNLINKER"
          chmod +x "$UNLINKER"
          echo "$UNLINKER" > unlinker-path.txt

      - name: Freeze one retail runtime and recover placements plus exact static texture identities
        run: |
          UNLINKER=$(cat unlinker-path.txt)
          python tools/t6_oat_external_static_texture_scan.py \
            --world-layout STATIC_TEXTURE_LAYOUT_X86_V1.json \
            --texture-layout T6_TEXTURE_LAYOUT_X86_V1.json \
            --proof manifests/maps/mp_nuketown_2020/T6_NUKETOWN_PLAYABLE_STATIC_MATERIAL_PROOF_V2.json.zlib.b64 \
            --placements-out GFXWORLD_STATIC_PLACEMENTS_2992_V1.json \
            --out NUKETOWN_STATIC_TEXTURE_IDENTITIES_LIVE_V1.json \
            --diag NUKETOWN_STATIC_TEXTURE_IDENTITIES_LIVE_V1_DIAGNOSTICS.json \
            --timeout 30 \
            -- \
            "$UNLINKER" mp_nuketown_2020.ff --output-folder probe_out --model-format GLB --verbose
          test "$(find probe_out/model_export -type f -name '*_lod0.glb' | wc -l)" = "433"
          python - <<'PY'
          import json
          d=json.load(open('NUKETOWN_STATIC_TEXTURE_IDENTITIES_LIVE_V1.json'))
          p=json.load(open('GFXWORLD_STATIC_PLACEMENTS_2992_V1.json'))
          assert d['playableStaticModelCount']==297
          assert d['materialCount']==344
          assert d['validation']['all297XModelsResolved'] is True
          assert d['validation']['allLod0MaterialOrdersMatchRetainedProof'] is True
          assert p['smodelCount']==2992 and len(p['placements'])==2992
          print({'staticMaterials':d['materialCount'],'staticImages':d['uniqueImageCount'],'textureEntries':d['textureEntryCount'],'placements':len(p['placements'])})
          PY

      - name: Reproduce exact 1943 playable static placement partition
        run: |
          python - <<'PY'
          import base64,hashlib,json,zlib
          from pathlib import Path
          src=Path('GFXWORLD_STATIC_PLACEMENTS_2992_V1.json')
          world=json.loads(src.read_text())
          pp=Path('manifests/maps/mp_nuketown_2020/T6_NUKETOWN_PLAYABLE_STATIC_MATERIAL_PROOF_V2.json.zlib.b64')
          proof=json.loads(zlib.decompress(base64.b64decode(pp.read_text())).decode())
          names={r['xmodelName'] for r in proof['models']}
          assert len(names)==297 and len(proof['models'])==297
          assert len({m for r in proof['models'] for m in r['materials']})==344
          rows=[r for r in world['placements'] if r['model'] in names]
          assert len(rows)==2303 and {r['model'] for r in rows}==names
          out={'format':'t6-nuketown-playable-identity-placement-candidates-v1','sourcePlacementSha256':hashlib.sha256(src.read_bytes()).hexdigest(),'playableIdentityCount':297,'count':2303,'placements':rows}
          Path('NUKETOWN_PLAYABLE_IDENTITY_CANDIDATES_2303_V1.json').write_text(json.dumps(out,separators=(',',':'))+'\n')
          PY
          python tools/t6_nuketown_playable_static_bounds_filter_v1.py \
            --source NUKETOWN_PLAYABLE_IDENTITY_CANDIDATES_2303_V1.json \
            --selected-out NUKETOWN_PLAYABLE_STATIC_PLACEMENTS_1943_V1.json \
            --excluded-out NUKETOWN_PLAYABLE_STATIC_EXCLUDED_360_V1.json \
            --manifest-out NUKETOWN_PLAYABLE_STATIC_BOUNDS_FILTER_PROOF_V1.json \
            --half-extent 2500 --expected-source 2303 --expected-selected 1943 --expected-identities 297
          echo 'b04aea6f480fe3c6b38648f99bba7b6c43a8541903e9d813ebef18d77e1cd85b  NUKETOWN_PLAYABLE_STATIC_PLACEMENTS_1943_V1.json' | sha256sum -c -

      - name: Assemble exact raw 1943-static GLB
        run: |
          python tools/t6_nuketown_oat_static_scene_assemble_v1.py \
            --placements NUKETOWN_PLAYABLE_STATIC_PLACEMENTS_1943_V1.json \
            --proof manifests/maps/mp_nuketown_2020/T6_NUKETOWN_PLAYABLE_STATIC_MATERIAL_PROOF_V2.json.zlib.b64 \
            --model-dir probe_out/model_export \
            --out mp_nuketown_2020_PLAYABLE_STATIC_OAT_RECOVERED_v1.glb \
            --manifest NUKETOWN_PLAYABLE_STATIC_OAT_RECOVERED_V1.json \
            --expected 1943 --full-smodel-count 2992
          test "$(stat -c %s mp_nuketown_2020_PLAYABLE_STATIC_OAT_RECOVERED_v1.glb)" = "17263196"
          echo 'bc8f0c14518ccd15fabcdc0dd283dbecea410e0383c5057e4036ad1e95d8835b  mp_nuketown_2020_PLAYABLE_STATIC_OAT_RECOVERED_v1.glb' | sha256sum -c -

      - name: Restore exact XModel material slots before texture binding
        run: |
          python tools/t6_nuketown_xmodel_material_slot_repair_v1.py \
            --glb mp_nuketown_2020_PLAYABLE_STATIC_OAT_RECOVERED_v1.glb \
            --proof manifests/maps/mp_nuketown_2020/T6_NUKETOWN_PLAYABLE_STATIC_MATERIAL_PROOF_V1.json.zlib.b64 \
            --out mp_nuketown_2020_PLAYABLE_STATIC_REPAIRED_v2.glb \
            --manifest NUKETOWN_STATIC_SLOT_REPAIR_V2.json
          python - <<'PY'
          import json
          d=json.load(open('NUKETOWN_STATIC_SLOT_REPAIR_V2.json'))
          s=d['summary']
          assert s['repairedGenericSlots']==197,s
          assert s['affectedMeshes']==122,s
          assert s['affectedPlacedNodes']==593,s
          assert s['genericPrimitiveReferencesAfter']==0,s
          assert s['identityOnlyMaterialsCreated']==3,s
          print(s)
          PY

      - name: Bind exact live static textures from the map IPAK
        run: |
          python tools/t6_nuketown_static_live_exact_texture_apply_v1.py \
            --glb mp_nuketown_2020_PLAYABLE_STATIC_REPAIRED_v2.glb \
            --catalog NUKETOWN_STATIC_TEXTURE_IDENTITIES_LIVE_V1.json \
            --ipak mp_nuketown_2020.ipak \
            --out mp_nuketown_2020_PLAYABLE_STATIC_REPAIRED_TEXTURED_v2.glb \
            --manifest NUKETOWN_STATIC_LIVE_EXACT_TEXTURE_APPLY_V1.json
          python - <<'PY'
          import json
          d=json.load(open('NUKETOWN_STATIC_LIVE_EXACT_TEXTURE_APPLY_V1.json'))
          s=d['summary']
          assert s['promotionCount']>=310,s
          assert s['colorPromotions']>=137,s
          assert s['normalPromotions']>=173,s
          assert s['identityNormalBindings']>=84,s
          assert all(p['semantic']==2 for p in d['promotions'] if p['kind']=='color')
          assert all(p['semantic']==5 for p in d['promotions'] if p['kind']=='normal')
          print(s)
          PY

      - name: Assemble corrected flat world plus repaired/textured 1943 statics
        run: |
          python tools/t6_nuketown_validated_texture_preview_v1.py \
            --world mp_nuketown_2020.GFXWORLD_FULL_GEOMETRY_LIVE_v1.glb \
            --static mp_nuketown_2020_PLAYABLE_STATIC_REPAIRED_TEXTURED_v2.glb \
            --coverage manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_TEXTURE_COVERAGE_V1.json \
            --map-bank world_map_texture_bank \
            --base-bank world_base_texture_bank \
            --out mp_nuketown_2020_CORRECTED_FLAT_PREVIEW_v2.glb \
            --proof NUKETOWN_CORRECTED_FLAT_PREVIEW_V2.json

      - name: Independently validate corrected preview
        run: |
          python - <<'PY'
          import json,struct
          b=open('mp_nuketown_2020_CORRECTED_FLAT_PREVIEW_v2.glb','rb').read()
          magic,ver,total=struct.unpack_from('<4sII',b,0)
          assert magic==b'glTF' and ver==2 and total==len(b)
          n,t=struct.unpack_from('<I4s',b,12); assert t==b'JSON'
          g=json.loads(b[20:20+n].rstrip(b' \0'))
          p=json.load(open('NUKETOWN_CORRECTED_FLAT_PREVIEW_V2.json'))
          repair=json.load(open('NUKETOWN_STATIC_SLOT_REPAIR_V2.json'))
          tex=json.load(open('NUKETOWN_STATIC_LIVE_EXACT_TEXTURE_APPLY_V1.json'))
          assert p['worldPrimaryColorBound']==259
          assert p['worldPrimaryNormalBound']==300
          assert p['sceneTopLevelNodes']==2283
          assert p['flatHierarchy'] is True
          assert len(g['scenes'][0]['nodes'])==2283
          assert all('children' not in g['nodes'][i] for i in g['scenes'][0]['nodes'])
          assert repair['summary']['genericPrimitiveReferencesAfter']==0
          assert tex['summary']['promotionCount']>=310
          assert tex['validation']['semantic2OnlyBaseColor']=='pass'
          assert tex['validation']['semantic5OnlyNormal']=='pass'
          # Static mesh definitions are appended after the 340 world meshes. No referenced
          # static primitive may point at a retained material_surface_* placeholder.
          bad=[]
          for mesh in g.get('meshes',[])[340:]:
              for prim in mesh.get('primitives',[]):
                  mi=prim.get('material')
                  if isinstance(mi,int) and str(g['materials'][mi].get('name','')).startswith('material_surface_'):
                      bad.append((mesh.get('name'),mi,g['materials'][mi].get('name')))
          assert not bad,bad[:20]
          print(json.dumps({
            'bytes':len(b),
            'materials':len(g.get('materials',[])),
            'images':len(g.get('images',[])),
            'textures':len(g.get('textures',[])),
            'sceneTopLevelNodes':len(g['scenes'][0]['nodes']),
            'staticExactPromotions':tex['summary']['promotionCount'],
            'staticExactColors':tex['summary']['colorPromotions'],
            'staticExactNormals':tex['summary']['normalPromotions'],
            'slotRepairs':repair['summary']['repairedGenericSlots'],
          },indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nuketown-corrected-flat-preview-v2
          path: |
            mp_nuketown_2020_CORRECTED_FLAT_PREVIEW_v2.glb
            NUKETOWN_CORRECTED_FLAT_PREVIEW_V2.json
            NUKETOWN_STATIC_SLOT_REPAIR_V2.json
            NUKETOWN_STATIC_LIVE_EXACT_TEXTURE_APPLY_V1.json
            NUKETOWN_STATIC_TEXTURE_IDENTITIES_LIVE_V1.json
            NUKETOWN_STATIC_TEXTURE_IDENTITIES_LIVE_V1_DIAGNOSTICS.json
            GFXWORLD_STATIC_PLACEMENTS_2992_V1.json
          retention-days: 7
          compression-level: 0
