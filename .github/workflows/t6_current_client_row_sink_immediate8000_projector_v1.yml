name: T6 current client row sink immediate 8000 contexts v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_row_sink_immediate8000_projector_v1.py'
      - '.github/workflows/t6_current_client_row_sink_immediate8000_projector_v1.yml'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Project exact 0x8000 caller contexts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/current_client
          python3 tools/t6_current_client_row_sink_immediate8000_projector_v1.py             --source proof/current_client/T6_CURRENT_CLIENT_ZONE_ROW_SINK_PROBE_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_ROW_SINK_IMMEDIATE8000_CONTEXTS_V1.json             | tee /tmp/summary.log
          python3 - <<'PY'
          import json
          p='proof/current_client/T6_CURRENT_CLIENT_ROW_SINK_IMMEDIATE8000_CONTEXTS_V1.json'
          d=json.load(open(p))
          assert d['inboundDirectCallCount']==18
          assert d['sink']=='0x004174b0'
          PY
          sha256sum proof/current_client/T6_CURRENT_CLIENT_ROW_SINK_IMMEDIATE8000_CONTEXTS_V1.json
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_ROW_SINK_IMMEDIATE8000_CONTEXTS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist current-client row-sink 0x8000 contexts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_ROW_SINK_IMMEDIATE8000_CONTEXTS_V1
          path: |
            proof/current_client/T6_CURRENT_CLIENT_ROW_SINK_IMMEDIATE8000_CONTEXTS_V1.json
            /tmp/summary.log
          if-no-files-found: error
          compression-level: 9
