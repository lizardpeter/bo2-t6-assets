name: T6 Nuketown DLC0 IPAK stage v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_nuketown_dlc0_ipak_stage_v2.yml'
      - 'tools/t6_nuketown_shared_ipak_stage_v1.py'
      - 'tools/t6_ipak_http_range_v2.py'
      - 'manifests/maps/mp_nuketown_2020/T6_NUKETOWN_DLC0_IPAK_PACKED_IMAGE_ALIAS_CLOSURE_V3.json.zlib.b64'

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install LZO runtime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq liblzo2-2 >/dev/null
      - name: Materialize all 81 exact pointer-proven payloads
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/staged/payloads
          PYTHONPATH=tools python tools/t6_nuketown_shared_ipak_stage_v1.py \
            --census manifests/maps/mp_nuketown_2020/T6_NUKETOWN_DLC0_IPAK_PACKED_IMAGE_ALIAS_CLOSURE_V3.json.zlib.b64 \
            --out-dir /tmp/staged/payloads \
            --manifest /tmp/staged/T6_NUKETOWN_DLC0_IPAK_STAGED_PAYLOADS_V2.json \
            https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/dlc0.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/dlc0_load_mp.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/mp.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/base.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/patch_mp.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/so.ipak \
            https://r2.houseofkublai.com/bo2/zone/english/en_base.ipak
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/staged/T6_NUKETOWN_DLC0_IPAK_STAGED_PAYLOADS_V2.json'); d=json.loads(p.read_text()); s=d['summary']
          assert s['aliasCount']==81 and s['resolvedAliasCount']==81 and s['unresolvedAliasCount']==0 and s['uniquePayloadCount']==81,s
          files=sorted(Path('/tmp/staged/payloads').glob('*.iwi')); assert len(files)==81,len(files)
          for r in d['payloads']:
            f=Path('/tmp/staged')/r['file']; assert f.is_file(); assert hashlib.sha256(f.read_bytes()).hexdigest()==r['sha256']
          print('MANIFEST_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          print('PAYLOAD_FILE_COUNT',len(files))
          print('PAYLOAD_BYTES',sum(x.stat().st_size for x in files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t6-nuketown-dlc0-ipak-staged-payloads-v2
          path: /tmp/staged
          if-no-files-found: error
          compression-level: 0
