name: T6 Nuketown reflection inline payload probe v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_nuketown_reflection_inline_payload_probe_v1.py'
      - '.github/workflows/t6_nuketown_reflection_inline_payload_probe_v1.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact expanded retail map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source proof
          curl -fL --retry 4 -o /tmp/source/map.ff https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/source/map.ff' | sha256sum -c -
          cc -O2 -Wall -Wextra -o /tmp/expand tools/t6_fastfile_expand_pc_v1.c -lz -lcrypto
          /tmp/expand /tmp/source/map.ff /tmp/source/map.expanded mp_nuketown_2020
      - name: Probe exact reflection identities
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_nuketown_reflection_inline_payload_probe_v1.py --expanded /tmp/source/map.expanded --catalog manifests/maps/mp_nuketown_2020/T6_NUKETOWN_GFXWORLD_REFLECTION_PROBE_CATALOG_V3.json --out proof/T6_NUKETOWN_REFLECTION_INLINE_PAYLOAD_PROBE_V1.json
          python3 - <<'PY'
          import json
          j=json.load(open('proof/T6_NUKETOWN_REFLECTION_INLINE_PAYLOAD_PROBE_V1.json'));s=j['summary']
          assert s['identityCount']==25
          assert len(j['rows'])==25
          # Discovery is allowed to retain unresolved rows; promotion is a later transaction.
          for r in j['rows']:
              assert r['image']==f"*reflection_probe{r['index']}"
              for c in r['candidates']:
                  if c.get('inline'):
                      assert c['resourceSize']>=0 and len(c['payloadSha256'])==64
          PY
          git diff --check
      - name: Persist discovery proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/T6_NUKETOWN_REFLECTION_INLINE_PAYLOAD_PROBE_V1.json
          git commit -m 'Persist retail reflection inline payload probe'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_REFLECTION_INLINE_PAYLOAD_PROBE_V1
          path: proof/T6_NUKETOWN_REFLECTION_INLINE_PAYLOAD_PROBE_V1.json
          if-no-files-found: error
