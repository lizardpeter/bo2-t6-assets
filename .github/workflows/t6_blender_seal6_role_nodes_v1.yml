name: T6 Blender SEAL6 role nodes v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_seal6_blender_role_plan_v1.py'
      - 'tools/test_t6_seal6_blender_role_plan_v1.py'
      - 'tools/t6_blender_seal6_role_nodes_v1.py'
      - 'tools/test_t6_blender_seal6_role_nodes_v1.py'
      - '.github/workflows/t6_blender_seal6_role_nodes_v1.yml'

permissions:
  contents: read

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test pure-data role planner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/t6_seal6_blender_role_plan_v1.py \
            tools/t6_blender_seal6_role_nodes_v1.py
          PYTHONPATH=tools python3 tools/test_t6_seal6_blender_role_plan_v1.py

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender >/dev/null
          blender --version | head -3

      - name: Compile five role-complete SEAL6 node graphs in Blender
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools blender --background \
            --python tools/test_t6_blender_seal6_role_nodes_v1.py \
            2>&1 | tee /tmp/blender_seal6_role_nodes_v1_test.log
          grep -F 'T6_BLENDER_SEAL6_ROLE_NODES_V1_TEST=' /tmp/blender_seal6_role_nodes_v1_test.log
          test -s /tmp/T6_BLENDER_SEAL6_ROLE_NODES_V1_TEST.blend
          test -s /tmp/T6_BLENDER_SEAL6_ROLE_NODES_V1_TEST.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/T6_BLENDER_SEAL6_ROLE_NODES_V1_TEST.json',encoding='utf-8'))
          assert d['summary']['materialsCompiled']==5
          assert d['summary']['nativeSlotsCompiled']==20
          assert d['summary']['uniqueExactPngImagesLoaded']==20
          assert d['summary']['allNativeInputsRepresented'] is True
          assert d['summary']['completeRetailPixelOutput'] is False
          assert d['sourceNodeCount']==20
          assert d['previewBaseColorLinkCount']==5
          assert d['previewNormalSourceLinkCount']==5
          print(json.dumps(d,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: T6_BLENDER_SEAL6_ROLE_NODES_V1_TEST
          path: |
            /tmp/T6_BLENDER_SEAL6_ROLE_NODES_V1_TEST.blend
            /tmp/T6_BLENDER_SEAL6_ROLE_NODES_V1_TEST.json
            /tmp/blender_seal6_role_nodes_v1_test.log
          if-no-files-found: error
          compression-level: 0
