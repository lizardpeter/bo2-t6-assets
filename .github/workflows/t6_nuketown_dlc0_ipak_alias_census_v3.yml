name: T6 Nuketown DLC0 IPAK alias census v3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_nuketown_dlc0_ipak_alias_census_v3.yml'
      - 'tools/t6_nuketown_shared_ipak_alias_census_v2.py'
      - 'tools/t6_ipak_http_range_v2.py'
      - 'manifests/maps/mp_nuketown_2020/NUKETOWN_PACKED_IMAGE_CROSSFAMILY_ALIAS_BANK_V1.json.zlib.b64'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install LZO runtime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq liblzo2-2 >/dev/null
      - name: Verify Nuketown depot DLC0 IPAKs on R2
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=tools python tools/t6_ipak_http_range_v2.py info https://r2.houseofkublai.com/bo2/zone/all/dlc0.ipak | tee /tmp/dlc0_info.json
          PYTHONPATH=tools python tools/t6_ipak_http_range_v2.py info https://r2.houseofkublai.com/bo2/zone/all/dlc0_load_mp.ipak | tee /tmp/dlc0_load_mp_info.json
      - name: Rerun pointer-proven image census with exact Nuketown DLC0 containers
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=tools python tools/t6_nuketown_shared_ipak_alias_census_v2.py \
            --alias-bank manifests/maps/mp_nuketown_2020/NUKETOWN_PACKED_IMAGE_CROSSFAMILY_ALIAS_BANK_V1.json.zlib.b64 \
            --out /tmp/T6_NUKETOWN_DLC0_IPAK_PACKED_IMAGE_ALIAS_CENSUS_V3.json \
            https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/dlc0.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/dlc0_load_mp.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/mp.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/base.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/patch_mp.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/so.ipak \
            https://r2.houseofkublai.com/bo2/zone/english/en_base.ipak
          python - <<'PY'
          import json
          d=json.load(open('/tmp/T6_NUKETOWN_DLC0_IPAK_PACKED_IMAGE_ALIAS_CENSUS_V3.json'))
          print('SUMMARY',json.dumps(d['summary'],sort_keys=True))
          print('CONTAINER_USE',json.dumps(d['containerUse'],sort_keys=True))
          print('FAILURES',json.dumps(d['failures'],sort_keys=True))
          for r in d['aliases']:
            if r['aliasIndex'] in {1,10,67,72,73,74,76}:
              print('TARGET',r['aliasIndex'],r['name'],r['status'],r['resolution'],r['payloadSha256'],[(m['container'],m['entry']['dataHash'],m['entry']['nameHash']) for m in r['matches']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t6-nuketown-dlc0-ipak-alias-census-v3
          path: |
            /tmp/T6_NUKETOWN_DLC0_IPAK_PACKED_IMAGE_ALIAS_CENSUS_V3.json
            /tmp/dlc0_info.json
            /tmp/dlc0_load_mp_info.json
          if-no-files-found: error
