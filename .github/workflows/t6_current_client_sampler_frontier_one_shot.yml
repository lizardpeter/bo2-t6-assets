name: T6 current client sampler frontier one-shot

on:
  push:
    paths:
      - '.github/workflows/t6_current_client_sampler_frontier_one_shot.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install exact probe dependency
        run: python -m pip install --disable-pip-version-check capstone

      - name: Fetch exact SHA-pinned current client
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6 proof/current_client
          python tools/t6_current_client_fetch_exact_v1.py             --out-exe /tmp/t6/t6mp.exe             --out-identity /tmp/t6/T6_CURRENT_CLIENT_EXACT_FETCH_IDENTITY_V1.json
          sha256sum /tmp/t6/t6mp.exe

      - name: Run exact sampler frontier probes
        run: |
          set -euo pipefail
          REVISION=$(python - <<'PY'
          import json
          p='/tmp/t6/T6_CURRENT_CLIENT_EXACT_FETCH_IDENTITY_V1.json'
          d=json.load(open(p))
          print(d.get('observedCdnRevision','transport-metadata-unpinned'))
          PY
          )
          python tools/t6_current_client_primary_lightmap_sampler_callers_v1.py             /tmp/t6/t6mp.exe             --revision "$REVISION"             --out proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_SAMPLER_CALLERS_V1.json
          python tools/t6_current_client_code_sampler_dispatchers_v1.py             /tmp/t6/t6mp.exe             --revision "$REVISION"             --out proof/current_client/T6_CURRENT_CLIENT_CODE_SAMPLER_DISPATCHERS_V1.json
          cp /tmp/t6/T6_CURRENT_CLIENT_EXACT_FETCH_IDENTITY_V1.json             proof/current_client/T6_CURRENT_CLIENT_EXACT_FETCH_IDENTITY_V1.json

      - name: Commit retained exact proof
        run: |
          set -euo pipefail
          git config user.name "uregraph-re-bot"
          git config user.email "uregraph-re-bot@users.noreply.github.com"
          git add             proof/current_client/T6_CURRENT_CLIENT_EXACT_FETCH_IDENTITY_V1.json             proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_SAMPLER_CALLERS_V1.json             proof/current_client/T6_CURRENT_CLIENT_CODE_SAMPLER_DISPATCHERS_V1.json
          if git diff --cached --quiet; then
            echo "No proof changes to commit."
          else
            git commit -m "Run exact T6 current-client sampler frontier probes"
            git push
          fi

      - name: Upload exact probe bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_SAMPLER_FRONTIER_ONE_SHOT
          path: |
            proof/current_client/T6_CURRENT_CLIENT_EXACT_FETCH_IDENTITY_V1.json
            proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_SAMPLER_CALLERS_V1.json
            proof/current_client/T6_CURRENT_CLIENT_CODE_SAMPLER_DISPATCHERS_V1.json
          if-no-files-found: error
          compression-level: 9
