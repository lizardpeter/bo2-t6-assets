name: T6 inspect static resolver

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_inspect_static_resolver.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract retained car02 pointer evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, pathlib, zlib

          root = pathlib.Path('.')
          src = root/'tools/t6_nuketown_static_material_alias_resolve_v3.py.zlib.b64'
          resolver = zlib.decompress(base64.b64decode(src.read_text().strip()))
          pathlib.Path('/tmp/resolver.py').write_bytes(resolver)

          targets = {12967476, 12967480}
          report = {
              'format': 't6-nuketown-car02-retained-pointer-evidence-v1',
              'resolverBytes': len(resolver),
              'resolverSha256': hashlib.sha256(resolver).hexdigest(),
              'targets': sorted(targets),
              'matches': [],
              'sources': [],
          }

          paths = [
              root/'manifests/maps/mp_nuketown_2020/T6_NUKETOWN_STATIC_MATERIAL_ALIAS_CLOSURE_V3.json.zlib.b64',
              root/'manifests/maps/mp_nuketown_2020/T6_NUKETOWN_STATIC_MATERIAL_ALIAS_CLOSURE_V2.json.zlib.b64',
              root/'manifests/maps/mp_nuketown_2020/T6_NUKETOWN_STATIC_MATERIAL_ALIAS_CLOSURE_V1.json.zlib.b64',
              root/'manifests/maps/mp_nuketown_2020/T6_NUKETOWN_PLAYABLE_STATIC_MATERIAL_PROOF_V1.json.zlib.b64',
              root/'manifests/maps/mp_nuketown_2020/T6_NUKETOWN_CAR_MATERIAL_ALIAS_PROOF_V1.json',
          ]

          def numeric(value):
              if isinstance(value, bool): return None
              if isinstance(value, int): return value
              if isinstance(value, str):
                  try: return int(value, 0)
                  except Exception: return None
              return None

          def walk(node, source, path='$'):
              if isinstance(node, dict):
                  nums = [(k, numeric(v)) for k,v in node.items()]
                  hit_targets = [(k,v) for k,v in nums if v in targets]
                  xa = numeric(node.get('xassetIndex'))
                  name = node.get('name') or node.get('xmodelName') or node.get('modelName') or node.get('material')
                  if hit_targets or xa == 162 or name == 'nt_2020_car_02':
                      report['matches'].append({
                          'source': source,
                          'jsonPath': path,
                          'reason': {
                              'targetFields': [{'field':k,'value':v} for k,v in hit_targets],
                              'xasset162': xa == 162,
                              'ownerName': name == 'nt_2020_car_02',
                          },
                          'record': node,
                      })
                  for k,v in node.items(): walk(v, source, f'{path}.{k}')
              elif isinstance(node, list):
                  for i,v in enumerate(node): walk(v, source, f'{path}[{i}]')

          for p in paths:
              if not p.exists():
                  continue
              if p.suffix == '.json':
                  raw = p.read_bytes()
              else:
                  raw = zlib.decompress(base64.b64decode(p.read_bytes().strip()))
              obj = json.loads(raw)
              report['sources'].append({
                  'file': str(p),
                  'format': obj.get('format') if isinstance(obj, dict) else None,
                  'rawBytes': len(raw),
                  'rawSha256': hashlib.sha256(raw).hexdigest(),
              })
              walk(obj, str(p))

          # Preserve the exact resolver lines that define material-handle array
          # and inline-Material cursor treatment. This is evidence only; no
          # material identity is inferred from nearby source strings.
          lines = resolver.decode('utf-8').splitlines()
          report['resolverRelevantLines'] = [
              {'line': i + 1, 'text': line}
              for i, line in enumerate(lines)
              if any(token in line for token in (
                  'materialHandles', 'handle_base', 'handleBase',
                  'FOLLOWING', 'INSERT', 'prefix_to_material',
                  'inline_material', 'inlineMaterial', 'virtual_cursor',
              ))
          ]

          pathlib.Path('/tmp/car02_pointer_evidence.json').write_text(
              json.dumps(report, indent=2, sort_keys=True, default=str) + '\n'
          )
          print('MATCH_COUNT', len(report['matches']))
          for row in report['matches']:
              print('MATCH', json.dumps(row, sort_keys=True, default=str))
          print('RESOLVER_RELEVANT', json.dumps(report['resolverRelevantLines'], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_CAR02_RETAINED_POINTER_EVIDENCE_V1
          path: /tmp/car02_pointer_evidence.json
          if-no-files-found: error
