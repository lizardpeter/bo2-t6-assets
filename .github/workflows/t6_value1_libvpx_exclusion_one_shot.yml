name: T6 value1 libvpx exclusion one-shot

on:
  push:
    paths:
      - '.github/workflows/t6_value1_libvpx_exclusion_one_shot.yml'

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Join retained exact proofs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_primary_lightmap_value1_libvpx_exclusion_v1.py             --decoder-proof proof/current_client/T6_CURRENT_CLIENT_9B59F0_LIBVPX_VP8_DECODER_IDENTITY_V1.json             --owner-proof proof/current_client/T6_CURRENT_CLIENT_WRITER_9C2A88_OWNER_STACK_SLOT_V2.json             --field-proof proof/current_client/T6_CURRENT_CLIENT_WRITER_9C2A88_CALLER_OWNER_FIELD_V1.json             --path-proof proof/current_client/T6_CURRENT_CLIENT_WRITER_9C2A88_PATH_SENSITIVE_ARG1_V3.json             --writer2-proof proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_WRITER_9C2A88_BASE_EXPRESSION_V1.json             --writer1-proof proof/current_client/T6_CURRENT_CLIENT_WRITER_9C1DBB_LIVEIN_EBX_V1.json             --writers-proof proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_CONSTANT_WRITER_BASE_PROVENANCE_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_VALUE1_LIBVPX_EXCLUSION_V1.json
          python3 - <<'PY'
          import json
          p='proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_VALUE1_LIBVPX_EXCLUSION_V1.json'
          d=json.load(open(p))
          assert d['summary']['excludedWriterVAs']==['0x009C1DBB','0x009C2A88']
          assert d['summary']['rendererSourceStateOccurrenceAccepted'] is False
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name uregraph-re-bot
          git config user.email uregraph-re-bot@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_VALUE1_LIBVPX_EXCLUSION_V1.json
          if ! git diff --cached --quiet; then
            git commit -m "Exclude T6 value-1 lightmap overlaps as libvpx decoder path"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_PRIMARY_LIGHTMAP_VALUE1_LIBVPX_EXCLUSION_V1
          path: proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_VALUE1_LIBVPX_EXCLUSION_V1.json
          if-no-files-found: error
