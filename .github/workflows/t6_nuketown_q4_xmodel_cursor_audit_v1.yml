name: T6 Nuketown q4 XModel cursor audit v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_nuketown_q4_xmodel_cursor_audit_v1.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Expand exact retail Nuketown
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 -o /tmp/map.ff https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          gcc -O2 tools/t6_fastfile_expand_pc_v1.c -o /tmp/expand -lz -lcrypto
          /tmp/expand /tmp/map.ff /tmp/map.expanded mp_nuketown_2020
          echo '7e791fb90a085f3bff9e0df895e5a232fa91cc43bcd0027225fe811f7891d505  /tmp/map.expanded' | sha256sum -c -
      - name: Audit q4 full retail structure and immediate tail
        shell: bash
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json,struct,hashlib
          from pathlib import Path
          from t6_xmodel_serialized_walker import XModelWalker
          from t6_material_techset_top_level_walk_v1 import Cursor
          import t6_retail_world_formats_45_proof_v1 as h

          d=Path('/tmp/map.expanded').read_bytes(); blocks,assets=h.front(d)
          q3=Cursor(d,125632,blocks).techset(); assert q3['end']==499456
          w=XModelWalker(d,499456).walk_xmodel(); assert not w['blockers'],w['blockers']
          e=int(w['assetSerializedEnd'])
          def okptr(v):
            if v in (0,0xffffffff,0xfffffffe): return True
            try: k,b,o=h.dec(v,blocks); return k=='packed'
            except Exception: return False
          cand=[]
          for p in range(e,580597-152+1):
            if d[p+4]>8 or d[p+5:p+8]!=b'\0\0\0': continue
            namep=struct.unpack_from('<I',d,p)[0]
            if not okptr(namep): continue
            refs=struct.unpack_from('<36I',d,p+8)
            if not all(okptr(v) for v in refs): continue
            nn=[v for v in refs if v]
            if not nn: continue
            cand.append({'sourceOffset':p,'nameRaw':f'0x{namep:08X}','worldVertFormat':d[p+4],
                         'nonNullTechniqueRefs':len(nn),
                         'followingRefs':sum(v==0xffffffff for v in refs),
                         'insertRefs':sum(v==0xfffffffe for v in refs),
                         'packedRefs':sum(v not in (0,0xffffffff,0xfffffffe) for v in refs)})
          out={
            'format':'t6-nuketown-q4-xmodel-cursor-audit-v1',
            'expandedSha256':hashlib.sha256(d).hexdigest(),
            'q3':{'sourceStart':125632,'sourceEnd':q3['end'],'name':q3.get('name')},
            'q4':{
              'sourceStart':499456,'customWalkerSourceEnd':e,
              'serializedBytes':w['assetSerializedBytes'],'xmodel':w['xmodel'],
              'details':w.get('details',{}),'sections':w['sections']},
            'tail':{'hex256':d[e:e+256].hex(),'ascii4096':d[e:e+4096].decode('latin1','replace')},
            'strongTechniqueSetCandidatesUntil580597':cand,
          }
          p=Path('manifests/maps/mp_nuketown_2020/q4_xmodel_source_cursor_audit_v1.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('Q4',out['q4']['xmodel'].get('name'),'END',e,'CANDIDATES',len(cand))
          PY
      - name: Persist audit manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/maps/mp_nuketown_2020/q4_xmodel_source_cursor_audit_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record exact Nuketown q4 XModel source cursor audit'
          git push
