name: T6 current-client character XAsset loader v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_current_client_character_xasset_loader_v1.yml'
      - 'tools/ghidra_scripts/ExportT6CurrentClientBatch.java'
      - 'tools/t6_current_client_fetch_exact_v1.py'

permissions:
  contents: write

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  CLIENT_SHA256: 770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf
  GHIDRA_CACHE_KEY: t6-current-client-ghidra-12.1.3-77031817-v1

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -o /tmp/ghidra.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Restore analyzed current-client project
        id: ghidra-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-ghidra/projects
          key: ${{ env.GHIDRA_CACHE_KEY }}

      - name: Recover exact client and import only if cache is absent
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/client /tmp/t6-ghidra/projects /tmp/t6-ghidra/config /tmp/t6-ghidra/cache
          python3 tools/t6_current_client_fetch_exact_v1.py \
            --out-exe /tmp/client/t6mp.exe \
            --out-identity /tmp/client/identity.json
          echo "$CLIENT_SHA256  /tmp/client/t6mp.exe" | sha256sum --check
          export XDG_CONFIG_HOME=/tmp/t6-ghidra/config
          export XDG_CACHE_HOME=/tmp/t6-ghidra/cache
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/t6-ghidra/projects t6-current-client \
            -import /tmp/client/t6mp.exe -overwrite \
            -preScript ConfigureT6CurrentClientAnalysis.java \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" \
            -analysisTimeoutPerFile 2400 -max-cpu 4

      - name: Save project cache on miss
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/t6-ghidra/projects
          key: ${{ env.GHIDRA_CACHE_KEY }}

      - name: Select exact XAsset loader functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-character-xasset/batch
          cat > /tmp/t6-character-xasset/selection.tsv <<'EOF'
          function_id	requested_va	tier	source
          urn:ure:t6:character-xasset:DB_GetXAssetTypeSize	name:DB_GetXAssetTypeSize	target	current-client-pdb-symbol
          urn:ure:t6:character-xasset:DB_GetXAssetName	name:DB_GetXAssetName	target	current-client-pdb-symbol
          urn:ure:t6:character-xasset:DB_SetXAssetName	name:DB_SetXAssetName	target	current-client-pdb-symbol
          urn:ure:t6:character-xasset:Load_XAssetHeader	name:Load_XAssetHeader	target	current-client-pdb-symbol
          urn:ure:t6:character-xasset:Load_XAsset	name:Load_XAsset	target	current-client-pdb-symbol
          EOF
          sed -i 's/^          //' /tmp/t6-character-xasset/selection.tsv

      - name: Export exact current-client loader evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-ghidra/config /tmp/t6-ghidra/cache
          export XDG_CONFIG_HOME=/tmp/t6-ghidra/config
          export XDG_CACHE_HOME=/tmp/t6-ghidra/cache
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/t6-ghidra/projects t6-current-client \
            -process t6mp.exe -noanalysis -readOnly \
            -postScript ExportT6CurrentClientBatch.java \
              /tmp/t6-character-xasset/selection.tsv /tmp/t6-character-xasset/batch 120 \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 4
          cat /tmp/t6-character-xasset/batch/results.tsv

      - name: Retain source-closed proof boundary
        shell: bash
        run: |
          set -euo pipefail
          OUT=proof/current_client/character_xasset_loader_v1
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp /tmp/t6-character-xasset/selection.tsv "$OUT/selection.tsv"
          cp /tmp/t6-character-xasset/batch/results.tsv "$OUT/results.tsv"
          cp /tmp/t6-character-xasset/batch/references.tsv "$OUT/references.tsv"
          cp -a /tmp/t6-character-xasset/batch/unreviewed "$OUT/"
          cp -a /tmp/t6-character-xasset/batch/disassembly "$OUT/"
          python3 - <<'PY'
          import csv,json,pathlib
          out=pathlib.Path('proof/current_client/character_xasset_loader_v1')
          rows=list(csv.DictReader((out/'results.tsv').open(encoding='utf-8',newline=''),dialect='excel-tab'))
          summary={
            'format':'t6-current-client-character-xasset-loader-v1',
            'clientSha256':'770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf',
            'targets':len(rows),
            'foundExact':sum(r['found_exact']=='true' for r in rows),
            'decompileCompleted':sum(r['decompile_completed']=='true' for r in rows),
            'proofBoundary':'Exact current-client addresses and instruction listings. Ghidra C is generated/unreviewed evidence. Types 35-40 may be promoted only from the client loader/handler behavior actually present in this SHA-pinned executable.',
          }
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          if summary['foundExact'] != summary['targets']:
              raise SystemExit('one or more exact target functions were not present')
          print(json.dumps(summary,indent=2))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m 'Persist current-client character XAsset loader proof'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
