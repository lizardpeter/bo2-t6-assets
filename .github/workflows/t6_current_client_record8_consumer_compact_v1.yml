name: T6 current client record8 consumer compact v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_record8_consumer_compact_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_RENDER_TARGET_RECORD8_FIRST_DWORD_CONSUMERS_V1.json'
      - '.github/workflows/t6_current_client_record8_consumer_compact_v1.yml'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reduce exact consumer neighborhoods
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_record8_consumer_compact_v1.py             --source proof/current_client/T6_CURRENT_CLIENT_RENDER_TARGET_RECORD8_FIRST_DWORD_CONSUMERS_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_RECORD8_CONSUMER_COMPACT_V1.json
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_RECORD8_CONSUMER_COMPACT_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist compact record-8 consumers'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_RECORD8_CONSUMER_COMPACT_V1
          path: proof/current_client/T6_CURRENT_CLIENT_RECORD8_CONSUMER_COMPACT_V1.json
          if-no-files-found: error
