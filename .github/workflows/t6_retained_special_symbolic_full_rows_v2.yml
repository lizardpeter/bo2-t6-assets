name: T6 retained special symbolic full rows v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_retained_special_symbolic_full_rows_v2.yml'
      - 'tools/t6_retail_special_shdr_symbolic_v1.py'
      - 'tools/t6_retail_special_shdr_branch_symbolic_v1.py'
      - 'tools/t6_retail_special_shdr_opcode_census_v1.py'
      - 'tools/t6_retail_special_shdr_operand_census_v1.py'
      - 'tools/t6_retail_special_shader_payload_census_v1.py'
      - 'tools/t6_retail_world_formats_45_proof_v1.py'
      - 'tools/t6_fastfile_expand_pc_v1.c'
      - 'manifests/render/T6_RETAIL_SPECIAL_SHDR_SYMBOLIC_V1.json'
      - 'manifests/render/T6_RETAIL_SPECIAL_SHDR_BRANCH_SYMBOLIC_V1.json'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build exact FastFile expander
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libssl-dev zlib1g-dev >/dev/null
          gcc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_fastfile_expand -lcrypto -lz
          mkdir -p /tmp/raw /tmp/corpus/mp proof/render
      - name: Recover five exact expanded worlds
        shell: bash
        run: |
          set -euo pipefail
          declare -A RAW=(
            [mp_nuketown_2020]='6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0'
            [mp_raid]='bca3b74d8df5a27b82e77f39ef82cbd87a19dedf30884600b73eb563acba5888'
            [mp_hijacked]='2e5f9b87af64645e6d2e3678bca46d458890efa9a19eb8afea4cda6e8dab4037'
            [zm_prison]='ebfd53156542bc61e842087879475c7515851ddcc6d4f0ae743099590177dcb1'
            [zm_tomb]='663c2f6e275fb6a8a2844bcc0e31808abe681ce7c2a2ddc6f616ef98fc7cd0b5'
          )
          declare -A EXP=(
            [mp_nuketown_2020]='7e791fb90a085f3bff9e0df895e5a232fa91cc43bcd0027225fe811f7891d505'
            [mp_raid]='d3874c5981a01d75b72c9584e0e7d8af6132f28135f1a1ec6c4db2b9ac5037f8'
            [mp_hijacked]='8bae6fdafd459f3fa6794a093a895c3c12ad3ca3f37ab83170a966884d54d42b'
            [zm_prison]='e9d334a173d05b2854370822bc2cb16c9d5eb6226254aaf28b726cfedc340487'
            [zm_tomb]='4b4e7cff929304fe58c83a2864dc76ddb8a295b6e6c548b30cb04a514800d219'
          )
          for zone in mp_nuketown_2020 mp_raid mp_hijacked zm_prison zm_tomb; do
            raw="/tmp/raw/${zone}.ff"
            curl -fL --retry 4 --retry-delay 2 -o "$raw" "https://r2.houseofkublai.com/bo2/zone/all/${zone}.ff"
            echo "${RAW[$zone]}  $raw" | sha256sum -c -
            if [[ "$zone" == mp_* ]]; then out="/tmp/corpus/mp/${zone}.expanded.bin"; else out="/tmp/corpus/${zone}.expanded.bin"; fi
            /tmp/t6_fastfile_expand "$raw" "$out" "$zone"
            echo "${EXP[$zone]}  $out" | sha256sum -c -
          done
      - name: Regenerate exact symbolic full row sets
        env:
          PYTHONPATH: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_retail_special_shdr_symbolic_v1.py --root /tmp/corpus --out /tmp/straight.json
          python3 tools/t6_retail_special_shdr_branch_symbolic_v1.py --root /tmp/corpus --out /tmp/branch.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          straight=json.loads(Path('/tmp/straight.json').read_text())
          branch=json.loads(Path('/tmp/branch.json').read_text())
          c1=json.loads(Path('manifests/render/T6_RETAIL_SPECIAL_SHDR_SYMBOLIC_V1.json').read_text())
          c2=json.loads(Path('manifests/render/T6_RETAIL_SPECIAL_SHDR_BRANCH_SYMBOLIC_V1.json').read_text())
          for got,old,label in [(straight,c1,'straight'),(branch,c2,'branch')]:
              assert got['summary']==old['summary'],(label,'summary drift')
              assert got['sourcePixelShaderSetSha256']==old['sourcePixelShaderSetSha256'],(label,'source drift')
              assert got['shaderRows'],(label,'missing full rows')
          assert straight['dagSetSha256']==c1['dagSetSha256'],('straight','dag drift')
          assert branch['dagSetSha256']=='2445f6adefcd1da3c5ae0f3df8ca12724ca0b2c26ba5e4102272956a8b3a2b86',('branch','canonical dag drift')
          assert len(straight['shaderRows'])==76
          assert len(branch['shaderRows'])==78
          sset={x['sha256'] for x in straight['shaderRows']}
          bset={x['sha256'] for x in branch['shaderRows']}
          assert len(sset)==76 and len(bset)==78 and not (sset & bset)
          out={
            'format':'t6-retail-special-symbolic-full-rows-v2',
            'sources':{'straightCompact':'manifests/render/T6_RETAIL_SPECIAL_SHDR_SYMBOLIC_V1.json','branchCompact':'manifests/render/T6_RETAIL_SPECIAL_SHDR_BRANCH_SYMBOLIC_V1.json'},
            'summary':{'straightShaderCount':76,'branchShaderCount':78,'symbolicShaderCount':154,'overlapCount':0,'straightDagSetSha256':straight['dagSetSha256'],'branchDagSetSha256':branch['dagSetSha256']},
            'straightShaderRows':straight['shaderRows'],
            'branchShaderRows':branch['shaderRows'],
            'proofBoundary':'Exact regenerated full row sets for the already-validated five-world special SHDR symbolic proofs. Every summary, source-set digest, and DAG-set digest must match the committed compact manifests. This adds hash-level coverage identity only; it does not expand semantic opcode support or resolve packed technique/shader references.'
          }
          Path('proof/render/T6_RETAIL_SPECIAL_SYMBOLIC_FULL_ROWS_V2.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out['summary'],indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/render/T6_RETAIL_SPECIAL_SYMBOLIC_FULL_ROWS_V2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist complete special symbolic shader row sets'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_RETAIL_SPECIAL_SYMBOLIC_FULL_ROWS_V2
          path: |
            proof/render/T6_RETAIL_SPECIAL_SYMBOLIC_FULL_ROWS_V2.json
            /tmp/straight.json
            /tmp/branch.json
          if-no-files-found: error
          compression-level: 9
