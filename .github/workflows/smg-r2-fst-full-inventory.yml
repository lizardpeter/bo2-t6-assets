name: smg r2 fst full inventory

on:
  push:
    branches: [uregraph-corpus-stress]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Parse DATA and UPDATE FSTs and validate R2 objects
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out/sys/DATA out/sys/UPDATE
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request, urllib.parse, hashlib, json, struct, collections, concurrent.futures, time, os

          BASE='https://r2.houseofkublai.com/super-mario-galaxy/'
          PARTS=('DATA','UPDATE')
          SYS=('boot.bin','bi2.bin','apploader.img','main.dol','fst.bin')

          def dl(url, out):
              req=urllib.request.Request(url,headers={'User-Agent':'uregraph-smg-fst/1'})
              with urllib.request.urlopen(req,timeout=120) as r:
                  data=r.read()
              Path(out).write_bytes(data)
              return data

          def hashes(b):
              return {'size':len(b),'md5':hashlib.md5(b).hexdigest(),'sha1':hashlib.sha1(b).hexdigest(),'sha256':hashlib.sha256(b).hexdigest()}

          def cstr(buf, off):
              end=buf.find(b'\0',off)
              if end<0: raise ValueError(f'unterminated FST string at {off}')
              return buf[off:end].decode('utf-8','surrogateescape')

          def parse_fst(b):
              if len(b)<12: raise ValueError('FST too short')
              root0,root1,n=struct.unpack_from('>III',b,0)
              if (root0>>24)!=1: raise ValueError('FST root is not directory')
              if n<=0 or n*12>len(b): raise ValueError(f'invalid FST entry count {n}')
              st=n*12
              entries=[]
              stack=[(n,'')]
              for i in range(1,n):
                  while stack and i>=stack[-1][0]:
                      stack.pop()
                  parent=stack[-1][1] if stack else ''
                  w0,w1,w2=struct.unpack_from('>III',b,i*12)
                  typ=w0>>24
                  noff=w0 & 0x00ffffff
                  name=cstr(b,st+noff)
                  path=parent+name
                  if typ:
                      entries.append({'index':i,'type':'dir','path':path+'/', 'parent_index':w1,'next_index':w2})
                      stack.append((w2,path+'/'))
                  else:
                      entries.append({'index':i,'type':'file','path':path,'offset':w1,'size':w2})
              return {'entry_count':n,'entries':entries}

          def parse_boot(b):
              if len(b)<0x20: return {}
              return {
                  'disc_id':b[:6].decode('ascii','replace'),
                  'game_code':b[:4].decode('ascii','replace'),
                  'maker_code':b[4:6].decode('ascii','replace'),
                  'disc_number':b[6],
                  'disc_version':b[7],
                  'audio_streaming':b[8],
                  'stream_buffer_size':b[9],
                  'wii_magic':f'0x{struct.unpack_from(">I",b,0x18)[0]:08X}',
              }

          def parse_dol(b):
              if len(b)<0x100: return {}
              to=list(struct.unpack_from('>7I',b,0x00)); do=list(struct.unpack_from('>11I',b,0x1c))
              ta=list(struct.unpack_from('>7I',b,0x48)); da=list(struct.unpack_from('>11I',b,0x64))
              ts=list(struct.unpack_from('>7I',b,0x90)); ds=list(struct.unpack_from('>11I',b,0xac))
              sec=[]
              for i,(o,a,s) in enumerate(zip(to,ta,ts)):
                  if s: sec.append({'kind':'text','index':i,'file_offset':o,'address':a,'size':s})
              for i,(o,a,s) in enumerate(zip(do,da,ds)):
                  if s: sec.append({'kind':'data','index':i,'file_offset':o,'address':a,'size':s})
              return {
                  'sections':sec,
                  'bss_address':struct.unpack_from('>I',b,0xd8)[0],
                  'bss_size':struct.unpack_from('>I',b,0xdc)[0],
                  'entry_point':struct.unpack_from('>I',b,0xe0)[0],
              }

          allout={'format':'uregraph-smg-r2-fst-inventory-v1','base':BASE,'partitions':{}}
          for part in PARTS:
              sysmeta={}
              raw={}
              for name in SYS:
                  url=BASE+part+'/sys/'+name
                  b=dl(url,f'out/sys/{part}/{name}')
                  raw[name]=b
                  sysmeta[name]={'url':url,**hashes(b)}
              fst=parse_fst(raw['fst.bin'])
              files=[e for e in fst['entries'] if e['type']=='file']
              dirs=[e for e in fst['entries'] if e['type']=='dir']
              ext=collections.Counter()
              for e in files:
                  p=e['path']; suf=Path(p).suffix.lower() or '<none>'; ext[suf]+=1
              allout['partitions'][part]={
                  'system_files':sysmeta,
                  'boot':parse_boot(raw['boot.bin']),
                  'dol':parse_dol(raw['main.dol']),
                  'fst_entry_count':fst['entry_count'],
                  'directory_count':len(dirs),
                  'file_count':len(files),
                  'fst_total_file_bytes':sum(e['size'] for e in files),
                  'extensions':ext.most_common(),
                  'directories':dirs,
                  'files':files,
              }

          # Validate every extracted file URL from FST with parallel HEAD.
          def head_one(item):
              part,e=item
              url=BASE+part+'/files/'+urllib.parse.quote(e['path'],safe='/')
              req=urllib.request.Request(url,method='HEAD',headers={'User-Agent':'uregraph-smg-fst/1'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      cl=r.headers.get('Content-Length')
                      got=int(cl) if cl is not None else None
                      return part,e['index'],{'status':'ok','url':url,'http_size':got,'fst_size':e['size'],
                                              'size_matches': got==e['size'] if got is not None else None,
                                              'etag':r.headers.get('ETag'),'last_modified':r.headers.get('Last-Modified')}
              except Exception as ex:
                  return part,e['index'],{'status':'error','url':url,'fst_size':e['size'],'error':repr(ex)}

          work=[]
          for part,pd in allout['partitions'].items():
              for e in pd['files']: work.append((part,e))
          t0=time.time()
          results={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=48) as ex:
              for part,idx,row in ex.map(head_one,work,chunksize=1):
                  results[(part,idx)]=row
          for part,pd in allout['partitions'].items():
              ok=bad=mismatch=0
              for e in pd['files']:
                  h=results[(part,e['index'])]
                  e['r2']=h
                  if h['status']=='ok':
                      ok+=1
                      if h.get('size_matches') is False: mismatch+=1
                  else: bad+=1
              pd['r2_validation']={'ok':ok,'errors':bad,'size_mismatches':mismatch}
          allout['validation_seconds']=time.time()-t0
          Path('out/smg_full_inventory.json').write_text(json.dumps(allout,indent=2,sort_keys=True),encoding='utf-8')
          with Path('out/smg_paths.tsv').open('w',encoding='utf-8') as f:
              f.write('partition\tpath\tfst_size\tstatus\thttp_size\n')
              for part,pd in allout['partitions'].items():
                  for e in pd['files']:
                      h=e['r2']; f.write(f"{part}\t{e['path']}\t{e['size']}\t{h['status']}\t{h.get('http_size','')}\n")
          summary={p:{
              'disc_id':d['boot'].get('disc_id'),'disc_version':d['boot'].get('disc_version'),
              'files':d['file_count'],'dirs':d['directory_count'],'bytes':d['fst_total_file_bytes'],
              'r2':d['r2_validation'],'main_dol':d['system_files']['main.dol'],'dol_entry':d['dol'].get('entry_point'),
              'top_extensions':d['extensions'][:20]
          } for p,d in allout['partitions'].items()}
          Path('out/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps(summary,indent=2))
          PY
      - name: Upload full inventory
        uses: actions/upload-artifact@v4
        with:
          name: smg-r2-fst-full-inventory
          path: out/
          compression-level: 6
          retention-days: 3
