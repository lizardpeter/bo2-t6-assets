name: T6 current client linked record relink swap probe v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_linked_record_relink_swap_probe_v1.py'
      - '.github/workflows/t6_current_client_linked_record_relink_swap_probe_v1.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q capstone==5.0.6
      - name: Recover classified client and persist focused relink/swap disassembly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/client proof/current_client
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          ua='bo2-t6-assets-relink-swap-probe/1'
          eps=['https://cdn.plutoniummod.com/updater/prod/info.json','https://cdn.plutonium.pw/updater/prod/info.json']
          def get(u):
            q=urllib.request.Request(u,headers={'User-Agent':ua})
            with urllib.request.urlopen(q,timeout=180) as r:return r.read()
          info=None
          for ep in eps:
            try: info=json.loads(get(ep)); break
            except Exception: pass
          if info is None: raise SystemExit('no CDN info')
          rows=[x for x in info['files'] if x.get('name','').replace('\\','/').lower()=='games/t6mp.exe']
          if len(rows)!=1: raise SystemExit(f'expected one client, got {len(rows)}')
          rec=rows[0];raw=get(info['baseUrl']+rec['hash']);sha=hashlib.sha256(raw).hexdigest()
          if str(info.get('revision'))!='5346' or sha!='770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf':
            raise SystemExit(f'classified client changed {info.get("revision")} {sha}')
          Path('/tmp/client/t6mp.exe').write_bytes(raw);Path('/tmp/client/revision').write_text(str(info['revision']))
          PY
          python3 tools/t6_current_client_linked_record_relink_swap_probe_v1.py /tmp/client/t6mp.exe --revision "$(cat /tmp/client/revision)" --out proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_RELINK_SWAP_PROBE_V1.json
          rm -f /tmp/client/t6mp.exe
          python3 - <<'PY'
          import json
          j=json.load(open('proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_RELINK_SWAP_PROBE_V1.json'))
          by={r['name']:r for r in j['ranges']}
          assert set(by)=={'directLookup','swapHelper','insertionPath'}
          def addrset(name): return {x['address'] for x in by[name]['instructions']}
          assert '0x00479cd5' in addrset('directLookup')
          assert '0x007fd520' in addrset('swapHelper')
          assert '0x007fdafc' in addrset('insertionPath')
          assert '0x007fdc24' in addrset('insertionPath')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_RELINK_SWAP_PROBE_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist current-client relink swap disassembly'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_LINKED_RECORD_RELINK_SWAP_PROBE_V1
          path: proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_RELINK_SWAP_PROBE_V1.json
          if-no-files-found: error
          compression-level: 9
