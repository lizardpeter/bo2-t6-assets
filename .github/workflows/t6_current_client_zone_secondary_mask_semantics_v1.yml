name: T6 current client secondary zone mask semantics v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_zone_secondary_mask_semantics_v1.py'
      - '.github/workflows/t6_current_client_zone_secondary_mask_semantics_v1.yml'
      - 'proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_ENTRY_PROBE_V1.json'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Project exact secondary-mask semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_zone_secondary_mask_semantics_v1.py             --source proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_ENTRY_PROBE_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_ZONE_SECONDARY_MASK_SEMANTICS_V1.json | tee /tmp/summary.log
          python3 - <<'PY'
          import json
          j=json.load(open('proof/current_client/T6_CURRENT_CLIENT_ZONE_SECONDARY_MASK_SEMANTICS_V1.json'))
          assert j['proven']['plus8IsCurrentClientMutableSecondaryControlMask'] is True
          assert j['proven']['plus8ParticipatesInBitmaskOverlapTests'] is True
          assert j['proven']['plus8Bit0x00200000HasDedicatedControlFlow'] is True
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_ZONE_SECONDARY_MASK_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact current-client secondary zone mask semantics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_ZONE_SECONDARY_MASK_SEMANTICS_V1
          path: |
            proof/current_client/T6_CURRENT_CLIENT_ZONE_SECONDARY_MASK_SEMANTICS_V1.json
            /tmp/summary.log
          if-no-files-found: error
          compression-level: 9
