name: T6 Nuketown packed GfxImage identity trace v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_oat_gfximage_packed_identity_trace_patch_v1.py'
      - '.github/workflows/t6_nuketown_gfximage_packed_identity_trace_v1.yml'
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build exactly pinned instrumented OAT
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq; sudo apt-get install -y -qq g++-multilib >/dev/null
          git clone -q --recursive https://github.com/Laupetin/OpenAssetTools.git /tmp/oat
          git -C /tmp/oat checkout -q 9dca965366541504b71fa8cfb7ac049cb9b717e1
          git -C /tmp/oat submodule update -q --init --recursive
          python3 tools/t6_oat_9dca_gcc_compat_patch_v3.py /tmp/oat
          python3 tools/t6_oat_gfximage_packed_identity_trace_patch_v1.py /tmp/oat
          git -C /tmp/oat diff --check
          cd /tmp/oat; PREMAKE_NO_PROMPT=1 ./generate.sh; make -C build -j2 config=debug_x86 UnlinkerCli
          BIN=$(find /tmp/oat/build/bin -type f \( -name Unlinker -o -name unlinker \) -perm -111 | head -1); test -n "$BIN"; realpath "$BIN" >/tmp/unlinker_path; test -x "$(cat /tmp/unlinker_path)"
      - name: Fetch exact Nuketown root and trace images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source /tmp/out /tmp/proof
          curl -fL --retry 4 -o /tmp/source/mp_nuketown_2020.ff https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/source/mp_nuketown_2020.ff' | sha256sum -c -
          BIN=$(cat /tmp/unlinker_path); "$BIN" --no-color --verbose --include-assets image --output-folder /tmp/out /tmp/source/mp_nuketown_2020.ff > /tmp/proof/trace.log 2>&1
          grep '^T6_GFXIMAGE_PACKED ' /tmp/proof/trace.log > /tmp/proof/packed.txt
          test -s /tmp/proof/packed.txt
      - name: Persist exact packed identity table
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,pathlib
          rx=re.compile(r'^T6_GFXIMAGE_PACKED name=(.*?) nameHash=(\d+) dataHash=(\d+) streamedParts=(\d+) width=(\d+) height=(\d+) depth=(\d+)$')
          rows=[]
          for line in pathlib.Path('/tmp/proof/packed.txt').read_text().splitlines():
              m=rx.match(line)
              if not m: raise SystemExit('trace parse drift: '+line)
              name,nh,dh,sp,w,h,d=m.groups(); rows.append({'name':name,'nameHash':int(nh),'dataHash':int(dh),'streamedPartCount':int(sp),'width':int(w),'height':int(h),'depth':int(d)})
          names={x['name'] for x in rows}
          if len(names)!=len(rows): raise SystemExit('duplicate packed names in map root')
          doc={'format':'t6-nuketown-gfximage-packed-identity-trace-v1','authority':'SHA-pinned mp_nuketown_2020.ff + OAT 9dca965 diagnostic trace','sourceFastFileSha256':'6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0','rows':rows,'summary':{'packedImageCount':len(rows)},'proofBoundary':'Fields are native resolved GfxImage values observed by pinned OAT immediately before its existing IPAK lookup. This proves map-root name/nameHash/first-streamed-dataHash/dimensions for streamed images; it does not prove payload presence in any particular IPAK until exact hash lookup and byte validation succeeds.'}
          p=pathlib.Path('proof/T6_NUKETOWN_GFXIMAGE_PACKED_IDENTITY_TRACE_V1.json'); p.write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n'); print(json.dumps(doc['summary']))
          PY
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/T6_NUKETOWN_GFXIMAGE_PACKED_IDENTITY_TRACE_V1.json
          git commit -m 'Persist Nuketown packed GfxImage identity trace' || exit 0
          git pull --rebase origin main; git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_GFXIMAGE_PACKED_IDENTITY_TRACE_V1
          path: /tmp/proof
