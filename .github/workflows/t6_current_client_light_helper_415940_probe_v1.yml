name: T6 current client light helper 415940 probe v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_light_helper_415940_probe_v1.py'
      - '.github/workflows/t6_current_client_light_helper_415940_probe_v1.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q capstone==5.0.6
      - name: Recover exact current client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/client proof/current_client
          python3 tools/t6_current_client_fetch_exact_v1.py --out-exe /tmp/client/t6mp.exe --out-identity /tmp/client/identity.json
      - name: Probe exact helper and two-push callers
        shell: bash
        run: |
          set -euo pipefail
          rev=$(python3 -c "import json;print(json.load(open('/tmp/client/identity.json'))['observedCdnRevision'])")
          python3 tools/t6_current_client_light_helper_415940_probe_v1.py             /tmp/client/t6mp.exe --revision "$rev"             --out proof/current_client/T6_CURRENT_CLIENT_LIGHT_HELPER_415940_PROBE_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_LIGHT_HELPER_415940_PROBE_V1.json'))
          assert d['client']['sha256']=='770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf'
          assert d['target']['entryVa']=='0x00415940'
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_LIGHT_HELPER_415940_PROBE_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist focused light helper 0x415940 evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          rm -f /tmp/client/t6mp.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_LIGHT_HELPER_415940_PROBE_V1
          path: proof/current_client/T6_CURRENT_CLIENT_LIGHT_HELPER_415940_PROBE_V1.json
          if-no-files-found: error
