name: T6 strict PDB exact-hash join regeneration v1

on:
  push:
    paths:
      - '.github/workflows/t6_strict_pdb_exact_hash_join_regen_v1.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build strict two-sided exact-hash join
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-pdb-join
          awk 'FNR==1 && NR!=1 {next} {print}'             proof/server_pdb_exact_hashes_v1/server_pdb_exact_hashes_*.tsv             > /tmp/t6-pdb-join/server_pdb_exact_hashes_all.tsv
          python3 tools/join_t6_current_client_pdb_exact_hashes_v1.py             --catalog proof/current_client/ghidra_low_hanging_v1/catalog.tsv             --pdb-hashes /tmp/t6-pdb-join/server_pdb_exact_hashes_all.tsv             --out proof/current_client/pdb_exact_hash_join_v1_strict/join.json             --cypher-out-dir proof/current_client/pdb_exact_hash_join_v1_strict/uregraph             --chunk-size 250
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("proof/current_client/pdb_exact_hash_join_v1_strict/join.json")
          d=json.loads(p.read_text())
          accepted=sum(1 for x in d["matches"] if x["state"]=="accepted-exact-byte-identity-witness")
          candidate=len(d["matches"])-accepted
          s={
            "format":"t6-current-client-pdb-exact-hash-join-v1-strict-summary",
            "current_client_catalog_functions":d["current_client_catalog_functions"],
            "server_pdb_exact_hash_variants":d["server_pdb_exact_hash_variants"],
            "match_rows":d["match_rows"],
            "current_client_functions_with_match":d["current_client_functions_with_match"],
            "ambiguous_current_client_hashes":d["ambiguous_current_client_hashes"],
            "ambiguous_current_client_functions":d["ambiguous_current_client_functions"],
            "accepted_unique_match_rows":accepted,
            "candidate_ambiguous_match_rows":candidate,
            "proof_boundary":d["proof_boundary"],
          }
          pathlib.Path("proof/current_client/pdb_exact_hash_join_v1_strict/summary.json").write_text(
              json.dumps(s,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
      - name: Run exact-hash join tests
        run: |
          python3 -m unittest             tools.test_join_t6_current_client_pdb_exact_hashes_v1             tools.test_join_t6_current_client_pdb_exact_hashes_v2
      - name: Commit regenerated strict proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proof/current_client/pdb_exact_hash_join_v1_strict
          if git diff --cached --quiet; then
            echo "No proof changes"
            exit 0
          fi
          git commit -m "proof: regenerate strict T6 PDB exact-hash join"
          git pull --rebase origin main
          git push origin HEAD:main
