name: T6 current-client fog writer locator v1

on:
  push:
    paths:
      - '.github/workflows/t6_current_client_fog_writer_locator_v1.yml'
      - 'tools/ghidra_scripts/FindT6CurrentClientFogWriters.java'
  workflow_dispatch:

permissions:
  contents: write

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  CLIENT_SHA256: 770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf
  GHIDRA_CACHE_KEY: t6-current-client-ghidra-12.1.3-77031817-v1

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ghidra.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: Recover exact current client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/client
          python3 tools/t6_current_client_fetch_exact_v1.py --out-exe /tmp/client/t6mp.exe --out-identity /tmp/client/identity.json
          echo "$CLIENT_SHA256  /tmp/client/t6mp.exe" | sha256sum --check
      - name: Restore analyzed client project
        id: ghidra-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-ghidra/projects
          key: ${{ env.GHIDRA_CACHE_KEY }}
      - name: Require analyzed cache
        shell: bash
        run: |
          set -euo pipefail
          test -d /tmp/t6-ghidra/projects
      - name: Locate and decompile fog candidates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/t6-fog-client
          mkdir -p /tmp/t6-fog-client /tmp/t6-ghidra/config-fog-client /tmp/t6-ghidra/cache-fog-client
          export XDG_CONFIG_HOME=/tmp/t6-ghidra/config-fog-client
          export XDG_CACHE_HOME=/tmp/t6-ghidra/cache-fog-client
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/t6-ghidra/projects t6-current-client \
            -process t6mp.exe -noanalysis -readOnly \
            -postScript FindT6CurrentClientFogWriters.java /tmp/t6-fog-client \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 2
          cat /tmp/t6-fog-client/manifest.txt
          cat /tmp/t6-fog-client/candidates.tsv
      - name: Commit exact client candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=proof/current_client/fog_writer_locator_v1
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp /tmp/t6-fog-client/* "$OUT/"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "proof: locate exact current-client T6 fog writer"
          git pull --rebase origin main
          git push origin HEAD:main
