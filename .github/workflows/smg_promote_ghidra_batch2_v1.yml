name: SMG promote RMGE01 Ghidra batch 2 v1

on:
  pull_request:
    paths:
      - 'smg/rmge01/trigger_promote_batch2_v1.txt'

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download verified batch 2 artifact
        uses: actions/download-artifact@v4
        with:
          name: SMG_RMGE01_GHIDRA_BATCH2_V1
          path: /tmp/batch2
          github-token: ${{ github.token }}
          repository: lizardpeter/bo2-t6-assets
          run-id: 36692633033
      - name: Commit durable exact-binary decompiler output
        run: |
          set -euo pipefail
          OUT=smg/rmge01/derived/ghidra_batch2_v1
          mkdir -p "$OUT"
          cp /tmp/batch2/batch2_exact.jsonl "$OUT/"
          cp /tmp/batch2/batch2_exact_summary.json "$OUT/"
          cp /tmp/batch2/smg-ghidra-out/decompile.tsv "$OUT/"
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
          git config user.name 'smg-re-bot'
          git config user.email 'smg-re-bot@users.noreply.github.com'
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'SMG: retain exact RMGE01 Ghidra batch 2 output'
          git push origin HEAD:"${GITHUB_HEAD_REF}"
