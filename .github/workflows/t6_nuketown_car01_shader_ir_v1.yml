name: T6 Nuketown Car01 shader IR v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_nuketown_car01_shader_ir_v1.yml'
      - 'tools/t6_shader_ir_v1.py'

permissions:
  contents: read
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download exact native map and shared shader proofs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/map /tmp/shared /tmp/ir
          for spec in \
            '10022923599:/tmp/map.zip:/tmp/map' \
            '10023377934:/tmp/shared.zip:/tmp/shared'; do
            IFS=: read -r id zip out <<< "$spec"
            curl -fL --retry 4 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$zip" \
              "https://api.github.com/repos/lizardpeter/bo2-t6-assets/actions/artifacts/${id}/zip"
            unzip -q "$zip" -d "$out"
          done

          test "$(cat /tmp/map/build_rc.txt)" = 0
          test "$(cat /tmp/map/material_rc.txt)" = 0
          test "$(cat /tmp/map/techset_rc.txt)" = 0
          test -s /tmp/map/T6_NUKETOWN_CAR01_OAT_SHADER_BINDINGS_V2.json
          test -s /tmp/shared/T6_CAR01_GLASS_SHADER_BINDINGS_V1.json

      - name: Generate all five exact normal-lit IR files
        shell: bash
        run: |
          set -euo pipefail
          MAP_SHA=6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0
          COMMON_SHA=93fe48b0f0d8cc6844be875ccad94e0cfcf635f62eeff00ac33f2f668a77cb77

          for material in exterior interior tire; do
            name="mc/mtl_nt_2020_car_01_${material}"
            python3 tools/t6_shader_ir_v1.py \
              --material-name "$name" \
              --material-json "/tmp/map/oat_selected/materials/${name}.json" \
              --shader-binding-manifest /tmp/map/T6_NUKETOWN_CAR01_OAT_SHADER_BINDINGS_V2.json \
              --technique-type lit \
              --material-fast-file mp_nuketown_2020.ff \
              --material-fast-file-sha256 "$MAP_SHA" \
              --shader-fast-file mp_nuketown_2020.ff \
              --shader-fast-file-sha256 "$MAP_SHA" \
              --out "/tmp/ir/${material}_lit.json" >/dev/null
          done

          for material in glass_out glass_in; do
            name="mc/mtl_nt_2020_car_01_${material}"
            python3 tools/t6_shader_ir_v1.py \
              --material-name "$name" \
              --material-json "/tmp/map/oat_selected/materials/${name}.json" \
              --shader-binding-manifest /tmp/shared/T6_CAR01_GLASS_SHADER_BINDINGS_V1.json \
              --technique-type lit \
              --material-fast-file mp_nuketown_2020.ff \
              --material-fast-file-sha256 "$MAP_SHA" \
              --shader-fast-file common_mp.ff \
              --shader-fast-file-sha256 "$COMMON_SHA" \
              --out "/tmp/ir/${material}_lit.json" >/dev/null
          done

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/ir')
          rows=[]
          expected={
              'exterior_lit.json':('mc_lit_sm_r0c0n0s0_zqq1fze7','pimp_technique_lprobe_651eb933',2,'one','zero',True),
              'interior_lit.json':('mc_lit_sm_r0c0n0s0_zqq1fze7','pimp_technique_lprobe_651eb933',2,'one','zero',True),
              'tire_lit.json':('mc_lit_sm_r0c0n0s0_zqq1fze7','pimp_technique_lprobe_651eb933',2,'one','zero',True),
              'glass_out_lit.json':('mc_lit_sm_b0c0s0_2q396f5e','pimp_technique_lprobe_de89e86a',1,'one','invsrcalpha',False),
              'glass_in_lit.json':('mc_lit_sm_b0c0s0_2q396f5e','pimp_technique_lprobe_de89e86a',1,'one','invsrcalpha',False),
          }
          for p in sorted(root.glob('*.json')):
              j=json.loads(p.read_text())
              e=expected[p.name]
              assert j['format']=='t6-shader-ir-v1'
              assert j['techniqueType']=='lit' and j['techniqueTypeIndex']==4
              assert j['techniqueSet']==e[0]
              assert j['technique']==e[1]
              assert j['stateBitsIndex']==e[2]
              assert j['pipelineState']['srcBlendRgb']==e[3]
              assert j['pipelineState']['dstBlendRgb']==e[4]
              assert j['pipelineState']['depthWrite'] is e[5]
              assert len(j['passes'])==1
              stages={s['stage'] for s in j['passes'][0]['shaders']}
              assert stages=={'vertex','pixel'}
              rows.append({
                  'file':p.name,
                  'material':j['material']['name'],
                  'techniqueSet':j['techniqueSet'],
                  'technique':j['technique'],
                  'stateBitsIndex':j['stateBitsIndex'],
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              })
          out={
              'format':'t6-nuketown-car01-shader-ir-bundle-v1',
              'proofBoundary':'Five normal-lit Car01 IR records regenerated from SHA-pinned native OAT proof artifacts through tools/t6_shader_ir_v1.py with exact technique-indexed state assertions.',
              'records':rows,
          }
          (root/'T6_NUKETOWN_CAR01_SHADER_IR_BUNDLE_V1.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

          find /tmp/ir -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/ir/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_CAR01_SHADER_IR_V1
          path: /tmp/ir
          if-no-files-found: error
