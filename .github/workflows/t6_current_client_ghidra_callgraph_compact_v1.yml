name: T6 current-client Ghidra callgraph compact v1

on:
  push:
    paths:
      - '.github/workflows/t6_current_client_ghidra_callgraph_compact_v1.yml'

permissions:
  contents: write

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  CLIENT_SHA256: 770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf
  GHIDRA_CACHE_KEY: t6-current-client-ghidra-12.1.3-77031817-v1

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ghidra.zip             https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: Restore analyzed current-client project
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-ghidra/projects
          key: ${{ env.GHIDRA_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Export complete direct-call census
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-callgraph/raw /tmp/t6-callgraph/compact
          export XDG_CONFIG_HOME=/tmp/t6-ghidra/config
          export XDG_CACHE_HOME=/tmp/t6-ghidra/cache
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless"             /tmp/t6-ghidra/projects t6-current-client             -process t6mp.exe -noanalysis -readOnly             -postScript ExportT6CurrentClientCallgraph.java /tmp/t6-callgraph/raw/calls.tsv             -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 4
          python3 tools/compact_t6_current_client_callgraph_v1.py             /tmp/t6-callgraph/raw/calls.tsv             --out-dir /tmp/t6-callgraph/compact
      - name: Package durable callgraph evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=proof/current_client/ghidra_callgraph_compact_v1
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp /tmp/t6-callgraph/compact/summary.json "$OUT/summary.json"
          for f in edges.tsv function_stats.tsv; do
            zstd -12 -T0 "/tmp/t6-callgraph/compact/$f" -o "$OUT/$f.zst"
            sha256sum "$OUT/$f.zst" > "$OUT/$f.zst.sha256"
          done
          zstd -12 -T0 /tmp/t6-callgraph/raw/calls.tsv -o "$OUT/calls_raw.tsv.zst"
          sha256sum "$OUT/calls_raw.tsv.zst" > "$OUT/calls_raw.tsv.zst.sha256"
          git diff --check
          git config user.name uregraph-re-bot
          git config user.email uregraph-re-bot@users.noreply.github.com
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add T6 current-client Ghidra callgraph compact v1"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_GHIDRA_CALLGRAPH_COMPACT_V1
          path: /tmp/t6-callgraph
          retention-days: 30
