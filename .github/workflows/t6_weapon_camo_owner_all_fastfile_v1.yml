name: T6 WeaponCamo owner all-FastFile census v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/firstperson-weapons-closure
    paths:
      - .github/workflows/t6_weapon_camo_owner_all_fastfile_v1.yml
      - tools/t6_raw_xasset_inventory.py
      - tools/t6_remote_zip_range_v1.py
      - tools/t6_fastfile_expand_pc_v1.c

permissions:
  contents: read

jobs:
  scan-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZIP_URL: https://cdn.jordanlindsay.com.au/pluto_t6_full_game.zip
      SHARD: ${{ matrix.shard }}
      SHARD_COUNT: '8'
    steps:
      - uses: actions/checkout@v4

      - name: Build source-closed T6 FastFile expander
        shell: bash
        run: |
          set -euo pipefail
          gcc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_expand -lcrypto -lz
          sha256sum /tmp/t6_expand

      - name: Census exact WeaponCamo XAsset owners in shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof /tmp/work
          PYTHONPATH=tools python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          from t6_remote_zip_range_v1 import RemoteZip
          from t6_raw_xasset_inventory import parse_front

          url=os.environ['ZIP_URL']; shard=int(os.environ['SHARD']); shard_count=int(os.environ['SHARD_COUNT'])
          rz=RemoteZip(url,f'bo2-t6-assets-weapon-camo-owner/{shard}')
          entries,meta=rz.central_directory()
          ff=sorted([e for e in entries if e['name'].lower().endswith('.ff')],key=lambda e:e['name'].lower())
          if len(ff)!=215: raise SystemExit(f'archive FastFile population changed: {len(ff)} != 215')
          selected=[(i,e) for i,e in enumerate(ff) if i % shard_count == shard]
          rows=[]; owner_rows=[]
          for global_index,e in selected:
              name=e['name']; zone=pathlib.PurePosixPath(name).name[:-3]
              ff_path=pathlib.Path('/tmp/work')/f'{global_index:03d}.ff'
              expanded=pathlib.Path('/tmp/work')/f'{global_index:03d}.expanded.bin'
              raw=rz.extract(e,verify_crc=True); ff_sha=hashlib.sha256(raw).hexdigest(); ff_path.write_bytes(raw)
              proc=subprocess.run(['/tmp/t6_expand',str(ff_path),str(expanded),zone],stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              if proc.returncode!=0 or not expanded.is_file():
                  raise SystemExit(f'FastFile expansion failed rc={proc.returncode}: {name}\n{proc.stdout.decode(errors="replace")}')
              blob=expanded.read_bytes(); inv=parse_front(blob); counts=inv['asset_type_counts']; camo=int(counts.get('WEAPON_CAMO',0))
              row={
                  'globalIndex':global_index,'zipPath':name,'zoneName':zone,
                  'zipCrc32':f"{int(e['crc32']):08x}",'fastFileBytes':len(raw),'fastFileSha256':ff_sha,
                  'expandedBytes':len(blob),'expandedSha256':hashlib.sha256(blob).hexdigest(),
                  'assetCount':inv['asset_count'],'weaponCamoCount':camo,
              }
              rows.append(row)
              if camo: owner_rows.append(row)
              print(global_index,camo,name,flush=True)
              ff_path.unlink(missing_ok=True); expanded.unlink(missing_ok=True)
          doc={
              'format':'t6-weapon-camo-owner-all-fastfile-shard-v1','shard':shard,'shardCount':shard_count,
              'remoteZip':meta,'allFastFileCount':len(ff),'rows':rows,'ownerRows':owner_rows,
              'summary':{'selectedFastFileCount':len(rows),'ownerFastFileCount':len(owner_rows),'weaponCamoPhysicalXAssetCount':sum(r['weaponCamoCount'] for r in owner_rows)},
              'proofBoundary':'Exact front-of-XFile XAsset type census on one deterministic shard. It establishes which physical FastFiles contain top-level WEAPON_CAMO XAssets and their counts, but not names, payload semantics, runtime precedence or per-weapon validity.',
          }
          out=pathlib.Path('/tmp/proof')/f'T6_WEAPON_CAMO_OWNER_ALL_FASTFILE_SHARD_{shard}_V1.json'; out.write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n')
          print(json.dumps(doc['summary'],indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: T6_WEAPON_CAMO_OWNER_ALL_FASTFILE_SHARD_${{ matrix.shard }}_V1
          path: /tmp/proof/T6_WEAPON_CAMO_OWNER_ALL_FASTFILE_SHARD_${{ matrix.shard }}_V1.json
          if-no-files-found: error
          compression-level: 9

  aggregate:
    needs: scan-shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: T6_WEAPON_CAMO_OWNER_ALL_FASTFILE_SHARD_*_V1
          path: /tmp/shards
          merge-multiple: true

      - name: Aggregate exact owner universe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof
          python3 - <<'PY'
          import glob,hashlib,json,pathlib
          paths=sorted(glob.glob('/tmp/shards/T6_WEAPON_CAMO_OWNER_ALL_FASTFILE_SHARD_*_V1.json'))
          if len(paths)!=8: raise SystemExit(f'expected 8 shard manifests, got {len(paths)}')
          docs=[json.load(open(p,encoding='utf-8')) for p in paths]
          for d in docs:
              if d.get('format')!='t6-weapon-camo-owner-all-fastfile-shard-v1': raise SystemExit('unexpected shard format')
              if d.get('allFastFileCount')!=215: raise SystemExit('archive population mismatch')
          rows=sorted([r for d in docs for r in d['rows']],key=lambda r:r['globalIndex'])
          if len(rows)!=215 or [r['globalIndex'] for r in rows]!=list(range(215)):
              raise SystemExit('shards do not form exact 0..214 FastFile coverage')
          owners=[r for r in rows if r['weaponCamoCount']]
          # Historical exact canaries from raw MP parser must be reproduced.
          mp={r['zoneName']:r['weaponCamoCount'] for r in owners if r['zoneName'] in {'common_mp','common_patch_mp','patch_mp'}}
          if mp!={'common_mp':47,'common_patch_mp':48,'patch_mp':1}:
              raise SystemExit(f'MP canary counts changed: {mp!r}')
          doc={
              'format':'t6-weapon-camo-owner-all-fastfile-v1','archiveFastFileCount':215,
              'summary':{
                  'greenFastFileCount':len(rows),'ownerFastFileCount':len(owners),
                  'weaponCamoPhysicalXAssetCount':sum(r['weaponCamoCount'] for r in owners),
                  'nonOwnerFastFileCount':len(rows)-len(owners),
              },
              'ownerRows':owners,
              'allRows':rows,
              'proofBoundary':'Exact complete 215-FastFile top-level WEAPON_CAMO owner census. This closes the physical owner universe and counts only. Names/payloads/copy equivalence and base-vs-DLC labeling require native payload dumps plus exact archive/path provenance; runtime precedence is not inferred.',
          }
          out=pathlib.Path('/tmp/proof/T6_WEAPON_CAMO_OWNER_ALL_FASTFILE_V1.json'); out.write_text(json.dumps(doc,indent=2,sort_keys=True)+'\n')
          print(json.dumps(doc['summary'],indent=2,sort_keys=True)); print('OWNERS');
          for r in owners: print(r['weaponCamoCount'],r['zipPath'])
          print('sha256',hashlib.sha256(out.read_bytes()).hexdigest())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: T6_WEAPON_CAMO_OWNER_ALL_FASTFILE_V1
          path: /tmp/proof/T6_WEAPON_CAMO_OWNER_ALL_FASTFILE_V1.json
          if-no-files-found: error
          compression-level: 9
