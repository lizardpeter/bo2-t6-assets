name: T6 Plutonium archive t6mp census v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_plutonium_archive_t6mp_census_v1.py'
      - '.github/workflows/t6_plutonium_archive_t6mp_census_v1.yml'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate historical t6mp objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof
          python3 tools/t6_plutonium_archive_t6mp_census_v1.py \
            --out /tmp/proof/T6_PLUTONIUM_ARCHIVE_T6MP_CENSUS_V1.json
          sha256sum /tmp/proof/T6_PLUTONIUM_ARCHIVE_T6MP_CENSUS_V1.json
      - name: Upload census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_PLUTONIUM_ARCHIVE_T6MP_CENSUS_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
