name: T6 Plutonium archive t6mp census v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_plutonium_archive_t6mp_census_v1.py'
      - '.github/workflows/t6_plutonium_archive_t6mp_census_v1.yml'

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate historical t6mp objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof
          python3 tools/t6_plutonium_archive_t6mp_census_v1.py \
            --out /tmp/proof/T6_PLUTONIUM_ARCHIVE_T6MP_CENSUS_V1.json
          sha256sum /tmp/proof/T6_PLUTONIUM_ARCHIVE_T6MP_CENSUS_V1.json

      - name: Persist compact current archive census
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p manifests/engine checkpoints
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          src=Path('/tmp/proof/T6_PLUTONIUM_ARCHIVE_T6MP_CENSUS_V1.json')
          raw=src.read_bytes(); d=json.loads(raw)
          compact={
              'format':'t6-plutonium-archive-t6mp-census-summary-v1',
              'sourceFullCensus':{
                  'bytes':len(raw),
                  'sha256':hashlib.sha256(raw).hexdigest(),
              },
              'authority':d['authority'],
              'archive':d['archive'],
              'expectedRetailIdentity':d['expectedRetailIdentity'],
              'target':d['target'],
              'revisionsWithTargetCount':d['revisionsWithTargetCount'],
              'targetOccurrenceCount':d['targetOccurrenceCount'],
              'uniqueTargetObjectCount':d['uniqueTargetObjectCount'],
              'uniqueTargetObjects':d['uniqueTargetObjects'],
              'exactExpectedSizeObjectCount':d['exactExpectedSizeObjectCount'],
              'downloadedExactSizeObjects':d['downloadedExactSizeObjects'],
              'exactExpectedRetailMatches':d['exactExpectedRetailMatches'],
              'proofBoundary':d['proofBoundary'],
          }
          out=Path('manifests/engine/T6_PLUTONIUM_ARCHIVE_T6MP_CENSUS_SUMMARY_V1.json')
          out.write_text(json.dumps(compact,indent=2,sort_keys=True)+'\n')
          exact=len(compact['exactExpectedRetailMatches'])
          lines=[
              '# T6 Plutonium historical t6mp archive census — current',
              '',
              'This checkpoint is generated only after a complete fail-closed traversal of the revision list returned by the source-derived Plutonium updater archive endpoint.',
              '',
              '## Current census',
              '',
              f"- revisions: **{compact['archive']['revisionCount']}**",
              f"- revisions containing `games/t6mp.exe`: **{compact['revisionsWithTargetCount']}**",
              f"- unique t6mp objects: **{compact['uniqueTargetObjectCount']}**",
              f"- objects with the exact expected retail byte length: **{compact['exactExpectedSizeObjectCount']}**",
              f"- exact SHA-256 retail matches: **{exact}**",
              '',
              'Pinned retail identity:',
              '',
              f"- bytes: **{compact['expectedRetailIdentity']['bytes']}**",
              f"- SHA-256: `{compact['expectedRetailIdentity']['sha256']}`",
              '',
              'A same-name archive client is not promoted. Exact byte length and SHA-256 are both required.',
              '',
              '## Proof boundary',
              '',
              compact['proofBoundary'],
              ''
          ]
          Path('checkpoints/T6_PLUTONIUM_ARCHIVE_T6MP_CENSUS_CURRENT.md').write_text('\n'.join(lines))
          print(json.dumps({
              'revisionCount':compact['archive']['revisionCount'],
              'uniqueTargetObjectCount':compact['uniqueTargetObjectCount'],
              'exactExpectedSizeObjectCount':compact['exactExpectedSizeObjectCount'],
              'exactExpectedRetailMatchCount':exact,
              'fullCensusSha256':compact['sourceFullCensus']['sha256'],
          },sort_keys=True))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifests/engine/T6_PLUTONIUM_ARCHIVE_T6MP_CENSUS_SUMMARY_V1.json \
                  checkpoints/T6_PLUTONIUM_ARCHIVE_T6MP_CENSUS_CURRENT.md
          if git diff --cached --quiet; then
            echo 'Compact archive census unchanged.'
          else
            git commit -m 'Persist current Plutonium t6mp archive census'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_PLUTONIUM_ARCHIVE_T6MP_CENSUS_V1
          path: /tmp/proof/T6_PLUTONIUM_ARCHIVE_T6MP_CENSUS_V1.json
          if-no-files-found: error
          compression-level: 9
