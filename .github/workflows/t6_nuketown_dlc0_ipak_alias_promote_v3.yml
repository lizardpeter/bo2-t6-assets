name: T6 Nuketown DLC0 IPAK alias promote v3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_nuketown_dlc0_ipak_alias_promote_v3.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install LZO runtime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq liblzo2-2 >/dev/null
      - name: Regenerate exact eight-container census
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=tools python tools/t6_nuketown_shared_ipak_alias_census_v2.py \
            --alias-bank manifests/maps/mp_nuketown_2020/NUKETOWN_PACKED_IMAGE_CROSSFAMILY_ALIAS_BANK_V1.json.zlib.b64 \
            --out /tmp/T6_NUKETOWN_DLC0_IPAK_PACKED_IMAGE_ALIAS_CLOSURE_V3.json \
            https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/dlc0.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/dlc0_load_mp.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/mp.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/base.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/patch_mp.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/so.ipak \
            https://r2.houseofkublai.com/bo2/zone/english/en_base.ipak
      - name: Serialize canonical proof and checkpoint
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,json,zlib
          from pathlib import Path
          src=Path('/tmp/T6_NUKETOWN_DLC0_IPAK_PACKED_IMAGE_ALIAS_CLOSURE_V3.json')
          raw=src.read_bytes(); d=json.loads(raw); s=d['summary']
          expected={'aliasCount':81,'resolved':81,'missing':0,'conflict':0,'exactPair':81,'dataHashByteIdentical':0,'uniquePayloadCount':81}
          if s!=expected: raise SystemExit(f'unexpected summary {s}')
          if d.get('failures'): raise SystemExit(f"unexpected failures: {d['failures']}")
          stored=base64.b64encode(zlib.compress(raw,9))+b'\n'
          out=Path('manifests/maps/mp_nuketown_2020/T6_NUKETOWN_DLC0_IPAK_PACKED_IMAGE_ALIAS_CLOSURE_V3.json.zlib.b64')
          out.write_bytes(stored)
          raw_sha=hashlib.sha256(raw).hexdigest(); stored_sha=hashlib.sha256(stored.rstrip()).hexdigest()
          dlc0=[r for r in d['aliases'] if any('/dlc0.ipak' in m['container'] for m in r.get('matches',[]))]
          former={1,10,67,72,73,74,76}
          former_rows=[r for r in d['aliases'] if r['aliasIndex'] in former]
          if len(former_rows)!=7 or any(r['status']!='resolved' or r['resolution']!='exact-pair' for r in former_rows):
              raise SystemExit('former seven are not exact-pair closed')
          cp=Path('checkpoints/T6_NUKETOWN_PACKED_IMAGE_TEXTURES_81_OF_81_2026-09-06.md')
          cp.write_text(f'''# T6 Nuketown packed GfxImage textures — 81 / 81 exact\n\nThe pointer-proven packed GfxImage population for `mp_nuketown_2020` is now completely source-closed against the retail Nuketown/DLC0/shared IPAK set.\n\n## Canonical result\n\n- pointer-proven aliases: **81**\n- exact `(nameHash,dataHash)` matches: **81**\n- dataHash-only fallbacks: **0**\n- missing: **0**\n- conflicts: **0**\n- unique exact payloads: **81**\n\nThe seven aliases previously absent from the six-container census are all exact-pair members of retail `dlc0.ipak`; no generated, guessed, or similarly named substitute is used.\n\n## Retail IPAK set\n\n- `mp_nuketown_2020.ipak`\n- `dlc0.ipak`\n- `dlc0_load_mp.ipak`\n- `mp.ipak`\n- `base.ipak`\n- `patch_mp.ipak`\n- `so.ipak`\n- `en_base.ipak`\n\n## Proof artifact\n\n- raw JSON bytes: **{len(raw):,}**\n- raw SHA-256: `{raw_sha}`\n- stored zlib+base64 bytes: **{len(stored):,}**\n- stored SHA-256 (without trailing newline): `{stored_sha}`\n- DLC0-backed alias rows: **{len(dlc0)}**\n\nEvery payload was actually range-read and retail-decompressed using raw/LZO/`0xCF` skip semantics, CRC29-checked, parsed as IWI27, and dimension-matched to the retained pointer-proven GfxImage. Unknown compression commands remain fail-closed.\n\nThis checkpoint supersedes the earlier 74/81 shared-IPAK closure for this 81-alias population.\n''')
          print(json.dumps({'summary':s,'rawBytes':len(raw),'rawSha256':raw_sha,'storedBytes':len(stored),'storedSha256':stored_sha,'dlc0AliasRows':len(dlc0)},indent=2))
          PY
      - name: Commit canonical closure
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifests/maps/mp_nuketown_2020/T6_NUKETOWN_DLC0_IPAK_PACKED_IMAGE_ALIAS_CLOSURE_V3.json.zlib.b64 checkpoints/T6_NUKETOWN_PACKED_IMAGE_TEXTURES_81_OF_81_2026-09-06.md
          git commit -m 'Promote Nuketown packed image textures to 81 of 81 exact'
          git pull --rebase origin main
          git push
