name: T6 audio decoder registration probe v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_audio_decoder_registration_probe_v2.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXE_ID: 1NhLTmevZ5HPKRByj1ok8BpwbvX_5rc1n
      MAP_ID: 1kcCFEDP-gubgUyN6R_WjlJpFGoeZNEmd
      EXE_SHA256: f67eb68a494b93b5b229985205bdc94e26fdfe677663410e2207c25f6f27a55d
      MAP_SHA256: 34e16e517072031629307ffa0520d59f3c586539b943d081f60c59ee9ce1c3bf
    steps:
      - uses: actions/checkout@v4
      - name: Download exact references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref /tmp/probe
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.exe "https://drive.usercontent.google.com/download?id=$EXE_ID&export=download&confirm=t"
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.map "https://drive.usercontent.google.com/download?id=$MAP_ID&export=download&confirm=t"
          echo "$EXE_SHA256  /tmp/ref/CoDMPServer_PC.exe" | sha256sum -c -
          echo "$MAP_SHA256  /tmp/ref/CoDMPServer_PC.map" | sha256sum -c -
      - name: Install disassembler
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Trace decoder registration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import bisect, json, re, struct
          from pathlib import Path
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32

          exe=Path('/tmp/ref/CoDMPServer_PC.exe').read_bytes()
          mt=Path('/tmp/ref/CoDMPServer_PC.map').read_text('ascii', errors='strict')
          BASE=0x400000
          pe=struct.unpack_from('<I',exe,0x3c)[0]; coff=pe+4
          _,ns,_,_,_,osz,_=struct.unpack_from('<HHIIIHH',exe,coff); opt=coff+20
          assert struct.unpack_from('<I',exe,opt+28)[0]==BASE
          sections=[]; st=opt+osz
          for i in range(ns):
              o=st+i*40
              name=exe[o:o+8].split(b'\0',1)[0].decode('ascii','replace')
              vs,rva,rs,ro=struct.unpack_from('<IIII',exe,o+8)
              sections.append((name,BASE+rva,vs,rs,ro))
          text=next(s for s in sections if s[0]=='.text')
          _,tb,tvs,trs,tro=text
          code=exe[tro:tro+trs]

          syms=[]
          for ln in mt.splitlines():
              # Exact public/code MAP rows include absolute VA and trailing object.
              m=re.search(r'\s([0-9A-Fa-f]{8})\s+f\s+([^\s]+\.obj)\s*$',ln)
              if m:
                  va=int(m.group(1),16)
                  if tb <= va < tb+trs:
                      syms.append((va,ln.strip()))
          syms=sorted(set(syms)); vas=[x[0] for x in syms]
          def owner(va):
              i=bisect.bisect_right(vas,va)-1
              return syms[i] if i>=0 else (None,None)
          def nextsym(va):
              i=bisect.bisect_right(vas,va)
              return syms[i] if i<len(syms) else (tb+trs,None)

          # Raw little-endian absolute-address census catches references even when
          # whole-section linear disassembly stops at padding/data islands.
          lo,hi=0x00DE2000,0x00DE5000
          refs=[]
          for i in range(0,len(code)-3):
              v=struct.unpack_from('<I',code,i)[0]
              if lo <= v < hi:
                  va=tb+i
                  ova,ol=owner(va); nva,nl=nextsym(va)
                  refs.append({'instructionByteVa':f'0x{va:08X}','referenced':f'0x{v:08X}','ownerVa':f'0x{ova:08X}' if ova else None,'owner':ol,'nextSymbolVa':f'0x{nva:08X}' if nva else None})
          print('=== RAW ABSOLUTE DECODER-GLOBAL REFS ===')
          for x in refs: print(json.dumps(x,sort_keys=True))
          Path('/tmp/probe/raw_decoder_global_refs.json').write_text(json.dumps(refs,indent=2)+'\n')

          # Deduplicate owner functions and disassemble their exact MAP-bounded ranges.
          md=Cs(CS_ARCH_X86,CS_MODE_32)
          owners=[]
          for x in refs:
              if x['ownerVa'] and x['ownerVa'] not in [o['va'] for o in owners]:
                  ova=int(x['ownerVa'],16); nva=nextsym(ova)[0]
                  # Cap enormous accidental gaps while retaining normal functions.
                  end=min(nva,ova+0x1000)
                  off=tro+(ova-tb); rb=exe[off:off+(end-ova)]
                  lines=[f'{ins.address:08X}: {ins.bytes.hex():<24} {ins.mnemonic:<8} {ins.op_str}' for ins in md.disasm(rb,ova)]
                  rec={'va':x['ownerVa'],'owner':x['owner'],'end':f'0x{end:08X}','refs':sorted({r['referenced'] for r in refs if r['ownerVa']==x['ownerVa']}),'instructions':lines}
                  owners.append(rec)
                  print('=== OWNER',x['ownerVa'],x['owner'],'===')
                  for line in lines: print(line)
          Path('/tmp/probe/owner_functions.json').write_text(json.dumps(owners,indent=2)+'\n')

          # Sound MAP census: all SD_ code symbols and every code symbol originating
          # in sound-driver objects, without broad generic 'stream' noise.
          sd=[]; sound_objs=[]
          for ln in mt.splitlines():
              low=ln.lower()
              if re.search(r'\?[A-Za-z0-9_@?$]*SD_[A-Za-z0-9_@?$]*',ln,re.I) or re.search(r'\bSD_[A-Za-z0-9_]+',ln,re.I):
                  sd.append(ln.rstrip())
              if re.search(r'\s(sd_[a-z0-9_]+\.obj)\s*$',low):
                  sound_objs.append(ln.rstrip())
          Path('/tmp/probe/map_SD_symbols.txt').write_text('\n'.join(sd)+'\n')
          Path('/tmp/probe/map_sd_objects.txt').write_text('\n'.join(sound_objs)+'\n')
          print('=== MAP SD SYMBOLS ==='); print('\n'.join(sd))

          # Look specifically for init/register/interface/pcm/vorbis/flac terms in exact MAP.
          narrow=[]
          for ln in mt.splitlines():
              low=ln.lower()
              if any(t in low for t in ('decoderinit','decoder_init','decoderinterface','decoder_interface','pcm16','pcm_','vorbis','flac')):
                  narrow.append(ln.rstrip())
          Path('/tmp/probe/map_narrow_codec_symbols.txt').write_text('\n'.join(narrow)+'\n')
          print('=== NARROW CODEC SYMBOLS ==='); print('\n'.join(narrow))

          # Raw xrefs to exact create slots / pool bases, for sanity.
          targets=[0x00DE2514,0x00DE2538,0x00DE2698,0x00DE3054,0x00DE3E64]
          exact={f'0x{t:08X}':[r for r in refs if r['referenced']==f'0x{t:08X}'] for t in targets}
          Path('/tmp/probe/exact_targets.json').write_text(json.dumps(exact,indent=2)+'\n')
          print('=== EXACT TARGETS ==='); print(json.dumps(exact,indent=2))
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: T6_AUDIO_DECODER_REGISTRATION_PROBE_V2
          path: /tmp/probe
          if-no-files-found: error
          compression-level: 9
