name: SMG finalize Ghidra batch for graph

on:
  pull_request:
    paths:
      - 'smg/rmge01/trigger_finalize_batch3_v1.txt'
      - 'smg/rmge01/trigger_finalize_batch4_v1.txt'

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve batch and download latest successful exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test -f smg/rmge01/trigger_finalize_batch3_v1.txt; then BATCH=3; else BATCH=4; fi
          WF="smg_rmge01_ghidra_batch${BATCH}_v1.yml"
          ART="SMG_RMGE01_GHIDRA_BATCH${BATCH}_V1"
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?event=pull_request&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          test -n "$RUN_ID" -a "$RUN_ID" != "null"
          mkdir -p /tmp/batch
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ART" --dir /tmp/batch
          echo "BATCH=$BATCH" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Normalize exact-binary Ghidra output for graph
        run: |
          python - <<'PY'
          import base64,csv,hashlib,json,os,pathlib,shutil
          b=int(os.environ['BATCH']); run=int(os.environ['RUN_ID'])
          src=pathlib.Path('/tmp/batch')
          out=pathlib.Path(f'smg/rmge01/derived/ghidra_batch{b}_v1')
          out.mkdir(parents=True,exist_ok=True)
          exact_src=src/f'batch{b}_exact.jsonl'
          sum_src=src/f'batch{b}_exact_summary.json'
          dec_src=src/'smg-ghidra-out'/'decompile.tsv'
          for s,d in [(exact_src,out/exact_src.name),(sum_src,out/sum_src.name),(dec_src,out/'decompile.tsv')]:
              shutil.copyfile(s,d)
          exact={}
          for line in exact_src.read_text().splitlines():
              if line.strip():
                  r=json.loads(line); exact[r['id']]=r
          recs=[]
          with dec_src.open(newline='',encoding='utf-8') as f:
              for r in csv.DictReader(f,delimiter='\t'):
                  e=exact[r['id']]
                  success=r['success'].lower()=='true'
                  c=base64.b64decode(r['c_b64']).decode('utf-8','replace') if r['c_b64'] else ''
                  name=base64.b64decode(r['function_name_b64']).decode('utf-8','replace') if r['function_name_b64'] else ''
                  err=base64.b64decode(r['error_b64']).decode('utf-8','replace') if r['error_b64'] else ''
                  dis='\n'.join(f"{i['address']}: {i['bytes']}  {i['mnemonic']} {i['op_str']}".rstrip() for i in e['instructions'])+'\n'
                  recs.append({
                    'function_variant_id':r['id'],'address':r['address'],'size_bytes':int(r['size']),
                    'function_byte_sha256':e['byte_sha256'],'bytes_hex':e['bytes_hex'],
                    'disassembly':dis,'disassembly_sha256':hashlib.sha256(dis.encode()).hexdigest(),
                    'ghidra_success':success,'ghidra_function_name':name,'ghidra_c':c,
                    'ghidra_c_sha256':hashlib.sha256(c.encode()).hexdigest() if c else None,
                    'ghidra_error':err,'dol_sha256':e['dol_sha256'],
                    'producer':f'smg-rmge01-ghidra-batch{b}-v1','workflow_run_id':run
                  })
          (out/'graph_ready.jsonl').write_text('\n'.join(json.dumps(x,separators=(',',':')) for x in recs)+'\n')
          summary={'batch':b,'records':len(recs),'ghidra_success':sum(x['ghidra_success'] for x in recs),'ghidra_failed':sum(not x['ghidra_success'] for x in recs),'dol_sha256':'2c680585a8f58e1cc9c5521b579057f12b124ff0ef409e470a57606c50a93c09','workflow_run_id':run,'source_policy':'exact retail RMGE01 main.dol only; no community decompilation source used for semantics'}
          (out/'graph_ready_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          with (out/'SHA256SUMS.txt').open('w') as o:
              for p in sorted(out.iterdir()):
                  if p.name=='SHA256SUMS.txt': continue
                  o.write(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p)+'\n')
          print(summary)
          PY
      - name: Commit durable graph-ready batch
        run: |
          git config user.name 'smg-re-bot'
          git config user.email 'smg-re-bot@users.noreply.github.com'
          git add "smg/rmge01/derived/ghidra_batch${BATCH}_v1/"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SMG: retain exact RMGE01 Ghidra batch ${BATCH} graph records"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
