name: T6 Nuketown unresolved Material packed trace join v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_nuketown_unresolved_material_packed_trace_join_v1.py'
      - 'proof/T6_NUKETOWN_GFXIMAGE_PACKED_IDENTITY_TRACE_V2.json'
      - 'proof/T6_NUKETOWN_PRODUCTION_TEXTURE_PAYLOAD_COVERAGE_V1.json'
      - '.github/workflows/t6_nuketown_unresolved_material_packed_trace_join_v1.yml'
permissions:
  contents: write
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Project exact unresolved Material packed tuples
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_nuketown_unresolved_material_packed_trace_join_v1.py             --coverage proof/T6_NUKETOWN_PRODUCTION_TEXTURE_PAYLOAD_COVERAGE_V1.json             --trace proof/T6_NUKETOWN_GFXIMAGE_PACKED_IDENTITY_TRACE_V2.json             --out proof/T6_NUKETOWN_UNRESOLVED_MATERIAL_PACKED_TRACE_JOIN_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/T6_NUKETOWN_UNRESOLVED_MATERIAL_PACKED_TRACE_JOIN_V1.json'))
          s=d['summary']
          assert s=={
            'unresolvedProductionMaterialImageCount':347,
            'stablePackedTupleJoinCount':347,
            'crossRootTupleConflictCount':0,
            'absentFromPackedTraceCount':0,
          }
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/T6_NUKETOWN_UNRESOLVED_MATERIAL_PACKED_TRACE_JOIN_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact 347-image packed trace join'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_UNRESOLVED_MATERIAL_PACKED_TRACE_JOIN_V1
          path: proof/T6_NUKETOWN_UNRESOLVED_MATERIAL_PACKED_TRACE_JOIN_V1.json
          if-no-files-found: error
