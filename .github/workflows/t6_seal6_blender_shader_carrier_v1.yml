name: T6 SEAL6 Blender exact shader carrier v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/seal6-material-closure
    paths:
      - '.github/workflows/t6_seal6_blender_shader_carrier_v1.yml'
      - 'tools/t6_blender_import_xmodel_shader_carrier_v1.py'
      - 'tools/t6_gltf_augment_xmodel_shader_attributes_v1.py'

permissions:
  contents: read
  actions: read

jobs:
  blender-carrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen exact V2 shader-attribute GLB
        uses: actions/download-artifact@v4
        with:
          name: T6_SEAL6_FULL_RETAIL_SHADER_ATTRIBUTE_CARRIER_V2
          run-id: 34186012958
          github-token: ${{ github.token }}
          repository: lizardpeter/bo2-t6-assets
          path: /tmp/source

      - name: Pin source carrier and install Blender
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=/tmp/source/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_ATTRIBUTES_V2.glb
          if [[ ! -s "$SOURCE" ]]; then
            SOURCE=$(find /tmp/source -type f -name 'T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_ATTRIBUTES_V2.glb' -print -quit)
          fi
          test -n "$SOURCE" && test -s "$SOURCE"
          echo 'b0543f983731afb8cb45d73ebd581026b53a23cf21d08a4178047fcacd5c8a20  '"$SOURCE" | sha256sum -c -
          mkdir -p /tmp/out /tmp/proof
          cp "$SOURCE" /tmp/out/source_shader_carrier_v2.glb
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy >/dev/null
          blender --version | head -3 | tee /tmp/proof/blender_version.txt
          python3 -m py_compile tools/t6_gltf_augment_xmodel_shader_attributes_v1.py tools/t6_blender_import_xmodel_shader_carrier_v1.py

      - name: Import normal carrier and inject exact T6 shader attributes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools blender --background \
            --python tools/t6_blender_import_xmodel_shader_carrier_v1.py -- \
            --source /tmp/out/source_shader_carrier_v2.glb \
            --output /tmp/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_CARRIER_V1.blend \
            --report /tmp/proof/T6_SEAL6_BLENDER_SHADER_CARRIER_V1.json \
            2>&1 | tee /tmp/proof/build.log
          grep -F 'T6_BLENDER_SHADER_CARRIER_V1=' /tmp/proof/build.log
          test -s /tmp/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_CARRIER_V1.blend
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/proof/T6_SEAL6_BLENDER_SHADER_CARRIER_V1.json'))
          assert d['format']=='t6-blender-import-xmodel-shader-carrier-v1'
          assert d['sourceSha256']=='b0543f983731afb8cb45d73ebd581026b53a23cf21d08a4178047fcacd5c8a20'
          assert d['geometry']=={'primitives':14,'vertices':13490,'triangles':14968,'joints':102,'materials':12,'animations':6}
          p=d['vertexSequenceProof']
          assert p['positionSequenceExact'] and p['uvSequenceExact'] and p['namedSkinWeightSequenceExact']
          assert d['shaderAttributeInjection']['allValuesReadBackExactWithinFloat32Tolerance'] is True
          assert set(d['shaderAttributeInjection']['attributes'])=={
            '_T6_COLOR_RGBA','_T6_XMODEL_NORMAL','_T6_XMODEL_TANGENT','_T6_TANGENT_HANDEDNESS'
          }
          assert all(x['domain']=='POINT' and x['count']==13490 for x in d['shaderAttributeInjection']['attributes'].values())
          assert d['color0Present'] is False and d['standardTangentPresent'] is False
          assert d['completeRetailPixelOutput'] is False
          print(json.dumps(d,indent=2,sort_keys=True))
          PY

      - name: Reopen saved Blender carrier and reverify exact attributes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools blender --background \
            /tmp/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_CARRIER_V1.blend \
            --python tools/t6_blender_import_xmodel_shader_carrier_v1.py -- \
            --source /tmp/out/source_shader_carrier_v2.glb \
            --verify-existing \
            --report /tmp/proof/T6_SEAL6_BLENDER_SHADER_CARRIER_V1_REOPEN.json \
            2>&1 | tee /tmp/proof/reopen.log
          grep -F 'T6_BLENDER_SHADER_CARRIER_V1_REOPEN=' /tmp/proof/reopen.log
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/proof/T6_SEAL6_BLENDER_SHADER_CARRIER_V1_REOPEN.json'))
          assert d['sourceSha256']=='b0543f983731afb8cb45d73ebd581026b53a23cf21d08a4178047fcacd5c8a20'
          assert d['vertexSequenceProof']['positionSequenceExact'] is True
          assert d['vertexSequenceProof']['uvSequenceExact'] is True
          assert d['vertexSequenceProof']['namedSkinWeightSequenceExact'] is True
          assert d['shaderAttributes']['reopenedAttributesExact'] is True
          assert d['shaderAttributes']['verticesVerified']==13490
          assert d['materials']==12 and d['animations']==6 and d['armatures']==1
          assert d['color0Present'] is False
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
          sha256sum /tmp/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_CARRIER_V1.blend \
            | tee /tmp/proof/BLEND_SHA256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_CARRIER_V1
          path: |
            /tmp/out/T6_SEAL6_SMG_LOD0_FULL_RETAIL_SHADER_CARRIER_V1.blend
            /tmp/proof
          if-no-files-found: error
          compression-level: 0
