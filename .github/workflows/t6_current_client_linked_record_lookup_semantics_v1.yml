name: T6 current client linked record lookup semantics v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_linked_record_lookup_semantics_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_GLOBAL_XREF_PROBE_V1.json'
      - '.github/workflows/t6_current_client_linked_record_lookup_semantics_v1.yml'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Project and validate exact lookup semantics
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_linked_record_lookup_semantics_v1.py proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_GLOBAL_XREF_PROBE_V1.json --out proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_LOOKUP_SEMANTICS_V1.json
          python3 - <<'PY'
          import json
          j=json.load(open('proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_LOOKUP_SEMANTICS_V1.json'))
          assert j['directLookup']['terminalReturnPayloadDwordOffset'] == 4
          assert j['exactFindings']['payloadDwordOffset'] == 4
          assert j['exactFindings']['collisionLinkWordOffset'] == 10
          assert j['exactFindings']['secondaryLinkWordOffset'] == 12
          assert j['exactFindings']['directLookupReturnsPayloadDword'] is True
          assert j['exactFindings']['independentPayloadConsumerCount'] == 2
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_LOOKUP_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist current-client linked-record lookup semantics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

