name: T6 Nuketown shared IPAK alias census v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_nuketown_shared_ipak_alias_census_v1.yml'
      - 'tools/t6_nuketown_shared_ipak_alias_census_v1.py'
      - 'tools/t6_ipak_http_range_v1.py'
      - 'manifests/maps/mp_nuketown_2020/NUKETOWN_PACKED_IMAGE_CROSSFAMILY_ALIAS_BANK_V1.json.zlib.b64'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install LZO runtime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq liblzo2-2 >/dev/null
      - name: Resolve and validate all retained packed image aliases
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=tools python tools/t6_nuketown_shared_ipak_alias_census_v1.py \
            --alias-bank manifests/maps/mp_nuketown_2020/NUKETOWN_PACKED_IMAGE_CROSSFAMILY_ALIAS_BANK_V1.json.zlib.b64 \
            --out /tmp/T6_NUKETOWN_SHARED_IPAK_PACKED_IMAGE_ALIAS_CENSUS_V1.json \
            https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/mp.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/base.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/patch_mp.ipak \
            https://r2.houseofkublai.com/bo2/zone/all/so.ipak \
            https://r2.houseofkublai.com/bo2/zone/english/en_base.ipak \
            | tee /tmp/summary.txt
          python - <<'PY'
          import json
          d=json.load(open('/tmp/T6_NUKETOWN_SHARED_IPAK_PACKED_IMAGE_ALIAS_CENSUS_V1.json'))
          print('SUMMARY',json.dumps(d['summary'],sort_keys=True))
          print('CONTAINER_USE',json.dumps(d['containerUse'],sort_keys=True))
          print('FAILURES',json.dumps(d['failures'][:20],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t6-nuketown-shared-ipak-alias-census-v1
          path: |
            /tmp/T6_NUKETOWN_SHARED_IPAK_PACKED_IMAGE_ALIAS_CENSUS_V1.json
            /tmp/summary.txt
          if-no-files-found: error
