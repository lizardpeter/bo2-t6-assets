name: T6 current client persistent zone runtime loop projection v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_zone_persistent_runtime_loop_v1.py'
      - '.github/workflows/t6_current_client_zone_persistent_runtime_loop_v1.yml'
      - 'proof/current_client/T6_CURRENT_CLIENT_ZONE_PERSISTENT_GLOBAL_XREF_PROBE_V1.json'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Project exact current-client runtime loop
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_zone_persistent_runtime_loop_v1.py             --xref-proof proof/current_client/T6_CURRENT_CLIENT_ZONE_PERSISTENT_GLOBAL_XREF_PROBE_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_ZONE_PERSISTENT_RUNTIME_LOOP_V1.json | tee /tmp/summary.log
          python3 - <<'PY'
          import json
          p='proof/current_client/T6_CURRENT_CLIENT_ZONE_PERSISTENT_RUNTIME_LOOP_V1.json'
          j=json.load(open(p))
          assert j['recordGeometry']['strideBytes']==68
          assert j['runtimeLoop']['firstPass']['predicate']['mask']=='0x00008000'
          assert j['proven']['persistentRecordAndClassifierArePassedTogetherTo0x007fdf40'] is True
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_ZONE_PERSISTENT_RUNTIME_LOOP_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact current-client persistent zone runtime loop'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_ZONE_PERSISTENT_RUNTIME_LOOP_V1
          path: |
            proof/current_client/T6_CURRENT_CLIENT_ZONE_PERSISTENT_RUNTIME_LOOP_V1.json
            /tmp/summary.log
          if-no-files-found: error
          compression-level: 9
