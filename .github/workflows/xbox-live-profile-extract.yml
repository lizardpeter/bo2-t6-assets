name: Reconstruct additional Xbox 360 profiles

on:
  push:
    branches:
      - tmp-xbox-live-profile-extract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install EWF tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ewf-tools fuse3 jq

      - name: Build raw-offset STFS reconstructor
        run: |
          set -euxo pipefail
          mkdir -p /tmp/stfs-raw-reconstruct/src
          cat > /tmp/stfs-raw-reconstruct/Cargo.toml <<'EOF'
          [package]
          name = "stfs-raw-reconstruct"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          sha1 = "0.11"
          sha2 = "0.10"
          hex = "0.4"
          serde_json = "1"
          EOF

          cat > /tmp/stfs-raw-reconstruct/src/main.rs <<'EOF'
          use sha1::{Digest as Sha1Digest, Sha1};
          use sha2::{Digest as Sha2Digest, Sha256};
          use serde_json::json;
          use std::collections::{HashMap, HashSet};
          use std::env;
          use std::fs::{self, File};
          use std::io::{Read, Seek, SeekFrom};
          use std::path::Path;

          const DATA_PARTITION_OFFSET: u64 = 0x1_30EB_0000;
          const SUPERBLOCK_SIZE: u64 = 0x1000;
          const SECTOR_SIZE: u64 = 0x200;
          const STFS_BLOCK: usize = 0x1000;

          fn align_up(v:u64,a:u64)->u64{(v+a-1)&!(a-1)}
          fn sha1_bytes(data:&[u8])->[u8;20]{let mut h=Sha1::new();h.update(data);h.finalize().into()}
          fn sha256_hex(data:&[u8])->String{let mut h=Sha256::new();h.update(data);hex::encode(h.finalize())}
          fn be_u32(b:&[u8],o:usize)->u32{u32::from_be_bytes(b[o..o+4].try_into().unwrap())}
          fn package_data_offset(header_size:u32,logical:u32)->usize{
              let data_start=align_up(header_size as u64,0x1000) as usize;
              data_start+((logical as usize)+2)*STFS_BLOCK
          }

          fn main(){
              let raw_path=env::args().nth(1).expect("raw");
              let out_dir=env::args().nth(2).expect("out");
              let profile_name=env::args().nth(3).expect("profile");
              let raw_offset_s=env::args().nth(4).expect("raw offset hex");
              let profile_start=u64::from_str_radix(raw_offset_s.trim_start_matches("0x"),16).unwrap();
              fs::create_dir_all(&out_dir).unwrap();

              let mut raw=File::open(&raw_path).unwrap();
              let raw_size=raw.seek(SeekFrom::End(0)).unwrap();
              raw.seek(SeekFrom::Start(profile_start)).unwrap();
              let mut seed=vec![0u8;1024*1024];
              raw.read_exact(&mut seed).unwrap();
              assert_eq!(&seed[0..4],b"CON ");

              let header_size=be_u32(&seed,0x340);
              let data_start=align_up(header_size as u64,0x1000) as usize;
              let vd=0x379usize;
              let root_active=(seed[vd+2]>>1)&1;
              let total_stfs_blocks=be_u32(&seed,vd+0x1C) as usize;
              assert!(total_stfs_blocks>0 && total_stfs_blocks<0xAA);
              let package_len=data_start+(total_stfs_blocks+2)*STFS_BLOCK;
              let mut partial=seed[..package_len].to_vec();

              let active_hash_off=data_start+root_active as usize*STFS_BLOCK;
              let root_hash=&partial[vd+8..vd+28];
              let active_table_sha=sha1_bytes(&partial[active_hash_off..active_hash_off+STFS_BLOCK]);
              assert_eq!(&active_table_sha[..],root_hash,"active L0 does not match root");

              let profile_id=hex::encode_upper(&partial[0x371..0x379]);
              let title_id=be_u32(&partial,0x360);
              let content_type=be_u32(&partial,0x344);
              assert_eq!(profile_id,profile_name);
              assert_eq!(title_id,0xFFFE07D1);
              assert_eq!(content_type,0x00010000);

              let zero_hash=sha1_bytes(&vec![0u8;STFS_BLOCK]);
              let mut expected=Vec::with_capacity(total_stfs_blocks);
              let mut target_hashes=HashSet::new();
              let mut initial_valid=0usize;

              for logical in 0..total_stfs_blocks{
                  let ent=active_hash_off+logical*24;
                  let mut exp=[0u8;20];
                  exp.copy_from_slice(&partial[ent..ent+20]);
                  expected.push(exp);
                  let poff=package_data_offset(header_size,logical as u32);
                  let act=sha1_bytes(&partial[poff..poff+STFS_BLOCK]);
                  if act==exp{initial_valid+=1;}else if exp!=zero_hash{target_hashes.insert(exp);}
              }

              println!("{profile_name}: header=0x{header_size:X} raw=0x{profile_start:X} root_active={root_active} logical={total_stfs_blocks} initial={initial_valid}/{total_stfs_blocks}");

              let mut found:HashMap<[u8;20],(Vec<u8>,u64,&'static str)>=HashMap::new();

              for off in (0..partial.len()).step_by(STFS_BLOCK){
                  if off+STFS_BLOCK>partial.len(){break;}
                  let h=sha1_bytes(&partial[off..off+STFS_BLOCK]);
                  if target_hashes.contains(&h)&&!found.contains_key(&h){
                      found.insert(h,(partial[off..off+STFS_BLOCK].to_vec(),profile_start+off as u64,"seed"));
                  }
              }

              if expected.iter().any(|h|*h==zero_hash){
                  found.insert(zero_hash,(vec![0u8;STFS_BLOCK],0,"zero"));
              }

              let mut remaining:HashSet<[u8;20]>=target_hashes.iter().copied().filter(|h|!found.contains_key(h)).collect();

              // Search +/- 2 GiB first.
              let local_radius=2u64*1024*1024*1024;
              let local_start=profile_start.saturating_sub(local_radius).max(DATA_PARTITION_OFFSET);
              let local_end=(profile_start+local_radius).min(raw_size);
              let mut buf=vec![0u8;8*1024*1024];
              raw.seek(SeekFrom::Start(local_start)).unwrap();
              let mut pos=local_start;
              while pos<local_end && !remaining.is_empty(){
                  let mut want=((local_end-pos) as usize).min(buf.len());
                  want-=want%STFS_BLOCK;
                  if want==0{break;}
                  raw.read_exact(&mut buf[..want]).unwrap();
                  for o in (0..want).step_by(STFS_BLOCK){
                      let h=sha1_bytes(&buf[o..o+STFS_BLOCK]);
                      if remaining.remove(&h){
                          found.insert(h,(buf[o..o+STFS_BLOCK].to_vec(),pos+o as u64,"disk-local"));
                      }
                  }
                  pos+=want as u64;
              }

              // Full XTAF data scan only if needed.
              if !remaining.is_empty(){
                  raw.seek(SeekFrom::Start(DATA_PARTITION_OFFSET)).unwrap();
                  let mut sb=[0u8;0x1000];
                  raw.read_exact(&mut sb).unwrap();
                  assert_eq!(&sb[0..4],b"XTAF");
                  let spc=be_u32(&sb,8) as u64;
                  let cluster_size=spc*SECTOR_SIZE;
                  let part_size=raw_size-DATA_PARTITION_OFFSET;
                  let total_clusters=(part_size-SUPERBLOCK_SIZE)/cluster_size;
                  let total_sectors=(part_size/SECTOR_SIZE)-(SUPERBLOCK_SIZE/SECTOR_SIZE);
                  let cluster_estimate=total_sectors.saturating_sub(260)/spc;
                  let fat_entry_size=if cluster_estimate>=65520{4u64}else{2u64};
                  let fat_size=align_up(total_clusters*fat_entry_size,0x1000);
                  let data_abs=DATA_PARTITION_OFFSET+SUPERBLOCK_SIZE+fat_size;
                  raw.seek(SeekFrom::Start(data_abs)).unwrap();
                  let data_bytes=total_clusters*cluster_size;
                  let mut processed=0u64;
                  while processed<data_bytes && !remaining.is_empty(){
                      let mut want=((data_bytes-processed) as usize).min(buf.len());
                      want-=want%STFS_BLOCK;
                      if want==0{break;}
                      raw.read_exact(&mut buf[..want]).unwrap();
                      for o in (0..want).step_by(STFS_BLOCK){
                          let h=sha1_bytes(&buf[o..o+STFS_BLOCK]);
                          if remaining.remove(&h){
                              found.insert(h,(buf[o..o+STFS_BLOCK].to_vec(),data_abs+processed+o as u64,"disk-full"));
                          }
                      }
                      processed+=want as u64;
                  }
              }

              let mut rebuilt=partial.clone();
              let mut sources=Vec::new();
              for logical in 0..total_stfs_blocks{
                  let poff=package_data_offset(header_size,logical as u32);
                  let exp=expected[logical];
                  let cur=sha1_bytes(&rebuilt[poff..poff+STFS_BLOCK]);
                  let (source,raw_off)=if cur==exp{
                      ("contiguous",Some(profile_start+poff as u64))
                  }else if exp==zero_hash{
                      rebuilt[poff..poff+STFS_BLOCK].fill(0);
                      ("zero",None)
                  }else if let Some((bytes,abs,kind))=found.get(&exp){
                      rebuilt[poff..poff+STFS_BLOCK].copy_from_slice(bytes);
                      (*kind,Some(*abs))
                  }else{
                      ("missing",None)
                  };
                  sources.push(json!({
                      "logical_block":logical,
                      "expected_sha1":hex::encode(exp),
                      "source":source,
                      "raw_offset":raw_off.map(|x|format!("0x{x:X}"))
                  }));
              }

              let mut good=0usize;
              let mut bad=Vec::new();
              for logical in 0..total_stfs_blocks{
                  let poff=package_data_offset(header_size,logical as u32);
                  if sha1_bytes(&rebuilt[poff..poff+STFS_BLOCK])==expected[logical]{good+=1;}else{bad.push(logical);}
              }
              println!("{profile_name}: rebuilt {good}/{total_stfs_blocks}, missing={bad:?}");

              let package_dir=Path::new(&out_dir).join("reconstructed");
              fs::create_dir_all(&package_dir).unwrap();
              fs::write(package_dir.join(&profile_name),&rebuilt).unwrap();
              let manifest=json!({
                  "profile":profile_name,
                  "raw_offset":format!("0x{profile_start:X}"),
                  "header_size":header_size,
                  "logical_blocks":total_stfs_blocks,
                  "initial_valid":initial_valid,
                  "rebuilt_valid":good,
                  "missing_logical_blocks":bad,
                  "rebuilt_sha256":sha256_hex(&rebuilt),
                  "sources":sources
              });
              fs::write(Path::new(&out_dir).join("manifest.json"),serde_json::to_vec_pretty(&manifest).unwrap()).unwrap();
              if good!=total_stfs_blocks{std::process::exit(4);}
          }
          EOF
          cargo build --release --manifest-path /tmp/stfs-raw-reconstruct/Cargo.toml

      - name: Download image and reconstruct both profiles
        run: |
          set -euxo pipefail
          IMAGE=DRIVE2_TIME_FINAL.E01
          URL="https://digitalcorpora.s3.amazonaws.com/corpora/drives/nps-2014-xbox1/$IMAGE"
          ROOT=/tmp/additional-profiles
          mkdir -p "$ROOT"
          sudo mkdir -p /mnt/xbox-ewf
          sudo modprobe fuse || true
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 \
            --speed-time 120 --speed-limit 1024 "$URL" -o "/tmp/$IMAGE"
          sha256sum "/tmp/$IMAGE" | tee "$ROOT/source-image.sha256"
          sudo ewfmount "/tmp/$IMAGE" /mnt/xbox-ewf

          declare -A OFFSETS
          OFFSETS[E00000FFAEF79876]=0x149B69000
          OFFSETS[E00004D4AEF799DA]=0x149BED000

          RC=0
          for PROFILE in E00000FFAEF79876 E00004D4AEF799DA; do
            OUT="$ROOT/$PROFILE"
            mkdir -p "$OUT"
            set +e
            sudo /tmp/stfs-raw-reconstruct/target/release/stfs-raw-reconstruct \
              /mnt/xbox-ewf/ewf1 "$OUT" "$PROFILE" "${OFFSETS[$PROFILE]}" \
              | tee "$OUT/reconstruct.log"
            X=${PIPESTATUS[0]}
            set -e
            if [ "$X" -ne 0 ]; then RC="$X"; fi
          done

          sudo fusermount3 -u /mnt/xbox-ewf || sudo umount /mnt/xbox-ewf || true
          sudo chown -R "$USER":"$USER" "$ROOT"
          find "$ROOT" -type f -printf '%p %s bytes\n' | sort
          exit "$RC"

      - name: Extract reconstructed packages and summarize FIT
        if: always()
        run: |
          set -euxo pipefail
          ROOT=/tmp/additional-profiles
          mkdir -p "$ROOT"
          git clone --depth 1 https://github.com/MVEALNG/NXE-Dashboard-Recomp.git /tmp/nxe-dashboard
          for PROFILE in E00000FFAEF79876 E00004D4AEF799DA; do
            PKG="$ROOT/$PROFILE/reconstructed/$PROFILE"
            [ -f "$PKG" ] || continue
            DEST="$ROOT/$PROFILE/unpacked"
            mkdir -p "$DEST"
            python3 /tmp/nxe-dashboard/tools/extract_stfs.py "$PKG" "$DEST" | tee "$DEST/extract.log" || true
            python3 - "$PROFILE" "$DEST" <<'PY'
          import hashlib,json,os,struct,sys
          profile,dest=sys.argv[1],sys.argv[2]
          report={"profile":profile,"files":[]}
          for root,_,files in os.walk(dest):
              for fn in sorted(files):
                  p=os.path.join(root,fn)
                  rel=os.path.relpath(p,dest)
                  b=open(p,"rb").read()
                  report["files"].append({"path":rel,"size":len(b),"sha256":hashlib.sha256(b).hexdigest()})
          fit=os.path.join(dest,"FFFE07D1.fit")
          if os.path.isfile(fit):
              b=open(fit,"rb").read()
              if b[:4]==b"XDBF":
                  _,ver,cap,count,freecap,freecount=struct.unpack_from(">4sIIIII",b,0)
                  base=0x18+cap*0x12+freecap*8
                  rec=[]
                  for i in range(count):
                      off=0x18+i*0x12
                      ns=struct.unpack_from(">H",b,off)[0]
                      rid=struct.unpack_from(">Q",b,off+2)[0]
                      spec=struct.unpack_from(">I",b,off+10)[0]
                      ln=struct.unpack_from(">I",b,off+14)[0]
                      data=b[base+spec:base+spec+ln]
                      rec.append({
                        "namespace":ns,"id":f"{rid:016X}","length":ln,
                        "address_specifier":f"0x{spec:08X}",
                        "sha256":hashlib.sha256(data).hexdigest(),
                        "hex":data.hex()
                      })
                  report["fit"]={"size":len(b),"version":ver,"entry_count":count,"records":rec}
          open(os.path.join(os.path.dirname(dest),"summary.json"),"w").write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
          done

      - name: Upload additional profile reconstructions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xbox360-additional-profile-reconstructions
          path: /tmp/additional-profiles
          if-no-files-found: warn
          retention-days: 7
