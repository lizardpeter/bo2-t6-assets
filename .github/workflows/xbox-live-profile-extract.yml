name: Scan damaged Xbox 360 profile header

on:
  push:
    branches:
      - tmp-xbox-live-profile-extract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install EWF tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ewf-tools fuse3 jq

      - name: Download and mount DRIVE2 final
        run: |
          set -euxo pipefail
          IMAGE=DRIVE2_TIME_FINAL.E01
          URL="https://digitalcorpora.s3.amazonaws.com/corpora/drives/nps-2014-xbox1/$IMAGE"
          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 \
            --speed-time 120 --speed-limit 1024 "$URL" -o "/tmp/$IMAGE"
          mkdir -p /tmp/profile-header-scan
          sha256sum "/tmp/$IMAGE" | tee /tmp/profile-header-scan/source-image.sha256
          sudo mkdir -p /mnt/xbox-ewf
          sudo modprobe fuse || true
          sudo ewfmount "/tmp/$IMAGE" /mnt/xbox-ewf
          sudo stat /mnt/xbox-ewf/ewf1

      - name: Scan raw image for STFS profile headers
        run: |
          set -euxo pipefail
          sudo python3 - <<'PY'
          import hashlib, json, os, struct

          RAW="/mnt/xbox-ewf/ewf1"
          OUT="/tmp/profile-header-scan"
          TARGET="E00000DEAEF799DA"

          def u32be(b,o):
              return struct.unpack_from(">I",b,o)[0]

          def clean_name(buf):
              # STFS localized display-name slots are zero-padded. Try UTF-8 first,
              # then UTF-16BE/LE only as diagnostics.
              raw=buf.split(b"\x00",1)[0]
              vals={}
              for enc in ("utf-8","utf-16-be","utf-16-le"):
                  try:
                      s=raw.decode(enc,errors="strict").strip()
                      if s and all((31 < ord(c) < 127) or c.isspace() for c in s):
                          vals[enc]=s
                  except Exception:
                      pass
              return vals

          size=os.path.getsize(RAW)
          chunk=64*1024*1024
          overlap=0x1000
          candidates=[]
          seen=set()
          with open(RAW,"rb",buffering=0) as f:
              base=0
              tail=b""
              while base < size:
                  data=f.read(min(chunk,size-base))
                  if not data:
                      break
                  blob=tail+data
                  blob_base=base-len(tail)
                  p=0
                  while True:
                      i=blob.find(b"CON ",p)
                      if i<0:
                          break
                      abs_off=blob_base+i
                      p=i+1
                      if abs_off in seen:
                          continue
                      seen.add(abs_off)
                      if i+0x1000 > len(blob):
                          # fetch directly for boundary hit
                          cur=f.tell()
                          f.seek(abs_off)
                          h=f.read(0x1000)
                          f.seek(cur)
                      else:
                          h=blob[i:i+0x1000]
                      if len(h)<0x411:
                          continue
                      try:
                          content_type=u32be(h,0x344)
                          metadata_version=u32be(h,0x348)
                          title_id=u32be(h,0x360)
                          profile_id=h[0x371:0x379].hex().upper()
                          console_id_hash=hashlib.sha256(h[0x36C:0x371]).hexdigest()
                          vd_off=0x379
                          vd=h[vd_off:vd_off+0x24]
                          if len(vd)==0x24:
                              vd_size=vd[0]
                              block_sep=vd[2]
                              file_table_blocks=int.from_bytes(vd[3:5],"big")
                              file_table_block=int.from_bytes(vd[5:8],"big")
                              top_hash=vd[8:28].hex()
                              allocated=int.from_bytes(vd[28:32],"big")
                              unallocated=int.from_bytes(vd[32:36],"big")
                          else:
                              vd_size=block_sep=file_table_blocks=file_table_block=allocated=unallocated=None
                              top_hash=None
                          cand={
                              "raw_offset":f"0x{abs_off:X}",
                              "content_type":f"0x{content_type:08X}",
                              "metadata_version":metadata_version,
                              "title_id":f"{title_id:08X}",
                              "profile_id":profile_id,
                              "display_name_candidates":clean_name(h[0x411:0x491]),
                              "console_id_sha256":console_id_hash,
                              "volume_descriptor":{
                                  "size":vd_size,
                                  "block_separation":block_sep,
                                  "file_table_block_count":file_table_blocks,
                                  "file_table_block_number":file_table_block,
                                  "top_hash":top_hash,
                                  "allocated_block_count":allocated,
                                  "unallocated_block_count":unallocated
                              },
                              "target_profile_id_match": profile_id==TARGET,
                              "looks_like_profile": content_type==0x00010000 and title_id==0xFFFE07D1
                          }
                          if cand["looks_like_profile"] or cand["target_profile_id_match"]:
                              candidates.append(cand)
                              print(json.dumps(cand,sort_keys=True))
                      except Exception as e:
                          pass
                  tail=blob[-overlap:]
                  base += len(data)
                  if base % (1024*1024*1024) < chunk:
                      print(f"progress {base/(1024**3):.2f}/{size/(1024**3):.2f} GiB candidates={len(candidates)}")
          os.makedirs(OUT,exist_ok=True)
          with open(os.path.join(OUT,"candidates.json"),"w") as g:
              json.dump(candidates,g,indent=2)
          target=[c for c in candidates if c["target_profile_id_match"]]
          with open(os.path.join(OUT,"target.json"),"w") as g:
              json.dump(target,g,indent=2)
          print(f"PROFILE_CANDIDATES={len(candidates)} TARGET_MATCHES={len(target)}")
          PY
          sudo chown -R "$USER":"$USER" /tmp/profile-header-scan
          cat /tmp/profile-header-scan/candidates.json
          cat /tmp/profile-header-scan/target.json

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xbox360-damaged-profile-header-scan
          path: /tmp/profile-header-scan
          if-no-files-found: warn
          retention-days: 7
