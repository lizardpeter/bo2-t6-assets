name: T6 primary lightmap object provenance one-shot

on:
  push:
    paths:
      - '.github/workflows/t6_primary_lightmap_object_provenance_one_shot.yml'

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run retained-proof projector
        run: |
          set -euo pipefail
          python tools/t6_current_client_primary_lightmap_writer_object_provenance_v1.py             --callers proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_SAMPLER_CALLERS_V1.json             --transfer-helper proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_PAYLOAD_EXCHANGE_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_WRITER_OBJECT_PROVENANCE_V1.json

      - name: Commit proof
        run: |
          set -euo pipefail
          git config user.name "uregraph-re-bot"
          git config user.email "uregraph-re-bot@users.noreply.github.com"
          git add proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_WRITER_OBJECT_PROVENANCE_V1.json
          if git diff --cached --quiet; then
            echo "No proof changes."
          else
            git commit -m "Reclassify T6 primary lightmap overlap writers by object provenance"
            git push
          fi

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_PRIMARY_LIGHTMAP_OBJECT_PROVENANCE
          path: proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_WRITER_OBJECT_PROVENANCE_V1.json
          if-no-files-found: error
