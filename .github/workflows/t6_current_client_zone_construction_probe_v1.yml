name: T6 current client zone construction probe v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_instruction_operand_xref_probe_v1.py'
      - 'tools/t6_current_client_xzoneinfo_row_probe_v1.py'
      - 'tools/t6_current_client_fastfile_name_construction_probe_v1.py'
      - '.github/workflows/t6_current_client_zone_construction_probe_v1.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install disassembler
        run: python3 -m pip install --disable-pip-version-check -q capstone==5.0.6

      - name: Recover exact current client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof /tmp/client
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          ua='bo2-t6-assets-zone-construction/1'
          endpoints=[
              'https://cdn.plutoniummod.com/updater/prod/info.json',
              'https://cdn.plutonium.pw/updater/prod/info.json',
          ]
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua})
              with urllib.request.urlopen(req,timeout=180) as r:
                  return r.read()
          info=None
          for endpoint in endpoints:
              try:
                  info=json.loads(get(endpoint)); break
              except Exception:
                  pass
          if info is None:
              raise SystemExit('no current CDN info endpoint')
          rows=[x for x in info['files'] if x.get('name','').replace('\\','/').lower()=='games/t6mp.exe']
          if len(rows)!=1:
              raise SystemExit(f'expected one games/t6mp.exe, got {len(rows)}')
          rec=rows[0]
          raw=get(info['baseUrl']+rec['hash'])
          sha1=hashlib.sha1(raw).hexdigest()
          sha256=hashlib.sha256(raw).hexdigest()
          if len(raw)!=int(rec['size']) or sha1!=rec['hash'].lower():
              raise SystemExit('CDN identity mismatch')
          if str(info.get('revision'))!='5346':
              raise SystemExit(f'unexpected revision {info.get("revision")}')
          if sha256!='770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf':
              raise SystemExit(f'current client changed: sha256={sha256}')
          Path('/tmp/client/t6mp.exe').write_bytes(raw)
          Path('/tmp/client/revision').write_text(str(info.get('revision')))
          print(json.dumps({'revision':info.get('revision'),'bytes':len(raw),'sha1':sha1,'sha256':sha256},sort_keys=True))
          PY

      - name: Run decoded-operand xref census
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/t6_current_client_instruction_operand_xref_probe_v1.py
          python3 tools/t6_current_client_instruction_operand_xref_probe_v1.py             /tmp/client/t6mp.exe             --revision "$(cat /tmp/client/revision)"             --out /tmp/proof/T6_CURRENT_CLIENT_INSTRUCTION_OPERAND_XREF_PROBE_V1.json             | tee /tmp/proof/xref_summary.log

      - name: Run structural XZoneInfo-row comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/t6_current_client_xzoneinfo_row_probe_v1.py
          python3 tools/t6_current_client_xzoneinfo_row_probe_v1.py             /tmp/client/t6mp.exe             --revision "$(cat /tmp/client/revision)"             --out /tmp/proof/T6_CURRENT_CLIENT_XZONEINFO_ROW_PROBE_V1.json             | tee /tmp/proof/xzoneinfo_summary.log

      - name: Run exact fastfile-name constructor and buffer-use probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/t6_current_client_fastfile_name_construction_probe_v1.py
          python3 tools/t6_current_client_fastfile_name_construction_probe_v1.py \
            /tmp/client/t6mp.exe \
            --revision "$(cat /tmp/client/revision)" \
            --out /tmp/proof/T6_CURRENT_CLIENT_FASTFILE_NAME_CONSTRUCTION_PROBE_V1.json \
            | tee /tmp/proof/fastfile_name_summary.log

      - name: Delete executable and hash derived evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/client/t6mp.exe
          test ! -e /tmp/client/t6mp.exe
          sha256sum /tmp/proof/* | sort | tee /tmp/proof/SHA256SUMS

      - name: Persist derived proof and handoff checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/current_client checkpoints
          cp /tmp/proof/T6_CURRENT_CLIENT_INSTRUCTION_OPERAND_XREF_PROBE_V1.json \
             proof/current_client/T6_CURRENT_CLIENT_INSTRUCTION_OPERAND_XREF_PROBE_V1.json
          cp /tmp/proof/T6_CURRENT_CLIENT_XZONEINFO_ROW_PROBE_V1.json \
             proof/current_client/T6_CURRENT_CLIENT_XZONEINFO_ROW_PROBE_V1.json
          cp /tmp/proof/T6_CURRENT_CLIENT_FASTFILE_NAME_CONSTRUCTION_PROBE_V1.json \
             proof/current_client/T6_CURRENT_CLIENT_FASTFILE_NAME_CONSTRUCTION_PROBE_V1.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          xp=Path('proof/current_client/T6_CURRENT_CLIENT_INSTRUCTION_OPERAND_XREF_PROBE_V1.json')
          zp=Path('proof/current_client/T6_CURRENT_CLIENT_XZONEINFO_ROW_PROBE_V1.json')
          fp=Path('proof/current_client/T6_CURRENT_CLIENT_FASTFILE_NAME_CONSTRUCTION_PROBE_V1.json')
          x=json.loads(xp.read_text()); z=json.loads(zp.read_text()); f=json.loads(fp.read_text())
          def digest(p):
              b=p.read_bytes(); return len(b),hashlib.sha256(b).hexdigest()
          xb,xh=digest(xp); zb,zh=digest(zp); fb,fh=digest(fp)
          lines=[
              '# T6 current-client decoded zone construction result — 2026-09-18','',
              '## Authority boundary','',
              'This is comparative evidence from the SHA-classified current Plutonium client only. It is not historical-retail authority and selects no Technique winner.','',
              '## Exact client','',
              f"- revision: \`{x['client']['revision']}\`",
              f"- bytes: \`{x['client']['bytes']}\`",
              f"- SHA-256: \`{x['client']['sha256']}\`",'',
              '## Decoded instruction-operand xrefs','',
          ]
          for name,row in x['summary'].items():
              lines.append(
                  f"- \`{name}\`: literals={row['literalOccurrenceCount']}, "
                  f"oldRawPackedHits={row['rawPackedVaExecutableHitCountOldMethod']}, "
                  f"decodedOperandXrefs={row['decodedOperandXrefCount']}"
              )
          lines += [
              '',
              '## Structural 12-byte-row comparison','',
              f"- admitted structural row candidates: **{z['candidateCount']}**",
          ]
          for name,count in z['candidateCountByString'].items():
              if count:
                  lines.append(f"- \`{name}\`: **{count}**")
          lines += [
              '',
              '## Exact fastfile-name constructor','',
              '- constructor range: `{}`..`{}`'.format(f['constructor']['start'], f['constructor']['endExclusive']),
              '- decoded constructor instructions: **{}**'.format(f['constructor']['instructionCount']),
              '- selected helper calls: **{}**'.format(len(f['constructor']['selectedHelperCalls'])),
              '- exact destination buffers: **{}**'.format(len(f['destinationBuffers'])),'',
              '### Destination-buffer consumers','',
          ]
          for row in f['destinationBuffers']:
              lines.append('- `{}`: decodedOperandXrefs={}'.format(row['va'], row['decodedOperandXrefCount']))
          lines += [
              '',
              '## Artifact identities','',
              f"- decoded xref JSON: {xb:,} bytes, SHA-256 \`{xh}\`",
              f"- structural row JSON: {zb:,} bytes, SHA-256 \`{zh}\`",
              f"- fastfile-name construction JSON: {fb:,} bytes, SHA-256 \`{fh}\`",'',
              '## Proof boundary','',
              x['proofBoundary'],'',
              z['proofBoundary'],'',
              f['proofBoundary'],'',
              '## Next step','',
              'Use only decoded operand xrefs and admitted same-row +0/+4(/+8) stores as anchors for further current-client data-flow recovery. Raw packed-address hits and proximity-only calls remain excluded. If no exact full-zone row is recovered, trace exact base-string construction into the eventual row pointer without importing dedicated-server flag values. Historical-retail promotion still requires genuine retail executable/runtime evidence.','',
              '## Existing closure preserved','',
              '- production GfxImage denominator: **450**',
              '- exact DDS coverage: **75/450**',
              '- unresolved shader ownership: **58 divergent child Techniques across nine TechniqueSets affecting 269 ordinary Materials**','',
          ]
          Path('checkpoints/T6_CURRENT_CLIENT_DECODED_ZONE_CONSTRUCTION_RESULT_2026-09-18.md').write_text('\n'.join(lines))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            proof/current_client/T6_CURRENT_CLIENT_INSTRUCTION_OPERAND_XREF_PROBE_V1.json \
            proof/current_client/T6_CURRENT_CLIENT_XZONEINFO_ROW_PROBE_V1.json \
            proof/current_client/T6_CURRENT_CLIENT_FASTFILE_NAME_CONSTRUCTION_PROBE_V1.json \
            checkpoints/T6_CURRENT_CLIENT_DECODED_ZONE_CONSTRUCTION_RESULT_2026-09-18.md
          if git diff --cached --quiet; then
            echo "derived proof already current"
            exit 0
          fi
          git commit -m 'Persist decoded current-client zone construction proof'
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_ZONE_CONSTRUCTION_PROBE_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
