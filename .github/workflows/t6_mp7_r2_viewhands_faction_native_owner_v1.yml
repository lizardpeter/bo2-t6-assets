name: T6 MP7 R2 SEAL6 viewhands faction native owner v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/firstperson-weapons-closure
    paths:
      - '.github/workflows/t6_mp7_r2_viewhands_faction_native_owner_v1.yml'
      - 'tools/t6_remote_zip_range_v1.py'
      - 'tools/t6_oat_9dca_gcc_compat_patch_v3.py'

permissions:
  contents: read

jobs:
  owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZIP_URL: https://cdn.jordanlindsay.com.au/pluto_t6_full_game.zip
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact pinned OAT Unlinker cache
        id: oat-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug

      - name: Require exact pinned OAT binary
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.oat-cache.outputs.cache-hit }}" = 'true'
          BIN=/tmp/oat-unlinker-cache/Unlinker
          META=/tmp/oat-unlinker-cache/source_identity.txt
          test -x "$BIN"
          grep -qx 'oat_commit=9dca965366541504b71fa8cfb7ac049cb9b717e1' "$META"
          PATCH_SHA=$(sha256sum tools/t6_oat_9dca_gcc_compat_patch_v3.py | awk '{print $1}')
          grep -qx "compat_patch_sha256=$PATCH_SHA" "$META"
          mkdir -p /tmp/game/zone/all /tmp/oat /tmp/proof/native_targets
          sha256sum "$BIN" | tee /tmp/proof/unlinker_sha256.txt

      - name: Extract and pin the three archive-located faction roots
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 - <<'PY'
          import hashlib,json,os,pathlib
          from t6_remote_zip_range_v1 import RemoteZip
          expected={
            'pluto_t6_full_game/zone/all/faction_multiteam_mp.ff':'1e22ed4f284d77d9f30d59e940b006977f208fcde6d0f68c9e3e613c5d8c06c7',
            'pluto_t6_full_game/zone/all/faction_multiteam_sand_mp.ff':'07d9774a9a82af58d417fefca10e6f348f2135ee09783614e0dae1f26b571a72',
            'pluto_t6_full_game/zone/all/faction_seals_mp.ff':'1a075434760751551158b7d62cc2761649e2d2c7606b27b3bbe066b998b77c88',
          }
          rz=RemoteZip(os.environ['ZIP_URL'],'bo2-t6-assets-seal6-native-owner')
          entries,meta=rz.central_directory()
          by={e['name']:e for e in entries}
          rows=[]
          for path,want in expected.items():
              if path not in by: raise SystemExit('missing archive member '+path)
              raw=rz.extract(by[path],verify_crc=True)
              got=hashlib.sha256(raw).hexdigest()
              if got != want: raise SystemExit(f'{path} sha {got} != {want}')
              fn=path.rsplit('/',1)[-1]
              out=pathlib.Path('/tmp/game/zone/all')/fn
              out.write_bytes(raw)
              rows.append({'zipPath':path,'file':fn,'bytes':len(raw),'sha256':got,'zipCrc32':f"{by[path]['crc32']:08x}"})
          pathlib.Path('/tmp/proof/source_roots.json').write_text(json.dumps({'remoteZip':meta,'roots':rows},indent=2,sort_keys=True)+'\n')
          print(json.dumps(rows,indent=2,sort_keys=True))
          PY

      - name: Dump each faction root's physical XModels independently
        shell: bash
        run: |
          set -euo pipefail
          BIN=/tmp/oat-unlinker-cache/Unlinker
          : > /tmp/proof/dump_status.tsv
          for z in faction_multiteam_mp faction_multiteam_sand_mp faction_seals_mp; do
            OUT="/tmp/oat/$z"
            mkdir -p "$OUT"
            set +e
            "$BIN" --no-color --include-assets xmodel --output-folder "$OUT" "/tmp/game/zone/all/$z.ff" \
              > "/tmp/proof/${z}_xmodel_dump.log" 2>&1
            RC=$?
            set -e
            printf '%s\t%s\t%s\n' "$z" "$RC" "$(find "$OUT" -type f | wc -l)" | tee -a /tmp/proof/dump_status.tsv
          done

      - name: Require exact owner matrix and byte-equivalent long copies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil
          roots=['faction_multiteam_mp','faction_multiteam_sand_mp','faction_seals_mp']
          long='c_usa_mp_seal6_longsleeve_viewhands'
          short='c_usa_mp_seal6_shortsleeve_viewhands'
          targets=[long,short]
          expected_owners={
            long:['faction_multiteam_mp','faction_multiteam_sand_mp','faction_seals_mp'],
            short:['faction_seals_mp'],
          }
          status={}
          for line in pathlib.Path('/tmp/proof/dump_status.tsv').read_text().splitlines():
              z,rc,count=line.split('\t'); status[z]={'returnCode':int(rc),'fileCount':int(count)}

          def file_meta(p):
              b=p.read_bytes()
              return {'path':str(p),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}

          rows=[]
          for z in roots:
              base=pathlib.Path('/tmp/oat')/z
              for t in targets:
                  j=base/'xmodel'/f'{t}.json'
                  g=base/'model_export'/f'{t}_lod0.glb'
                  row={'root':z,'target':t,'xmodelJson':None,'lod0Glb':None}
                  if j.is_file(): row['xmodelJson']=file_meta(j)
                  if g.is_file(): row['lod0Glb']=file_meta(g)
                  if (j.is_file()) != (g.is_file()):
                      raise SystemExit(f'{z}/{t}: JSON/GLB presence disagreement')
                  if j.is_file():
                      dst=pathlib.Path('/tmp/proof/native_targets')/z
                      dst.mkdir(parents=True,exist_ok=True)
                      shutil.copy2(j,dst/j.name); shutil.copy2(g,dst/g.name)
                  rows.append(row)

          owners={t:sorted(r['root'] for r in rows if r['target']==t and r['xmodelJson']) for t in targets}
          long_rows=[r for r in rows if r['target']==long and r['xmodelJson']]
          long_json_hashes=sorted({r['xmodelJson']['sha256'] for r in long_rows})
          long_glb_hashes=sorted({r['lod0Glb']['sha256'] for r in long_rows})
          long_json_sizes=sorted({r['xmodelJson']['bytes'] for r in long_rows})
          long_glb_sizes=sorted({r['lod0Glb']['bytes'] for r in long_rows})
          long_equiv=(len(long_rows)==3 and len(long_json_hashes)==1 and len(long_glb_hashes)==1 and len(long_json_sizes)==1 and len(long_glb_sizes)==1)
          owner_matrix_matches=(owners==expected_owners)
          all_ok=all(status[z]['returnCode']==0 for z in roots)
          out={
            'format':'t6-mp7-r2-seal6-viewhands-faction-native-owner-v1',
            'oatCommit':'9dca965366541504b71fa8cfb7ac049cb9b717e1',
            'sourceRoots':json.load(open('/tmp/proof/source_roots.json')),
            'dumpStatus':status,
            'targets':rows,
            'ownersByTarget':owners,
            'expectedOwnersByTarget':expected_owners,
            'allPhysicalDumpsSucceeded':all_ok,
            'ownerMatrixMatchesRetailObservation':owner_matrix_matches,
            'longSleevePhysicalCopiesByteEquivalent':long_equiv,
            'longSleeveXModelJsonSha256':long_json_hashes,
            'longSleeveLod0GlbSha256':long_glb_hashes,
            'longSleeveXModelJsonBytes':long_json_sizes,
            'longSleeveLod0GlbBytes':long_glb_sizes,
            'proofBoundary':'The three faction roots are exact archive rows discovered by the complete 215-FastFile name census, CRC-verified and SHA-256 pinned before use. Pinned OAT receives each root independently with include-assets xmodel and no --load dependency. Ownership requires the exact xmodel/<name>.json plus model_export/<name>_lod0.glb pair. Retail is allowed to contain duplicate physical XModel copies; duplicate long-sleeve copies are promoted as one content identity only if both native JSON and native GLB bytes are exactly identical across all three physical roots.',
          }
          p=pathlib.Path('/tmp/proof/T6_MP7_R2_SEAL6_VIEWHANDS_FACTION_NATIVE_OWNER_V1.json')
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          if not all_ok: raise SystemExit('one or more physical faction XModel dumps failed')
          if not owner_matrix_matches: raise SystemExit('physical owner matrix changed: '+json.dumps(owners,sort_keys=True))
          if not long_equiv: raise SystemExit('three long-sleeve physical copies are not byte-equivalent')
          PY
          sha256sum /tmp/proof/T6_MP7_R2_SEAL6_VIEWHANDS_FACTION_NATIVE_OWNER_V1.json | tee /tmp/proof/manifest_sha256.txt

      - name: Upload physical owner proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_MP7_R2_SEAL6_VIEWHANDS_FACTION_NATIVE_OWNER_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
