name: T6 world special render-contract overlay v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_world_special_render_contract_overlay_v1.py'
      - 'tools/test_t6_world_special_render_contract_overlay_v1.py'
      - 'tools/t6_oat_world_textured_export_pipeline_v52.py'
      - 'tools/test_t6_oat_world_textured_export_pipeline_v52.py'
      - 'tools/t6_generated_final_output_texture_resource_binding_v2.py'
      - 'tools/t6_oat_slot_shader_resolver_v2.py'
      - '.github/workflows/t6_world_special_render_contract_overlay_v1.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install production image dependencies
        run: python3 -m pip install --disable-pip-version-check pillow numpy
      - name: Compile overlay and production v52
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/t6_world_special_render_contract_overlay_v1.py \
            tools/test_t6_world_special_render_contract_overlay_v1.py \
            tools/t6_oat_world_textured_export_pipeline_v52.py \
            tools/test_t6_oat_world_textured_export_pipeline_v52.py \
            tools/t6_generated_final_output_texture_resource_binding_v2.py
      - name: Run fail-closed overlay regression
        env:
          PYTHONPATH: tools
        run: |
          set -euo pipefail
          python3 tools/test_t6_world_special_render_contract_overlay_v1.py
      - name: Run production v52 wiring regression
        env:
          PYTHONPATH: tools
        run: |
          set -euo pipefail
          python3 tools/test_t6_oat_world_textured_export_pipeline_v52.py
