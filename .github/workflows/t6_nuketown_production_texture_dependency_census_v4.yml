name: T6 Nuketown production texture dependency census v4

on:
  workflow_dispatch:
  push:
    branches:
      - nuketown-layered-runtime-projection-v2
    paths:
      - 'tools/t6_nuketown_production_texture_dependency_census_v4.py'
      - 'tools/t6_nuketown_production_texture_dependency_census_v3.py'
      - 'tools/t6_nuketown_production_texture_dependency_census_v2.py'
      - 'tools/t6_nuketown_production_texture_dependency_census_v1.py'
      - 'manifests/render/T6_NUKETOWN_IDENTITYNORMALMAP_BLOCK5_PROOF_V1.json'
      - '.github/workflows/t6_nuketown_production_texture_dependency_census_v4.yml'

permissions:
  actions: read
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Import exact green v3 census inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v3 /tmp/proof
          gh run download 34402312296 \
            --repo lizardpeter/bo2-t6-assets \
            --name T6_NUKETOWN_PRODUCTION_TEXTURE_DEPENDENCY_CENSUS_V3 \
            --dir /tmp/v3
          cp /tmp/v3/proof/T6_NUKETOWN_OAT_MATERIAL_TEXTURE_MANIFEST_V7.json /tmp/proof/
          cp /tmp/v3/proof/T6_NUKETOWN_IWI27_DDS_BRIDGE_V1.json /tmp/proof/
          echo '14c4b7098df32de0e0238197b5c8103b1ea5b29c84a2ed8b240917caa25b9b47  /tmp/proof/T6_NUKETOWN_OAT_MATERIAL_TEXTURE_MANIFEST_V7.json' | sha256sum -c -
          echo '693a23ccbf5e13d079ecb408393bf151c2c87bbf8f485a26e0d78bf820d8701e  /tmp/proof/T6_NUKETOWN_IWI27_DDS_BRIDGE_V1.json' | sha256sum -c -

      - name: Count all currently exact-source Material image coverage
        env:
          PYTHONPATH: tools
        run: |
          set -euo pipefail
          python3 tools/t6_nuketown_production_texture_dependency_census_v4.py \
            --material-manifest /tmp/proof/T6_NUKETOWN_OAT_MATERIAL_TEXTURE_MANIFEST_V7.json \
            --dds-bridge /tmp/proof/T6_NUKETOWN_IWI27_DDS_BRIDGE_V1.json \
            --identitynormal-proof manifests/render/T6_NUKETOWN_IDENTITYNORMALMAP_BLOCK5_PROOF_V1.json \
            --out /tmp/proof/T6_NUKETOWN_PRODUCTION_TEXTURE_DEPENDENCY_CENSUS_MATERIAL_ONLY_V4.json \
            2>&1 | tee /tmp/proof/dependency_census_v4.log
          python3 - <<'PY'
          import json
          p='/tmp/proof/T6_NUKETOWN_PRODUCTION_TEXTURE_DEPENDENCY_CENSUS_MATERIAL_ONLY_V4.json'
          d=json.load(open(p)); s=d['summary']
          assert d['format']=='t6-nuketown-production-texture-dependency-census-v4',d.get('format')
          assert s['materialUniqueImageCount']==423,s
          assert s['exact81BridgeImageCount']==81,s
          assert s['materialCoveredByExact81Count']==75,s
          assert s['materialMissingFromExact81Count']==348,s
          assert s['exactInlineFastFileImageCount']==1,s
          assert s['materialCoveredByKnownExactSourceCount']==76,s
          assert s['materialMissingFromKnownExactSourceCount']==347,s
          assert s['productionCoveredByKnownExactSourceCount']==76,s
          assert s['productionMissingFromKnownExactSourceCount']==347,s
          assert len(d['missingProductionImagesBridgeOnly'])==348
          assert len(d['missingProductionImages'])==347
          assert '$identitynormalmap' not in {r['image'] for r in d['missingProductionImages']}
          inline=d['exactInlineFastFileImages']
          assert inline==[{
            'image':'$identitynormalmap','authority':'exact-inline-fastfile-gfximage',
            'source':'mp_nuketown_2020.expanded.bin',
            'sourceSha256':'7e791fb90a085f3bff9e0df895e5a232fa91cc43bcd0027225fe811f7891d505',
            'block':5,'virtualOffset':514620,'xassetIndex':836,'resourceSize':4,
            'rgba':[128,128,255,128],
          }],inline
          print('GREEN EXACT-SOURCE MATERIAL TEXTURE CENSUS V4',json.dumps(s,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_NUKETOWN_PRODUCTION_TEXTURE_DEPENDENCY_CENSUS_V4
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 0
