name: T6 native recompilation C++26 multi-unit admission
on:
  push:
    paths:
      - "reconstruction/native/**"
      - "reconstruction/current_client/simd_candidates_v1.cpp"
      - "tools/t6_native_manifest_audit_v1.py"
      - "tools/t6_native_callgraph_frontier_v1.py"
      - "tools/t6_verify_msvc_pdb_coff_symbols_v1.py"
      - "tools/t6_native_pdb_queue_v1.py"
      - "tools/test_t6_native_pdb_queue_v1.py"
      - "tools/t6_native_decompile_availability_v1.py"
      - "tools/test_t6_native_decompile_availability_v1.py"
      - ".github/workflows/t6_native_recomp_cpp26.yml"
  pull_request:
    paths:
      - "reconstruction/native/**"
      - "reconstruction/current_client/simd_candidates_v1.cpp"
      - "tools/t6_native_manifest_audit_v1.py"
      - "tools/t6_native_callgraph_frontier_v1.py"
      - "tools/t6_verify_msvc_pdb_coff_symbols_v1.py"
      - "tools/t6_native_pdb_queue_v1.py"
      - "tools/test_t6_native_pdb_queue_v1.py"
      - "tools/t6_native_decompile_availability_v1.py"
      - "tools/test_t6_native_decompile_availability_v1.py"
      - ".github/workflows/t6_native_recomp_cpp26.yml"
  workflow_dispatch:

jobs:
  compile-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install C++26 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 zstd
          python3 -m pip install --user "cmake>=3.31,<4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Audit exact-build native source manifest
        run: python3 tools/t6_native_manifest_audit_v1.py
      - name: Check exact-byte PDB-derived native source queue
        run: |
          python3 tools/test_t6_native_pdb_queue_v1.py
          python3 tools/t6_native_pdb_queue_v1.py --output build/t6-native-pdb-queue.json
      - name: Audit and stage generated PDB-matched Ghidra evidence
        run: |
          python3 tools/test_t6_native_decompile_availability_v1.py
          python3 tools/t6_native_decompile_availability_v1.py --output build/t6-decompile-availability.json --stage-dir build/t6-native-ghidra-staging
      - name: Preserve unreviewed Ghidra staging for source review
        uses: actions/upload-artifact@v4
        with:
          name: t6-pdb-ghidra-unreviewed
          path: |
            build/t6-native-ghidra-staging/
            build/t6-decompile-availability.json
          retention-days: 30
      - name: Recover exact direct-call frontier for admitted native functions
        run: python3 tools/t6_native_callgraph_frontier_v1.py --output build/t6-native-callgraph-frontier.json
      - name: Preserve recovered T6 callgraph frontier
        uses: actions/upload-artifact@v4
        with:
          name: t6-native-recovery-callgraph-frontier
          path: build/t6-native-callgraph-frontier.json
          retention-days: 30
      - name: Configure recovered native leaf library
        run: cmake -S reconstruction/native -B build/t6-native -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Debug
      - name: Build recovered native leaf library
        run: cmake --build build/t6-native --parallel
      - name: Run deterministic candidate invariants
        run: ctest --test-dir build/t6-native --output-on-failure

  native-msvc-x86:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install modern CMake
        run: python -m pip install "cmake>=3.31,<5"
      - name: Audit recovered native manifest
        run: python tools/t6_native_manifest_audit_v1.py
      - name: Validate exact-byte PDB source queue
        run: |
          python tools/test_t6_native_pdb_queue_v1.py
          python tools/t6_native_pdb_queue_v1.py --output build/t6-native-pdb-queue.json
      - name: Audit retained decompilation archives
        run: python tools/test_t6_native_decompile_availability_v1.py
      - name: Configure with MSVC x86
        run: cmake -S reconstruction/native -B build/t6-native-win -G "Visual Studio 18 2026" -A Win32 -DBUILD_TESTING=ON
      - name: Compile and link native leaf-test executables
        run: cmake --build build/t6-native-win --config Release --parallel
      - name: Verify PDB decorated COFF ABI names
        run: python tools/t6_verify_msvc_pdb_coff_symbols_v1.py build/t6-native-win/Release/t6_native_msvc_pdb_abi.lib
      - name: Verify original glass allocator constructor COFF name
        run: python tools/t6_verify_msvc_pdb_coff_symbols_v1.py build/t6-native-win/Release/t6_native_msvc_glass_allocator.lib --spec reconstruction/native/msvc_glass_allocator_symbols_v1.json
      - name: Run native Windows x86 candidate tests
        run: ctest --test-dir build/t6-native-win -C Release --output-on-failure
