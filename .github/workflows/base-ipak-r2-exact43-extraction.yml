name: base-ipak-r2-exact43-extraction
on:
  push:
    branches: [base-ipak-r2-recovery]
    paths: [.github/workflows/base-ipak-r2-exact43-extraction.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblzo2-2
          python -m pip install --disable-pip-version-check pillow
      - name: Extract exact nameHash+dataHash aliases independently
        run: |
          mkdir -p exact43
          python - <<'PY'
          import base64,ctypes,ctypes.util,hashlib,importlib.util,json,struct,urllib.request,zlib
          from collections import defaultdict,Counter
          from pathlib import Path
          URL='https://r2.houseofkublai.com/bo2/zone/all/base.ipak'; OUT=Path('exact43')
          bank=json.loads(zlib.decompress(base64.b64decode(Path('manifests/maps/mp_nuketown_2020/NUKETOWN_PACKED_IMAGE_CROSSFAMILY_ALIAS_BANK_V1.json.zlib.b64').read_text().strip())))
          spec=importlib.util.spec_from_file_location('t6tex',Path('tools/t6_nuketown_ipak_partial_texture_export_v2.py')); t6=importlib.util.module_from_spec(spec); spec.loader.exec_module(t6)
          def rg(a,b):
            q=urllib.request.Request(URL,headers={'Range':f'bytes={a}-{b}','User-Agent':'bo2-t6-assets-exact43/1'})
            with urllib.request.urlopen(q,timeout=120) as r:
              if r.status!=206: raise RuntimeError(f'range not honored {r.status}')
              cr=r.headers.get('Content-Range',''); d=r.read()
            if len(d)!=b-a+1: raise RuntimeError(f'range length mismatch {cr}')
            return d,cr
          head,_=rg(0,65535); magic,ver,total,sc=struct.unpack_from('<4sIII',head,0); secs=[struct.unpack_from('<IIII',head,16+16*i) for i in range(sc)]
          if magic!=b'KAPI' or ver!=0x50000: raise ValueError('invalid IPAK')
          data_sec=[s for s in secs if s[0]==2][0]; _,ioff,isz,n=[s for s in secs if s[0]==1][0]; idx,_=rg(ioff,ioff+n*16-1)
          by_name={}
          for i in range(n):
            e=struct.unpack_from('<IIII',idx,i*16); by_name[e[1]]=e
          lib=ctypes.util.find_library('lzo2'); lzo=ctypes.CDLL(lib).lzo1x_decompress_safe
          lzo.argtypes=[ctypes.c_void_p,ctypes.c_size_t,ctypes.c_void_p,ctypes.POINTER(ctypes.c_size_t),ctypes.c_void_p]; lzo.restype=ctypes.c_int
          def align(x,a): return (x+a-1)//a*a
          def extract(seg,start,e):
            dh,nh,rel,raw=e; ap=start; ae=start+raw; out=bytearray(); blocks=0
            while ap<ae:
              ap=align(ap,128)
              if ap>=ae: break
              p0=ap-start
              if p0+128>len(seg): raise ValueError('truncated header')
              hdr=seg[p0:p0+128]; co=struct.unpack_from('<I',hdr,0)[0]; fo=co&0xffffff; cnt=(co>>24)&0xff
              if cnt>31: raise ValueError(f'block command count {cnt}')
              cmds=[]
              for j in range(cnt):
                w=struct.unpack_from('<I',hdr,4+4*j)[0]; cmds.append((w&0xffffff,(w>>24)&0xff))
              if any(c in (0,1) for _,c in cmds) and fo!=len(out): raise ValueError(f'block offset mismatch {fo}!={len(out)}')
              p=p0+128
              for sz,c in cmds:
                blob=seg[p:p+sz]
                if len(blob)!=sz: raise ValueError('truncated command')
                if c==0: out.extend(blob)
                elif c==1:
                  dst=ctypes.create_string_buffer(0x8000); ln=ctypes.c_size_t(0x8000); src=ctypes.create_string_buffer(blob)
                  rc=lzo(src,len(blob),dst,ctypes.byref(ln),None)
                  if rc: raise ValueError(f'lzo {rc}')
                  out.extend(dst.raw[:ln.value])
                else: raise ValueError(f'unsupported compression {c}')
                p+=sz
              ap=start+p; blocks+=1
              if blocks>10000: raise ValueError('runaway')
            b=bytes(out); crc=zlib.crc32(b)&0x1fffffff
            if crc!=e[0]: raise ValueError(f'CRC29 {crc:08x}!={e[0]:08x}')
            return b,blocks
          rows=[]; stats=Counter(); network=len(head)+len(idx)
          for a in bank['aliases']:
            nh=int(a['hash']); dh=int(a['dataHash']); e=by_name.get(nh)
            if e is None or e[0]!=dh: continue
            row={k:a[k] for k in ('name','hash','dataHash','semantic','width','height','depth','suffix','slot')}; row['nameHashHex']=f'{nh:08x}'; row['dataHashHex']=f'{dh:08x}'
            try:
              start=data_sec[1]+e[2]; end=start+e[3]-1; seg,cr=rg(start,end); network+=len(seg); iwi,blocks=extract(seg,start,e)
              fmt,flags,w,h,d,gamma,sizes=t6.parse_iwi27(iwi)
              if (w,h,d)!=(int(a['width']),int(a['height']),int(a['depth'])): raise ValueError(f'dimensions {(w,h,d)} != {(a["width"],a["height"],a["depth"])}')
              safe=f'{len(rows):03d}_{a["name"].replace("/","__").replace("~","_tilde_")}'
              iwip=OUT/f'{safe}.iwi'; iwip.write_bytes(iwi)
              png_name=None; png_sha=None; png_bytes=0
              try:
                png,_=t6.iwi_top_png(iwi,normal_semantic=(int(a['semantic'])==5)); pp=OUT/f'{safe}.png'; pp.write_bytes(png); png_name=pp.name; png_sha=hashlib.sha256(png).hexdigest(); png_bytes=len(png)
              except Exception as px: row['pngDecodeFailure']=f'{type(px).__name__}: {px}'
              row.update({'status':'validated','contentRange':cr,'ipakEntry':list(e),'blockCount':blocks,'format':fmt,'flags':flags,'gamma':gamma,
                          'iwiFile':iwip.name,'iwiBytes':len(iwi),'iwiSha256':hashlib.sha256(iwi).hexdigest(),'pngFile':png_name,'pngBytes':png_bytes,'pngSha256':png_sha,
                          'crc29Validated':True,'iwi27Validated':True,'dimensionsValidated':True}); stats['validated']+=1
            except Exception as ex:
              row.update({'status':'rejected','ipakEntry':list(e),'reason':f'{type(ex).__name__}: {ex}'}); stats['rejected']+=1
            rows.append(row)
          report={'format':'t6-base-ipak-exact-alias-extraction-v1','sourceUrl':URL,'sourceBytes':total,'indexEntryCount':n,'candidateCount':len(rows),'summary':dict(stats),'networkBytes':network,'rows':rows}
          (OUT/'BASE_IPAK_EXACT_ALIAS_EXTRACTION_V1.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'candidateCount':len(rows),'summary':dict(stats),'networkBytes':network},indent=2))
          if stats['validated']==0: raise SystemExit('no validated payloads')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: base-ipak-exact43-extraction
          path: exact43/
          retention-days: 1
