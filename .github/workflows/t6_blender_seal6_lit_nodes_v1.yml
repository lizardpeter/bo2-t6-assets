name: T6 Blender SEAL6 exact lit nodes v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/seal6-material-closure
    paths:
      - 'tools/t6_install_blender_5_2_1_linux_x64.sh'
      - 'tools/t6_seal6_blender_shader_plan_v1.py'
      - 'tools/test_t6_seal6_blender_shader_plan_v1.py'
      - 'tools/t6_blender_seal6_role_nodes_v1.py'
      - 'tools/t6_blender_seal6_lit_nodes_v1.py'
      - 'tools/test_t6_blender_seal6_lit_nodes_v1.py'
      - 'manifests/render/T6_RETAIL_SEAL6_LIT_SEMANTICS_V1.json'
      - '.github/workflows/t6_blender_seal6_lit_nodes_v1.yml'

permissions:
  contents: read

jobs:
  blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate pure-data exact shader plan
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/t6_seal6_blender_shader_plan_v1.py \
            tools/t6_blender_seal6_lit_nodes_v1.py \
            tools/test_t6_blender_seal6_lit_nodes_v1.py
          PYTHONPATH=tools python3 -m unittest -v tools/test_t6_seal6_blender_shader_plan_v1.py
          python3 - <<'PY'
          import json
          d=json.load(open('manifests/render/T6_RETAIL_SEAL6_LIT_SEMANTICS_V1.json'))
          assert d['format']=='t6-retail-seal6-lit-semantics-v1'
          assert d['summary']['families']==3
          assert d['summary']['exactMaterialArgumentAbiClosed'] is True
          assert d['summary']['completeRetailPixelOutputInBlender'] is False
          assert d['sharedSkinSemantics']['diffuse']['encoded']=='Diffuse_Map.rgb*(vertexColor.rgb*vertexColor.rgb)'
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY

      - name: Install exact Blender 5.2.1 LTS runtime
        shell: bash
        run: bash tools/t6_install_blender_5_2_1_linux_x64.sh

      - name: Compile exact SEAL6 material-local shader graphs in Blender 5.2.1
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools "$BLENDER" --background --factory-startup \
            --python tools/test_t6_blender_seal6_lit_nodes_v1.py \
            2>&1 | tee /tmp/blender_seal6_lit_nodes_v1_test.log
          grep -F 'T6_BLENDER_SEAL6_LIT_NODES_V1_TEST=' /tmp/blender_seal6_lit_nodes_v1_test.log
          test -s /tmp/T6_BLENDER_SEAL6_LIT_NODES_V1_TEST.blend
          test -s /tmp/T6_BLENDER_SEAL6_LIT_NODES_V1_TEST.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/T6_BLENDER_SEAL6_LIT_NODES_V1_TEST.json',encoding='utf-8'))
          assert d['summary']=={
              'materialsCompiled':5,
              'nativeSourceNodesRetained':20,
              'ordinaryLitReferencedSourceNodes':15,
              'preservedNonLitSourceNodes':5,
              'constantNodes':22,
              'skinLocalDiffuseGraphs':4,
              'heroDetailNormalGraphs':1,
              'corneaLocalGraphs':1,
              'allExactOrdinaryLitEquationsClosed':True,
              'globalRuntimeLightingInputsBound':False,
              'completeRetailPixelOutput':False,
          }, d['summary']
          assert len(d['materials'])==5
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_BLENDER_SEAL6_LIT_NODES_V1_TEST
          path: |
            /tmp/T6_BLENDER_SEAL6_LIT_NODES_V1_TEST.blend
            /tmp/T6_BLENDER_SEAL6_LIT_NODES_V1_TEST.json
            /tmp/blender_seal6_lit_nodes_v1_test.log
          if-no-files-found: error
          compression-level: 0
