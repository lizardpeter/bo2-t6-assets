name: T6 Blender lprobe nodes v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_blender_lprobe_nodes_v1.py'
      - 'tools/test_t6_blender_lprobe_nodes_v1.py'
      - 'tools/t6_blender_generated_normal_nodes_v2.py'
      - '.github/workflows/t6_blender_lprobe_nodes_v1.yml'

permissions:
  contents: read

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender >/dev/null
          blender --version | head -3

      - name: Compile exact-local lprobe node graphs in Blender
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools blender --background \
            --python tools/test_t6_blender_lprobe_nodes_v1.py \
            2>&1 | tee /tmp/blender_lprobe_test.log
          grep -F 'T6_BLENDER_LPROBE_TEST=' /tmp/blender_lprobe_test.log
          test -s /tmp/T6_BLENDER_LPROBE_NODES_V1_TEST.blend
          test -s /tmp/T6_BLENDER_LPROBE_NODES_V1_TEST.json

      - uses: actions/upload-artifact@v4
        with:
          name: T6_BLENDER_LPROBE_NODES_V1_TEST
          path: |
            /tmp/T6_BLENDER_LPROBE_NODES_V1_TEST.blend
            /tmp/T6_BLENDER_LPROBE_NODES_V1_TEST.json
            /tmp/blender_lprobe_test.log
          if-no-files-found: error
