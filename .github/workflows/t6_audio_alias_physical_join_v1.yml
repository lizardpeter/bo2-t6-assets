name: T6 audio alias to physical ID join v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_audio_alias_physical_join_v1.py'
      - 'tools/test_t6_audio_alias_physical_join_v1.py'
      - '.github/workflows/t6_audio_alias_physical_join_v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALIAS_RUN: '34177086929'
      ALIAS_ARTIFACT: T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1
      PHYSICAL_RUN: '34177204458'
      PHYSICAL_ARTIFACT: T6_AUDIO_PHYSICAL_ID_MANIFEST_V1
    steps:
      - uses: actions/checkout@v4

      - name: Test fail-closed join logic
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/test_t6_audio_alias_physical_join_v1.py

      - name: Download exact retained alias and physical manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/alias /tmp/physical /tmp/proof
          gh run download "$ALIAS_RUN" --repo "$GITHUB_REPOSITORY" --name "$ALIAS_ARTIFACT" --dir /tmp/alias
          gh run download "$PHYSICAL_RUN" --repo "$GITHUB_REPOSITORY" --name "$PHYSICAL_ARTIFACT" --dir /tmp/physical
          test -f /tmp/alias/T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1.json
          test -f /tmp/physical/T6_AUDIO_PHYSICAL_ID_MANIFEST_V1.json
          sha256sum /tmp/alias/T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1.json | tee /tmp/proof/alias_manifest_sha256.txt
          sha256sum /tmp/physical/T6_AUDIO_PHYSICAL_ID_MANIFEST_V1.json | tee /tmp/proof/physical_manifest_sha256.txt
          cat > /tmp/proof/source_artifacts.txt <<EOF
          alias_run=$ALIAS_RUN
          alias_artifact=$ALIAS_ARTIFACT
          alias_artifact_digest=sha256:7aa3a37ac803a49d0b629cad446c1475edd682a328d2d39cce07c1fce19eac8a
          physical_run=$PHYSICAL_RUN
          physical_artifact=$PHYSICAL_ARTIFACT
          physical_artifact_digest=sha256:da4e9a19922b283d111a23af7064c5e3d7afc40a4d1e063c8dddebb1050a6caa
          EOF

      - name: Join all nonzero SndAlias asset IDs to physical banks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/t6_audio_alias_physical_join_v1.py \
            --aliases /tmp/alias/T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1.json \
            --physical /tmp/physical/T6_AUDIO_PHYSICAL_ID_MANIFEST_V1.json \
            --out /tmp/proof/T6_AUDIO_ALIAS_PHYSICAL_JOIN_V1.json
          cat /tmp/proof/T6_AUDIO_ALIAS_PHYSICAL_JOIN_V1.json | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["summary"],indent=2,sort_keys=True))'

      - name: Upload complete exact audio join
        uses: actions/upload-artifact@v4
        with:
          name: T6_AUDIO_ALIAS_PHYSICAL_JOIN_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
