name: T6 cross-build anchor candidates v1

on:
  push:
    paths:
      - '.github/workflows/t6_cross_build_anchor_candidates_v1.yml'

permissions:
  contents: write

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch PC-server function ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/server
          curl --fail --location --retry 5 --retry-all-errors \
            -o /tmp/server/CoDMPServer_PC.functions.csv.gz \
            https://raw.githubusercontent.com/lizardpeter/bo2-pc-server-decompile/main/analysis/generated/CoDMPServer_PC.functions.csv.gz
          test -s /tmp/server/CoDMPServer_PC.functions.csv.gz
          gzip -t /tmp/server/CoDMPServer_PC.functions.csv.gz

      - name: Build conservative changed-byte candidates
        shell: bash
        run: |
          set -euo pipefail
          out=proof/current_client/cross_build_anchor_v1
          python3 tools/t6_cross_build_anchor_match_v1.py \
            --client-catalog proof/current_client/ghidra_low_hanging_v1/catalog.tsv \
            --server-functions /tmp/server/CoDMPServer_PC.functions.csv.gz \
            --anchors "$out/anchors.tsv" \
            --output "$out/candidates.tsv" \
            --summary "$out/summary.json"

      - name: Commit proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proof/current_client/cross_build_anchor_v1/candidates.tsv \
                  proof/current_client/cross_build_anchor_v1/summary.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add T6 changed-byte anchor candidate census v1"
          git push origin HEAD:main
