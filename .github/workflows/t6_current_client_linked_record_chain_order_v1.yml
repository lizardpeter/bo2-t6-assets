name: T6 current client linked record chain order v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_linked_record_chain_order_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_RELINK_SWAP_PROBE_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_LOOKUP_SEMANTICS_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_FIVE_ROOT_SCALAR_RELATION_V1.json'
      - '.github/workflows/t6_current_client_linked_record_chain_order_v1.yml'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Project and validate chain order
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_linked_record_chain_order_v1.py \
            --relink proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_RELINK_SWAP_PROBE_V1.json \
            --lookup proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_LOOKUP_SEMANTICS_V1.json \
            --scalar proof/current_client/T6_CURRENT_CLIENT_FIVE_ROOT_SCALAR_RELATION_V1.json \
            --out proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_CHAIN_ORDER_V1.json
          python3 - <<'PY'
          import json
          j=json.load(open('proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_CHAIN_ORDER_V1.json'))
          assert j['proven']['thereforeNonJgeBranchMaintainsGreaterScalarBeforeLowerScalarOrder'] is True
          assert j['proven']['directLookupWalksSecondaryLinksToTerminalRecord'] is True
          assert j['fiveRootRelation']['winner'] is None
          assert j['fiveRootRelation']['winnerAuthority'] is False
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_CHAIN_ORDER_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist current-client linked-record chain order'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
