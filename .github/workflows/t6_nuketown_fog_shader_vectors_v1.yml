name: T6 Nuketown fog shader vectors v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_nuketown_init_world_fog_v1.py'
      - 'tools/t6_nuketown_fog_shader_vectors_v1.py'
      - 'tools/t6_fastfile_expand_pc_v1.c'
      - '.github/workflows/t6_nuketown_fog_shader_vectors_v1.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build exact T6 FastFile expander
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libssl-dev zlib1g-dev >/dev/null
          gcc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_fastfile_expand -lcrypto -lz
          mkdir -p /tmp/proof

      - name: Download and exactly expand retail Nuketown
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 -o /tmp/mp_nuketown_2020.ff https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/mp_nuketown_2020.ff' | sha256sum -c -
          /tmp/t6_fastfile_expand /tmp/mp_nuketown_2020.ff /tmp/mp_nuketown_2020.expanded.bin mp_nuketown_2020 2> /tmp/proof/expand.log
          echo '7e791fb90a085f3bff9e0df895e5a232fa91cc43bcd0027225fe811f7891d505  /tmp/mp_nuketown_2020.expanded.bin' | sha256sum -c -

      - name: Re-extract SHA-pinned authored fog
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/t6_nuketown_init_world_fog_v1.py tools/t6_nuketown_fog_shader_vectors_v1.py
          python3 tools/t6_nuketown_init_world_fog_v1.py \
            --expanded /tmp/mp_nuketown_2020.expanded.bin \
            --out /tmp/proof/T6_NUKETOWN_INIT_WORLD_FOG_V1.json \
            | tee /tmp/proof/init_world_fog.log

      - name: Prove shader-vector construction and half-distance invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_nuketown_fog_shader_vectors_v1.py \
            --fog /tmp/proof/T6_NUKETOWN_INIT_WORLD_FOG_V1.json \
            --out /tmp/proof/T6_NUKETOWN_FOG_SHADER_VECTORS_V1.json \
            | tee /tmp/proof/fog_shader_vectors.log
          python3 - <<'PY'
          import json
          p='/tmp/proof/T6_NUKETOWN_FOG_SHADER_VECTORS_V1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['format']=='t6-nuketown-fog-shader-vectors-v1'
          inv=d['baseHeightCheckpoint']['invariants']
          assert abs(inv['baseDistTransmission']-1.0) < 2e-6
          assert abs(inv['halfDistTransmission']-0.5) < 2e-6
          assert len(d['assumptions']) == 2
          assert all(x['status']=='LINEAGE_BACKED_NOT_DIRECT_T6_BODY' for x in d['assumptions'])
          print('GREEN T6 NUKETOWN FOG SHADER VECTOR CONSTRUCTION')
          PY

      - name: Upload fog-vector proof
        uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_FOG_SHADER_VECTORS_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 0
