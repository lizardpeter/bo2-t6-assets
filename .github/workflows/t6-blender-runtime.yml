name: T6 Blender Runtime

on:
  push:
    paths:
      - '.github/workflows/t6-blender-runtime.yml'
      - 'tools/t6_blender_generated_layer_preview_v1.py'
      - 'tools/t6_blender_generated_layer_preview_v2.py'
      - 'tools/t6_blender_generated_layer_preview_v3.py'
      - 'tools/t6_generated_shader_recipe_contract_v1.py'
      - 'tools/t6_generated_world_shader_semantics_v1.py'
      - 'tools/test_t6_blender_generated_layer_preview_runtime_v3.py'
  pull_request:
    paths:
      - '.github/workflows/t6-blender-runtime.yml'
      - 'tools/t6_blender_generated_layer_preview_v1.py'
      - 'tools/t6_blender_generated_layer_preview_v2.py'
      - 'tools/t6_blender_generated_layer_preview_v3.py'
      - 'tools/t6_generated_shader_recipe_contract_v1.py'
      - 'tools/t6_generated_world_shader_semantics_v1.py'
      - 'tools/test_t6_blender_generated_layer_preview_runtime_v3.py'
  workflow_dispatch:

jobs:
  blender-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender 4.5.13 LTS
        shell: bash
        run: |
          set -euxo pipefail
          archive="$RUNNER_TEMP/blender.tar.xz"
          urls=(
            "https://mirror.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz"
            "https://download.blender.org/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz"
            "https://mirrors.nju.edu.cn/blender/release/Blender4.5/blender-4.5.13-linux-x64.tar.xz"
          )
          ok=0
          for url in "${urls[@]}"; do
            if curl --fail --location --retry 3 --retry-delay 2 --output "$archive" "$url"; then
              ok=1
              break
            fi
          done
          test "$ok" -eq 1
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          blender="$RUNNER_TEMP/blender-4.5.13-linux-x64/blender"
          test -x "$blender"
          "$blender" --version
          echo "BLENDER=$blender" >> "$GITHUB_ENV"

      - name: Run actual Blender importer and adapter
        shell: bash
        run: |
          set -euxo pipefail
          "$BLENDER" --background --factory-startup \
            --python tools/test_t6_blender_generated_layer_preview_runtime_v3.py
