name: T6 MP player body native-name join v1

on:
  workflow_dispatch:
  push:
    branches: [reversal/nonmap-assets]
    paths:
      - '.github/workflows/t6-mp-player-body-native-name-join-v1.yml'
      - 'tools/t6_mp_player_body_native_name_join_v1.py'
      - 'manifests/nonmap/retail/mp_player_body_faction_corpus_checkpoint_v1.json'

permissions:
  contents: read
  actions: read

env:
  SOURCE_NAME_CATALOG_RUN_ID: '34165691247'

jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact native-name catalog
        uses: actions/download-artifact@v4
        with:
          name: T6_STEAM_ENGLISH_AVAILABLE_NATIVE_XMODEL_NAME_CATALOG_V1
          path: /tmp/name-catalog
          github-token: ${{ github.token }}
          repository: lizardpeter/bo2-t6-assets
          run-id: ${{ env.SOURCE_NAME_CATALOG_RUN_ID }}

      - name: Join all 30 independently proven MP player bodies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof
          test -s /tmp/name-catalog/T6_STEAM_ENGLISH_AVAILABLE_NATIVE_XMODEL_NAME_CATALOG_V1.json
          python3 tools/t6_mp_player_body_native_name_join_v1.py \
            --body-corpus manifests/nonmap/retail/mp_player_body_faction_corpus_checkpoint_v1.json \
            --name-catalog /tmp/name-catalog/T6_STEAM_ENGLISH_AVAILABLE_NATIVE_XMODEL_NAME_CATALOG_V1.json \
            --out /tmp/proof/T6_MP_PLAYER_BODY_NATIVE_NAME_JOIN_V1.json \
            --require-closed

      - name: Upload exact 30-body global provenance join
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_MP_PLAYER_BODY_NATIVE_NAME_JOIN_V1
          path: /tmp/proof/T6_MP_PLAYER_BODY_NATIVE_NAME_JOIN_V1.json
          if-no-files-found: warn
          retention-days: 14
