name: T6 OAT debug offsets Nuketown

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_oat_debug_offsets_nuketown.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned OpenAssetTools with block-offset diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-multilib >/dev/null
          git clone -q --recursive https://github.com/Laupetin/OpenAssetTools.git /tmp/oat
          git -C /tmp/oat checkout -q 2ca512abe7cb82d70a94d5ad7846043c3978862d
          git -C /tmp/oat submodule update -q --init --recursive
          sed -i 's@// #define DEBUG_OFFSETS 1@#define DEBUG_OFFSETS 1@' /tmp/oat/src/ZoneLoading/Zone/Stream/ZoneInputStream.h
          cd /tmp/oat
          PREMAKE_NO_PROMPT=1 ./generate.sh
          ./scripts/make-debug.sh
          find build/bin -maxdepth 2 -type f \( -iname '*unlinker*' -o -iname 'Unlinker' \) | sort
      - name: Download exact retail Nuketown FastFile and trace loader offsets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/game/zone/all /tmp/out
          curl -fL --retry 4 -o /tmp/game/zone/all/mp_nuketown_2020.ff https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          sha256sum /tmp/game/zone/all/mp_nuketown_2020.ff
          BIN=$(find /tmp/oat/build/bin -type f \( -name Unlinker -o -name unlinker \) | head -1)
          test -n "$BIN"
          "$BIN" --no-color --list /tmp/game/zone/all/mp_nuketown_2020.ff > /tmp/oat_trace.log 2>&1 || { cat /tmp/oat_trace.log; exit 1; }
          grep -E '^Asset (2[5-9][0-9]|3[0-1][0-9]) ' /tmp/oat_trace.log | tee /tmp/xasset_offsets_250_319.txt || true
          echo '--- XAssets 270-299 ---'
          grep -E '^Asset (27[0-9]|28[0-9]|29[0-9]) ' /tmp/oat_trace.log | tee /tmp/xasset_offsets_270_299.txt
          echo '--- full tail ---'
          tail -200 /tmp/oat_trace.log
      - uses: actions/upload-artifact@v4
        with:
          name: t6-oat-nuketown-debug-offsets
          path: |
            /tmp/xasset_offsets_250_319.txt
            /tmp/xasset_offsets_270_299.txt
            /tmp/oat_trace.log
          if-no-files-found: error
