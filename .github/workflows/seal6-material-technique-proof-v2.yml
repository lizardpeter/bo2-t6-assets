name: SEAL6 material TechniqueSet proof v2

on:
  push:
    branches:
      - reversal/nonmap-assets
    paths:
      - ".github/workflows/seal6-material-technique-proof-v2.yml"
      - "tools/t6_seal6_material_technique_binding_proof_v1.py"
      - "tools/t6_seal6_material_technique_binding_proof_v2.py"
      - "tools/bo2_t6_fastfile.py"
      - "manifests/nonmap/retail/seal6_smg_material_handle_alias_proof_v1.json"
      - "manifests/nonmap/retail/faction_seals_mp_seal6_smg_full_player_v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and expand exact retail faction FastFile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/seal6_technique_v2
          curl --fail --location --silent --show-error \
            --retry 6 --retry-delay 2 --retry-all-errors --connect-timeout 30 \
            'https://r2.houseofkublai.com/bo2/zone/all/faction_seals_mp.ff' \
            -o /tmp/seal6_technique_v2/faction_seals_mp.ff
          python tools/bo2_t6_fastfile.py decrypt \
            /tmp/seal6_technique_v2/faction_seals_mp.ff \
            --output /tmp/seal6_technique_v2/faction_seals_mp.ff.expanded
      - name: Prove all 13 Material to TechniqueSet bindings
        shell: bash
        run: |
          set -euo pipefail
          python tools/t6_seal6_material_technique_binding_proof_v2.py \
            /tmp/seal6_technique_v2/faction_seals_mp.ff.expanded \
            manifests/nonmap/retail/seal6_smg_material_handle_alias_proof_v1.json \
            manifests/nonmap/retail/faction_seals_mp_seal6_smg_full_player_v1.json \
            --out /tmp/seal6_technique_v2/seal6_material_technique_binding_proof_v2.json
      - name: Assert complete closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='/tmp/seal6_technique_v2/seal6_material_technique_binding_proof_v2.json'
          d=json.load(open(p,encoding='utf-8'))
          s=d['summary']
          assert d['format']=='t6-seal6-material-technique-binding-proof-v2'
          assert s['materials']==13
          assert s['all13MaterialStartsExact'] is True
          assert s['allTechniqueSetBindingsExact'] is True
          assert len(d['directInlineOwnerSupplements'])==1
          x=d['directInlineOwnerSupplements'][0]
          assert x['material']=='mc/mtl_gen_eye_iris_green'
          assert x['materialRawStart']==0x547DEE
          assert x['serializedBytes']==511
          assert x['serializedSha256']=='65e65dd6624966845e39c0556b5062e327a6401ecf4a1fe88e85537b79390247'
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: SEAL6_MATERIAL_TECHNIQUE_PROOF_V2
          path: /tmp/seal6_technique_v2/seal6_material_technique_binding_proof_v2.json
          if-no-files-found: error
          retention-days: 14
