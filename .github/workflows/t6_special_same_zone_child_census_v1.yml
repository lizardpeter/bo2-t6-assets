name: T6 special same-zone child unique-pointer census v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_retail_special_oat_same_zone_child_census_v1.py'
      - 'proof/render/T6_RETAIL_SPECIAL_OAT_SAME_ZONE_CHILD_RESOLUTION_V1.json'
      - '.github/workflows/t6_special_same_zone_child_census_v1.yml'
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compact exact same-zone resolution
        run: |
          set -euo pipefail
          python3 tools/t6_retail_special_oat_same_zone_child_census_v1.py             --resolution proof/render/T6_RETAIL_SPECIAL_OAT_SAME_ZONE_CHILD_RESOLUTION_V1.json             --out proof/render/T6_RETAIL_SPECIAL_OAT_SAME_ZONE_CHILD_CENSUS_V1.json
          python3 -c "import json; d=json.load(open('proof/render/T6_RETAIL_SPECIAL_OAT_SAME_ZONE_CHILD_CENSUS_V1.json')); assert d['summary']['conflictCount']==0; assert d['summary']['topologyOccurrenceCount']==1436; print(json.dumps(d,indent=2,sort_keys=True))"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/render/T6_RETAIL_SPECIAL_OAT_SAME_ZONE_CHILD_CENSUS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist special packed child unique-pointer census'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_RETAIL_SPECIAL_OAT_SAME_ZONE_CHILD_CENSUS_V1
          path: proof/render/T6_RETAIL_SPECIAL_OAT_SAME_ZONE_CHILD_CENSUS_V1.json
          if-no-files-found: error
