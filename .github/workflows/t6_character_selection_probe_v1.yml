name: T6 character selection probe v1

on:
  push:
    branches:
      - probe-t6-character-xassets
    paths:
      - ".github/workflows/t6_character_selection_probe_v1.yml"
      - "tools/ghidra_scripts/ExportT6NamedFunctions.java"
  workflow_dispatch:

permissions:
  contents: read

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  SERVER_CACHE_KEY: t6-server-ghidra-12.1.3-f67eb68a-7874efc2-pdb-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors             -o /tmp/ghidra.zip             https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Restore exact PDB-backed server project
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-server-ghidra/projects
          key: ${{ env.SERVER_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Select character ownership functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-character-selection
          cat >/tmp/t6-character-selection/selection.tsv <<'EOF'
          function_id	requested_name	tier
          BG_FactionData_Init	BG_FactionData_Init	faction-selection
          BG_GetFactionForTeam	BG_GetFactionForTeam	faction-selection
          Com_FactionLookup	Com_FactionLookup	faction-selection
          Com_FactionLookupAllies	Com_FactionLookupAllies	faction-selection
          Com_FactionLookupAxis	Com_FactionLookupAxis	faction-selection
          Com_FactionFastFileAllies	Com_FactionFastFileAllies	faction-selection
          Com_FactionFastFileAxis	Com_FactionFastFileAxis	faction-selection
          CG_ParsePlayerInfos	CG_ParsePlayerInfos	player-model-selection
          G_UpdateClientInfo	G_UpdateClientInfo	player-model-selection
          CG_PlayerDobjChanging	CG_PlayerDobjChanging	player-model-selection
          CG_UpdatePlayerDObj	CG_UpdatePlayerDObj	player-model-selection
          BG_UpdatePlayerDObj	BG_UpdatePlayerDObj	player-model-selection
          G_CreateDObj	G_CreateDObj	player-model-construction
          CG_CreateDObj	CG_CreateDObj	player-model-construction
          R_RegisterModel	R_RegisterModel	model-registration
          G_ModelIndex	G_ModelIndex	model-registration
          EOF

      - name: Export exact PDB-backed functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-character-selection/out /tmp/t6-server-ghidra/config-char /tmp/t6-server-ghidra/cache-char
          export XDG_CONFIG_HOME=/tmp/t6-server-ghidra/config-char
          export XDG_CACHE_HOME=/tmp/t6-server-ghidra/cache-char
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless"             /tmp/t6-server-ghidra/projects t6-server-pdb             -process CoDMPServer_PC.exe -noanalysis -readOnly             -postScript ExportT6NamedFunctions.java               /tmp/t6-character-selection/selection.tsv /tmp/t6-character-selection/out 30             -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 2
          cat /tmp/t6-character-selection/out/results.tsv
          for f in /tmp/t6-character-selection/out/decompile/*.c; do
            echo "=== $(basename "$f") ==="
            cat "$f"
          done

      - name: Mine selection strings and table calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('/tmp/t6-character-selection/out/decompile')
          needles=[
            'StringTable','RawFile','DB_FindXAsset','R_RegisterModel','G_ModelIndex',
            'faction','model','body','head','viewhand','hands','class','team',
            '.csv','.gsc','.cfg','.txt'
          ]
          out={}
          for p in sorted(root.glob('*.c')):
            text=p.read_text(errors='replace')
            lines=text.splitlines()
            hits=[]
            for i,line in enumerate(lines):
              low=line.lower()
              if any(n.lower() in low for n in needles):
                hits.append({'line':i+1,'text':line.strip()})
            if hits:
              out[p.stem]=hits
          Path('/tmp/t6-character-selection/selection_hits.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Upload exact character-selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: T6_CHARACTER_SELECTION_PROBE_V1
          path: /tmp/t6-character-selection
          if-no-files-found: error
          retention-days: 7
