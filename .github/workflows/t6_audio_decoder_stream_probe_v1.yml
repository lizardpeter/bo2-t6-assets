name: T6 audio decoder stream probe v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_audio_decoder_stream_probe_v1.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXE_ID: 1NhLTmevZ5HPKRByj1ok8BpwbvX_5rc1n
      MAP_ID: 1kcCFEDP-gubgUyN6R_WjlJpFGoeZNEmd
      EXE_SHA256: f67eb68a494b93b5b229985205bdc94e26fdfe677663410e2207c25f6f27a55d
      MAP_SHA256: 34e16e517072031629307ffa0520d59f3c586539b943d081f60c59ee9ce1c3bf
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify exact active references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref /tmp/probe
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.exe "https://drive.usercontent.google.com/download?id=$EXE_ID&export=download&confirm=t"
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.map "https://drive.usercontent.google.com/download?id=$MAP_ID&export=download&confirm=t"
          echo "$EXE_SHA256  /tmp/ref/CoDMPServer_PC.exe" | sha256sum -c -
          echo "$MAP_SHA256  /tmp/ref/CoDMPServer_PC.map" | sha256sum -c -

      - name: Install disassembler
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6

      - name: Extract exact decoder and stream functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, struct
          from pathlib import Path
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32

          exe = Path('/tmp/ref/CoDMPServer_PC.exe').read_bytes()
          map_text = Path('/tmp/ref/CoDMPServer_PC.map').read_text('ascii', errors='strict')
          BASE = 0x00400000
          pe = struct.unpack_from('<I', exe, 0x3c)[0]
          coff = pe + 4
          _, nsects, _, _, _, opt_size, _ = struct.unpack_from('<HHIIIHH', exe, coff)
          opt = coff + 20
          assert struct.unpack_from('<I', exe, opt + 28)[0] == BASE
          sections = []
          st = opt + opt_size
          for i in range(nsects):
              o = st + i * 40
              name = exe[o:o+8].split(b'\0',1)[0].decode('ascii','replace')
              virtual_size, rva, raw_size, raw_offset = struct.unpack_from('<IIII', exe, o + 8)
              sections.append((name, BASE+rva, virtual_size, raw_size, raw_offset))

          def va_off(va):
              for name, base, vs, rs, ro in sections:
                  if base <= va < base + rs:
                      return ro + va - base
              raise ValueError(hex(va))

          def raw(a,b):
              return exe[va_off(a):va_off(a)+(b-a)]

          def cstr(va, limit=240):
              try:
                  o = va_off(va)
              except Exception:
                  return None
              s = exe[o:o+limit].split(b'\0',1)[0]
              if not s or len(s) >= limit:
                  return None
              if all((32 <= c < 127) or c in (9,10,13) for c in s):
                  return s.decode('ascii','replace')
              return None

          # Exact MAP symbol start addresses establish these function boundaries.
          ranges = {
              'SD_DecoderShutdown': (0x008B99F0, 0x008B9A10),
              'SD_DecoderAllocate_impl': (0x008B9A10, 0x008B9B20),
              'SD_DecoderAllocate_wrapper': (0x008B9B20, 0x008B9B70),
              'SD_SourceInitStream': (0x008B9D10, 0x008B9DA0),
              'SD_StreamShutdown': (0x008B9DA0, 0x008B9DC0),
              'SD_StreamBufferPreload': (0x008B9DC0, 0x008B9E20),
              'SD_StreamAllocate': (0x008B9E20, 0x008BA010),
          }

          # Collect MAP lines keyed by exact public VA.
          map_by_va = {}
          for ln in map_text.splitlines():
              m = re.search(r'\b([0-9A-Fa-f]{8})\b(?:\s+f)?\s+[^\s]+\.obj\s*$', ln)
              if not m:
                  continue
              va = int(m.group(1),16)
              map_by_va.setdefault(va, []).append(ln.strip())

          md = Cs(CS_ARCH_X86, CS_MODE_32)
          md.detail = False
          metadata = {}
          all_calls = set()
          immediates = set()

          for name,(start,end) in ranges.items():
              rb = raw(start,end)
              insns = list(md.disasm(rb,start))
              if not insns or insns[0].address != start:
                  raise SystemExit(f'disassembly failed at {name}')
              lines = [f'{i.address:08X}: {i.bytes.hex():<24} {i.mnemonic:<8} {i.op_str}' for i in insns]
              Path('/tmp/probe',name+'.asm').write_text('\n'.join(lines)+'\n')
              h = hashlib.sha256(rb).hexdigest()
              metadata[name] = {'start':f'0x{start:08X}','endExclusive':f'0x{end:08X}','bytes':len(rb),'sha256':h,'instructions':len(insns)}
              print(f'=== {name} ===')
              print(json.dumps(metadata[name], sort_keys=True))
              for i in insns:
                  if i.mnemonic == 'call' and i.op_str.startswith('0x'):
                      try: all_calls.add(int(i.op_str,16))
                      except ValueError: pass
                  if i.mnemonic == 'push' and i.op_str.startswith('0x'):
                      try: immediates.add(int(i.op_str,16))
                      except ValueError: pass
                  print(f'{i.address:08X}: {i.bytes.hex():<24} {i.mnemonic:<8} {i.op_str}')

          Path('/tmp/probe/ranges.json').write_text(json.dumps(metadata,indent=2,sort_keys=True)+'\n')

          print('=== DIRECT CALL TARGET MAP RESOLUTION ===')
          call_report=[]
          for va in sorted(all_calls):
              lines=map_by_va.get(va,[])
              call_report.append({'va':f'0x{va:08X}','map':lines})
              print(f'0x{va:08X}')
              for ln in lines: print('  '+ln)
          Path('/tmp/probe/call_targets.json').write_text(json.dumps(call_report,indent=2)+'\n')

          print('=== REFERENCED ASCII IMMEDIATES ===')
          strings=[]
          for va in sorted(immediates):
              s=cstr(va)
              if s is not None:
                  strings.append({'va':f'0x{va:08X}','string':s})
                  print(f'0x{va:08X}: {s!r}')
          Path('/tmp/probe/strings.json').write_text(json.dumps(strings,indent=2)+'\n')

          print('=== MAP NEIGHBORHOOD 0x008B9900..0x008BA100 ===')
          near=[]
          for va in sorted(map_by_va):
              if 0x008B9900 <= va <= 0x008BA100:
                  for ln in map_by_va[va]:
                      near.append({'va':f'0x{va:08X}','line':ln})
                      print(ln)
          Path('/tmp/probe/map_neighborhood.json').write_text(json.dumps(near,indent=2)+'\n')
          PY

      - name: Upload exact decoder stream probe
        uses: actions/upload-artifact@v4
        with:
          name: T6_AUDIO_DECODER_STREAM_PROBE_V1
          path: /tmp/probe
          if-no-files-found: error
          compression-level: 9
