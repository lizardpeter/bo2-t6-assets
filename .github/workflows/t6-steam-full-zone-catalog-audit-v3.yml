name: T6 Steam full English FastFile catalog audit v3

on:
  workflow_dispatch:
  push:
    branches: [reversal/nonmap-assets]
    paths:
      - '.github/workflows/t6-steam-full-zone-catalog-audit-v3.yml'
      - 'tools/t6_public_zip_ff_catalog_probe_v2.py'
      - 'tools/t6_public_zip_ff_catalog_probe_v3.py'
      - 'tools/t6_steam_zone_catalog_audit_v2.py'
      - 'manifests/nonmap/retail/t6_steam_english_base_zone_catalog_v1.json'
      - 'manifests/nonmap/retail/t6_steam_english_full_zone_catalog_v2.json'
      - 'manifests/nonmap/retail/t6_whole_retail_corpus_seed_v1.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate full English-install catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/t6_steam_zone_catalog_audit_v2.py tools/t6_public_zip_ff_catalog_probe_v2.py tools/t6_public_zip_ff_catalog_probe_v3.py
          python3 tools/t6_steam_zone_catalog_audit_v2.py \
            --base-catalog manifests/nonmap/retail/t6_steam_english_base_zone_catalog_v1.json \
            --catalog manifests/nonmap/retail/t6_steam_english_full_zone_catalog_v2.json \
            --seed manifests/nonmap/retail/t6_whole_retail_corpus_seed_v1.json \
            --out /tmp/T6_STEAM_FULL_ZONE_CATALOG_PREPROBE_V3.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/T6_STEAM_FULL_ZONE_CATALOG_PREPROBE_V3.json'))
          assert p['totals']=={'depots':28,'depotFfEntries':303,'uniqueFfPaths':297,'overlappingUniquePaths':6},p['totals']
          assert p['seedCoverage']=={'zones':18,'matched':18,'outsideCatalogPaths':[]},p['seedCoverage']
          assert p['gates']['catalogStructurallyValid'] is True
          assert p['gates']['englishRetailFfCatalogComplete'] is True
          assert p['gates']['overlappingDepotPathOwnershipAccounted'] is True
          assert p['gates']['overlappingDepotByteIdentityComplete'] is False
          assert p['gates']['wholeRetailAllLanguagesCatalogComplete'] is False
          assert p['gates']['populationInputIdentityComplete'] is False
          PY

      - name: Build canonical 297-path set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/T6_STEAM_FULL_ZONE_PATHS_V3.txt
          import json
          b=json.load(open('manifests/nonmap/retail/t6_steam_english_base_zone_catalog_v1.json'))
          c=json.load(open('manifests/nonmap/retail/t6_steam_english_full_zone_catalog_v2.json'))
          paths=set()
          for d in b['depots']+c['additionalDepots']:
              paths.update(d['ff'])
          for p in sorted(paths): print(p)
          PY
          test "$(wc -l < /tmp/T6_STEAM_FULL_ZONE_PATHS_V3.txt)" -eq 297

      - name: Probe flat R2 mirror
        shell: bash
        run: |
          set -euo pipefail
          export R2_BASE='https://r2.houseofkublai.com/bo2'
          probe_one() {
            p="$1"; url="$R2_BASE/$p"; hdr=$(mktemp)
            if curl -fsSIL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 20 -o /dev/null -D "$hdr" "$url"; then
              bytes=$(awk 'BEGIN{IGNORECASE=1} /^content-length:/ {gsub("\r",""); v=$2} END{print v}' "$hdr")
              printf '%s\tpresent\t%s\t%s\n' "$p" "${bytes:-unknown}" "$url"
            else
              printf '%s\tunavailable\t-\t%s\n' "$p" "$url"
            fi
            rm -f "$hdr"
          }
          export -f probe_one
          xargs -P 16 -I{} bash -c 'probe_one "$1"' _ {} < /tmp/T6_STEAM_FULL_ZONE_PATHS_V3.txt | sort -t $'\t' -k1,1 > /tmp/T6_STEAM_FULL_ZONE_R2_PROBE_V3.tsv
          test "$(wc -l < /tmp/T6_STEAM_FULL_ZONE_R2_PROBE_V3.tsv)" -eq 297
          awk -F '\t' '{c[$2]++} END {for (k in c) print k,c[k]}' /tmp/T6_STEAM_FULL_ZONE_R2_PROBE_V3.tsv | sort

      - name: Probe public full-game ZIP without weakening Range safety
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_public_zip_ff_catalog_probe_v3.py \
            --url https://cdn.jordanlindsay.com.au/pluto_t6_full_game.zip \
            --paths /tmp/T6_STEAM_FULL_ZONE_PATHS_V3.txt \
            --out-tsv /tmp/T6_STEAM_FULL_ZONE_ZIP_PROBE_V3.tsv \
            --out-meta /tmp/T6_STEAM_FULL_ZONE_ZIP_META_V3.json
          test "$(wc -l < /tmp/T6_STEAM_FULL_ZONE_ZIP_PROBE_V3.tsv)" -eq 297
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/T6_STEAM_FULL_ZONE_ZIP_META_V3.json'))
          assert p['format']=='t6-public-zip-ff-catalog-probe-v3'
          assert p['catalogPaths']==297
          assert p['safety']['sizeDiscoveryBodylessHead'] is True
          assert p['safety']['requires206BeforeBodyRead'] is True
          assert p['safety']['archivePayloadDownloaded'] is False
          if p['sourceProbeAvailable'] is False:
              assert p['sourceProbeReason']=='rangeUnsupported',p
              assert p['present']==0 and p['unavailable']==297,p
              assert p['rangeFailure']['httpStatus'] != 206,p
          else:
              assert p['sourceProbeAvailable'] is True,p
              assert p['sourceProbeReason'] is None,p
              assert p['rangeFailure'] is None,p
          print(json.dumps({
            'sourceProbeAvailable':p['sourceProbeAvailable'],
            'sourceProbeReason':p['sourceProbeReason'],
            'present':p['present'],
            'unavailable':p['unavailable'],
            'rangeFailure':p['rangeFailure'],
            'safety':p['safety'],
          },indent=2,sort_keys=True))
          PY

      - name: Build combined source-container audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_steam_zone_catalog_audit_v2.py \
            --base-catalog manifests/nonmap/retail/t6_steam_english_base_zone_catalog_v1.json \
            --catalog manifests/nonmap/retail/t6_steam_english_full_zone_catalog_v2.json \
            --seed manifests/nonmap/retail/t6_whole_retail_corpus_seed_v1.json \
            --r2-probe-tsv /tmp/T6_STEAM_FULL_ZONE_R2_PROBE_V3.tsv \
            --zip-probe-tsv /tmp/T6_STEAM_FULL_ZONE_ZIP_PROBE_V3.tsv \
            --out /tmp/T6_STEAM_FULL_ZONE_CATALOG_AUDIT_V3.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/T6_STEAM_FULL_ZONE_CATALOG_AUDIT_V3.json'))
          z=json.load(open('/tmp/T6_STEAM_FULL_ZONE_ZIP_META_V3.json'))
          assert p['gates']['catalogStructurallyValid'] is True
          assert p['gates']['englishRetailFfCatalogComplete'] is True
          assert p['gates']['overlappingDepotPathOwnershipAccounted'] is True
          assert p['gates']['overlappingDepotByteIdentityComplete'] is False
          assert p['gates']['wholeRetailAllLanguagesCatalogComplete'] is False
          assert p['gates']['populationInputIdentityComplete'] is False
          if z['sourceProbeAvailable'] is False:
              assert p['gates']['publicZipCompleteForCatalog'] is False
              assert p['publicZipProbe']['present']==0
          print(json.dumps({
            'totals':p['totals'],
            'r2Present':None if p['r2Probe'] is None else p['r2Probe']['present'],
            'zipSourceProbeAvailable':z['sourceProbeAvailable'],
            'zipSourceProbeReason':z['sourceProbeReason'],
            'zipPresent':None if p['publicZipProbe'] is None else p['publicZipProbe']['present'],
            'unionPresent':p['sourceContainerUnion']['present'],
            'unionMissingCount':len(p['sourceContainerUnion']['missing']),
            'unionMissing':p['sourceContainerUnion']['missing'],
            'gates':p['gates'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload compact v3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_STEAM_FULL_ZONE_CATALOG_AUDIT_V3
          path: |
            /tmp/T6_STEAM_FULL_ZONE_CATALOG_PREPROBE_V3.json
            /tmp/T6_STEAM_FULL_ZONE_CATALOG_AUDIT_V3.json
            /tmp/T6_STEAM_FULL_ZONE_PATHS_V3.txt
            /tmp/T6_STEAM_FULL_ZONE_R2_PROBE_V3.tsv
            /tmp/T6_STEAM_FULL_ZONE_ZIP_PROBE_V3.tsv
            /tmp/T6_STEAM_FULL_ZONE_ZIP_META_V3.json
          if-no-files-found: error
          retention-days: 14
