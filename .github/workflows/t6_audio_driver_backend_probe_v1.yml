name: T6 audio driver backend probe v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_audio_driver_backend_probe_v1.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXE_ID: 1NhLTmevZ5HPKRByj1ok8BpwbvX_5rc1n
      MAP_ID: 1kcCFEDP-gubgUyN6R_WjlJpFGoeZNEmd
      EXE_SHA256: f67eb68a494b93b5b229985205bdc94e26fdfe677663410e2207c25f6f27a55d
      MAP_SHA256: 34e16e517072031629307ffa0520d59f3c586539b943d081f60c59ee9ce1c3bf
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify exact active references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref /tmp/probe
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.exe "https://drive.usercontent.google.com/download?id=$EXE_ID&export=download&confirm=t"
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ref/CoDMPServer_PC.map "https://drive.usercontent.google.com/download?id=$MAP_ID&export=download&confirm=t"
          echo "$EXE_SHA256  /tmp/ref/CoDMPServer_PC.exe" | sha256sum -c -
          echo "$MAP_SHA256  /tmp/ref/CoDMPServer_PC.map" | sha256sum -c -

      - name: Install disassembler
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6

      - name: Resolve helper symbols and exact code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re, struct
          from pathlib import Path
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32

          exe=Path('/tmp/ref/CoDMPServer_PC.exe').read_bytes()
          mt=Path('/tmp/ref/CoDMPServer_PC.map').read_text('ascii')
          BASE=0x400000
          pe=struct.unpack_from('<I',exe,0x3c)[0]; coff=pe+4
          _,ns,_,_,_,osz,_=struct.unpack_from('<HHIIIHH',exe,coff); opt=coff+20
          assert struct.unpack_from('<I',exe,opt+28)[0]==BASE
          secs=[]; st=opt+osz
          for i in range(ns):
              o=st+i*40
              _,rva,rs,ro=struct.unpack_from('<IIII',exe,o+8)
              secs.append((BASE+rva,rs,ro))
          def off(va):
              for b,rs,ro in secs:
                  if b<=va<b+rs: return ro+va-b
              raise ValueError(hex(va))
          def raw(a,b): return exe[off(a):off(a)+(b-a)]

          targets=[0x008BA1C0,0x008B9B20,0x008B9D10,0x008B8A50,0x008BA150]
          print('=== EXACT MAP TARGET LINES ===')
          for va in targets:
              token=f'{va:08x}'
              hits=[ln for ln in mt.splitlines() if re.search(rf'(?i)(?<![0-9a-f]){token}(?![0-9a-f])',ln)]
              print(f'-- 0x{va:08X} --')
              for ln in hits: print(ln)

          # Build a VA-indexed MAP symbol census so the nearest subsequent symbols expose exact boundaries.
          syms=[]
          for ln in mt.splitlines():
              m=re.search(r'\s([0-9A-Fa-f]{8})\s+(?:f\s+)?[^\s]+\.obj\s*$',ln)
              if not m: continue
              va=int(m.group(1),16)
              if 0x008B0000 <= va <= 0x008C0000:
                  syms.append((va,ln.strip()))
          syms=sorted(set(syms))
          print('=== TARGET NEIGHBORHOODS ===')
          for target in targets:
              before=[x for x in syms if x[0]<=target][-3:]
              after=[x for x in syms if x[0]>target][:6]
              print(f'-- around 0x{target:08X} --')
              for va,ln in before+after: print(f'{va:08X} {ln}')

          md=Cs(CS_ARCH_X86,CS_MODE_32)
          ranges={
              'helper_8ba1c0':(0x008BA1C0,0x008BA310),
              'helper_8b9b20':(0x008B9B20,0x008B9D10),
              'helper_8b9d10':(0x008B9D10,0x008B9F80),
              'helper_8b8a50':(0x008B8A50,0x008B8B20),
              'helper_8ba150':(0x008BA150,0x008BA1C0),
          }
          meta={}
          for name,(a,b) in ranges.items():
              rb=raw(a,b)
              lines=[f'{i.address:08X}: {i.bytes.hex():<24} {i.mnemonic:<8} {i.op_str}' for i in md.disasm(rb,a)]
              Path('/tmp/probe',name+'.asm').write_text('\n'.join(lines)+'\n')
              meta[name]={'start':f'0x{a:08X}','endExclusive':f'0x{b:08X}','bytes':len(rb),'sha256':hashlib.sha256(rb).hexdigest(),'instructions':len(lines)}
              print(f'=== {name} ===')
              for line in lines:
                  if 'call' in line or '0xb8c' in line.lower() or '0xe6' in line.lower() or '0xe5' in line.lower():
                      print(line)
          Path('/tmp/probe/ranges.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          print('=== RANGE IDENTITIES ===')
          print(json.dumps(meta,indent=2,sort_keys=True))
          PY

      - name: Upload exact backend probe
        uses: actions/upload-artifact@v4
        with:
          name: T6_AUDIO_DRIVER_BACKEND_PROBE_V1
          path: /tmp/probe
          if-no-files-found: error
          compression-level: 9
