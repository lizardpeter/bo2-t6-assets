name: T6 current client gameTime provider semantics v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_gametime_provider_semantics_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_GAMETIME_SOURCE_OBJECT_CALLERS_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_GAMETIME_STATE_COPY_PROBE_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_GAMETIME_TRANSFORM_SEMANTICS_V1.json'
      - '.github/workflows/t6_current_client_gametime_provider_semantics_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Project exact gameTime provider semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_gametime_provider_semantics_v1.py             --callers proof/current_client/T6_CURRENT_CLIENT_GAMETIME_SOURCE_OBJECT_CALLERS_V1.json             --copy proof/current_client/T6_CURRENT_CLIENT_GAMETIME_STATE_COPY_PROBE_V1.json             --transform proof/current_client/T6_CURRENT_CLIENT_GAMETIME_TRANSFORM_SEMANTICS_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_GAMETIME_PROVIDER_SEMANTICS_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_GAMETIME_PROVIDER_SEMANTICS_V1.json'))
          s=d['summary']
          assert s['currentClientProviderClosed'] is True
          assert s['exactCallerCount']==6
          assert s['sourceScalarProviderDataflowClosed'] is True
          assert s['physicalUnitsClosed'] is False
          assert s['historicalRetailEquivalent'] is False
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_GAMETIME_PROVIDER_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact gameTime provider semantics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_GAMETIME_PROVIDER_SEMANTICS_V1
          path: proof/current_client/T6_CURRENT_CLIENT_GAMETIME_PROVIDER_SEMANTICS_V1.json
          if-no-files-found: error
