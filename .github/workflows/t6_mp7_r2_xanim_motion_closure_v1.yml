name: T6 MP7 R2 XAnim motion closure v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/firstperson-weapons-closure
    paths:
      - '.github/workflows/t6_mp7_r2_xanim_motion_closure_v1.yml'
      - 'tools/t6_mp7_r2_xanim_motion_closure_v1.py'
      - 'tools/t6_xanim_normalize_v1.py'
      - 'tools/t6_xanim_serialized_walker.py'
      - 'tools/t6_xanim_quaternion_semantics.py'
      - 'tools/t6_fastfile_expand_pc_v1.c'
      - 'manifests/weapons/T6_MP7_R2_XANIM_NOTETRACK_CLOSURE_V1.json'
      - 'manifests/weapons/T6_MP7_R2_XANIM_MOTION_CLOSURE_V1.json'
      - 'manifests/animations/T6_XANIM_HALF_QUATERNION_SEMANTICS_PROOF_V1.json'

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile-check motion closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/t6_mp7_r2_xanim_motion_closure_v1.py \
            tools/t6_xanim_normalize_v1.py \
            tools/t6_xanim_serialized_walker.py \
            tools/t6_xanim_quaternion_semantics.py

      - name: Build source-closed FastFile expander
        shell: bash
        run: |
          set -euo pipefail
          gcc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_expand -lcrypto -lz
          mkdir -p /tmp/game/zone/all /tmp/expanded /tmp/proof
          sha256sum /tmp/t6_expand | tee /tmp/proof/expander_sha256.txt

      - name: Download exact current R2 common_mp
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 https://r2.houseofkublai.com/bo2/zone/all/common_mp.ff -o /tmp/game/zone/all/common_mp.ff
          echo '93fe48b0f0d8cc6844be875ccad94e0cfcf635f62eeff00ac33f2f668a77cb77  /tmp/game/zone/all/common_mp.ff' | sha256sum -c -
          sha256sum /tmp/game/zone/all/common_mp.ff | tee /tmp/proof/r2_fastfile_sha256.txt

      - name: Freshly expand current R2 common_mp
        shell: bash
        run: |
          set -euo pipefail
          /tmp/t6_expand /tmp/game/zone/all/common_mp.ff /tmp/expanded/common_mp.bin common_mp \
            > /tmp/proof/common_mp_expand.log 2>&1
          test "$(stat -c%s /tmp/expanded/common_mp.bin)" = '206493911'
          echo 'fbd91d0ede8e27bcaaf7af9638a7118050f27519524be36e9234f980bd6170ce  /tmp/expanded/common_mp.bin' | sha256sum -c -
          sha256sum /tmp/expanded/common_mp.bin | tee /tmp/proof/expanded_sha256.txt

      - name: Close all 23 MP7 ordinary XAnim motion payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_mp7_r2_xanim_motion_closure_v1.py \
            --stream /tmp/expanded/common_mp.bin \
            --retained manifests/weapons/T6_MP7_R2_XANIM_NOTETRACK_CLOSURE_V1.json \
            --half-proof manifests/animations/T6_XANIM_HALF_QUATERNION_SEMANTICS_PROOF_V1.json \
            --out /tmp/proof/T6_MP7_R2_XANIM_MOTION_CLOSURE_V1.json \
            | tee /tmp/proof/motion_closure.log
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/proof/T6_MP7_R2_XANIM_MOTION_CLOSURE_V1.json')
          raw=p.read_bytes()
          d=json.loads(raw)
          retained=json.loads(Path('manifests/weapons/T6_MP7_R2_XANIM_MOTION_CLOSURE_V1.json').read_text())
          assert d['format']=='t6-mp7-r2-xanim-motion-closure-v1'
          assert d['source']['expandedCommonMp']['bytes']==206493911
          assert d['source']['expandedCommonMp']['sha256']=='fbd91d0ede8e27bcaaf7af9638a7118050f27519524be36e9234f980bd6170ce'
          assert d['summary']['targetCount']==23
          assert d['summary']['boneTrackCount']==1598
          assert d['summary']['allTargetsFlatPoolsExhausted'] is True
          assert d['summary']['allTargetsDeltaPartAbsent'] is True
          assert len(d['targets'])==23
          assert all(x['flatPoolExhaustion'] for x in d['targets'])

          assert retained['format']=='t6-mp7-r2-xanim-motion-retained-closure-v1'
          assert hashlib.sha256(raw).hexdigest()==retained['provenance']['generatedManifestSha256']
          assert retained['source']==d['source']['expandedCommonMp']
          assert retained['summary']==d['summary']
          projected=[]
          for x in d['targets']:
              projected.append({
                  'name':x['name'],
                  'assetSerializedSha256':x['assetSerializedSha256'],
                  'normalizedAugmentedCanonicalSha256':x['normalizedAugmentedCanonicalSha256'],
                  'boneTrackCount':x['boneTrackCount'],
                  'quatStoredKeyCount':x['quatStoredKeyCount'],
                  'transStoredKeyCount':x['transStoredKeyCount'],
              })
          assert retained['targets']==projected
          print('motion_manifest_sha256='+hashlib.sha256(raw).hexdigest())
          PY
          sha256sum /tmp/proof/T6_MP7_R2_XANIM_MOTION_CLOSURE_V1.json | tee /tmp/proof/manifest_sha256.txt

      - name: Upload MP7 XAnim motion proof
        uses: actions/upload-artifact@v4
        with:
          name: T6_MP7_R2_XANIM_MOTION_CLOSURE_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
