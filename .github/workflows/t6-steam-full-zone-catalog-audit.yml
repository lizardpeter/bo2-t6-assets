name: T6 Steam full English FastFile catalog audit v2

on:
  workflow_dispatch:
  push:
    branches: [reversal/nonmap-assets]
    paths:
      - '.github/workflows/t6-steam-full-zone-catalog-audit.yml'
      - 'tools/t6_steam_zone_catalog_audit_v2.py'
      - 'manifests/nonmap/retail/t6_steam_english_base_zone_catalog_v1.json'
      - 'manifests/nonmap/retail/t6_steam_english_full_zone_catalog_v2.json'
      - 'manifests/nonmap/retail/t6_whole_retail_corpus_seed_v1.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate complete English-install source catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/t6_steam_zone_catalog_audit_v2.py
          python3 tools/t6_steam_zone_catalog_audit_v2.py \
            --base-catalog manifests/nonmap/retail/t6_steam_english_base_zone_catalog_v1.json \
            --catalog manifests/nonmap/retail/t6_steam_english_full_zone_catalog_v2.json \
            --seed manifests/nonmap/retail/t6_whole_retail_corpus_seed_v1.json \
            --out /tmp/T6_STEAM_FULL_ZONE_CATALOG_PREPROBE_V2.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/T6_STEAM_FULL_ZONE_CATALOG_PREPROBE_V2.json'))
          assert p['totals']=={'depots':28,'depotFfEntries':303,'uniqueFfPaths':297,'overlappingUniquePaths':6},p['totals']
          assert p['seedCoverage']['zones']==18
          assert p['seedCoverage']['matched']==18
          assert p['seedCoverage']['outsideCatalogPaths']==[]
          assert p['gates']['catalogStructurallyValid'] is True
          assert p['gates']['englishRetailFfCatalogComplete'] is True
          assert p['gates']['overlappingDepotPathOwnershipAccounted'] is True
          assert p['gates']['overlappingDepotByteIdentityComplete'] is False
          assert p['gates']['wholeRetailAllLanguagesCatalogComplete'] is False
          assert p['gates']['populationInputIdentityComplete'] is False
          PY

      - name: Build unique Steam FastFile path set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/T6_STEAM_FULL_ZONE_PATHS_V2.txt
          import json
          b=json.load(open('manifests/nonmap/retail/t6_steam_english_base_zone_catalog_v1.json'))
          c=json.load(open('manifests/nonmap/retail/t6_steam_english_full_zone_catalog_v2.json'))
          paths=set()
          for d in b['depots']+c['additionalDepots']:
              paths.update(d['ff'])
          for p in sorted(paths): print(p)
          PY
          test "$(wc -l < /tmp/T6_STEAM_FULL_ZONE_PATHS_V2.txt)" -eq 297

      - name: Probe flat R2 mirror
        shell: bash
        run: |
          set -euo pipefail
          export R2_BASE='https://r2.houseofkublai.com/bo2'
          probe_one() {
            p="$1"; url="$R2_BASE/$p"; hdr=$(mktemp)
            if curl -fsSIL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 20 -o /dev/null -D "$hdr" "$url"; then
              bytes=$(awk 'BEGIN{IGNORECASE=1} /^content-length:/ {gsub("\r",""); v=$2} END{print v}' "$hdr")
              printf '%s\tpresent\t%s\t%s\n' "$p" "${bytes:-unknown}" "$url"
            else
              printf '%s\tunavailable\t-\t%s\n' "$p" "$url"
            fi
            rm -f "$hdr"
          }
          export -f probe_one
          xargs -P 16 -I{} bash -c 'probe_one "$1"' _ {} < /tmp/T6_STEAM_FULL_ZONE_PATHS_V2.txt | sort -t $'\t' -k1,1 > /tmp/T6_STEAM_FULL_ZONE_R2_PROBE_V2.tsv
          test "$(wc -l < /tmp/T6_STEAM_FULL_ZONE_R2_PROBE_V2.tsv)" -eq 297
          awk -F '\t' '{c[$2]++} END {for (k in c) print k,c[k]}' /tmp/T6_STEAM_FULL_ZONE_R2_PROBE_V2.tsv | sort

      - name: Probe public full-game ZIP central directory
        shell: bash
        env:
          ZIP_URL: https://cdn.jordanlindsay.com.au/pluto_t6_full_game.zip
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, struct, urllib.request
          from pathlib import Path
          url=os.environ['ZIP_URL']
          wanted=set(Path('/tmp/T6_STEAM_FULL_ZONE_PATHS_V2.txt').read_text().splitlines())
          def rr(start,end=None):
              h={'Range':f'bytes={start}-'+('' if end is None else str(end)),'User-Agent':'bo2-t6-assets-full-catalog-probe/2'}
              r=urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=60)
              return r.read(),dict(r.headers),r.status
          _,hdr,status=rr(0,0)
          cr=hdr.get('Content-Range') or hdr.get('content-range')
          if not cr or '/' not in cr: raise SystemExit(f'ZIP range unsupported status={status}')
          total=int(cr.rsplit('/',1)[1]); tail_n=min(total,2*1024*1024); tail_start=total-tail_n
          tail,_,_=rr(tail_start,total-1); p=tail.rfind(b'PK\x05\x06')
          if p<0: raise SystemExit('EOCD not found')
          eocd=tail[p:p+22]; disk,cd_disk,disk_entries,entries,cd_size,cd_off,comment_len=struct.unpack_from('<4H2LH',eocd,4)
          if disk or cd_disk or disk_entries!=entries: raise SystemExit('multi-disk ZIP unsupported')
          if cd_off==0xffffffff or cd_size==0xffffffff or entries==0xffff: raise SystemExit('ZIP64 unsupported')
          cd,_,_=rr(cd_off,cd_off+cd_size-1)
          if len(cd)!=cd_size: raise SystemExit(f'central directory short read {len(cd)} != {cd_size}')
          found={}; o=0; n=0
          while o<len(cd):
              if cd[o:o+4]!=b'PK\x01\x02': raise SystemExit(f'bad central signature at {o}')
              vals=struct.unpack_from('<6H3L5H2L',cd,o+4)
              _,_,flags,method,_,_,crc32,csize,usize,nlen,xlen,clen,_,_,_,lhoff=vals
              name=cd[o+46:o+46+nlen].decode('utf-8','replace').replace('\\','/')
              if name.startswith('./'): name=name[2:]
              if name in wanted: found[name]=(crc32,csize,usize,method,flags,lhoff)
              o+=46+nlen+xlen+clen; n+=1
          with open('/tmp/T6_STEAM_FULL_ZONE_ZIP_PROBE_V2.tsv','w') as f:
              for path in sorted(wanted):
                  if path in found:
                      crc,csize,usize,method,flags,lhoff=found[path]
                      f.write(f'{path}\tpresent\t{usize}\t{crc:08x}\t{csize}\t{method}\t{flags}\t{lhoff}\t{url}\n')
                  else:
                      f.write(f'{path}\tunavailable\t-\t-\t-\t-\t-\t-\t{url}\n')
          meta={'remoteZipBytes':total,'centralEntries':n,'catalogPaths':len(wanted),'present':len(found),'unavailable':len(wanted-found.keys())}
          Path('/tmp/T6_STEAM_FULL_ZONE_ZIP_META_V2.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          print(json.dumps(meta,indent=2,sort_keys=True))
          PY
          test "$(wc -l < /tmp/T6_STEAM_FULL_ZONE_ZIP_PROBE_V2.tsv)" -eq 297

      - name: Build combined fail-closed source audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_steam_zone_catalog_audit_v2.py \
            --base-catalog manifests/nonmap/retail/t6_steam_english_base_zone_catalog_v1.json \
            --catalog manifests/nonmap/retail/t6_steam_english_full_zone_catalog_v2.json \
            --seed manifests/nonmap/retail/t6_whole_retail_corpus_seed_v1.json \
            --r2-probe-tsv /tmp/T6_STEAM_FULL_ZONE_R2_PROBE_V2.tsv \
            --zip-probe-tsv /tmp/T6_STEAM_FULL_ZONE_ZIP_PROBE_V2.tsv \
            --out /tmp/T6_STEAM_FULL_ZONE_CATALOG_AUDIT_V2.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/T6_STEAM_FULL_ZONE_CATALOG_AUDIT_V2.json'))
          assert p['gates']['catalogStructurallyValid'] is True
          assert p['gates']['englishRetailFfCatalogComplete'] is True
          assert p['gates']['overlappingDepotPathOwnershipAccounted'] is True
          assert p['gates']['overlappingDepotByteIdentityComplete'] is False
          assert p['gates']['wholeRetailAllLanguagesCatalogComplete'] is False
          assert p['gates']['populationInputIdentityComplete'] is False
          print(json.dumps({
            'totals':p['totals'],'seedCoverage':p['seedCoverage'],'r2Probe':p['r2Probe'],
            'publicZipProbe':p['publicZipProbe'],'sourceContainerUnion':p['sourceContainerUnion'],'gates':p['gates']
          },indent=2,sort_keys=True))
          PY

      - name: Upload compact full-catalog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_STEAM_FULL_ZONE_CATALOG_AUDIT_V2
          path: |
            /tmp/T6_STEAM_FULL_ZONE_CATALOG_PREPROBE_V2.json
            /tmp/T6_STEAM_FULL_ZONE_CATALOG_AUDIT_V2.json
            /tmp/T6_STEAM_FULL_ZONE_PATHS_V2.txt
            /tmp/T6_STEAM_FULL_ZONE_R2_PROBE_V2.tsv
            /tmp/T6_STEAM_FULL_ZONE_ZIP_PROBE_V2.tsv
            /tmp/T6_STEAM_FULL_ZONE_ZIP_META_V2.json
          if-no-files-found: error
          retention-days: 14
