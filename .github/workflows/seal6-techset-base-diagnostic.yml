name: SEAL6 TechniqueSet base diagnostic

on:
  push:
    branches: [reversal/nonmap-assets]
    paths:
      - ".github/workflows/seal6-techset-base-diagnostic.yml"
      - "tools/t6_xasset_virtual_base_diagnostic_v1.py"
      - "tools/t6_techset_fixed_record_census_diagnostic_v1.py"
      - "tools/t6_material_dependency_graph_v1.py"
      - "tools/t6_material_techset_resolve_v1.py"
      - "tools/t6_material_techset_top_level_walk_v1.py"
      - "tools/t6_early_techset_source_order_walk_v1.py"
      - "tools/t6_early_techset_source_order_walk_v2.py"
      - "tools/t6_early_techset_source_order_probe_v1.py"
      - "tools/t6_seal6_q20_nested_proof_v1.py"
      - "tools/t6_xmodel_serialized_walker.py"
      - "tools/t6_asset_types_v1.py"
      - "tools/bo2_t6_fastfile.py"
      - "manifests/nonmap/retail/seal6_smg_material_handle_alias_proof_v1.json"
      - "manifests/nonmap/retail/faction_seals_mp_seal6_smg_full_player_v1.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reversal/nonmap-assets
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and expand faction zone
        run: |
          curl --fail --location --silent --show-error --retry 6 --retry-delay 2 --retry-all-errors \
            'https://r2.houseofkublai.com/bo2/zone/all/faction_seals_mp.ff' -o /tmp/faction.ff
          python tools/bo2_t6_fastfile.py decrypt /tmp/faction.ff --output /tmp/faction.expanded
      - name: Rebuild exact local/import graph
        run: |
          PYTHONPATH=tools python tools/t6_material_dependency_graph_v1.py \
            /tmp/faction.expanded \
            manifests/nonmap/retail/seal6_smg_material_handle_alias_proof_v1.json \
            --direct-proof manifests/nonmap/retail/faction_seals_mp_seal6_smg_full_player_v1.json \
            --zone faction_seals_mp --out /tmp/graph.json
      - name: Emit non-promoting XAsset VIRTUAL-base diagnostic
        run: |
          PYTHONPATH=tools python tools/t6_xasset_virtual_base_diagnostic_v1.py \
            /tmp/faction.expanded /tmp/graph.json --out /tmp/base.json
      - name: Emit pointer-agnostic TechniqueSet fixed-record census
        run: |
          PYTHONPATH=tools python tools/t6_techset_fixed_record_census_diagnostic_v1.py \
            /tmp/faction.expanded --out /tmp/techset_census.json
      - name: Probe exact early source-order prefixes
        run: |
          PYTHONPATH=tools python tools/t6_early_techset_source_order_probe_v1.py \
            /tmp/faction.expanded --end-asset 20 \
            --out /tmp/source_order_prefix_probe.json
      - name: Replay exact top-level source order through q20
        run: |
          PYTHONPATH=tools python tools/t6_early_techset_source_order_walk_v2.py \
            /tmp/faction.expanded --end-asset 20 --targets 10,17,20 \
            --out /tmp/source_order_q0_q20.json
      - name: Generate exact q20 nested TechniqueSet proof
        run: |
          PYTHONPATH=tools python tools/t6_seal6_q20_nested_proof_v1.py \
            /tmp/source_order_q0_q20.json \
            --out /tmp/seal6_q20_nested_proof.json
      - name: Persist exact q20 nested proof on branch
        shell: bash
        run: |
          set -euo pipefail
          dst=manifests/nonmap/retail/faction_seals_mp_seal6_q20_techset_nested_proof_v1.json
          cp /tmp/seal6_q20_nested_proof.json "$dst"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$dst"
          if git diff --cached --quiet; then
            echo 'q20 nested proof already identical'
          else
            git commit -m 'Persist exact SEAL6 q20 nested TechniqueSet proof'
            git pull --rebase origin reversal/nonmap-assets
            git push origin HEAD:reversal/nonmap-assets
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SEAL6_TECHSET_BASE_DIAGNOSTIC
          path: |
            /tmp/base.json
            /tmp/techset_census.json
            /tmp/source_order_prefix_probe.json
            /tmp/source_order_q0_q20.json
            /tmp/seal6_q20_nested_proof.json
          if-no-files-found: warn
          retention-days: 14
