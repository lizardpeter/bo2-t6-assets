name: T6 Nuketown Ficus inline texture roles v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_nuketown_ficus_inline_texture_roles_v1.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and expand exact retail FastFile
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 -o /tmp/mp_nuketown_2020.ff https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/mp_nuketown_2020.ff' | sha256sum -c -
          gcc -O2 tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_expand -lz -lcrypto
          /tmp/t6_expand /tmp/mp_nuketown_2020.ff /tmp/mp_nuketown_2020.expanded.bin mp_nuketown_2020
          test "$(stat -c '%s' /tmp/mp_nuketown_2020.expanded.bin)" = 154653476
          echo '7e791fb90a085f3bff9e0df895e5a232fa91cc43bcd0027225fe811f7891d505  /tmp/mp_nuketown_2020.expanded.bin' | sha256sum -c -
      - name: Trace Ficus inline MaterialTextureDef roles
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 - <<'PY'
          import json,struct
          from pathlib import Path
          from t6_xmodel_serialized_walker import XModelWalker
          data=Path('/tmp/mp_nuketown_2020.expanded.bin').read_bytes()
          d=XModelWalker(data,24530208).walk_xmodel()
          x=d['xmodel']
          assert x['name']=='mlv/nt_tree_ficus_lrg_01_sway',x.get('name')
          assert not d['blockers'],d['blockers']
          print('MODEL',x['name'])
          print('HANDLES',json.dumps(x['materialHandles'],sort_keys=True))
          print('INLINE_MATERIALS',json.dumps(d.get('inlineMaterials',[]),indent=2,sort_keys=True))
          secs=d['sections']
          by={s['name']:s for s in secs}
          roles={0:'2D',1:'FUNCTION',2:'COLOR_MAP',3:'UNUSED_1',4:'UNUSED_2',5:'NORMAL_MAP',6:'UNUSED_3',7:'UNUSED_4',8:'SPECULAR_MAP'}
          for m in d.get('inlineMaterials',[]):
              label=m['label']
              tname=f'{label}.Material.textureTable.fixed'
              if tname not in by:
                  print('MATERIAL_NO_INLINE_TABLE',m['name'])
                  continue
              tb=by[tname]['start']
              print('MATERIAL',m['name'],'TEXTURES',m['textureCount'],'TABLE',tb)
              for i in range(m['textureCount']):
                  b=tb+i*16
                  namehash=struct.unpack_from('<I',data,b)[0]
                  ns=chr(data[b+4]); ne=chr(data[b+5]); sampler=data[b+6]; semantic=data[b+7]
                  imagep=struct.unpack_from('<I',data,b+12)[0]
                  prefix=f'{label}.Material.textureTable[{i}].image.GfxImage'
                  imgname=None
                  nsec=by.get(prefix+'.name')
                  if nsec:
                      a=nsec['start']; e=data.index(b'\0',a); imgname=data[a:e].decode('latin1')
                  print(json.dumps({'material':m['name'],'slot':i,'nameHash':f'0x{namehash:08X}','nameStart':ns,'nameEnd':ne,'samplerState':sampler,'semantic':semantic,'semanticName':roles.get(semantic,'OTHER'),'imagePointer':f'0x{imagep:08X}','inlineImageName':imgname},sort_keys=True))
          PY
