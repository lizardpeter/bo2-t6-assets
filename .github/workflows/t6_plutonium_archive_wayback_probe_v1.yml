name: T6 Plutonium archive Wayback probe v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_plutonium_archive_wayback_probe_v1.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Query Wayback CDX for historical archive bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          queries = {
            'r3553': 'https://updater-archive.plutools.pw/archives/3553.tar.gz',
            'r3963': 'https://updater-archive.plutools.pw/archives/3963.tar.gz',
            'prefix': 'https://updater-archive.plutools.pw/archives/*',
          }
          out = {'format':'t6-plutonium-archive-wayback-probe-v1','queries':{}}
          for key, target in queries.items():
            params = {
              'url': target,
              'output': 'json',
              'filter': 'statuscode:200',
              'collapse': 'digest',
              'fl': 'timestamp,original,statuscode,mimetype,digest,length',
            }
            if key == 'prefix':
              params['matchType'] = 'prefix'
            url='https://web.archive.org/cdx/search/cdx?' + urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={'User-Agent':'bo2-t6-assets-wayback-probe/1'})
            try:
              with urllib.request.urlopen(req,timeout=60) as r:
                body=r.read()
              data=json.loads(body.decode('utf-8'))
              rows=[]
              if isinstance(data,list) and data:
                hdr=data[0]
                for row in data[1:]:
                  if len(row)==len(hdr): rows.append(dict(zip(hdr,row)))
              out['queries'][key]={'target':target,'cdxUrl':url,'rows':rows,'rowCount':len(rows)}
            except Exception as e:
              out['queries'][key]={'target':target,'cdxUrl':url,'error':repr(e),'rows':[],'rowCount':0}
          with open('/tmp/proof/T6_PLUTONIUM_ARCHIVE_WAYBACK_PROBE_V1.json','w') as f:
            json.dump(out,f,indent=2,sort_keys=True)
            f.write('\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          sha256sum /tmp/proof/T6_PLUTONIUM_ARCHIVE_WAYBACK_PROBE_V1.json
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: T6_PLUTONIUM_ARCHIVE_WAYBACK_PROBE_V1
          path: /tmp/proof/T6_PLUTONIUM_ARCHIVE_WAYBACK_PROBE_V1.json
          if-no-files-found: error
          compression-level: 9
