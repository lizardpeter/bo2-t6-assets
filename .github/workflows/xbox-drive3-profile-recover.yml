name: Recover DRIVE3 deleted Xbox 360 profiles

on:
  push:
    branches:
      - tmp-xbox-live-profile-extract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install EWF/FUSE tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ewf-tools fuse3 jq
          df -h

      - name: Build deleted-entry recovery extractor
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/rdmrocha/xtafkit.git /tmp/xtafkit

          # Add two read-only forensic helpers inside volume.rs so they can use
          # the library's private cluster/dirent parsing primitives.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/xtafkit/fatxlib/src/volume.rs")
          s = p.read_text()
          needle = "    /// Read all valid directory entries from a directory cluster chain.\n"
          helper = r'''    /// Forensic helper: read every slot from exactly one directory cluster,
              /// including entries marked deleted (filename_len == 0xE5).
              pub fn recovery_read_directory_cluster_all(&mut self, cluster: u32) -> Result<Vec<DirectoryEntry>> {
                  let cluster_size = self.superblock.cluster_size() as usize;
                  let mut buf = vec![0u8; cluster_size];
                  self.read_cluster(cluster, &mut buf)?;
                  let mut entries = Vec::new();
                  for slot in 0..(cluster_size / DIRENT_SIZE) {
                      let mut raw = [0u8; DIRENT_SIZE];
                      raw.copy_from_slice(&buf[slot * DIRENT_SIZE..(slot + 1) * DIRENT_SIZE]);
                      let entry = self.parse_dirent_buf(&raw);
                      if entry.is_end() {
                          break;
                      }
                      entries.push(entry);
                  }
                  Ok(entries)
              }

              /// Forensic helper: recover a deleted file assuming its original
              /// allocation was contiguous. The original directory slot retains
              /// first_cluster and file_size even after FAT chain release.
              pub fn recovery_read_contiguous(&mut self, start_cluster: u32, file_size: usize) -> Result<Vec<u8>> {
                  let cluster_size = self.superblock.cluster_size() as usize;
                  let needed = (file_size + cluster_size - 1) / cluster_size;
                  let mut out = Vec::with_capacity(needed * cluster_size);
                  for i in 0..needed {
                      let cluster = start_cluster.checked_add(i as u32)
                          .ok_or_else(|| FatxError::Other("cluster overflow".to_string()))?;
                      let mut buf = vec![0u8; cluster_size];
                      self.read_cluster(cluster, &mut buf)?;
                      out.extend_from_slice(&buf);
                  }
                  out.truncate(file_size);
                  Ok(out)
              }

          '''
          if needle not in s:
              raise SystemExit("volume.rs insertion point not found")
          s = s.replace(needle, helper + needle, 1)
          p.write_text(s)
          PY

          mkdir -p /tmp/profile-recover/src
          cat > /tmp/profile-recover/Cargo.toml <<'EOF'
          [package]
          name = "profile-recover"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          fatxlib = { path = "/tmp/xtafkit/fatxlib" }
          sha1 = "0.11"
          sha2 = "0.10"
          hmac = "0.13"
          hex = "0.4"
          serde_json = "1"
          EOF

          cat > /tmp/profile-recover/src/main.rs <<'EOF'
          use std::env;
          use std::fs::{self, File};
          use std::io::{self, Read, Seek, SeekFrom, Write};
          use std::path::Path;

          use fatxlib::partition::detect_xbox_partitions;
          use fatxlib::stfs;
          use fatxlib::types::DirectoryEntry;
          use fatxlib::volume::FatxVolume;
          use hmac::{Hmac, KeyInit, Mac};
          use serde_json::json;
          use sha1::Sha1;
          use sha2::{Digest, Sha256};

          const ACCOUNT_LEN: usize = 0x194;
          const KEY_PROD: [u8; 16] = [
              0xE1,0xBC,0x15,0x9C,0x73,0xB1,0xEA,0xE9,0xAB,0x31,0x70,0xF3,0xAD,0x47,0xEB,0xF3
          ];
          const KEY_OTHER: [u8; 16] = [
              0xDA,0xB6,0x9A,0xD9,0x8E,0x28,0x76,0x4F,0x97,0x7E,0xE2,0x48,0x7E,0x4F,0x3F,0x68
          ];

          struct ReadOnlyFile(File);
          impl Read for ReadOnlyFile {
              fn read(&mut self, buf: &mut [u8]) -> io::Result<usize> { self.0.read(buf) }
          }
          impl Seek for ReadOnlyFile {
              fn seek(&mut self, pos: SeekFrom) -> io::Result<u64> { self.0.seek(pos) }
          }
          impl Write for ReadOnlyFile {
              fn write(&mut self, _buf: &[u8]) -> io::Result<usize> {
                  Err(io::Error::new(io::ErrorKind::PermissionDenied, "read-only"))
              }
              fn flush(&mut self) -> io::Result<()> { Ok(()) }
          }

          #[derive(Debug, Clone)]
          struct AccountInfo {
              gamertag: String,
              live_account: bool,
              online_xuid: String,
              membership: String,
              account_type: String,
              offset: usize,
              verified_online: bool,
          }

          fn arc4(key: &[u8], data: &mut [u8]) {
              let mut s = [0u8; 256];
              for (i, v) in s.iter_mut().enumerate() { *v = i as u8; }
              let mut j: u8 = 0;
              for i in 0..256 {
                  j = j.wrapping_add(s[i]).wrapping_add(key[i % key.len()]);
                  s.swap(i, j as usize);
              }
              let mut i: u8 = 0;
              let mut j: u8 = 0;
              for b in data {
                  i = i.wrapping_add(1);
                  j = j.wrapping_add(s[i as usize]);
                  s.swap(i as usize, j as usize);
                  *b ^= s[(s[i as usize].wrapping_add(s[j as usize])) as usize];
              }
          }

          fn decrypt_account(block: &[u8], key: &[u8]) -> Option<Vec<u8>> {
              if block.len() != ACCOUNT_LEN { return None; }
              type HmacSha1 = Hmac<Sha1>;
              let mut mac = HmacSha1::new_from_slice(key).ok()?;
              mac.update(&block[..16]);
              let digest = mac.finalize().into_bytes();
              let mut data = block[16..].to_vec();
              arc4(&digest[..16], &mut data);
              Some(data)
          }

          fn decode_gamertag(data: &[u8]) -> Option<String> {
              if data.len() < 0x40 { return None; }
              let mut units = Vec::new();
              for pair in data[0x10..0x2E].chunks_exact(2) {
                  let u = u16::from_be_bytes([pair[0], pair[1]]);
                  if u == 0 { break; }
                  units.push(u);
              }
              let s = String::from_utf16(&units).ok()?.trim().to_string();
              if s.is_empty() || s.chars().count() > 15 { return None; }
              if !s.chars().all(|c| c.is_alphanumeric() || c == ' ') { return None; }
              Some(s)
          }

          fn parse_account(block: &[u8], offset: usize) -> Option<AccountInfo> {
              for key in [&KEY_PROD[..], &KEY_OTHER[..]] {
                  let Some(data) = decrypt_account(block, key) else { continue; };
                  let Some(gamertag) = decode_gamertag(&data) else { continue; };

                  let live_account = ((data[0] >> 5) & 1) == 1;
                  let online_xuid = hex::encode_upper(&data[0x30..0x38]);
                  let membership = match data[0x39] {
                      0x30 => "Silver/Free",
                      0x60 => "Gold/Paid",
                      _ => "Offline/Other",
                  }.to_string();
                  let account_type = String::from_utf8_lossy(&data[0x3C..0x40])
                      .trim_matches(char::from(0)).to_string();
                  let verified_online = live_account
                      && online_xuid != "0000000000000000"
                      && matches!(membership.as_str(), "Silver/Free" | "Gold/Paid");

                  return Some(AccountInfo {
                      gamertag, live_account, online_xuid, membership,
                      account_type, offset, verified_online
                  });
              }
              None
          }

          fn find_account(bytes: &[u8]) -> Option<AccountInfo> {
              let mut off = 0x1000usize;
              while off + ACCOUNT_LEN <= bytes.len() {
                  if let Some(a) = parse_account(&bytes[off..off + ACCOUNT_LEN], off) {
                      return Some(a);
                  }
                  off += 0x1000;
              }
              None
          }

          fn raw_name(e: &DirectoryEntry) -> String {
              let end = e.filename_raw.iter()
                  .position(|&b| b == 0x00 || b == 0xFF)
                  .unwrap_or(e.filename_raw.len());
              String::from_utf8_lossy(&e.filename_raw[..end]).to_string()
          }

          fn find_slot<T: Read + Write + Seek>(
              vol: &mut FatxVolume<T>,
              dir_cluster: u32,
              wanted: &str,
              log: &mut String,
          ) -> Option<DirectoryEntry> {
              let entries = vol.recovery_read_directory_cluster_all(dir_cluster).ok()?;
              for e in entries {
                  let n = raw_name(&e);
                  log.push_str(&format!(
                      "slot dir_cluster={} deleted={} attr=0x{:02X} first_cluster={} size={} raw_name={:?}\n",
                      dir_cluster,
                      e.is_deleted(),
                      e.attributes.bits(),
                      e.first_cluster,
                      e.file_size,
                      n
                  ));
                  if n.eq_ignore_ascii_case(wanted) {
                      return Some(e);
                  }
              }
              None
          }

          fn is_stfs(bytes: &[u8]) -> bool {
              matches!(bytes.get(0..4), Some(b"CON ") | Some(b"LIVE") | Some(b"PIRS"))
          }

          fn main() {
              let image = env::args().nth(1).expect("usage: profile-recover <raw> <out>");
              let out = env::args().nth(2).expect("usage: profile-recover <raw> <out>");
              fs::create_dir_all(Path::new(&out).join("packages")).unwrap();

              let mut f = File::open(&image).expect("open raw image");
              let device_size = f.seek(SeekFrom::End(0)).expect("size");
              f.seek(SeekFrom::Start(0)).unwrap();
              let mut ro = ReadOnlyFile(f);
              let parts = detect_xbox_partitions(&mut ro, device_size).expect("partitions");
              let data = parts.iter()
                  .find(|p| p.name == "360 Data" && p.has_valid_magic)
                  .expect("360 Data").clone();

              let mut vol = FatxVolume::open(ro, data.offset, data.size).expect("open volume");
              let content = vol.resolve_path("/Content").expect("/Content");
              let owners = vol.read_directory(content.first_cluster).expect("owners");

              let mut log = String::new();
              let mut manifest = Vec::new();

              for owner in owners {
                  if !owner.is_directory() { continue; }
                  let xuid = owner.filename().to_uppercase();
                  if xuid.len() != 16 || !xuid.starts_with('E')
                      || !xuid.chars().all(|c| c.is_ascii_hexdigit()) {
                      continue;
                  }

                  log.push_str(&format!("\n===== OWNER {xuid} cluster={} =====\n", owner.first_cluster));

                  let Some(fffe) = find_slot(&mut vol, owner.first_cluster, "FFFE07D1", &mut log) else {
                      log.push_str("FFFE07D1 slot not found\n");
                      continue;
                  };
                  log.push_str(&format!(
                      "FOUND FFFE07D1 deleted={} cluster={}\n",
                      fffe.is_deleted(), fffe.first_cluster
                  ));

                  let Some(profile_type) = find_slot(&mut vol, fffe.first_cluster, "00010000", &mut log) else {
                      log.push_str("00010000 slot not found\n");
                      continue;
                  };
                  log.push_str(&format!(
                      "FOUND 00010000 deleted={} cluster={}\n",
                      profile_type.is_deleted(), profile_type.first_cluster
                  ));

                  let Some(pkg) = find_slot(&mut vol, profile_type.first_cluster, &xuid, &mut log) else {
                      log.push_str(&format!("profile file slot {xuid} not found\n"));
                      continue;
                  };
                  log.push_str(&format!(
                      "FOUND PROFILE SLOT deleted={} cluster={} size={}\n",
                      pkg.is_deleted(), pkg.first_cluster, pkg.file_size
                  ));

                  let bytes = match vol.recovery_read_contiguous(pkg.first_cluster, pkg.file_size as usize) {
                      Ok(b) => b,
                      Err(e) => {
                          log.push_str(&format!("contiguous recovery failed: {e}\n"));
                          continue;
                      }
                  };

                  let magic = if bytes.len() >= 4 {
                      String::from_utf8_lossy(&bytes[..4]).to_string()
                  } else { String::new() };
                  let header = stfs::parse_header(&bytes);
                  let account = find_account(&bytes);
                  let sha256 = hex::encode(Sha256::digest(&bytes));

                  log.push_str(&format!(
                      "RECOVERED first4={:?} stfs={} sha256={} header={:?} account={:?}\n",
                      magic, is_stfs(&bytes), sha256,
                      header.as_ref().map(|h| (&h.display_name, &h.title_name, h.title_id)),
                      account
                  ));

                  let saved = Path::new(&out).join("packages").join(&xuid);
                  fs::write(&saved, &bytes).expect("write recovered package");

                  let (display_name, title_name, title_id) = header.as_ref()
                      .map(|h| (h.display_name.clone(), h.title_name.clone(), h.title_id))
                      .unwrap_or_default();

                  let (gamertag, live_account, online_xuid, membership, account_type, account_offset, verified_online) =
                      if let Some(a) = account {
                          (
                              Some(a.gamertag), a.live_account, Some(a.online_xuid),
                              Some(a.membership), Some(a.account_type),
                              Some(format!("0x{:X}", a.offset)), a.verified_online
                          )
                      } else {
                          (None, false, None, None, None, None, false)
                      };

                  manifest.push(json!({
                      "owner_xuid": xuid,
                      "deleted_fffe07d1": fffe.is_deleted(),
                      "deleted_00010000": profile_type.is_deleted(),
                      "deleted_profile_file": pkg.is_deleted(),
                      "first_cluster": pkg.first_cluster,
                      "size": pkg.file_size,
                      "stfs_magic": magic,
                      "is_stfs": is_stfs(&bytes),
                      "title_id": format!("{:08X}", title_id),
                      "display_name": display_name,
                      "title_name": title_name,
                      "sha256": sha256,
                      "gamertag": gamertag,
                      "live_account": live_account,
                      "online_xuid": online_xuid,
                      "membership": membership,
                      "account_type": account_type,
                      "account_block_offset": account_offset,
                      "verified_online": verified_online
                  }));
              }

              fs::write(Path::new(&out).join("recovery.log"), &log).unwrap();
              fs::write(
                  Path::new(&out).join("manifest.json"),
                  serde_json::to_vec_pretty(&manifest).unwrap()
              ).unwrap();

              println!("{}", log);
              println!("{}", serde_json::to_string_pretty(&manifest).unwrap());

              let verified = manifest.iter()
                  .filter(|m| m.get("verified_online").and_then(|v| v.as_bool()) == Some(true))
                  .count();
              println!("verified online recovered profiles: {verified}");
              if verified == 0 {
                  std::process::exit(4);
              }
          }
          EOF

          cargo build --release --manifest-path /tmp/profile-recover/Cargo.toml

      - name: Download and recover deleted profile from DRIVE2 final
        run: |
          set -euxo pipefail
          IMAGE="DRIVE3_TIME_FINAL.E01"
          URL="https://digitalcorpora.s3.amazonaws.com/corpora/drives/nps-2014-xbox1/$IMAGE"
          OUT="/tmp/recovered-xbox-live-profile"
          mkdir -p "$OUT"
          sudo mkdir -p /mnt/xbox-ewf
          sudo modprobe fuse || true

          curl -fL --retry 8 --retry-all-errors --connect-timeout 30 \
            --speed-time 120 --speed-limit 1024 \
            "$URL" -o "/tmp/$IMAGE"
          sha256sum "/tmp/$IMAGE" | tee "$OUT/source-image.sha256"

          sudo ewfmount "/tmp/$IMAGE" /mnt/xbox-ewf
          set +e
          sudo /tmp/profile-recover/target/release/profile-recover \
            /mnt/xbox-ewf/ewf1 "$OUT" | tee "$OUT/runner.log"
          RC=${PIPESTATUS[0]}
          set -e
          sudo fusermount3 -u /mnt/xbox-ewf || sudo umount /mnt/xbox-ewf || true
          sudo chown -R "$USER":"$USER" "$OUT"

          cat "$OUT/manifest.json"
          exit "$RC"

      - name: Unpack recovered STFS profile
        if: always()
        run: |
          set -euxo pipefail
          OUT="/tmp/recovered-xbox-live-profile"
          mkdir -p "$OUT"
          git clone --depth 1 https://github.com/MVEALNG/NXE-Dashboard-Recomp.git /tmp/nxe-dashboard
          mkdir -p "$OUT/unpacked"
          for profile in "$OUT"/packages/E*; do
            [ -f "$profile" ] || continue
            xuid="$(basename "$profile")"
            mkdir -p "$OUT/unpacked/$xuid"
            python3 /tmp/nxe-dashboard/tools/extract_stfs.py \
              "$profile" "$OUT/unpacked/$xuid" \
              | tee "$OUT/unpacked/$xuid/extract.log" || true
          done
          find "$OUT" -type f -printf '%p %s bytes\n' | head -300

      - name: Upload recovery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-drive3-xbox360-profiles
          path: /tmp/recovered-xbox-live-profile
          if-no-files-found: warn
          retention-days: 7
