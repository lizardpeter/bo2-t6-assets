name: SMG RMGE01 native Ghidra decompile v1

on:
  push:
    paths:
      - '.github/workflows/smg_rmge01_native_ghidra_v1.yml'
      - 'tools/ghidra_scripts/ExportSmgRmge01NativeDecompile.java'
  pull_request:
    paths:
      - 'smg/rmge01/trigger_native_ghidra_v1.txt'

permissions:
  contents: write

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  DOL_SHA256: 2c680585a8f58e1cc9c5521b579057f12b124ff0ef409e470a57606c50a93c09
  GC_LOADER_COMMIT: 921504c9ddba6e8d9b3655b665a60f1a33306220

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download verified Ghidra 12.1.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors -o /tmp/ghidra.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: Build pinned GameCube/Wii DOL loader
        run: |
          set -euo pipefail
          git clone https://github.com/Cuyler36/Ghidra-GameCube-Loader.git /tmp/gc-loader
          git -C /tmp/gc-loader checkout "$GC_LOADER_COMMIT"
          cd /tmp/gc-loader
          GHIDRA_INSTALL_DIR="$GHIDRA_HOME" ./gradlew buildExtension --no-daemon
          LOADER_ZIP="$(find dist -maxdepth 1 -type f -name '*.zip' | head -1)"
          test -n "$LOADER_ZIP"
          unzip -q "$LOADER_ZIP" -d "$GHIDRA_HOME/Ghidra/Extensions"
          find "$GHIDRA_HOME/Ghidra/Extensions" -maxdepth 2 -name extension.properties -print
      - name: Fetch and verify exact retail RMGE01 main.dol
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors -A 'Mozilla/5.0' -o /tmp/rmge01_main.dol \
            'https://r2.houseofkublai.com/super-mario-galaxy/DATA/sys/main.dol'
          echo "$DOL_SHA256  /tmp/rmge01_main.dol" | sha256sum --check
          test "$(stat -c %s /tmp/rmge01_main.dol)" = "6283264"
      - name: Analyze DOL and decompile shortest 1500 discovered functions
        run: |
          set -euo pipefail
          rm -rf /tmp/smg-ghidra /tmp/smg-native-out
          mkdir -p /tmp/smg-ghidra /tmp/smg-native-out
          export GHIDRA_HEADLESS_MAXMEM=10G
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/smg-ghidra rmge01-native-v1 \
            -import /tmp/rmge01_main.dol \
            -loader "Nintendo GameCube/Wii Binary" \
            -loader-autoloadMaps false \
            -loader-addSystemMemorySections true \
            -analysisTimeoutPerFile 2400 \
            -postScript ExportSmgRmge01NativeDecompile.java \
              /tmp/smg-native-out/functions.tsv /tmp/smg-native-out/decompile.tsv /tmp/smg-native-out/summary.json 1500 12 \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" \
            -max-cpu 4
      - name: Add provenance files
        run: |
          echo "$DOL_SHA256  /tmp/rmge01_main.dol" > /tmp/smg-native-out/main.dol.sha256
          printf '%s\n' "$GC_LOADER_COMMIT" > /tmp/smg-native-out/gamecube_loader_commit.txt
          printf '%s\n' 'Ghidra 12.1.3 PUBLIC 20260817' > /tmp/smg-native-out/ghidra_version.txt
      - name: Commit durable native analysis
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          OUT=smg/rmge01/derived/ghidra_native_v1
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp /tmp/smg-native-out/summary.json "$OUT/"
          cp /tmp/smg-native-out/main.dol.sha256 "$OUT/"
          cp /tmp/smg-native-out/gamecube_loader_commit.txt "$OUT/"
          cp /tmp/smg-native-out/ghidra_version.txt "$OUT/"
          zstd -12 -T0 /tmp/smg-native-out/functions.tsv -o "$OUT/functions.tsv.zst"
          zstd -12 -T0 /tmp/smg-native-out/decompile.tsv -o "$OUT/decompile.tsv.zst"
          sha256sum "$OUT"/* > "$OUT/CHECKSUMS.sha256"
          git config user.name 'smg-re-bot'
          git config user.email 'smg-re-bot@users.noreply.github.com'
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'SMG: add executable-native RMGE01 Ghidra decompile v1'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 2; done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SMG_RMGE01_NATIVE_GHIDRA_V1
          path: /tmp/smg-native-out
          retention-days: 30
