name: T6 current client linked record payload exchange v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_linked_record_payload_exchange_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_RELINK_SWAP_PROBE_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_RELINK_PAYLOAD_HELPER_PROBE_V1.json'
      - '.github/workflows/t6_current_client_linked_record_payload_exchange_v1.yml'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Project and validate payload exchange
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_linked_record_payload_exchange_v1.py \
            --relink proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_RELINK_SWAP_PROBE_V1.json \
            --helper proof/current_client/T6_CURRENT_CLIENT_RELINK_PAYLOAD_HELPER_PROBE_V1.json \
            --out proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_PAYLOAD_EXCHANGE_V1.json
          python3 - <<'PY'
          import json
          j=json.load(open('proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_PAYLOAD_EXCHANGE_V1.json'))
          p=j['proven']
          assert p['duplicatePathRequiresEqualTypeDword'] is True
          assert p['flag1ReplayRunsThreeTransferCycle'] is True
          assert p['incomingLogicalPayloadAndZoneMetadataMoveToExistingHeadStorage'] is True
          assert p['oldHeadLogicalPayloadAndZoneMetadataMoveToIncomingLinkedStorage'] is True
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_LINKED_RECORD_PAYLOAD_EXCHANGE_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist current-client duplicate payload exchange'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
