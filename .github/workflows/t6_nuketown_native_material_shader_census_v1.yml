name: T6 Nuketown native Material shader census v4 + conflicts

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_oat_material_shader_census_v1.py'
      - 'tools/t6_oat_material_shader_census_v2.py'
      - 'tools/t6_oat_material_shader_census_v3.py'
      - 'tools/t6_oat_material_shader_census_v4.py'
      - 'tools/test_t6_oat_material_shader_census_v3.py'
      - 'tools/test_t6_oat_material_shader_census_v4.py'
      - 'tools/t6_oat_parent_dependency_conflict_census_v1.py'
      - 'tools/test_t6_oat_parent_dependency_conflict_census_v1.py'
      - 'tools/t6_oat_exact_technique_owner_closure_v1.py'
      - 'tools/t6_oat_exact_technique_owner_closure_v2.py'
      - 'tools/t6_oat_techset_binding_manifest_v1.py'
      - 'tools/t6_oat_9dca_gcc_compat_patch_v3.py'
      - '.github/workflows/t6_nuketown_native_material_shader_census_v1.yml'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Test parent-owned all-TechniqueSet census logic
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/test_t6_oat_material_shader_census_v4.py
          PYTHONPATH=tools python3 tools/test_t6_oat_parent_dependency_conflict_census_v1.py

      - name: Restore exact pinned OAT Unlinker cache
        id: oat-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug

      - name: Build or verify pinned OAT Unlinker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof /tmp/game/zone/all /tmp/oat-unlinker-cache
          CACHE_BIN=/tmp/oat-unlinker-cache/Unlinker
          CACHE_META=/tmp/oat-unlinker-cache/source_identity.txt
          EXPECTED_COMMIT=9dca965366541504b71fa8cfb7ac049cb9b717e1
          PATCH_SHA=$(sha256sum tools/t6_oat_9dca_gcc_compat_patch_v3.py | awk '{print $1}')

          if test "${{ steps.oat-cache.outputs.cache-hit }}" = 'true'; then
            test -x "$CACHE_BIN"
            test -f "$CACHE_META"
            grep -qx "oat_commit=$EXPECTED_COMMIT" "$CACHE_META"
            grep -qx "compat_patch_sha256=$PATCH_SHA" "$CACHE_META"
            printf 'cache_hit=true\n' | tee /tmp/proof/oat_cache.txt
          else
            printf 'cache_hit=false\n' | tee /tmp/proof/oat_cache.txt
            sudo apt-get update -qq
            sudo apt-get install -y -qq g++-multilib >/dev/null
            git clone -q --recursive https://github.com/Laupetin/OpenAssetTools.git /tmp/oat
            git -C /tmp/oat checkout -q "$EXPECTED_COMMIT"
            test "$(git -C /tmp/oat rev-parse HEAD)" = "$EXPECTED_COMMIT"
            git -C /tmp/oat submodule update -q --init --recursive
            python3 tools/t6_oat_9dca_gcc_compat_patch_v3.py /tmp/oat
            git -C /tmp/oat diff --check
            cd /tmp/oat
            PREMAKE_NO_PROMPT=1 ./generate.sh
            BUILD_JOBS=2
            printf 'nproc=%s\nbuild_jobs=%s\n' "$(nproc)" "$BUILD_JOBS" | tee /tmp/proof/oat_build_parallelism.txt
            make -C build -j"$BUILD_JOBS" config=debug_x86 UnlinkerCli 2>&1 | tee /tmp/proof/oat_build.log
            BIN=$(find build/bin -type f \( -name Unlinker -o -name unlinker \) | head -1)
            test -n "$BIN"
            install -m 0755 "$BIN" "$CACHE_BIN"
            printf 'oat_commit=%s\ncompat_patch_sha256=%s\n' "$EXPECTED_COMMIT" "$PATCH_SHA" > "$CACHE_META"
          fi

          printf 'oat_commit=%s\ncompat_patch_sha256=%s\n' "$EXPECTED_COMMIT" "$PATCH_SHA" > /tmp/proof/oat_source_identity.txt
          sha256sum "$CACHE_BIN" | tee /tmp/proof/unlinker_sha256.txt
          printf '%s\n' "$CACHE_BIN" > /tmp/unlinker_path

      - name: Save exact pinned OAT Unlinker cache
        if: steps.oat-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug

      - name: Download SHA-pinned map and shared FastFiles
        shell: bash
        run: |
          set -euo pipefail
          for f in mp_nuketown_2020.ff common_mp.ff common_patch_mp.ff patch_mp.ff; do
            curl -fL --retry 4 -o "/tmp/game/zone/all/$f" "https://r2.houseofkublai.com/bo2/zone/all/$f"
          done
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/game/zone/all/mp_nuketown_2020.ff' | sha256sum -c -
          echo '93fe48b0f0d8cc6844be875ccad94e0cfcf635f62eeff00ac33f2f668a77cb77  /tmp/game/zone/all/common_mp.ff' | sha256sum -c -
          echo '95622d93d4fb761db311a123cd073bed34ea48c9c711d2c11bce4170dd08bae9  /tmp/game/zone/all/common_patch_mp.ff' | sha256sum -c -
          echo '459077cda8e4a1457f7ee7d8f6c5e0abf30f41767a21ff6744df6a4307cbce1e  /tmp/game/zone/all/patch_mp.ff' | sha256sum -c -

      - name: Record runner resource limits
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "nproc=$(nproc)"
            echo "ulimit_user_processes=$(ulimit -u)"
            echo "ulimit_open_files=$(ulimit -n)"
            echo "pid_max=$(cat /proc/sys/kernel/pid_max)"
            if test -r /sys/fs/cgroup/pids.max; then
              echo "cgroup_pids_max=$(cat /sys/fs/cgroup/pids.max)"
            fi
            if test -r /sys/fs/cgroup/pids.current; then
              echo "cgroup_pids_current=$(cat /sys/fs/cgroup/pids.current)"
            fi
            free -h || true
          } | tee /tmp/proof/runner_resource_limits.txt

      - name: Dump native map Materials and map/shared TechniqueSets
        shell: bash
        run: |
          set -uo pipefail
          BIN=$(cat /tmp/unlinker_path)
          mkdir -p /tmp/map_out /tmp/common_out /tmp/common_patch_out /tmp/patch_out /tmp/proof
          : > /tmp/proof/native_dump_return_codes.txt
          overall_rc=0

          run_dump() {
            label="$1"
            root="$2"
            ff="$3"
            kind="$4"
            log="/tmp/proof/${label}.log"
            set +e
            "$BIN" --no-color --verbose --include-assets "$kind" \
              --output-folder "$root" "$ff" \
              2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            printf '%s rc=%s\n' "$label" "$rc" | tee -a /tmp/proof/native_dump_return_codes.txt
            if test "$rc" -ne 0; then
              overall_rc=1
            fi
          }

          set -e
          run_dump map_material_dump /tmp/map_out /tmp/game/zone/all/mp_nuketown_2020.ff material
          run_dump map_techset_dump /tmp/map_out /tmp/game/zone/all/mp_nuketown_2020.ff techniqueset
          run_dump common_techset_dump /tmp/common_out /tmp/game/zone/all/common_mp.ff techniqueset
          run_dump common_patch_techset_dump /tmp/common_patch_out /tmp/game/zone/all/common_patch_mp.ff techniqueset
          run_dump patch_techset_dump /tmp/patch_out /tmp/game/zone/all/patch_mp.ff techniqueset

          find /tmp/map_out/materials -type f -name '*.json' 2>/dev/null | sort > /tmp/proof/map_material_files.txt || true
          : > /tmp/proof/target_technique_physical_files.txt
          for root in map_out common_out common_patch_out patch_out; do
            find "/tmp/$root/techsets" -type f -name '*.techset' 2>/dev/null | sort > "/tmp/proof/${root}_techset_files.txt" || true
            if test -f "/tmp/$root/techniques/pimp_technique_shadowoverlay_5255c888.tech"; then
              file="/tmp/$root/techniques/pimp_technique_shadowoverlay_5255c888.tech"
              printf '%s bytes=%s sha256=%s\n' "$root" "$(stat -c '%s' "$file")" "$(sha256sum "$file" | awk '{print $1}')" \
                | tee -a /tmp/proof/target_technique_physical_files.txt
            fi
          done
          wc -l /tmp/proof/*_files.txt | tee /tmp/proof/dump_counts.txt

          if test "$overall_rc" -ne 0; then
            echo 'One or more required native OAT dumps failed; downstream authoritative census is blocked.' | tee /tmp/proof/native_dump_gate.txt
            exit 1
          fi
          echo 'All required native OAT dumps succeeded.' | tee /tmp/proof/native_dump_gate.txt

      - name: Record every unresolved parent-owned dependency conflict
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/t6_oat_parent_dependency_conflict_census_v1.py \
            --material-root /tmp/map_out \
            --shader-root /tmp/map_out \
            --shader-root /tmp/common_out \
            --shader-root /tmp/common_patch_out \
            --shader-root /tmp/patch_out \
            --out /tmp/proof/T6_NUKETOWN_PARENT_DEPENDENCY_CONFLICT_CENSUS_V1.json \
            2>&1 | tee /tmp/proof/parent_dependency_conflicts.log

      - name: Census every declared native TechniqueSet program with parent provenance
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=tools python3 tools/t6_oat_material_shader_census_v4.py \
            --material-root /tmp/map_out \
            --shader-root /tmp/map_out \
            --shader-root /tmp/common_out \
            --shader-root /tmp/common_patch_out \
            --shader-root /tmp/patch_out \
            --out /tmp/proof/T6_NUKETOWN_NATIVE_MATERIAL_SHADER_CENSUS_V4.json \
            2>&1 | tee /tmp/proof/census.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "$RC" > /tmp/proof/census_rc.txt
          if test -s /tmp/proof/T6_NUKETOWN_NATIVE_MATERIAL_SHADER_CENSUS_V4.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/proof/T6_NUKETOWN_NATIVE_MATERIAL_SHADER_CENSUS_V4.json')
          d=json.loads(p.read_text())
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          print('TOP EXACT TYPE/SHADER GROUPS')
          for g in sorted(d['shaderGroups'],key=lambda x:(-x['materialCount'],x['techniqueType'],x['groupKey']))[:50]:
              stage=[]
              for q in g['passes']:
                  stage.extend(f"{s['kind']}:{s['sha256'][:12]}" for s in q['stages'])
              print(f"{g['materialCount']:4d} mats type={g['techniqueType']} group={g['groupKey'][:12]} stages={','.join(stage)} techsets={len(g['techniqueSets'])}")
          print('DIVERGENT NON-PARENT ALTERNATES')
          for row in d['nonParentAlternateTechniqueDefinitions']:
              if not row['sameParsedPassStageIdentity']:
                  print(row['name'], 'parent=', ','.join(row['parentOwners']), 'alternate=', row['alternateOwner'])
          PY
          fi
          exit "$RC"

      - name: Close exact shadowCookieOverlay Technique owner
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=tools python3 tools/t6_oat_exact_technique_owner_closure_v2.py \
            --census /tmp/proof/T6_NUKETOWN_NATIVE_MATERIAL_SHADER_CENSUS_V4.json \
            --shader-root mp_nuketown_2020=/tmp/map_out \
            --shader-root common_mp=/tmp/common_out \
            --shader-root common_patch_mp=/tmp/common_patch_out \
            --shader-root patch_mp=/tmp/patch_out \
            --target-name pimp_technique_shadowoverlay_5255c888 \
            --target-bytes 592 \
            --target-sha256 cc2f2805aef4899b24ed1a181f816bfcdfd18c6ab876a1172cae11f0abd20d71 \
            --out /tmp/proof/T6_SHADOWCOOKIEOVERLAY_NATIVE_OWNER_CLOSURE_V2.json \
            2>&1 | tee /tmp/proof/shadowcookie_owner_closure.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "$RC" > /tmp/proof/shadowcookie_owner_closure_rc.txt
          exit "$RC"

      - name: Upload native shader census proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_NATIVE_MATERIAL_SHADER_CENSUS_V4_CONFLICTS
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 0
