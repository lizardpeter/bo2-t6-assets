name: T6 server structural fingerprints via retail repo v1

on:
  push:
    paths:
      - '.github/workflows/t6_server_structural_fingerprints_retailrepo_v1.yml'
      - 'tools/ghidra_scripts/ConfigureT6ServerPdbAnalysis.java'
      - 'tools/ghidra_scripts/ExportT6StructuralFingerprints.java'
  workflow_dispatch:

permissions:
  contents: write

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  EXE_SHA256: f67eb68a494b93b5b229985205bdc94e26fdfe677663410e2207c25f6f27a55d
  PDB_SHA256: 7874efc2c9992467a72dbf48cc6f66d8cfa3c9a701275e41df1f8483a3d971fc
  SERVER_CACHE_KEY: t6-server-ghidra-12.1.3-f67eb68a-7874efc2-pdb-v1

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -o /tmp/ghidra.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Fetch exact server EXE and PDB from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-server-ref
          curl --fail --location --retry 5 --retry-all-errors \
            -o /tmp/t6-server-ref/CoDMPServer_PC.exe \
            'https://drive.usercontent.google.com/download?id=1NhLTmevZ5HPKRByj1ok8BpwbvX_5rc1n&export=download&confirm=t'
          curl --fail --location --retry 5 --retry-all-errors \
            -o /tmp/t6-server-ref/CoDMPServer_PC.pdb \
            'https://drive.usercontent.google.com/download?id=1HLGAl3Pbeyv7FDx39vSncy-iRHa4-oCR&export=download&confirm=t'
          echo "$EXE_SHA256  /tmp/t6-server-ref/CoDMPServer_PC.exe" | sha256sum --check
          echo "$PDB_SHA256  /tmp/t6-server-ref/CoDMPServer_PC.pdb" | sha256sum --check

      - name: Restore PDB-backed server Ghidra cache
        id: server-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-server-ghidra/projects
          key: ${{ env.SERVER_CACHE_KEY }}

      - name: Import and analyze exact server once
        if: steps.server-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-server-ghidra/projects /tmp/t6-server-ghidra/config /tmp/t6-server-ghidra/cache
          export XDG_CONFIG_HOME=/tmp/t6-server-ghidra/config
          export XDG_CACHE_HOME=/tmp/t6-server-ghidra/cache
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/t6-server-ghidra/projects t6-server-pdb \
            -import /tmp/t6-server-ref/CoDMPServer_PC.exe \
            -overwrite \
            -preScript ConfigureT6ServerPdbAnalysis.java \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" \
            -analysisTimeoutPerFile 3600 \
            -max-cpu 4

      - name: Save PDB-backed server Ghidra cache
        if: steps.server-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/t6-server-ghidra/projects
          key: ${{ env.SERVER_CACHE_KEY }}

      - name: Export whole-program server fingerprints
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/t6-server-fingerprints
          mkdir -p /tmp/t6-server-fingerprints /tmp/t6-server-ghidra/config-export /tmp/t6-server-ghidra/cache-export
          export XDG_CONFIG_HOME=/tmp/t6-server-ghidra/config-export
          export XDG_CACHE_HOME=/tmp/t6-server-ghidra/cache-export
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/t6-server-ghidra/projects t6-server-pdb \
            -process CoDMPServer_PC.exe -noanalysis -readOnly \
            -postScript ExportT6StructuralFingerprints.java /tmp/t6-server-fingerprints 8 \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 4
          python3 - <<'PY'
          import csv,hashlib,json,pathlib
          root=pathlib.Path('/tmp/t6-server-fingerprints')
          files=sorted(root.glob('fingerprints_*.tsv'))
          assert len(files)==8,len(files)
          count=0; shards=[]
          for p in files:
              with p.open(encoding='utf-8',newline='') as f:
                  rows=list(csv.DictReader(f,dialect='excel-tab'))
              count += len(rows)
              shards.append({'file':p.name,'rows':len(rows),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          assert count>20000,count
          summary={
            'format':'t6-structural-fingerprints-v1',
            'build':'pc-server-2013-03-11',
            'exe_sha256':'f67eb68a494b93b5b229985205bdc94e26fdfe677663410e2207c25f6f27a55d',
            'pdb_sha256':'7874efc2c9992467a72dbf48cc6f66d8cfa3c9a701275e41df1f8483a3d971fc',
            'ghidra_version':'12.1.3',
            'function_rows':count,
            'shards':shards,
            'authority':'PDB-backed Ghidra analysis of exact CoDMPServer_PC.exe',
            'proof_boundary':'Mechanical server structural fingerprint evidence only. Server names/types remain server-build facts; no retail identity is inferred by this export.'
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Commit compact server fingerprint ledger
        shell: bash
        run: |
          set -euo pipefail
          OUT=proof/server_structural_fingerprints_v1
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp /tmp/t6-server-fingerprints/fingerprints_*.tsv /tmp/t6-server-fingerprints/summary.json "$OUT/"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "proof: export PDB-backed T6 server structural fingerprints"
          git pull --rebase origin main
          git push origin HEAD:main
