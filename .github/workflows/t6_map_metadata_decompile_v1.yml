name: T6 map metadata decompile v1

on:
  push:
    branches:
      - probe-t6-character-xassets
    paths:
      - ".github/workflows/t6_map_metadata_decompile_v1.yml"
      - "tools/ghidra_scripts/ExportT6TypeLayout.java"
  workflow_dispatch:

permissions:
  contents: read

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  SERVER_EXE_SHA256: f67eb68a494b93b5b229985205bdc94e26fdfe677663410e2207c25f6f27a55d
  SERVER_PDB_SHA256: 7874efc2c9992467a72dbf48cc6f66d8cfa3c9a701275e41df1f8483a3d971fc
  SERVER_CACHE_KEY: t6-server-ghidra-12.1.3-f67eb68a-7874efc2-pdb-v1

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors             -o /tmp/ghidra.zip             https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Fetch exact server EXE and PDB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-server-ref
          curl --fail --location --retry 5 --retry-all-errors             -o /tmp/t6-server-ref/CoDMPServer_PC.exe             'https://drive.usercontent.google.com/download?id=1NhLTmevZ5HPKRByj1ok8BpwbvX_5rc1n&export=download&confirm=t'
          curl --fail --location --retry 5 --retry-all-errors             -o /tmp/t6-server-ref/CoDMPServer_PC.pdb             'https://drive.usercontent.google.com/download?id=1HLGAl3Pbeyv7FDx39vSncy-iRHa4-oCR&export=download&confirm=t'
          echo "$SERVER_EXE_SHA256  /tmp/t6-server-ref/CoDMPServer_PC.exe" | sha256sum --check
          echo "$SERVER_PDB_SHA256  /tmp/t6-server-ref/CoDMPServer_PC.pdb" | sha256sum --check

      - name: Restore PDB-backed server project
        id: server-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-server-ghidra/projects
          key: ${{ env.SERVER_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Build exact selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-map-decomp
          cat >/tmp/t6-map-decomp/selection.tsv <<'EOF'
          function_id	requested_va	tier	note
          UI_GetMapTableName	0x00717420	map-meta	server PDB exact
          UI_GetMapName	0x00717440	map-meta	server PDB exact
          UI_GetZMMapStartLocName	0x00717600	map-meta	server PDB exact
          UI_GetMapDisplayName	0x007135d0	map-meta	server PDB exact
          UI_GetMapDisplayNameCaps	0x00718820	map-meta	server PDB exact
          UI_GetMapLocationName	0x00718870	map-meta	server PDB exact
          UI_GetMapLoadNameForCurrentIndex	0x0070d170	map-meta	server PDB exact
          UI_LoadMaps	0x0070d650	map-meta	server PDB exact
          UI_MapLoadInfo	0x00733f70	map-meta	server PDB exact
          EOF

      - name: Export exact disassembly and decompile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-map-decomp/out /tmp/t6-server-ghidra/config-map /tmp/t6-server-ghidra/cache-map
          export XDG_CONFIG_HOME=/tmp/t6-server-ghidra/config-map
          export XDG_CACHE_HOME=/tmp/t6-server-ghidra/cache-map
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless"             /tmp/t6-server-ghidra/projects t6-server-pdb             -process CoDMPServer_PC.exe -noanalysis -readOnly             -postScript ExportT6CurrentClientBatch.java               /tmp/t6-map-decomp/selection.tsv /tmp/t6-map-decomp/out 30             -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 2
          for f in /tmp/t6-map-decomp/out/unreviewed/*.c; do
            echo "=== $(basename "$f") ==="
            cat "$f"
          done
          for f in /tmp/t6-map-decomp/out/disassembly/*.asm; do
            echo "=== $(basename "$f") ==="
            cat "$f"
          done

      - name: Export PDB map metadata layouts
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/t6-server-ghidra/projects t6-server-pdb \
            -process CoDMPServer_PC.exe -noanalysis -readOnly \
            -postScript ExportT6TypeLayout.java \
              /tmp/t6-map-decomp/map_types.tsv mapInfo sharedUiInfo_t contentPackInfo \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 2
          cat /tmp/t6-map-decomp/map_types.tsv

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: T6_MAP_METADATA_DECOMPILE_V1
          path: /tmp/t6-map-decomp
          if-no-files-found: error
          retention-days: 3
