name: SMG RMGE01 retail J3D material census v1

on:
  push:
    paths:
      - '.github/workflows/smg_rmge01_j3d_material_census_v1.yml'
      - 'tools/smg_rmge01_j3d_material_census_v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Census exact RMGE01 Good Egg J3D contracts
        run: |
          set -euo pipefail
          mkdir -p /tmp/smg-j3d
          python tools/smg_rmge01_j3d_material_census_v1.py \
            --galaxy EggStarGalaxy \
            --max-objects 220 \
            --out /tmp/smg-j3d/eggstar_j3d_material_census_v1.json
          python tools/smg_rmge01_j3d_material_census_v1.py \
            --galaxy AstroGalaxy \
            --max-objects 400 \
            --out /tmp/smg-j3d/astrogalaxy_j3d_material_census_v1.json
      - name: Commit structural retail census
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          OUT=smg/rmge01/derived/j3d_material_census_v1
          mkdir -p "$OUT"
          cp /tmp/smg-j3d/eggstar_j3d_material_census_v1.json "$OUT/"
          cp /tmp/smg-j3d/astrogalaxy_j3d_material_census_v1.json "$OUT/"
          sha256sum "$OUT"/*.json > "$OUT/CHECKSUMS.sha256"
          git config user.name 'smg-re-bot'
          git config user.email 'smg-re-bot@users.noreply.github.com'
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'SMG: retain RMGE01 J3D material census v1'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SMG_RMGE01_J3D_MATERIAL_CENSUS_V1
          path: /tmp/smg-j3d
          retention-days: 30
