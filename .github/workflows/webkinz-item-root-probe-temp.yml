name: Temporary Webkinz item asset root probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe item asset roots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
import json, urllib.request, urllib.error
from pathlib import Path

roots = [
    "https://assets.webkinz.com/swf/items/",
    "https://assets.webkinz.com/SWF/ITEMS/",
    "https://play.webkinz.com/swf/items/",
    "https://play.webkinz.com/SWF/ITEMS/",
]
ids = [331, 590, 14280, 22241, 29889]
files = ["sw.png","sw.xml","nw.png","nw.xml","ne.png","ne.xml","se.png","se.xml"]
ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
rows=[]

for root in roots:
    for iid in ids:
        for name in files:
            url=f"{root}{iid}/{name}"
            req=urllib.request.Request(url,headers={"User-Agent":ua,"Range":"bytes=0-255"})
            try:
                with urllib.request.urlopen(req, timeout=20) as r:
                    body=r.read(256)
                    ct=r.headers.get("Content-Type","")
                    rows.append({
                        "url":url,
                        "status":getattr(r,"status",200),
                        "content_type":ct,
                        "content_length":r.headers.get("Content-Length",""),
                        "first_bytes_hex":body[:16].hex(),
                        "png_signature":body.startswith(b"\x89PNG\r\n\x1a\n"),
                        "xml_prefix":body.lstrip().startswith(b"<"),
                        "final_url":r.geturl(),
                    })
            except urllib.error.HTTPError as e:
                body=e.read(256) if hasattr(e,"read") else b""
                rows.append({
                    "url":url,"status":e.code,
                    "content_type":e.headers.get("Content-Type","") if e.headers else "",
                    "content_length":e.headers.get("Content-Length","") if e.headers else "",
                    "first_bytes_hex":body[:16].hex(),
                    "png_signature":body.startswith(b"\x89PNG\r\n\x1a\n"),
                    "xml_prefix":body.lstrip().startswith(b"<"),
                    "final_url":url,
                })
            except Exception as e:
                rows.append({"url":url,"status":0,"error":type(e).__name__+":"+str(e)})

valid=[r for r in rows if r.get("png_signature") or r.get("xml_prefix")]
Path("out/probe.json").write_text(json.dumps(rows,indent=2))
Path("out/valid.json").write_text(json.dumps(valid,indent=2))
by_root={}
for root in roots:
    subset=[r for r in rows if r["url"].startswith(root)]
    by_root[root]={
        "total":len(subset),
        "png":sum(1 for r in subset if r.get("png_signature")),
        "xml":sum(1 for r in subset if r.get("xml_prefix")),
        "status200":sum(1 for r in subset if r.get("status")==200),
        "types":sorted(set(r.get("content_type","") for r in subset)),
    }
Path("out/summary.json").write_text(json.dumps(by_root,indent=2))
print(json.dumps(by_root,indent=2))
PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-item-root-probe
          path: out/
          retention-days: 7
