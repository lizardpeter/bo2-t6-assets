name: Temporary Webkinz item asset root probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recursive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build current item ID database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/ffdec work/src out
          python3 -m pip install -q aiohttp
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 180 -o work/ffdec.zip "https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip"
          unzip -q work/ffdec.zip -d work/ffdec
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 180 -A "Mozilla/5.0" -o work/items.swf "https://play.webkinz.com/SWF/staticdata/US_EN/items.swf?v=v390_249"
          java -Xmx4g -jar work/ffdec/ffdec.jar -cli -timeout 60 -exportTimeout 900 -onerror ignore -export script work/src work/items.swf > out/items.ffdec.log 2>&1

      - name: Recursively scan special item SWFs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/webkinz_special_item_recursive.py 2>&1 | tee out/run.log

      - name: Upload recursive special item scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-special-item-recursive
          path: out/
          if-no-files-found: error
          retention-days: 7
