name: Temporary Webkinz item asset root probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe item asset roots
        run: python3 tools/webkinz_item_root_probe.py
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-item-root-probe
          path: out/
          retention-days: 7
