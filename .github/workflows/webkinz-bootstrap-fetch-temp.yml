name: Temporary Webkinz bootstrap fetch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/webkinz_bootstrap_fetch.py
      - uses: actions/upload-artifact@v4
        with:
          name: webkinz-bootstrap-raw
          path: bootstrap_raw/
          retention-days: 7
