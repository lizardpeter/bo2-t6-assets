name: T6 provenance-safe cross-build Ghidra hints v1

on:
  push:
    paths:
      - '.github/workflows/t6_ghidra_cross_build_hints_v1.yml'
      - 'tools/ghidra_scripts/ApplyT6CrossBuildHints.java'
      - 'proof/current_client/ghidra_cross_build_hints_v1/hints.tsv'
  workflow_dispatch:

permissions:
  contents: write

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  BASE_CACHE_KEY: t6-current-client-ghidra-12.1.3-77031817-v1
  ENRICHED_CACHE_KEY: t6-current-client-ghidra-12.1.3-77031817-xbuild-hints-v1-20261002
  CLIENT_SHA256: 770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf

jobs:
  enrich-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -o /tmp/ghidra.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Restore enriched project if already cached
        id: enriched-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-ghidra/projects
          key: ${{ env.ENRICHED_CACHE_KEY }}

      - name: Restore pristine retail project
        if: steps.enriched-cache.outputs.cache-hit != 'true'
        id: base-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-ghidra/projects
          key: ${{ env.BASE_CACHE_KEY }}

      - name: Require a saved exact-current-client Ghidra project
        shell: bash
        run: |
          set -euo pipefail
          test -d /tmp/t6-ghidra/projects
          find /tmp/t6-ghidra/projects -maxdepth 2 -type f | head

      - name: Build deterministic exact-witness selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-xbuild/batch /tmp/t6-ghidra/config /tmp/t6-ghidra/cache
          python3 - <<'PY'
          import csv,pathlib
          src=pathlib.Path('proof/current_client/ghidra_cross_build_hints_v1/hints.tsv')
          out=pathlib.Path('/tmp/t6-xbuild/selection.tsv')
          rows=list(csv.DictReader(src.open(encoding='utf-8',newline=''),dialect='excel-tab'))
          assert len(rows)==353, len(rows)
          with out.open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter='\t',lineterminator='\n')
              w.writerow(['function_id','requested_va','tier'])
              for r in rows:
                  va=int(r['client_va'],16)
                  w.writerow([f'urn:ure:t6:occ:function:current-client:{va:08x}',r['client_va'],'cross-build-exact-hint'])
          PY

      - name: Apply provenance-safe exact-byte hints
        shell: bash
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME=/tmp/t6-ghidra/config
          export XDG_CACHE_HOME=/tmp/t6-ghidra/cache
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/t6-ghidra/projects t6-current-client \
            -process t6mp.exe -noanalysis \
            -postScript ApplyT6CrossBuildHints.java \
              "$GITHUB_WORKSPACE/proof/current_client/ghidra_cross_build_hints_v1/hints.tsv" \
              /tmp/t6-xbuild/apply_report.tsv \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 4

      - name: Save enriched project cache
        if: steps.enriched-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/t6-ghidra/projects
          key: ${{ env.ENRICHED_CACHE_KEY }}

      - name: Export enriched exact-witness pseudocode
        shell: bash
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME=/tmp/t6-ghidra/config
          export XDG_CACHE_HOME=/tmp/t6-ghidra/cache
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/t6-ghidra/projects t6-current-client \
            -process t6mp.exe -noanalysis -readOnly \
            -postScript ExportT6CurrentClientBatch.java \
              /tmp/t6-xbuild/selection.tsv /tmp/t6-xbuild/batch 15 \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 4

      - name: Audit the pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('/tmp/t6-xbuild')
          a=list(csv.DictReader((root/'apply_report.tsv').open(encoding='utf-8',newline=''),dialect='excel-tab'))
          r=list(csv.DictReader((root/'batch/results.tsv').open(encoding='utf-8',newline=''),dialect='excel-tab'))
          assert len(a)==353, len(a)
          assert len(r)==353, len(r)
          assert all(x['exact_function']=='true' for x in a)
          assert all(x['hash_match']=='true' for x in a)
          renamed=[x for x in a if x['renamed']=='true']
          comments=[x for x in a if x['commented']=='true']
          xbuild=[x for x in r if 'xbuild_' in x['ghidra_name']]
          summary={
            'format':'t6-ghidra-cross-build-hints-v1',
            'client_sha256':'770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf',
            'hint_rows':len(a),
            'exact_retail_functions_found':sum(x['exact_function']=='true' for x in a),
            'retail_instruction_hashes_reverified':sum(x['hash_match']=='true' for x in a),
            'functions_renamed_with_xbuild_prefix':len(renamed),
            'functions_commented_this_run':len(comments),
            'decompile_completed':sum(x['decompile_completed']=='true' for x in r),
            'decompile_failed_or_timed_out':sum(x['decompile_completed']!='true' for x in r),
            'decompile_rows_showing_xbuild_names':len(xbuild),
            'server_prototypes_applied':0,
            'server_types_applied':0,
            'server_globals_applied':0,
            'policy':'Server build is a cross-build oracle only. Every hint is guarded by a retail-side instruction-byte SHA-256 recheck. Names remain xbuild-prefixed; no server prototype/type/global/source/layout/address-delta facts are imported.',
          }
          out=pathlib.Path('proof/current_client/ghidra_cross_build_hints_v1/run')
          out.mkdir(parents=True,exist_ok=True)
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          (out/'apply_report.tsv').write_text((root/'apply_report.tsv').read_text())
          (out/'enriched_results.tsv').write_text((root/'batch/results.tsv').read_text())
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          git diff --check

      - name: Commit durable audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name uregraph-re-bot
          git config user.email uregraph-re-bot@users.noreply.github.com
          git add proof/current_client/ghidra_cross_build_hints_v1/run
          git diff --cached --quiet && exit 0
          git commit -m "Record T6 provenance-safe Ghidra hint validation"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_GHIDRA_CROSS_BUILD_HINTS_V1
          path: |
            /tmp/t6-xbuild
            proof/current_client/ghidra_cross_build_hints_v1
          if-no-files-found: warn
          retention-days: 30
