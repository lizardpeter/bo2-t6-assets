name: T6 retail special direct symbolic coverage v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_retail_special_direct_symbolic_coverage_v1.py'
      - 'proof/render/T6_RETAIL_SPECIAL_SYMBOLIC_FULL_ROWS_V2.json'
      - 'proof/render/T6_RETAIL_SPECIAL_*_DIRECT_DXBC_VALIDATED_V1.json'
      - 'manifests/render/T6_NUKETOWN_SPECIAL_FULL_OUTPUT_SYMBOLIC_V1.json'
      - '.github/workflows/t6_retail_special_direct_symbolic_coverage_v1.yml'
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Join direct pixel shaders to symbolic proofs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_retail_special_direct_symbolic_coverage_v1.py             --out proof/render/T6_RETAIL_SPECIAL_DIRECT_SYMBOLIC_COVERAGE_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/render/T6_RETAIL_SPECIAL_DIRECT_SYMBOLIC_COVERAGE_V1.json'))
          s=d['summary']
          assert s['directPixelShaderCount']==176
          assert s['coveredDirectPixelShaderCount']==157
          assert s['missingDirectPixelShaderCount']==19
          assert {x['family']:x['missingCount'] for x in d['families']}=={
            'default':1,'emissive_or_burning':0,'rawnormal_special':0,
            'shadowcaster':0,'tv_special':0,'unlit':13,'water':5}
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/render/T6_RETAIL_SPECIAL_DIRECT_SYMBOLIC_COVERAGE_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact special shader symbolic coverage'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_RETAIL_SPECIAL_DIRECT_SYMBOLIC_COVERAGE_V1
          path: proof/render/T6_RETAIL_SPECIAL_DIRECT_SYMBOLIC_COVERAGE_V1.json
          if-no-files-found: error
          compression-level: 9
