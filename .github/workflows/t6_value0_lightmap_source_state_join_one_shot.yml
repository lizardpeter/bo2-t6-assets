name: T6 value0 lightmap source-state join one-shot

on:
  push:
    paths:
      - '.github/workflows/t6_value0_lightmap_source_state_join_one_shot.yml'

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Join retained exact proofs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_primary_lightmap_value0_source_state_join_v1.py             --base-proof proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_CONSTANT_WRITER_BASE_PROVENANCE_V1.json             --barrier-proof proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_CALL_BARRIER_REGISTER_EFFECTS_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_VALUE0_SOURCE_STATE_JOIN_V1.json
          python3 - <<'PY'
          import json
          p='proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_VALUE0_SOURCE_STATE_JOIN_V1.json'
          d=json.load(open(p))
          assert d['summary']['sourceStateOccurrenceAccepted'] is True
          assert d['summary']['slot4Value']==0
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name uregraph-re-bot
          git config user.email uregraph-re-bot@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_VALUE0_SOURCE_STATE_JOIN_V1.json
          if ! git diff --cached --quiet; then
            git commit -m "Close T6 value-0 lightmap source-state identity"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_PRIMARY_LIGHTMAP_VALUE0_SOURCE_STATE_JOIN_V1
          path: proof/current_client/T6_CURRENT_CLIENT_PRIMARY_LIGHTMAP_VALUE0_SOURCE_STATE_JOIN_V1.json
          if-no-files-found: error
