name: nuketown-persist-live-identity-v1

on:
  push:
    branches: [base-ipak-r2-recovery]
    paths:
      - .github/workflows/nuketown-persist-live-identity-v1.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download the successful live-identity artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9962029647/zip" \
            -o live-identity.zip
          echo 'e8e1e4e31496f1f6db0155b7e873d218a173ad81a8990509060d643a25353200  live-identity.zip' | sha256sum -c -
          unzip -q live-identity.zip -d live-identity
          echo '713d3845c09093f097544803098d97a121acc8fd3bfa9b79b11fd28c1caa666c  live-identity/NUKETOWN_WORLD_TEXTURE_IDENTITIES_LIVE_V1.json' | sha256sum -c -
      - name: Canonicalize and validate the retail identity inventory
        run: |
          mkdir -p manifests/maps/mp_nuketown_2020
          python - <<'PY'
          import base64
          import hashlib
          import json
          import zlib
          from pathlib import Path

          src=Path('live-identity/NUKETOWN_WORLD_TEXTURE_IDENTITIES_LIVE_V1.json')
          d=json.loads(src.read_text())
          assert d['map']=='mp_nuketown_2020'
          assert d['materialCount']==327
          assert d['textureEntryCount']==973
          assert d['uniqueImageCount']==423
          assert d['ordinaryRetailImageCount']==422
          assert d['runtimeCodeImageCount']==1
          assert [x['image'] for x in d['runtimeCodeImages']]==[',shadow']
          assert sum(bool(x['streamedPart0']) for x in d['images'])==421

          nonstreamed=[x for x in d['images'] if not x['streamedPartCountRaw']]
          assert [x['image'] for x in nonstreamed]==['$identitynormalmap',',shadow']
          identity=nonstreamed[0]
          shadow=nonstreamed[1]
          assert identity['identityClass']=='retail-name-hash-validated'
          assert identity['imageHash']==identity['computedRHashString']==45285053
          assert identity['width']==identity['height']==identity['depth']==1
          assert shadow['identityClass']=='runtime-code-hash-zero'
          assert shadow['imageHash']==0

          # Runtime heap addresses are useful capture diagnostics but are not retail identities.
          # Strip them from the durable canonical form so reruns can reproduce the same bytes.
          for m in d['materials']:
              m.pop('runtimePointer',None)
              for t in m['textures']:
                  t.pop('imagePointerRuntime',None)

          canonical=(json.dumps(d,indent=2,sort_keys=True)+'\n').encode()
          canonical_sha=hashlib.sha256(canonical).hexdigest()
          assert canonical_sha=='6fa514496c95fe9275fe260f67aabe54c8217f824e03ba9ee5420ec20f255835'
          compressed=zlib.compress(canonical,9)
          assert hashlib.sha256(compressed).hexdigest()=='46837ea69975b1a43c2624e38e3e3a226c955238e49e04ed4a056009dea9d24f'

          out=Path('manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_TEXTURE_IDENTITIES_CANONICAL_V1.json.zlib.b64')
          out.write_text(base64.b64encode(compressed).decode()+'\n')

          diag=json.loads(Path('live-identity/NUKETOWN_WORLD_TEXTURE_IDENTITIES_LIVE_V1_DIAGNOSTICS.json').read_text())
          readiness=diag['surfaceMaterialReadiness']
          assert readiness=={
              'distinctMaterialPointers':327,
              'nonNullMaterialPointers':5614,
              'stableConsecutiveSnapshots':2,
              'surfaceCount':5614,
          }

          proof={
              'format':'t6-nuketown-world-texture-identities-canonical-v1-proof',
              'map':'mp_nuketown_2020',
              'sourceActionRunId':33941679398,
              'sourceArtifactId':9962029647,
              'sourceArtifactZipSha256':'e8e1e4e31496f1f6db0155b7e873d218a173ad81a8990509060d643a25353200',
              'sourceLiveManifestBytes':src.stat().st_size,
              'sourceLiveManifestSha256':'713d3845c09093f097544803098d97a121acc8fd3bfa9b79b11fd28c1caa666c',
              'canonicalManifestRawBytes':len(canonical),
              'canonicalManifestRawSha256':canonical_sha,
              'canonicalManifestZlibBytes':len(compressed),
              'canonicalManifestZlibSha256':hashlib.sha256(compressed).hexdigest(),
              'materialCount':d['materialCount'],
              'textureEntryCount':d['textureEntryCount'],
              'uniqueImageCount':d['uniqueImageCount'],
              'ordinaryRetailImageCount':d['ordinaryRetailImageCount'],
              'runtimeCodeImageCount':d['runtimeCodeImageCount'],
              'streamedImageCount':421,
              'nonStreamedImages':nonstreamed,
              'runtimeCodeImages':d['runtimeCodeImages'],
              'semanticEntryCounts':d['semanticEntryCounts'],
              'uniqueImageStreamingCounts':d['uniqueImageStreamingCounts'],
              'uniqueImageStreamedPartCounts':d['uniqueImageStreamedPartCounts'],
              'captureReadiness':readiness,
              'oatCrosscheck':{
                  'materialCount':327,
                  'textureEntryCount':973,
                  'imageOrderMismatches':0,
                  'onlyProvenRuntimeNameNormalization':{
                      'material':'wpc/shadowcaster',
                      'slot':0,
                      'oatImage':'shadow',
                      'liveRetailImage':',shadow',
                  },
              },
              'proofBoundary':'The canonical inventory comes from the frozen retail GfxWorld only after all 5,614 surface material pointers were non-null, exactly 327 distinct material pointers were present, and two consecutive full snapshots matched. Ordinary retail GfxImage.hash values remain fail-closed against R_HashString(name). The single comma-prefixed zero-hash runtime image is separated from streamed IPAK recovery. Runtime heap pointer fields are intentionally removed from the canonical form.',
          }
          Path('manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_TEXTURE_IDENTITIES_CANONICAL_V1_PROOF.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:proof[k] for k in ('canonicalManifestRawBytes','canonicalManifestRawSha256','canonicalManifestZlibBytes','canonicalManifestZlibSha256','materialCount','textureEntryCount','uniqueImageCount','streamedImageCount')},indent=2))
          PY
      - name: Commit the canonical manifest and proof
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_TEXTURE_IDENTITIES_CANONICAL_V1.json.zlib.b64 \
            manifests/maps/mp_nuketown_2020/NUKETOWN_WORLD_TEXTURE_IDENTITIES_CANONICAL_V1_PROOF.json
          git diff --cached --check
          git commit -m 'Checkpoint canonical Nuketown world texture identities'
          git push origin HEAD:base-ipak-r2-recovery
