name: T6 missing Secondary target owner census v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_oat_alias_csv_target_census_v1.py'
      - 'tools/test_t6_oat_alias_csv_target_census_v1.py'
      - 'tools/t6_remote_zip_range_v1.py'
      - 'tools/t6_oat_9dca_gcc_compat_patch_v3.py'
      - '.github/workflows/t6_oat_missing_secondary_target_owner_census_v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: PYTHONPATH=tools python3 tools/test_t6_oat_alias_csv_target_census_v1.py

  native-shard:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZIP_URL: https://cdn.jordanlindsay.com.au/pluto_t6_full_game.zip
      SHARD: ${{ matrix.shard }}
      SHARD_COUNT: '8'
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact pinned OAT Unlinker cache
        id: oat-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug

      - name: Build or verify pinned OAT Unlinker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof /tmp/oat-unlinker-cache
          CACHE_BIN=/tmp/oat-unlinker-cache/Unlinker
          CACHE_META=/tmp/oat-unlinker-cache/source_identity.txt
          EXPECTED_COMMIT=9dca965366541504b71fa8cfb7ac049cb9b717e1
          PATCH_SHA=$(sha256sum tools/t6_oat_9dca_gcc_compat_patch_v3.py | awk '{print $1}')
          if test "${{ steps.oat-cache.outputs.cache-hit }}" = 'true'; then
            test -x "$CACHE_BIN"; test -f "$CACHE_META"
            grep -qx "oat_commit=$EXPECTED_COMMIT" "$CACHE_META"
            grep -qx "compat_patch_sha256=$PATCH_SHA" "$CACHE_META"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq g++-multilib >/dev/null
            git clone -q --recursive https://github.com/Laupetin/OpenAssetTools.git /tmp/oat
            git -C /tmp/oat checkout -q "$EXPECTED_COMMIT"
            test "$(git -C /tmp/oat rev-parse HEAD)" = "$EXPECTED_COMMIT"
            git -C /tmp/oat submodule update -q --init --recursive
            python3 tools/t6_oat_9dca_gcc_compat_patch_v3.py /tmp/oat
            git -C /tmp/oat diff --check
            cd /tmp/oat
            PREMAKE_NO_PROMPT=1 ./generate.sh
            make -C build -j2 config=debug_x86 UnlinkerCli >/tmp/proof/oat_build.log 2>&1
            BIN=$(find build/bin -type f \( -name Unlinker -o -name unlinker \) | head -1)
            test -n "$BIN"
            install -m0755 "$BIN" "$CACHE_BIN"
            printf 'oat_commit=%s\ncompat_patch_sha256=%s\n' "$EXPECTED_COMMIT" "$PATCH_SHA" > "$CACHE_META"
          fi
          printf 'oat_commit=%s\ncompat_patch_sha256=%s\n' "$EXPECTED_COMMIT" "$PATCH_SHA" > /tmp/proof/oat_source_identity.txt
          sha256sum "$CACHE_BIN" | tee /tmp/proof/unlinker_sha256.txt
          printf '%s\n' "$CACHE_BIN" > /tmp/unlinker_path

      - name: Save exact pinned OAT cache
        if: steps.oat-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug

      - name: Download exact retained 215-FastFile census
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/alias /tmp/proof
          gh run download 34177086929 --repo "$GITHUB_REPOSITORY" --name T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1 --dir /tmp/alias
          test -f /tmp/alias/T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1.json
          echo '5da7ed9c5cd5ea4c2cd69213438103883f6c804db678db6496f781ed86713f5d  /tmp/alias/T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1.json' | sha256sum -c -

      - name: Native owner census over every structurally proven SoundBank FastFile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/work /tmp/oatroot /tmp/proof/logs
          BIN=$(cat /tmp/unlinker_path); export BIN
          PYTHONPATH=tools python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess
          from t6_remote_zip_range_v1 import RemoteZip
          from t6_oat_alias_csv_target_census_v1 import scan

          census=json.load(open('/tmp/alias/T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1.json',encoding='utf-8'))
          rows=census['rows']
          if len(rows)!=215 or [int(r['globalIndex']) for r in rows]!=list(range(215)):
              raise SystemExit('retained alias census no longer provides exact globalIndex 0..214 coverage')
          snd_rows=[r for r in rows if int(r['summary']['validatedSndBankSectionCount'])>0]
          if len(snd_rows)!=63 or census['summary']['fastFilesWithValidatedSndBankSections']!=63:
              raise SystemExit(f'expected exact 63 structurally validated SoundBank FastFiles, got {len(snd_rows)}')
          shard=int(os.environ['SHARD']); n=int(os.environ['SHARD_COUNT'])
          selected=[r for r in snd_rows if int(r['globalIndex']) % n == shard]
          rz=RemoteZip(os.environ['ZIP_URL'],f'bo2-t6-assets-oat-missing-secondary-owner-v2/{shard}',timeout=180,retries=7)
          entries,meta=rz.central_directory(); by_name={e['name']:e for e in entries}
          out_rows=[]; matches=[]; totals={'nativeSoundBankCsvCount':0,'nativeAliasRowCount':0}
          targets=['wpn_wa2000_bass_swt_silencer','zmb_tomahawk_sparks']
          for r in selected:
              idx=int(r['globalIndex']); source=r['zipPath']; z=by_name.get(source)
              if z is None: raise SystemExit(f'archive missing exact FastFile {source}')
              raw=rz.extract(z,verify_crc=True); sha=hashlib.sha256(raw).hexdigest()
              if sha!=r['fastFileSha256']:
                  raise SystemExit(f'{source}: FastFile SHA mismatch {sha} != {r["fastFileSha256"]}')
              ff=pathlib.Path('/tmp/work')/f'{idx:03d}.ff'; ff.write_bytes(raw)
              root=pathlib.Path('/tmp/oatroot')/f'{idx:03d}'; root.mkdir(parents=True,exist_ok=True)
              log=pathlib.Path('/tmp/proof/logs')/f'{idx:03d}.log'
              with log.open('wb') as lf:
                  proc=subprocess.run([os.environ['BIN'],'--no-color','--include-assets','soundbank','--output-folder',str(root),str(ff)],stdout=lf,stderr=subprocess.STDOUT)
              if proc.returncode!=0:
                  raise SystemExit(f'{source}: native OAT SoundBank dump failed rc={proc.returncode}')
              d=scan(root,source,targets)
              if d['summary']['nativeSoundBankCsvCount'] < 1:
                  raise SystemExit(f'{source}: structural census proved SoundBank but native OAT emitted no alias CSV')
              totals['nativeSoundBankCsvCount']+=d['summary']['nativeSoundBankCsvCount']
              totals['nativeAliasRowCount']+=d['summary']['nativeAliasRowCount']
              matches.extend(d['matches'])
              out_rows.append({
                  'globalIndex':idx,'sourceFastFile':source,'fastFileSha256':sha,
                  'zipCrc32':f"{int(z['crc32']):08x}",'nativeDumpReturnCode':proc.returncode,
                  'structuralValidatedSndBankSectionCount':r['summary']['validatedSndBankSectionCount'],
                  'structuralAliasDefinitionOccurrenceCount':r['summary']['aliasDefinitionOccurrenceCount'],
                  **d['summary']
              })
              print(idx,d['summary']['nativeSoundBankCsvCount'],d['summary']['nativeAliasRowCount'],d['summary']['targetMatchCount'],source,flush=True)
              ff.unlink(missing_ok=True); shutil.rmtree(root)
          result={
              'format':'t6-oat-missing-secondary-target-owner-census-shard-v2',
              'shard':shard,'shardCount':n,'archiveFastFileCount':215,'structuralSoundBankFastFileCount':63,'targets':targets,
              'remoteZip':meta,'rows':out_rows,'matches':matches,
              'summary':{
                  'selectedNativeFastFileCount':len(out_rows),
                  'greenNativeDumpFastFileCount':sum(r['nativeDumpReturnCode']==0 for r in out_rows),
                  **totals,'targetMatchCount':len(matches)
              },
              'proofBoundary':'Native pinned-OAT SoundBank alias Name census for one deterministic shard of the 63 FastFiles that the exact retained 215-FastFile structural census proves contain validated SndBank sections. Every selected FF is ZIP-CRC verified and SHA-matched to that census; every native SoundBank dump must return zero and emit at least one alias CSV. The other 152 archive FastFiles are not passed to a SoundBank-only OAT dump because the retained fail-closed structural census proves zero validated SndBank sections in them. Only native alias CSV Name rows can establish a target owner.'
          }
          pathlib.Path(f'/tmp/proof/T6_OAT_MISSING_SECONDARY_TARGET_OWNER_SHARD_{shard}_V2.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result['summary'],indent=2,sort_keys=True))
          PY

      - name: Upload native owner shard
        uses: actions/upload-artifact@v4
        with:
          name: T6_OAT_MISSING_SECONDARY_TARGET_OWNER_SHARD_${{ matrix.shard }}_V2
          path: /tmp/proof/T6_OAT_MISSING_SECONDARY_TARGET_OWNER_SHARD_${{ matrix.shard }}_V2.json
          if-no-files-found: error
          compression-level: 9

  aggregate:
    needs: native-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: T6_OAT_MISSING_SECONDARY_TARGET_OWNER_SHARD_*_V2
          path: /tmp/shards
          merge-multiple: true
      - name: Download exact retained 215-FastFile structural census
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/alias
          gh run download 34177086929 --repo "$GITHUB_REPOSITORY" --name T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1 --dir /tmp/alias
          echo '5da7ed9c5cd5ea4c2cd69213438103883f6c804db678db6496f781ed86713f5d  /tmp/alias/T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1.json' | sha256sum -c -
      - name: Require exact 63-native plus 152-structural archive coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof
          python3 - <<'PY'
          import glob,hashlib,json,pathlib
          census=json.load(open('/tmp/alias/T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1.json',encoding='utf-8'))
          all_rows=census['rows']
          if len(all_rows)!=215 or [int(r['globalIndex']) for r in all_rows]!=list(range(215)):
              raise SystemExit('retained structural census is not exact 215 coverage')
          snd_indices={int(r['globalIndex']) for r in all_rows if int(r['summary']['validatedSndBankSectionCount'])>0}
          no_snd_indices={int(r['globalIndex']) for r in all_rows if int(r['summary']['validatedSndBankSectionCount'])==0}
          if len(snd_indices)!=63 or len(no_snd_indices)!=152 or snd_indices|no_snd_indices!=set(range(215)) or snd_indices&no_snd_indices:
              raise SystemExit('structural SoundBank/non-SoundBank partition mismatch')

          files=sorted(glob.glob('/tmp/shards/T6_OAT_MISSING_SECONDARY_TARGET_OWNER_SHARD_*_V2.json'))
          if len(files)!=8: raise SystemExit(f'expected 8 shards, got {len(files)}')
          docs=[json.load(open(p,encoding='utf-8')) for p in files]
          rows=[]; matches=[]; csv_count=0; alias_rows=0; targets=None
          for d in docs:
              if d.get('format')!='t6-oat-missing-secondary-target-owner-census-shard-v2': raise SystemExit('bad shard format')
              if d.get('archiveFastFileCount')!=215 or d.get('structuralSoundBankFastFileCount')!=63: raise SystemExit('archive population mismatch')
              if targets is None: targets=d['targets']
              elif targets!=d['targets']: raise SystemExit('target set differs across shards')
              rows.extend(d['rows']); matches.extend(d['matches'])
              csv_count+=int(d['summary']['nativeSoundBankCsvCount']); alias_rows+=int(d['summary']['nativeAliasRowCount'])
          rows.sort(key=lambda r:r['globalIndex'])
          native_indices=[int(r['globalIndex']) for r in rows]
          if len(rows)!=63 or set(native_indices)!=snd_indices or len(native_indices)!=len(set(native_indices)):
              raise SystemExit('native shards do not cover exactly the 63 structurally proven SoundBank FastFiles')
          if any(r['nativeDumpReturnCode']!=0 or r['nativeSoundBankCsvCount']<1 for r in rows):
              raise SystemExit('one or more native OAT SoundBank dumps failed or emitted no alias CSV')
          by_target={t:[] for t in targets}
          for m in matches: by_target[m['target']].append(m)
          result={
              'format':'t6-missing-secondary-target-owner-census-v2',
              'targets':targets,'nativeRows':rows,'matches':matches,'ownersByTarget':by_target,
              'summary':{
                  'archiveFastFileCount':215,
                  'structuralNoSoundBankFastFileCount':152,
                  'structuralSoundBankFastFileCount':63,
                  'greenNativeSoundBankFastFileCount':63,
                  'nativeSoundBankCsvCount':csv_count,'nativeAliasRowCount':alias_rows,
                  'targetMatchCount':len(matches),
                  'targetsWithOwnerCount':sum(bool(v) for v in by_target.values()),
                  'targetsWithoutOwnerCount':sum(not v for v in by_target.values())
              },
              'source':{
                  'structuralCensusRun':34177086929,
                  'structuralCensusArtifact':'T6_SNDALIAS_ALL_FASTFILE_CENSUS_V1',
                  'structuralCensusArtifactDigest':'sha256:7aa3a37ac803a49d0b629cad446c1475edd682a328d2d39cce07c1fce19eac8a',
                  'structuralCensusJsonSha256':'5da7ed9c5cd5ea4c2cd69213438103883f6c804db678db6496f781ed86713f5d'
              },
              'shardJsonSha256':[{'file':pathlib.Path(p).name,'sha256':hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()} for p in files],
              'proofBoundary':'Complete owner census within the exact 215-FastFile archive using two fail-closed layers. The retained structural census proves 152 FastFiles contain zero validated SndBank sections and exactly 63 contain validated SndBank sections. Every one of those 63 was ZIP-CRC verified, exact-SHA matched, natively dumped by pinned OAT with rc=0, and required to emit at least one SoundBank alias CSV. Owner presence requires an exact native CSV Name-row match. If a target has zero matches, absence is authoritative only within this exact archive SoundBank universe, not outside the archive or for runtime-generated aliases.'
          }
          pathlib.Path('/tmp/proof/T6_MISSING_SECONDARY_TARGET_OWNER_CENSUS_V2.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result['summary'],indent=2,sort_keys=True))
          print(json.dumps(by_target,indent=2,sort_keys=True))
          PY
      - name: Upload complete target-owner census
        uses: actions/upload-artifact@v4
        with:
          name: T6_MISSING_SECONDARY_TARGET_OWNER_CENSUS_V2
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9