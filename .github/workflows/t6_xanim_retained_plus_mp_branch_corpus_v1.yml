name: T6 XAnim retained plus MP branch corpus v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_xanim_retained_plus_mp_branch_corpus_v1.py'
      - 'manifests/xanim/T6_RETAIL_XANIM_FULL_QUAT_CENSUS_V4.json'
      - 'proof/xanim/T6_MP_XANIM_DELTA_BRANCH_CORPUS_V1.json'
      - 'proof/xanim/T6_MP_XANIM_DYNAMIC_FULL_QUAT_COMPILED_V19_RETAIL_PROOF_V1.json'
      - '.github/workflows/t6_xanim_retained_plus_mp_branch_corpus_v1.yml'
permissions:
  contents: write
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build exact deduplicated XAnim corpus union
        run: |
          set -euo pipefail
          python3 tools/t6_xanim_retained_plus_mp_branch_corpus_v1.py             --retained manifests/xanim/T6_RETAIL_XANIM_FULL_QUAT_CENSUS_V4.json             --mp proof/xanim/T6_MP_XANIM_DELTA_BRANCH_CORPUS_V1.json             --full-quat-proof proof/xanim/T6_MP_XANIM_DYNAMIC_FULL_QUAT_COMPILED_V19_RETAIL_PROOF_V1.json             --out proof/xanim/T6_XANIM_RETAINED_PLUS_MP_BRANCH_CORPUS_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/xanim/T6_XANIM_RETAINED_PLUS_MP_BRANCH_CORPUS_V1.json'))
          s=d['summary']
          assert s['allUnionXFilesCountClosed'] is True
          assert s['constantFullQuatObserved']==0
          assert s['directDynamicFullQuatCompiledV19RawExactFixtureCount']==6
          assert s['uniqueXFileCount']>31
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/xanim/T6_XANIM_RETAINED_PLUS_MP_BRANCH_CORPUS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist deduplicated retained plus MP XAnim corpus'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_XANIM_RETAINED_PLUS_MP_BRANCH_CORPUS_V1
          path: proof/xanim/T6_XANIM_RETAINED_PLUS_MP_BRANCH_CORPUS_V1.json
          if-no-files-found: error
