name: T6 current-client model-lighting proof v1

on:
  push:
    paths:
      - 'tools/ghidra_scripts/ExportT6CurrentClientModelLighting.java'
      - '.github/workflows/t6_current_client_model_lighting_v1.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  GHIDRA_CACHE_KEY: t6-current-client-ghidra-12.1.3-77031817-v1
  CLIENT_SHA256: 770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -o /tmp/ghidra.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Restore analyzed current-client project
        id: ghidra-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-ghidra/projects
          key: ${{ env.GHIDRA_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Export exact retail model-lighting neighborhood
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/t6-model-lighting
          mkdir -p /tmp/t6-model-lighting /tmp/t6-ghidra/config /tmp/t6-ghidra/cache
          export XDG_CONFIG_HOME=/tmp/t6-ghidra/config
          export XDG_CACHE_HOME=/tmp/t6-ghidra/cache
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/t6-ghidra/projects t6-current-client \
            -process t6mp.exe -noanalysis -readOnly \
            -postScript ExportT6CurrentClientModelLighting.java /tmp/t6-model-lighting \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 4

      - name: Commit durable proof
        shell: bash
        run: |
          set -euo pipefail
          OUT=proof/current_client/model_lighting_runtime_v1
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp -a /tmp/t6-model-lighting/. "$OUT/"
          python3 - <<'PY'
          import csv,json,pathlib
          out=pathlib.Path('proof/current_client/model_lighting_runtime_v1')
          with (out/'functions.tsv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f,dialect='excel-tab'))
          summary={
              'format':'t6-current-client-model-lighting-runtime-v1',
              'client_sha256':'770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf',
              'ghidra_version':'12.1.3',
              'range':'0x00760000..0x00762000',
              'functions':len(rows),
              'decompile_completed':sum(r['decompile_completed']=='true' for r in rows),
              'proof_boundary':'Exact retail-client disassembly/reference evidence. Cross-build names in cross_build_hypotheses.tsv are hypotheses except the already accepted R_ToggleModelLightingFrame anchor.'
          }
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name uregraph-re-bot
          git config user.email uregraph-re-bot@users.noreply.github.com
          git add "$OUT"
          git commit -m "proof: add retail T6 model-lighting runtime evidence"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_MODEL_LIGHTING_V1
          path: /tmp/t6-model-lighting
          if-no-files-found: warn
          retention-days: 30
