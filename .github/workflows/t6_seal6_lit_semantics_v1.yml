name: T6 SEAL6 exact lit semantics v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/seal6-material-closure
    paths:
      - 'tools/t6_seal6_lit_semantics_v1.py'
      - 'tools/test_t6_seal6_lit_semantics_v1.py'
      - '.github/workflows/t6_seal6_lit_semantics_v1.yml'

permissions:
  contents: read
  actions: read

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run semantic normalization regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 -m unittest -v tools/test_t6_seal6_lit_semantics_v1.py
          python3 -m py_compile tools/t6_seal6_lit_semantics_v1.py

      - name: Download exact validated SEAL6 shader IR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/input /tmp/proof
          curl -fL --retry 4 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/input/ir.zip \
            https://api.github.com/repos/lizardpeter/bo2-t6-assets/actions/artifacts/10038442629/zip
          echo '1cb9304d7b4471e215a5fe3d4b6ee211c074914e7512ed1b62878c3bcc153976  /tmp/input/ir.zip' | sha256sum -c -
          unzip -q /tmp/input/ir.zip -d /tmp/input/ir
          test -f /tmp/input/ir/T6_SEAL6_EXACT_LIT_SHADER_IR_V1.json
          test -f /tmp/input/ir/T6_SEAL6_LIT_SHADER_ABI_MANIFEST_V1.json
          test "$(find /tmp/input/ir/glsl -name '*.glsl' | wc -l)" -eq 5

      - name: Normalize exact character shader equations
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/t6_seal6_lit_semantics_v1.py \
            --ir-manifest /tmp/input/ir/T6_SEAL6_EXACT_LIT_SHADER_IR_V1.json \
            --abi-manifest /tmp/input/ir/T6_SEAL6_LIT_SHADER_ABI_MANIFEST_V1.json \
            --glsl-dir /tmp/input/ir/glsl \
            --out /tmp/proof/T6_RETAIL_SEAL6_LIT_SEMANTICS_V1.json \
            > /tmp/proof/semantics.log
          python3 - <<'PY'
          import json
          p='/tmp/proof/T6_RETAIL_SEAL6_LIT_SEMANTICS_V1.json'
          d=json.load(open(p))
          assert d['format']=='t6-retail-seal6-lit-semantics-v1'
          assert d['summary']['families']==3
          assert d['summary']['uniqueVertexPrograms']==2
          assert d['summary']['uniquePixelPrograms']==3
          assert d['summary']['exactMaterialArgumentAbiClosed'] is True
          assert d['summary']['heroExecutablePairIndependentOfUnresolvedMaterialOwner'] is True
          assert d['summary']['completeRetailPixelOutputInBlender'] is False
          by_id={r['id']:r for r in d['families']}
          hero=by_id['seal6-char-skin-hero-lit-v1']
          std=by_id['seal6-char-skin-standard-lit-v1']
          eye=by_id['seal6-char-eye-cornea-lit-v1']
          assert 'Normal_Detail_Map' in hero['materialArguments']
          assert 'Normal_Detail_Map' not in std['materialArguments']
          assert 'SpecularAndGloss' not in eye['materialArguments']
          assert 'Reflection_Amount' not in eye['materialArguments']
          assert eye['alpha']['outAlpha']=='sqrt(gate)'
          assert 'Mask.r' in eye['alpha']['gate']
          assert 'Surface_Normal_Map perturbs highlight alpha only' in eye['rgb']['lightingNormal']
          forbidden=' '.join(d['backendPolicy']['forbiddenFallbacks']).lower()
          assert 'invent metallic' in forbidden and 'invent roughness' in forbidden
          # Guard a subtle character-only operation that must not regress to the older lprobe formula.
          assert d['sharedSkinSemantics']['diffuse']['encoded']=='Diffuse_Map.rgb * (vertexColor.rgb*vertexColor.rgb)'
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY
          cp /tmp/input/ir/T6_SEAL6_LIT_SHADER_ABI_MANIFEST_V1.json /tmp/proof/
          cp /tmp/input/ir/T6_SEAL6_EXACT_LIT_SHADER_IR_V1.json /tmp/proof/
          find /tmp/proof -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/proof/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_RETAIL_SEAL6_LIT_SEMANTICS_V1
          path: /tmp/proof
          if-no-files-found: error
