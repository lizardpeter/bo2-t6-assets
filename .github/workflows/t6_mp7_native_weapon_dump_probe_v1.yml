name: T6 MP7 native weapon dump probe v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/firstperson-weapons-closure
    paths:
      - .github/workflows/t6_mp7_native_weapon_dump_probe_v1.yml
      - tools/t6_oat_9dca_gcc_compat_patch_v3.py

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact pinned OAT Unlinker cache
        id: oat-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug

      - name: Build or verify pinned OAT Unlinker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof /tmp/game/zone/all /tmp/oat-unlinker-cache
          CACHE_BIN=/tmp/oat-unlinker-cache/Unlinker
          CACHE_META=/tmp/oat-unlinker-cache/source_identity.txt
          EXPECTED_COMMIT=9dca965366541504b71fa8cfb7ac049cb9b717e1
          PATCH_SHA=$(sha256sum tools/t6_oat_9dca_gcc_compat_patch_v3.py | awk '{print $1}')
          if test "${{ steps.oat-cache.outputs.cache-hit }}" = 'true'; then
            test -x "$CACHE_BIN"
            test -f "$CACHE_META"
            grep -qx "oat_commit=$EXPECTED_COMMIT" "$CACHE_META"
            grep -qx "compat_patch_sha256=$PATCH_SHA" "$CACHE_META"
            echo cache_hit=true | tee /tmp/proof/oat_cache.txt
          else
            echo cache_hit=false | tee /tmp/proof/oat_cache.txt
            sudo apt-get update -qq
            sudo apt-get install -y -qq g++-multilib >/dev/null
            git clone -q --recursive https://github.com/Laupetin/OpenAssetTools.git /tmp/oat
            git -C /tmp/oat checkout -q "$EXPECTED_COMMIT"
            test "$(git -C /tmp/oat rev-parse HEAD)" = "$EXPECTED_COMMIT"
            git -C /tmp/oat submodule update -q --init --recursive
            python3 tools/t6_oat_9dca_gcc_compat_patch_v3.py /tmp/oat
            git -C /tmp/oat diff --check
            cd /tmp/oat
            PREMAKE_NO_PROMPT=1 ./generate.sh
            make -C build -j2 config=debug_x86 UnlinkerCli 2>&1 | tee /tmp/proof/oat_build.log
            BIN=$(find build/bin -type f \( -name Unlinker -o -name unlinker \) | head -1)
            test -n "$BIN"
            install -m 0755 "$BIN" "$CACHE_BIN"
            printf 'oat_commit=%s\ncompat_patch_sha256=%s\n' "$EXPECTED_COMMIT" "$PATCH_SHA" > "$CACHE_META"
          fi
          printf 'oat_commit=%s\ncompat_patch_sha256=%s\n' "$EXPECTED_COMMIT" "$PATCH_SHA" > /tmp/proof/oat_source_identity.txt
          sha256sum "$CACHE_BIN" | tee /tmp/proof/unlinker_sha256.txt
          printf '%s\n' "$CACHE_BIN" > /tmp/unlinker_path

      - name: Save exact pinned OAT Unlinker cache
        if: steps.oat-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug

      - name: Download SHA-pinned common_mp FastFile
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 -o /tmp/game/zone/all/common_mp.ff https://r2.houseofkublai.com/bo2/zone/all/common_mp.ff
          echo '93fe48b0f0d8cc6844be875ccad94e0cfcf635f62eeff00ac33f2f668a77cb77  /tmp/game/zone/all/common_mp.ff' | sha256sum -c -
          sha256sum /tmp/game/zone/all/common_mp.ff | tee /tmp/proof/common_mp_ff_sha256.txt

      - name: Native OAT dump common_mp weapon assets
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(cat /tmp/unlinker_path)
          mkdir -p /tmp/oat_out /tmp/proof
          set +e
          "$BIN" --no-color --verbose --include-assets weapon --output-folder /tmp/oat_out /tmp/game/zone/all/common_mp.ff \
            2>&1 | tee /tmp/proof/common_mp_weapon_dump.log
          rc=${PIPESTATUS[0]}
          set -e
          printf 'native_weapon_dump_return_code=%s\n' "$rc" | tee /tmp/proof/native_weapon_dump_return_code.txt
          test "$rc" -eq 0

      - name: Inventory native output and locate exact MP7 representation
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/oat_out -type f -printf '%P\t%s\n' | LC_ALL=C sort | tee /tmp/proof/oat_output_files.tsv
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          root=Path('/tmp/oat_out')
          rows=[]
          mp7=[]
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              data=path.read_bytes()
              row={
                  'path':str(path.relative_to(root)),
                  'bytes':len(data),
                  'sha256':hashlib.sha256(data).hexdigest(),
              }
              rows.append(row)
              # Diagnostic only: identify physical OAT outputs containing the exact
              # literal asset identity. Do not infer a winner from path/order.
              if b'mp7_mp' in data:
                  positions=[]
                  pos=0
                  while True:
                      pos=data.find(b'mp7_mp',pos)
                      if pos<0: break
                      positions.append(pos); pos+=1
                  mp7.append({**row,'literalOffsets':positions})
          out={
              'format':'t6-mp7-native-weapon-dump-probe-v1',
              'sourceFastFile':{
                  'name':'common_mp.ff',
                  'sha256':'93fe48b0f0d8cc6844be875ccad94e0cfcf635f62eeff00ac33f2f668a77cb77',
              },
              'oat':{
                  'commit':'9dca965366541504b71fa8cfb7ac049cb9b717e1',
                  'includeAssets':'weapon',
              },
              'outputFileCount':len(rows),
              'mp7LiteralContainingFileCount':len(mp7),
              'mp7LiteralContainingFiles':mp7,
              'files':rows,
              'proofBoundary':'This is an output-format/identity probe only. A physical OAT file is considered an MP7 candidate only because its bytes contain the exact literal mp7_mp. No load-order, precedence, stat meaning or runtime winner is inferred here.'
          }
          Path('/tmp/proof/T6_MP7_NATIVE_WEAPON_DUMP_PROBE_V1.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'outputFileCount':len(rows),'mp7LiteralContainingFileCount':len(mp7),'mp7LiteralContainingFiles':mp7},indent=2,sort_keys=True))
          if not mp7:
              raise SystemExit('no native OAT output file contains exact literal mp7_mp')
          PY

      - name: Capture MP7 candidate text safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.load(open('/tmp/proof/T6_MP7_NATIVE_WEAPON_DUMP_PROBE_V1.json'))
          out=Path('/tmp/proof/mp7_candidates')
          out.mkdir(parents=True,exist_ok=True)
          root=Path('/tmp/oat_out')
          manifest=[]
          for i,row in enumerate(d['mp7LiteralContainingFiles']):
              src=root/row['path']
              data=src.read_bytes()
              # Keep exact bytes if textual; otherwise retain a bounded hex/context
              # diagnostic without pretending the binary format is authored text.
              try:
                  text=data.decode('utf-8')
              except UnicodeDecodeError:
                  text=None
              if text is not None:
                  dst=out/f'{i:02d}.txt'
                  dst.write_text(text)
                  kind='utf8-full-copy'
              else:
                  p=data.find(b'mp7_mp')
                  lo=max(0,p-512); hi=min(len(data),p+4096)
                  dst=out/f'{i:02d}.hex.txt'
                  dst.write_text(data[lo:hi].hex()+'\n')
                  kind='bounded-hex-context'
              manifest.append({'source':row['path'],'capture':str(dst.relative_to(Path('/tmp/proof'))),'captureKind':kind})
          Path('/tmp/proof/mp7_candidate_captures.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: T6_MP7_NATIVE_WEAPON_DUMP_PROBE_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
