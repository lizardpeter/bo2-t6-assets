name: T6 PDB current-client command-buffer layout bridge one-shot

on:
  push:
    paths:
      - '.github/workflows/t6_pdb_cmdbuf_layout_bridge_one_shot.yml'

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPO: lizardpeter/bo2-pc-server-decompile
      SOURCE_COMMIT: e68bc232869f6fe5bd5df68418277b64735301bf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact PDB-derived inventories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pdb proof/current_client
          base="https://api.github.com/repos/$SOURCE_REPO/contents/analysis/generated"
          for f in CoDMPServer_PC.members.csv.gz CoDMPServer_PC.procedures.csv.gz; do
            curl -fL --retry 4               -H 'Accept: application/vnd.github.raw'               -H 'X-GitHub-Api-Version: 2022-11-28'               "$base/$f?ref=$SOURCE_COMMIT" -o "/tmp/pdb/$f"
            gzip -t "/tmp/pdb/$f"
          done

      - name: Build layout bridge proof
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_pc_server_pdb_current_client_cmdbuf_layout_bridge_v1.py             --members /tmp/pdb/CoDMPServer_PC.members.csv.gz             --procedures /tmp/pdb/CoDMPServer_PC.procedures.csv.gz             --sampler-proof proof/current_client/T6_CURRENT_CLIENT_CODE_PIXEL_SAMPLER_ARRAY_SEMANTICS_V1.json             --source-repo "$SOURCE_REPO"             --source-commit "$SOURCE_COMMIT"             --out proof/current_client/T6_PC_SERVER_PDB_CURRENT_CLIENT_CMDBUF_LAYOUT_BRIDGE_V1.json
          git diff --check
          git config user.name uregraph-re-bot
          git config user.email uregraph-re-bot@users.noreply.github.com
          git add proof/current_client/T6_PC_SERVER_PDB_CURRENT_CLIENT_CMDBUF_LAYOUT_BRIDGE_V1.json
          if ! git diff --cached --quiet; then
            git commit -m "Bridge T6 PDB command-buffer layout to current client"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_PDB_CURRENT_CLIENT_CMDBUF_LAYOUT_BRIDGE_V1
          path: proof/current_client/T6_PC_SERVER_PDB_CURRENT_CLIENT_CMDBUF_LAYOUT_BRIDGE_V1.json
          if-no-files-found: error
