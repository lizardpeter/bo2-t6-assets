name: SMG RMGE01 exact DOL semantic lift v1

on:
  push:
    paths:
      - '.github/workflows/smg_rmge01_exact_lift_v1.yml'
  pull_request:
    paths:
      - 'smg/rmge01/trigger_exact_lift_v1.txt'

permissions:
  contents: write

jobs:
  lift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PowerPC disassembler
        run: python -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Fetch and verify exact RMGE01 main.dol
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            -A 'Mozilla/5.0' \
            -o /tmp/rmge01_main.dol \
            'https://r2.houseofkublai.com/super-mario-galaxy/DATA/sys/main.dol'
          echo '2c680585a8f58e1cc9c5521b579057f12b124ff0ef409e470a57606c50a93c09  /tmp/rmge01_main.dol' | sha256sum --check
      - name: Lift exact RMGE01 low-hanging functions
        run: |
          python tools/smg_rmge01_exact_lift_v1.py \
            --dol /tmp/rmge01_main.dol \
            --expected-dol-sha256 '2c680585a8f58e1cc9c5521b579057f12b124ff0ef409e470a57606c50a93c09' \
            --manifest smg/rmge01/decompile_batch_low_hanging_v1.jsonl \
            --out /tmp/rmge01_exact_low_hanging_v1.jsonl \
            --summary /tmp/rmge01_exact_low_hanging_v1_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SMG_RMGE01_EXACT_LIFT_V1
          path: |
            /tmp/rmge01_exact_low_hanging_v1.jsonl
            /tmp/rmge01_exact_low_hanging_v1_summary.json
          retention-days: 30
      - name: Commit derived executable evidence
        if: github.event_name == 'push'
        run: |
          mkdir -p smg/rmge01/derived
          cp /tmp/rmge01_exact_low_hanging_v1.jsonl smg/rmge01/derived/
          cp /tmp/rmge01_exact_low_hanging_v1_summary.json smg/rmge01/derived/
          git config user.name 'smg-re-bot'
          git config user.email 'smg-re-bot@users.noreply.github.com'
          git add smg/rmge01/derived/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'SMG: derive exact RMGE01 low-hanging semantic lifts'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
