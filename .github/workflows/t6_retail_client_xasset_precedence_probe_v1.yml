name: T6 retail client XAsset precedence discovery v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_retail_client_xasset_precedence_probe_v1.py'
      - '.github/workflows/t6_retail_client_xasset_precedence_probe_v1.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q capstone==5.0.6
      - name: Recover exact SHA-pinned retail t6mp.exe
        env:
          ZIP_URL: https://cdn.jordanlindsay.com.au/pluto_t6_full_game.zip
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof
          PYTHONPATH=tools python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          from t6_remote_zip_range_v1 import RemoteZip
          rz=RemoteZip(os.environ['ZIP_URL'],'bo2-t6-assets-xasset-client-proof/1')
          entries,_=rz.central_directory(); want='11c7542fc571379da5b3dbb8967372c2f8283e8457ae4a78070e16d51824d5d1'; winner=None
          for e in entries:
              if e['uncompressedSize']!=12850328: continue
              raw=rz.extract(e,verify_crc=True)
              if hashlib.sha256(raw).hexdigest()==want:
                  if winner is not None: raise SystemExit('multiple exact client matches')
                  winner=raw
          if winner is None: raise SystemExit('exact retail client not recovered')
          Path('/tmp/t6mp.exe').write_bytes(winner)
          PY
          echo '11c7542fc571379da5b3dbb8967372c2f8283e8457ae4a78070e16d51824d5d1  /tmp/t6mp.exe' | sha256sum -c -
          test "$(stat -c %s /tmp/t6mp.exe)" = 12850328
      - name: Inventory exact client precedence evidence
        run: |
          set -euo pipefail
          python3 tools/t6_retail_client_xasset_precedence_probe_v1.py /tmp/t6mp.exe --out /tmp/proof/T6_RETAIL_CLIENT_XASSET_PRECEDENCE_DISCOVERY_V1.json | tee /tmp/proof/probe.log
          python3 - <<'PY' | tee /tmp/proof/summary.txt
          import json
          p=json.load(open('/tmp/proof/T6_RETAIL_CLIENT_XASSET_PRECEDENCE_DISCOVERY_V1.json'))
          print('string executable references',len(p['stringExecutableReferences']))
          for r in p['immediateInventory']: print(r['valueHex'],r['executableHitCount'])
          PY
      - name: Refuse executable archival
        run: |
          set -euo pipefail
          test ! -e /tmp/proof/t6mp.exe
          ! find /tmp/proof -type f -size +8M | grep -q .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_RETAIL_CLIENT_XASSET_PRECEDENCE_DISCOVERY_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
