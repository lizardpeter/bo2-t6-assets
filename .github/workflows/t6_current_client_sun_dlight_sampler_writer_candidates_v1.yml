name: T6 current client sun dlight sampler writer candidates v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_sun_dlight_sampler_writer_candidates_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_UNRESOLVED_SAMPLER_STORAGE_XREFS_V1.json'
      - '.github/workflows/t6_current_client_sun_dlight_sampler_writer_candidates_v1.yml'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Project exact target sampler candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_sun_dlight_sampler_writer_candidates_v1.py             --source proof/current_client/T6_CURRENT_CLIENT_UNRESOLVED_SAMPLER_STORAGE_XREFS_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_SUN_DLIGHT_SAMPLER_WRITER_CANDIDATES_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_SUN_DLIGHT_SAMPLER_WRITER_CANDIDATES_V1.json'))
          s=d['summary']
          assert s['shadowmapSamplerSun']['destinationReferenceCount']>=1
          assert s['dlightAttenuationSampler']['sourceReferenceCount']>=1
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_SUN_DLIGHT_SAMPLER_WRITER_CANDIDATES_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist sun/dlight sampler writer candidates'
            ok=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then ok=1; break; fi
              sleep 2
            done
            test "$ok" = 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_SUN_DLIGHT_SAMPLER_WRITER_CANDIDATES_V1
          path: proof/current_client/T6_CURRENT_CLIENT_SUN_DLIGHT_SAMPLER_WRITER_CANDIDATES_V1.json
          if-no-files-found: error
