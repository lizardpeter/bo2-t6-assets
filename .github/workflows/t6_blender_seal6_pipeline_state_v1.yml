name: T6 Blender SEAL6 exact lit pipeline state v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/seal6-material-closure
    paths:
      - 'tools/t6_seal6_lit_pipeline_state_v1.py'
      - 'tools/test_t6_seal6_lit_pipeline_state_v1.py'
      - 'tools/t6_blender_seal6_pipeline_state_v1.py'
      - 'tools/test_t6_blender_seal6_pipeline_state_v1.py'
      - '.github/workflows/t6_blender_seal6_pipeline_state_v1.yml'

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact technique-indexed state closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/t6_seal6_lit_pipeline_state_v1.py \
            tools/t6_blender_seal6_pipeline_state_v1.py \
            tools/test_t6_blender_seal6_pipeline_state_v1.py
          PYTHONPATH=tools python3 -m unittest -v tools/test_t6_seal6_lit_pipeline_state_v1.py
          PYTHONPATH=tools python3 - <<'PY'
          from t6_shader_ir_v1 import TECHNIQUE_TYPES
          assert TECHNIQUE_TYPES.index('lit') == 4
          assert len(TECHNIQUE_TYPES) == 36
          print('T6 ordinary lit TechniqueType index = 4')
          PY

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender >/dev/null
          blender --version | head -3 | tee /tmp/blender_version.txt

      - name: Preserve exact T6 lit pipeline state in Blender metadata
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools blender --background \
            --python tools/test_t6_blender_seal6_pipeline_state_v1.py \
            2>&1 | tee /tmp/blender_seal6_pipeline_state_v1_test.log
          grep -F 'T6_BLENDER_SEAL6_PIPELINE_STATE_V1_TEST=' /tmp/blender_seal6_pipeline_state_v1_test.log
          test -s /tmp/T6_BLENDER_SEAL6_PIPELINE_STATE_V1_TEST.blend
          test -s /tmp/T6_BLENDER_SEAL6_PIPELINE_STATE_V1_TEST.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/T6_BLENDER_SEAL6_PIPELINE_STATE_V1_TEST.json',encoding='utf-8'))
          assert d['summary']=={
              'materialsCompiled':5,
              'exactD3DPipelineStatesPreserved':5,
              'litOpaqueMaterials':4,
              'litTransMaterials':1,
              'allBlenderPipelineMappingsExplicitlyAuthoringOnly':True,
              'completeRetailPixelOutput':False,
          }, d['summary']
          eye=[r for r in d['materials'] if r['cameraRegion']=='litTrans']
          assert len(eye)==1
          assert eye[0]['material']=='mc/mtl_gen_eye_cornea'
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_BLENDER_SEAL6_PIPELINE_STATE_V1_TEST
          path: |
            /tmp/T6_BLENDER_SEAL6_PIPELINE_STATE_V1_TEST.blend
            /tmp/T6_BLENDER_SEAL6_PIPELINE_STATE_V1_TEST.json
            /tmp/blender_seal6_pipeline_state_v1_test.log
            /tmp/blender_version.txt
          if-no-files-found: error
          compression-level: 0
