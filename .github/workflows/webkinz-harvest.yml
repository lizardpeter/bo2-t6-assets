name: Webkinz harvest

on:
  push:
    branches:
      - webkinz-harvest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe and fetch Webkinz endpoints
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/files out/meta

          fetch() {
            local name="$1"
            local url="$2"
            echo "$url" > "out/meta/$name.url"
            curl -L --fail-with-body --retry 2 --retry-all-errors               --connect-timeout 20 --max-time 180               -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'               -D "out/meta/$name.headers"               -o "out/files/$name"               "$url"               >"out/meta/$name.stdout" 2>"out/meta/$name.stderr" || true
            if [ -f "out/files/$name" ]; then
              wc -c "out/files/$name" > "out/meta/$name.size"
              file "out/files/$name" > "out/meta/$name.file"
              sha256sum "out/files/$name" > "out/meta/$name.sha256"
            fi
          }

          for h in play.webkinz.com downloads.webkinz.com www.webkinz.com assets.webkinz.com bluepload.unstable.life db-api.unstable.life ooooooooo.ooo; do
            {
              echo "### $h"
              getent ahosts "$h" || true
            } >> out/meta/dns.txt 2>&1
          done

          fetch wconf_js_php 'https://play.webkinz.com/wconf.js.php'
          fetch latest_yml 'https://downloads.webkinz.com/apps/latest.yml'
          fetch play_root 'https://play.webkinz.com/'
          fetch webkinz_swf 'https://www.webkinz.com/Webkinz.swf?v320_181'
          fetch main2_swf 'https://www.webkinz.com/SWF/main2.swf?v=v320_181'
          fetch translist_xml 'https://www.webkinz.com/XML/L10N/TransList.xml'
          fetch flashpoint_search 'https://ooooooooo.ooo/browse?search=Webkinz'
          fetch dbapi_search_q 'https://db-api.unstable.life/search?query=Webkinz'
          fetch dbapi_search_s 'https://db-api.unstable.life/search?search=Webkinz'

          curl -IL --connect-timeout 20 --max-time 120             -A 'Mozilla/5.0'             'https://bluepload.unstable.life/webkinzfiles.7z'             > out/meta/webkinzfiles_7z_head.txt 2>&1 || true

          python3 - <<'PY'
          from pathlib import Path
          import re, zlib, json

          root = Path("out/files")
          report = {}
          url_re = re.compile(rb'https?://[^\x00\s\x22\x27<>\\]+', re.I)
          path_re = re.compile(rb'(?:[A-Za-z0-9_.-]+/)+(?:[A-Za-z0-9_.%?=&+-]+\.(?:swf|xml|php|jpg|jpeg|png|gif|mp3|wav|flv|json|js))(?:\?[^\x00\s\x22\x27<>\\]*)?', re.I)

          def normalize(data):
              if len(data) >= 8 and data[:3] == b'CWS':
                  try:
                      return b'FWS' + data[3:8] + zlib.decompress(data[8:])
                  except Exception:
                      pass
              return data

          for p in root.iterdir():
              if not p.is_file():
                  continue
              raw = p.read_bytes()
              data = normalize(raw)
              urls = sorted(set(m.group(0).decode("latin1","ignore") for m in url_re.finditer(data)))
              paths = sorted(set(m.group(0).decode("latin1","ignore") for m in path_re.finditer(data)))
              report[p.name] = {
                  "raw_size": len(raw),
                  "normalized_size": len(data),
                  "urls": urls,
                  "paths": paths,
              }
              if data != raw:
                  (Path("out/files") / (p.name + ".uncompressed.swf")).write_bytes(data)

          Path("out/report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          Path("out/urls.txt").write_text("\n".join(sorted({u for v in report.values() for u in v["urls"]})) + "\n")
          Path("out/paths.txt").write_text("\n".join(sorted({u for v in report.values() for u in v["paths"]})) + "\n")
          PY

          {
            echo '# Webkinz harvest'
            echo
            find out/files -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            echo
            echo '## URLs'
            cat out/urls.txt 2>/dev/null || true
            echo
            echo '## Paths'
            cat out/paths.txt 2>/dev/null || true
            echo
            echo '## Dump HEAD'
            cat out/meta/webkinzfiles_7z_head.txt 2>/dev/null || true
          } > out/SUMMARY.md

      - name: Upload harvest
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-harvest
          path: out/
          if-no-files-found: error
          retention-days: 7
