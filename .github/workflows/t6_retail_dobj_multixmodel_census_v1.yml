name: T6 retail DObj multi-XModel census v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/firstperson-weapons-closure
    paths:
      - 'tools/t6_retail_dobj_multixmodel_census_v1.py'
      - 'tools/t6_retail_exe_wayback_probe_v1.py'
      - '.github/workflows/t6_retail_dobj_multixmodel_census_v1.yml'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install exact disassembly dependency
        run: python3 -m pip install --disable-pip-version-check -q capstone==5.0.6

      - name: Compile-check proof tools
        run: python3 -m py_compile tools/t6_retail_dobj_multixmodel_census_v1.py tools/t6_retail_exe_wayback_probe_v1.py

      - name: Probe archived content-addressed objects for exact retail t6mp.exe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof
          python3 tools/t6_retail_exe_wayback_probe_v1.py \
            --out /tmp/proof/T6_RETAIL_EXE_WAYBACK_PROBE_V1.json \
            --exe-out /tmp/t6mp.exe \
            | tee /tmp/proof/wayback_probe.log

          test -f /tmp/t6mp.exe || {
            echo 'Wayback probe did not recover an exact identity match' >&2
            exit 1
          }
          echo '44eba16d0d9c66f40637611137affbe6b0364f20  /tmp/t6mp.exe' | sha1sum -c -
          echo '11c7542fc571379da5b3dbb8967372c2f8283e8457ae4a78070e16d51824d5d1  /tmp/t6mp.exe' | sha256sum -c -
          test "$(stat -c '%s' /tmp/t6mp.exe)" = 12850328

      - name: Census exact retail DObj consumers and helper xrefs
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/t6_retail_dobj_multixmodel_census_v1.py \
            /tmp/t6mp.exe \
            --out /tmp/proof/T6_RETAIL_DOBJ_MULTIXMODEL_CENSUS_V1.json \
            --disasm-out /tmp/proof/dobj_consumer_windows.txt \
            | tee /tmp/proof/census.log
          sha256sum /tmp/proof/T6_RETAIL_DOBJ_MULTIXMODEL_CENSUS_V1.json /tmp/proof/dobj_consumer_windows.txt \
            | tee /tmp/proof/proof_sha256.txt

      - name: Refuse executable bytes in artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/t6mp.exe
          test ! -e /tmp/proof/t6mp.exe
          if find /tmp/proof -type f -size +8M | grep -q .; then
            echo 'unexpected large proof file; refusing artifact' >&2
            find /tmp/proof -type f -size +8M -ls >&2
            exit 1
          fi

      - name: Upload exact-retail DObj census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_RETAIL_DOBJ_MULTIXMODEL_CENSUS_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
