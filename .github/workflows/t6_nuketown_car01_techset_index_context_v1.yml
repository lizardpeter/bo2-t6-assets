name: T6 Nuketown car01 TechniqueSet index context v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t6_nuketown_car01_techset_index_context_v1.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Expand exact retail Nuketown
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 -o /tmp/map.ff https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          gcc -O2 tools/t6_fastfile_expand_pc_v1.c -o /tmp/expand -lz -lcrypto
          /tmp/expand /tmp/map.ff /tmp/map.expanded mp_nuketown_2020
          echo '7e791fb90a085f3bff9e0df895e5a232fa91cc43bcd0027225fe811f7891d505  /tmp/map.expanded' | sha256sum -c -
      - name: Test exact q5 start candidates
        shell: bash
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import struct
          from pathlib import Path
          import t6_retail_world_formats_45_proof_v1 as h
          from t6_material_techset_top_level_walk_v1 import Cursor
          from t6_xmodel_serialized_walker import XModelWalker
          d=Path('/tmp/map.expanded').read_bytes();blocks,assets=h.front(d)
          q3=Cursor(d,125632,blocks).techset();assert q3['end']==499456
          w4=XModelWalker(d,499456).walk_xmodel();assert not w4['blockers'];end=int(w4['assetSerializedEnd']);print('Q4_END',end,'MOD4',end%4,'MOD8',end%8)
          print('AROUND_Q4_END',[(p,d[p:p+16].hex(),f'0x{struct.unpack_from("<I",d,p)[0]:08X}') for p in range(end-4,end+17)])
          for p in range(end,end+17):
            try:
              c=Cursor(d,p,blocks);t=c.techset();print('Q5_CANDIDATE_OK',p,'END',t['end'],'NAME',t['name'],'FMT',t['worldVertFormat'])
            except Exception as e:print('Q5_CANDIDATE_FAIL',p,repr(e))
          # raw structural scan locally around the gap: fixed 152 with fmt/pad and valid 36 pointers.
          cand=[]
          for p in range(end,end+70000):
            if p+152>len(d):break
            if d[p+4]>8 or d[p+5:p+8]!=b'\0\0\0':continue
            vals=struct.unpack_from('<37I',d,p)
            try:
              h.dec(vals[0],blocks)
              for x in vals[1:]:h.dec(x,blocks)
            except Exception:continue
            cand.append((p,f'0x{vals[0]:08X}',d[p+4],sum(x in (0xffffffff,0xfffffffe) for x in vals[1:])))
            if len(cand)>=20:break
          print('STRUCTURAL_NEAR_Q5',cand)
          PY
