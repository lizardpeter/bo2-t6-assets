name: T6 current client inline brush model focused probe v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_inline_brush_model_focused_probe_v1.py'
      - '.github/workflows/t6_current_client_inline_brush_model_focused_probe_v1.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check -q capstone==5.0.6
      - name: Recover SHA-classified current client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/client proof/current_client
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          eps=['https://cdn.plutoniummod.com/updater/prod/info.json','https://cdn.plutonium.pw/updater/prod/info.json']
          def get(u):
              req=urllib.request.Request(u,headers={'User-Agent':'bo2-t6-assets-inline-brush-probe/1'})
              with urllib.request.urlopen(req,timeout=180) as r:return r.read()
          info=None
          for ep in eps:
              try:info=json.loads(get(ep));break
              except Exception:pass
          if info is None:raise SystemExit('no CDN info')
          rows=[x for x in info['files'] if x.get('name','').replace('\\','/').lower()=='games/t6mp.exe']
          if len(rows)!=1:raise SystemExit(f'expected one t6mp.exe row, got {len(rows)}')
          rec=rows[0];raw=get(info['baseUrl']+rec['hash']);sha=hashlib.sha256(raw).hexdigest()
          if str(info.get('revision'))!='5346' or sha!='770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf':
              raise SystemExit(f'classified client changed revision={info.get("revision")} sha={sha}')
          Path('/tmp/client/t6mp.exe').write_bytes(raw);Path('/tmp/client/revision').write_text(str(info['revision']))
          PY
      - name: Persist focused exact disassembly
        env:
          PYTHONPATH: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_inline_brush_model_focused_probe_v1.py             /tmp/client/t6mp.exe --revision "$(cat /tmp/client/revision)"             --out proof/current_client/T6_CURRENT_CLIENT_INLINE_BRUSH_MODEL_FOCUSED_PROBE_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_INLINE_BRUSH_MODEL_FOCUSED_PROBE_V1.json'))
          assert d['client']['sha256']=='770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf'
          assert [x['label'] for x in d['ranges']]==['candidateA','candidateB','suffixParser']
          print({x['label']:len(x['instructions']) for x in d['ranges']})
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_INLINE_BRUSH_MODEL_FOCUSED_PROBE_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist focused current-client inline model probe'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          rm -f /tmp/client/t6mp.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_INLINE_BRUSH_MODEL_FOCUSED_PROBE_V1
          path: proof/current_client/T6_CURRENT_CLIENT_INLINE_BRUSH_MODEL_FOCUSED_PROBE_V1.json
          if-no-files-found: error
          compression-level: 9
