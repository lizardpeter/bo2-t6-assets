name: T6 current client zone sink fieldflow compact v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_zone_sink_fieldflow_compact_v1.py'
      - '.github/workflows/t6_current_client_zone_sink_fieldflow_compact_v1.yml'
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and compact persisted exact proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/t6_current_client_zone_sink_fieldflow_compact_v1.py
          python3 tools/t6_current_client_zone_sink_fieldflow_compact_v1.py --source proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_FIELDFLOW_PROBE_V1.json --out proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_FIELDFLOW_COMPACT_V1.json | tee /tmp/summary.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_FIELDFLOW_COMPACT_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist compact current-client zone sink field flow'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_ZONE_SINK_FIELDFLOW_COMPACT_V1
          path: |
            proof/current_client/T6_CURRENT_CLIENT_ZONE_SINK_FIELDFLOW_COMPACT_V1.json
            /tmp/summary.log
          if-no-files-found: error
