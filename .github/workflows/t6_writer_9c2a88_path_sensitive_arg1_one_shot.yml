name: T6 9C2A88 path-sensitive arg1 one-shot

on:
  push:
    paths:
      - '.github/workflows/t6_writer_9c2a88_path_sensitive_arg1_one_shot.yml'

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check -q capstone==5.0.6
      - name: Recover exact current client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/client proof/current_client
          python3 tools/t6_current_client_fetch_exact_v1.py --out-exe /tmp/client/t6mp.exe --out-identity /tmp/client/identity.json
      - name: Prove path-sensitive arg1
        shell: bash
        run: |
          set -euo pipefail
          rev=$(python3 -c "import json;print(json.load(open('/tmp/client/identity.json'))['observedCdnRevision'])")
          python3 tools/t6_current_client_writer_9c2a88_path_sensitive_arg1_v3.py             /tmp/client/t6mp.exe --revision "$rev"             --out proof/current_client/T6_CURRENT_CLIENT_WRITER_9C2A88_PATH_SENSITIVE_ARG1_V3.json
          python3 - <<'PY'
          import json
          p='proof/current_client/T6_CURRENT_CLIENT_WRITER_9C2A88_PATH_SENSITIVE_ARG1_V3.json'
          d=json.load(open(p))
          assert d['summary']['observedBranchFramePointerPreserved'] is True
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name uregraph-re-bot
          git config user.email uregraph-re-bot@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_WRITER_9C2A88_PATH_SENSITIVE_ARG1_V3.json
          if ! git diff --cached --quiet; then
            git commit -m "Prove T6 9C2A88 path-sensitive arg1"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          rm -f /tmp/client/t6mp.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_WRITER_9C2A88_PATH_SENSITIVE_ARG1_V3
          path: proof/current_client/T6_CURRENT_CLIENT_WRITER_9C2A88_PATH_SENSITIVE_ARG1_V3.json
          if-no-files-found: error
