name: T6 current-client Ghidra low-hanging v2

on:
  push:
    paths:
      - '.github/workflows/t6_current_client_ghidra_low_hanging_v2.yml'

permissions:
  contents: write

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  CLIENT_SHA256: 770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf
  GHIDRA_CACHE_KEY: t6-current-client-ghidra-12.1.3-77031817-v1

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors             -o /tmp/ghidra.zip             https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Restore analyzed current-client project
        id: ghidra-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-ghidra/projects
          key: ${{ env.GHIDRA_CACHE_KEY }}

      - name: Recover exact client and import only if cache is absent
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/client /tmp/t6-ghidra/projects /tmp/t6-ghidra/config /tmp/t6-ghidra/cache
          python3 tools/t6_current_client_fetch_exact_v1.py             --out-exe /tmp/client/t6mp.exe             --out-identity /tmp/client/identity.json
          echo "$CLIENT_SHA256  /tmp/client/t6mp.exe" | sha256sum --check
          export XDG_CONFIG_HOME=/tmp/t6-ghidra/config
          export XDG_CACHE_HOME=/tmp/t6-ghidra/cache
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless"             /tmp/t6-ghidra/projects t6-current-client             -import /tmp/client/t6mp.exe -overwrite             -preScript ConfigureT6CurrentClientAnalysis.java             -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts"             -analysisTimeoutPerFile 2400 -max-cpu 4

      - name: Save project cache on miss
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/t6-ghidra/projects
          key: ${{ env.GHIDRA_CACHE_KEY }}

      - name: Select next non-overlapping tranche
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-evidence-v2/batch
          python3 tools/select_t6_current_client_low_hanging_v1.py             proof/current_client/ghidra_low_hanging_v1/catalog.tsv             --exclude proof/current_client/ghidra_low_hanging_v1/low_hanging.tsv             --out /tmp/t6-evidence-v2/selection.tsv             --limit 5000

      - name: Decompile selected exact functions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-ghidra/config /tmp/t6-ghidra/cache
          export XDG_CONFIG_HOME=/tmp/t6-ghidra/config
          export XDG_CACHE_HOME=/tmp/t6-ghidra/cache
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless"             /tmp/t6-ghidra/projects t6-current-client             -process t6mp.exe -noanalysis -readOnly             -postScript ExportT6CurrentClientBatch.java               /tmp/t6-evidence-v2/selection.tsv /tmp/t6-evidence-v2/batch             -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 4

      - name: Summarize and package durable v2 evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=proof/current_client/ghidra_low_hanging_v2
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python3 - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('/tmp/t6-evidence-v2')
          with (root/'selection.tsv').open(encoding='utf-8',newline='') as f:
              sel=list(csv.DictReader(f,dialect='excel-tab'))
          with (root/'batch/results.tsv').open(encoding='utf-8',newline='') as f:
              res=list(csv.DictReader(f,dialect='excel-tab'))
          tiers={}
          for r in sel: tiers[r['tier']]=tiers.get(r['tier'],0)+1
          summary={
            'format':'t6-current-client-ghidra-low-hanging-v2',
            'client_sha256':'770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf',
            'ghidra_version':'12.1.3',
            'excluded_v1_functions':3000,
            'selected_functions':len(sel),
            'tier_counts':tiers,
            'exact_functions_found':sum(r['found_exact']=='true' for r in res),
            'decompile_completed':sum(r['decompile_completed']=='true' for r in res),
            'decompile_failed_or_timed_out':sum(r['decompile_completed']!='true' for r in res),
            'proof_boundary':'Generated/unreviewed Ghidra evidence only; selection excludes every v1 function.',
          }
          out=pathlib.Path('proof/current_client/ghidra_low_hanging_v2')
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          (out/'selection.tsv').write_text((root/'selection.tsv').read_text())
          (out/'results.tsv').write_text((root/'batch/results.tsv').read_text())
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          tar -C /tmp/t6-evidence-v2 -cf - batch | zstd -19 -T0 -o /tmp/t6-ghidra-low-hanging-v2.tar.zst
          sha256sum /tmp/t6-ghidra-low-hanging-v2.tar.zst | tee "$OUT/bundle.sha256"
          split -b 80M -d -a 3 /tmp/t6-ghidra-low-hanging-v2.tar.zst "$OUT/bundle.tar.zst.part-"
          git diff --check
          git config user.name uregraph-re-bot
          git config user.email uregraph-re-bot@users.noreply.github.com
          git add "$OUT"
          git commit -m "Add T6 current-client Ghidra low-hanging evidence v2"
          git pull --rebase origin main
          git push origin HEAD:main
