name: T6 UREGraph inventory rechunk v2
on: push
permissions:
  contents: write
jobs:
  rechunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          mkdir -p proof/current_client/whole_image_inventory_v1_transport/cypher
          python3 tools/rechunk_uregraph_cypher_v1.py proof/current_client/whole_image_inventory_v1/cypher proof/current_client/whole_image_inventory_v1_transport/cypher --functions 1000 --strings 1000 --calls 750 --default 500
          git config user.name uregraph-re-bot
          git config user.email uregraph-re-bot@users.noreply.github.com
          git add proof/current_client/whole_image_inventory_v1_transport
          git commit -m "Rechunk T6 UREGraph inventory v2" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
