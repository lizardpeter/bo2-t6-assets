name: T6 Nuketown multiply-decal VS symbolic v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_nuketown_special_multiply_decal_vs_symbolic_v1.py'
      - 'tools/t6_nuketown_special_multiply_decal_vs_bindings_v1.py'
      - 'tools/t6_nuketown_special_multiply_decal_vs_bindings_v2.py'
      - 'tools/t6_nuketown_special_full_output_symbolic_v1.py'
      - 'tools/t6_retail_special_shdr_symbolic_v1.py'
      - 'tools/t6_retail_special_shdr_operand_census_v1.py'
      - 'tools/t6_retail_special_vs_operand_adapter_v1.py'
      - 'tools/t6_retail_special_shdr_opcode_census_v1.py'
      - 'tools/t6_oat_material_shader_census_pc_server_v1.py'
      - 'tools/t6_nuketown_special_material_census_v1.py'
      - 'tools/t6_oat_9dca_gcc_compat_patch_v3.py'
      - 'manifests/engine/T6_PC_SERVER_XASSET_OVERRIDE_PROOF_V2.json'
      - 'manifests/render/T6_RETAIL_SPECIAL_MATERIAL_FAMILY_CENSUS_V1.json'
      - '.github/workflows/t6_nuketown_special_multiply_decal_vs_symbolic_v1.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Compile proof tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/t6_nuketown_special_multiply_decal_vs_symbolic_v1.py \
            tools/t6_nuketown_special_multiply_decal_vs_bindings_v1.py \
            tools/t6_nuketown_special_multiply_decal_vs_bindings_v2.py \
            tools/t6_nuketown_special_full_output_symbolic_v1.py \
            tools/t6_retail_special_shdr_symbolic_v1.py \
            tools/t6_retail_special_vs_operand_adapter_v1.py

      - name: Restore exact pinned OAT Unlinker cache
        id: oat-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/oat-unlinker-cache
          key: oat-unlinker-t6-9dca965366541504b71fa8cfb7ac049cb9b717e1-compat-v3-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py') }}-ubuntu24-x86-debug

      - name: Require exact pinned OAT Unlinker cache
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.oat-cache.outputs.cache-hit }}" = 'true'
          CACHE_BIN=/tmp/oat-unlinker-cache/Unlinker
          CACHE_META=/tmp/oat-unlinker-cache/source_identity.txt
          PATCH_SHA=$(sha256sum tools/t6_oat_9dca_gcc_compat_patch_v3.py | awk '{print $1}')
          test -x "$CACHE_BIN"
          grep -qx 'oat_commit=9dca965366541504b71fa8cfb7ac049cb9b717e1' "$CACHE_META"
          grep -qx "compat_patch_sha256=$PATCH_SHA" "$CACHE_META"
          mkdir -p /tmp/proof /tmp/game/zone/all
          printf '%s\n' "$CACHE_BIN" > /tmp/unlinker_path
          sha256sum "$CACHE_BIN" > /tmp/proof/unlinker_sha256.txt

      - name: Download exact five-root MP dependency universe
        shell: bash
        run: |
          set -euo pipefail
          for f in mp_nuketown_2020.ff common_mp.ff common_patch_mp.ff patch_mp.ff code_post_gfx_mp.ff; do
            curl -fL --retry 4 -o "/tmp/game/zone/all/$f" "https://r2.houseofkublai.com/bo2/zone/all/$f"
          done
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/game/zone/all/mp_nuketown_2020.ff' | sha256sum -c -
          echo '93fe48b0f0d8cc6844be875ccad94e0cfcf635f62eeff00ac33f2f668a77cb77  /tmp/game/zone/all/common_mp.ff' | sha256sum -c -
          echo '95622d93d4fb761db311a123cd073bed34ea48c9c711d2c11bce4170dd08bae9  /tmp/game/zone/all/common_patch_mp.ff' | sha256sum -c -
          echo '459077cda8e4a1457f7ee7d8f6c5e0abf30f41767a21ff6744df6a4307cbce1e  /tmp/game/zone/all/patch_mp.ff' | sha256sum -c -
          echo 'b7bce1dbe94692b1668ae9a1c83a4dcf008979ee5d5f79b3d2e619c23a1002b3  /tmp/game/zone/all/code_post_gfx_mp.ff' | sha256sum -c -

      - name: Dump exact Materials and TechniqueSet roots
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(cat /tmp/unlinker_path)
          mkdir -p /tmp/map_out /tmp/common_out /tmp/common_patch_out /tmp/patch_out /tmp/code_post_out
          "$BIN" --no-color --include-assets material --output-folder /tmp/map_out /tmp/game/zone/all/mp_nuketown_2020.ff > /tmp/proof/map_material.log 2>&1
          "$BIN" --no-color --include-assets techniqueset --output-folder /tmp/map_out /tmp/game/zone/all/mp_nuketown_2020.ff > /tmp/proof/map_techset.log 2>&1
          "$BIN" --no-color --include-assets techniqueset --output-folder /tmp/common_out /tmp/game/zone/all/common_mp.ff > /tmp/proof/common_techset.log 2>&1
          "$BIN" --no-color --include-assets techniqueset --output-folder /tmp/common_patch_out /tmp/game/zone/all/common_patch_mp.ff > /tmp/proof/common_patch_techset.log 2>&1
          "$BIN" --no-color --include-assets techniqueset --output-folder /tmp/patch_out /tmp/game/zone/all/patch_mp.ff > /tmp/proof/patch_techset.log 2>&1
          "$BIN" --no-color --include-assets techniqueset --output-folder /tmp/code_post_out /tmp/game/zone/all/code_post_gfx_mp.ff > /tmp/proof/code_post_techset.log 2>&1

      - name: Rebuild exact PC-server Material shader census
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/t6_oat_material_shader_census_pc_server_v1.py \
            --material-root /tmp/map_out \
            --shader-root /tmp/map_out \
            --shader-root /tmp/common_out \
            --shader-root /tmp/common_patch_out \
            --shader-root /tmp/patch_out \
            --shader-root /tmp/code_post_out \
            --server-proof manifests/engine/T6_PC_SERVER_XASSET_OVERRIDE_PROOF_V2.json \
            --root-zone /tmp/map_out=ordinaryBuiltInMpMap \
            --root-zone /tmp/common_out=common_mp \
            --root-zone /tmp/code_post_out=code_post_gfx_mp \
            --root-zone /tmp/patch_out=patch_mp \
            --out /tmp/proof/T6_NUKETOWN_PC_SERVER_MATERIAL_SHADER_CENSUS_V1.json

          PYTHONPATH=tools python3 tools/t6_nuketown_special_material_census_v1.py \
            --census /tmp/proof/T6_NUKETOWN_PC_SERVER_MATERIAL_SHADER_CENSUS_V1.json \
            --family-manifest manifests/render/T6_RETAIL_SPECIAL_MATERIAL_FAMILY_CENSUS_V1.json \
            --out /tmp/proof/T6_NUKETOWN_SPECIAL_MATERIAL_CENSUS_V1.json

      - name: Prove exact multiply-decal VS and pixel v2.z producer
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/t6_nuketown_special_multiply_decal_vs_symbolic_v1.py \
            --special-census /tmp/proof/T6_NUKETOWN_SPECIAL_MATERIAL_CENSUS_V1.json \
            --operand-tool tools/t6_retail_special_vs_operand_adapter_v1.py \
            --out /tmp/proof/T6_NUKETOWN_SPECIAL_MULTIPLY_DECAL_VS_SYMBOLIC_V1.json \
            | tee /tmp/proof/multiply_decal_vs_symbolic.log

          python3 - <<'PY'
          import json
          p='/tmp/proof/T6_NUKETOWN_SPECIAL_MULTIPLY_DECAL_VS_SYMBOLIC_V1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['format']=='t6-nuketown-special-multiply-decal-vs-symbolic-v1'
          assert d['vertexShader']['sha256']=='c3bd9eb7d12a444c63867be2e466ac00c495a5a7f64a8b2c9f73e2558a5e12e0'
          assert d['pixelShader']['sha256']=='e9820077a4df69228fd1626997270d7b31337f82eab6c26c1a14a33257424a0b'
          q=d['pixelV2ZProducer']
          assert q['pixelInputRegister']==2
          assert q['vertexOutput'].endswith('.z')
          print('GREEN EXACT MULTIPLY-DECAL VS PRODUCER')
          print(json.dumps(q,indent=2,sort_keys=True))
          PY

      - name: Recover exact multiply-decal VS constant bindings
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 tools/t6_nuketown_special_multiply_decal_vs_bindings_v2.py \
            --special-census /tmp/proof/T6_NUKETOWN_SPECIAL_MATERIAL_CENSUS_V1.json \
            --out /tmp/proof/T6_NUKETOWN_SPECIAL_MULTIPLY_DECAL_VS_BINDINGS_V2.json \
            | tee /tmp/proof/multiply_decal_vs_bindings.log

      - name: Upload exact VS proof
        uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_SPECIAL_MULTIPLY_DECAL_VS_SYMBOLIC_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 0
