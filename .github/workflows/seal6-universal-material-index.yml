name: SEAL6 universal Material index

on:
  push:
    branches:
      - reversal/nonmap-assets
    paths:
      - ".github/workflows/seal6-universal-material-index.yml"
      - "tools/t6_asset_types_v1.py"
      - "tools/t6_retail_asset_index_v1.py"
      - "tools/t6_material_techset_top_level_walk_v1.py"
      - "tools/t6_exact_material_graph_to_index_v1.py"
      - "tools/t6_seal6_material_technique_binding_proof_v1.py"
      - "tools/t6_seal6_material_technique_binding_proof_v2.py"
      - "tools/bo2_t6_fastfile.py"
      - "manifests/nonmap/retail/seal6_smg_material_handle_alias_proof_v1.json"
      - "manifests/nonmap/retail/faction_seals_mp_seal6_smg_full_player_v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile universal Material index path
        run: |
          python -m py_compile \
            tools/t6_asset_types_v1.py \
            tools/t6_retail_asset_index_v1.py \
            tools/t6_material_techset_top_level_walk_v1.py \
            tools/t6_exact_material_graph_to_index_v1.py

      - name: Fetch and expand exact retail faction FastFile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/seal6_universal
          curl --fail --location --silent --show-error \
            --retry 6 --retry-delay 2 --retry-all-errors --connect-timeout 30 \
            'https://r2.houseofkublai.com/bo2/zone/all/faction_seals_mp.ff' \
            -o /tmp/seal6_universal/faction_seals_mp.ff
          python tools/bo2_t6_fastfile.py decrypt \
            /tmp/seal6_universal/faction_seals_mp.ff \
            --output /tmp/seal6_universal/faction_seals_mp.ff.expanded

      - name: Diagnose 104 vs 112 byte Material layouts from exact names
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, struct
          from pathlib import Path

          data = Path('/tmp/seal6_universal/faction_seals_mp.ff.expanded').read_bytes()
          proof = json.load(open('manifests/nonmap/retail/seal6_smg_material_handle_alias_proof_v1.json', encoding='utf-8'))
          names = []
          for x in proof.get('surfaceMaterialSequence', []):
              n = x[1:] if x.startswith(',') else x
              if n not in names:
                  names.append(n)
          full = json.load(open('manifests/nonmap/retail/faction_seals_mp_seal6_smg_full_player_v1.json', encoding='utf-8'))
          for x in (full.get('bodyMaterials') or {}).get('directInline', []):
              n = str(x.get('name') or '')
              n = n[1:] if n.startswith(',') else n
              if n and n not in names:
                  names.append(n)

          def ptrs(start, off):
              if start < 0 or start + off + 20 > len(data): return None
              return [f'0x{x:08X}' for x in struct.unpack_from('<5I', data, start + off)]

          rows=[]
          for name in names:
              variants=[name]
              if not name.startswith(','): variants.append(','+name)
              hits=[]
              for variant in variants:
                  needle=variant.encode('ascii')+b'\0'
                  pos=0
                  while True:
                      at=data.find(needle,pos)
                      if at<0: break
                      for fixed in (104,112):
                          st=at-fixed
                          if st>=0:
                              hits.append({
                                  'serializedName':variant,
                                  'nameOffset':at,
                                  'fixedBytes':fixed,
                                  'candidateStart':st,
                                  'namePtr':f'0x{struct.unpack_from("<I",data,st)[0]:08X}',
                                  'counts76':list(data[st+76:st+82]),
                                  'counts84':list(data[st+84:st+90]),
                                  'ptrs84':ptrs(st,84),
                                  'ptrs92':ptrs(st,92),
                                  'headHex':data[st:st+112].hex(),
                              })
                      pos=at+1
              rows.append({'material':name,'candidates':hits})
          print(json.dumps(rows,indent=2))
          PY

      - name: Rebuild independent exact Material to TechniqueSet proof
        shell: bash
        run: |
          set -euo pipefail
          python tools/t6_seal6_material_technique_binding_proof_v2.py \
            /tmp/seal6_universal/faction_seals_mp.ff.expanded \
            manifests/nonmap/retail/seal6_smg_material_handle_alias_proof_v1.json \
            manifests/nonmap/retail/faction_seals_mp_seal6_smg_full_player_v1.json \
            --out /tmp/seal6_universal/bindings.json

      - name: Replay exact definitions into persistent universal index
        shell: bash
        run: |
          set -euo pipefail
          python tools/t6_exact_material_graph_to_index_v1.py \
            /tmp/seal6_universal/faction_seals_mp.ff.expanded \
            /tmp/seal6_universal/bindings.json \
            --zone faction_seals_mp \
            --out-index /tmp/seal6_universal/index.json \
            --out-proof /tmp/seal6_universal/index_proof.json

      - name: Assert 13 Material definitions resolve from the cache
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python - <<'PY'
          import json
          from pathlib import Path
          from t6_retail_asset_index_v1 import RetailAssetIndex

          p = json.load(open('/tmp/seal6_universal/index_proof.json', encoding='utf-8'))
          assert p['format'] == 't6-exact-material-graph-index-proof-v1'
          assert p['materialDefinitions'] == 13
          assert p['uniqueMaterialDefinitions'] == 13
          assert p['techniqueSetDefinitions'] >= 1
          assert p['allMaterialDefinitionsReplayed'] is True
          assert p['allTechniqueSetDefinitionsReplayed'] is True
          assert p['definitionStartsDerivedFromBindingProofNotHandleOwners'] is True

          idx = RetailAssetIndex.load(Path('/tmp/seal6_universal/index.json'))
          assert idx.as_dict()['summary']['zoneCount'] == 1
          for name in p['resolvedMaterials']:
              d = idx.resolve('material', name, ['faction_seals_mp'])
              assert d.zone == 'faction_seals_mp'
              assert d.serialized_bytes > 112
              assert len(d.sha256) == 64
          assert len(p['resolvedMaterials']) == 13
          print(json.dumps({
              'materials': len(p['resolvedMaterials']),
              'techniqueSets': p['techniqueSetDefinitions'],
              'indexSummary': idx.as_dict()['summary'],
          }, indent=2, sort_keys=True))
          PY

      - name: Verify cached zone fingerprint
        run: |
          python tools/t6_retail_asset_index_v1.py verify \
            /tmp/seal6_universal/index.json \
            --expanded faction_seals_mp=/tmp/seal6_universal/faction_seals_mp.ff.expanded

      - name: Upload universal cache proof
        uses: actions/upload-artifact@v4
        with:
          name: SEAL6_UNIVERSAL_MATERIAL_INDEX
          path: |
            /tmp/seal6_universal/index.json
            /tmp/seal6_universal/index_proof.json
            /tmp/seal6_universal/bindings.json
          if-no-files-found: error
          retention-days: 14
