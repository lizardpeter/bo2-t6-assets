name: SEAL6 universal Material index

on:
  push:
    branches:
      - reversal/nonmap-assets
    paths:
      - ".github/workflows/seal6-universal-material-index.yml"
      - "tools/t6_asset_types_v1.py"
      - "tools/t6_retail_asset_index_v1.py"
      - "tools/t6_material_techset_top_level_walk_v1.py"
      - "tools/t6_material_dependency_graph_v1.py"
      - "tools/t6_material_dependency_graph_to_index_v1.py"
      - "tools/t6_material_source_order_proof_v1.py"
      - "tools/t6_material_source_order_proof_to_index_v1.py"
      - "tools/t6_material_techset_resolve_v1.py"
      - "tools/bo2_t6_fastfile.py"
      - "manifests/nonmap/retail/seal6_smg_material_handle_alias_proof_v1.json"
      - "manifests/nonmap/retail/faction_seals_mp_seal6_smg_full_player_v1.json"
      - "manifests/nonmap/retail/seal6_common_packed_image_name_proof_v1.json"
      - "manifests/nonmap/retail/seal6_common_import_material_source_order_spec_v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile universal dependency path
        run: |
          python -m py_compile \
            tools/t6_asset_types_v1.py \
            tools/t6_retail_asset_index_v1.py \
            tools/t6_material_techset_top_level_walk_v1.py \
            tools/t6_material_dependency_graph_v1.py \
            tools/t6_material_dependency_graph_to_index_v1.py \
            tools/t6_material_source_order_proof_v1.py \
            tools/t6_material_source_order_proof_to_index_v1.py \
            tools/t6_material_techset_resolve_v1.py

      - name: Fetch and expand exact retail dependency zones
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/seal6_universal
          for zone in faction_seals_mp common_mp; do
            curl --fail --location --silent --show-error \
              --retry 6 --retry-delay 2 --retry-all-errors --connect-timeout 30 \
              "https://r2.houseofkublai.com/bo2/zone/all/${zone}.ff" \
              -o "/tmp/seal6_universal/${zone}.ff"
            python tools/bo2_t6_fastfile.py decrypt \
              "/tmp/seal6_universal/${zone}.ff" \
              --output "/tmp/seal6_universal/${zone}.ff.expanded"
          done

      - name: Verify exact retail identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected={
            'faction_seals_mp':(6245916,'21a11090990417faefa8c39282f499c7bdb87a7acf62f00082aa9b3811cced30'),
            'common_mp':(206493911,'fbd91d0ede8e27bcaaf7af9638a7118050f27519524be36e9234f980bd6170ce'),
          }
          for zone,(size,digest) in expected.items():
              data=Path(f'/tmp/seal6_universal/{zone}.ff.expanded').read_bytes()
              actual=hashlib.sha256(data).hexdigest()
              assert (len(data),actual)==(size,digest),(zone,len(data),actual)
          print(json.dumps({z:{'bytes':s,'sha256':h} for z,(s,h) in expected.items()},indent=2))
          PY

      - name: Classify faction Material records as definitions or imports
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/t6_material_dependency_graph_v1.py \
            /tmp/seal6_universal/faction_seals_mp.ff.expanded \
            manifests/nonmap/retail/seal6_smg_material_handle_alias_proof_v1.json \
            --direct-proof manifests/nonmap/retail/faction_seals_mp_seal6_smg_full_player_v1.json \
            --zone faction_seals_mp \
            --out /tmp/seal6_universal/faction_material_graph.json

      - name: Assert exact local/import split and seed faction index
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python - <<'PY'
          import json
          d=json.load(open('/tmp/seal6_universal/faction_material_graph.json',encoding='utf-8'))
          s=d['summary']
          assert s['targetMaterials']==13,s
          assert s['localDefinitions']==10,s
          assert s['importStubs']==3,s
          assert s['allTargetMaterialRecordsExact'] is True
          assert s['allImportStubsStrictZeroBody'] is True
          imports={x['material'] for x in d['materials'] if x['classification']=='import_stub'}
          assert imports=={'mc/mtl_c_gen_insidemouth','mc/mtl_gen_eye_cornea','mc/mtl_c_gen_mp_datapad'},imports
          print(json.dumps({'summary':s,'imports':sorted(imports)},indent=2,sort_keys=True))
          PY
          PYTHONPATH=tools python tools/t6_material_dependency_graph_to_index_v1.py \
            /tmp/seal6_universal/faction_material_graph.json \
            --out-index /tmp/seal6_universal/index.faction.json \
            --out-proof /tmp/seal6_universal/faction_index_ingest.json

      - name: Prove common_mp import definitions by exact top-level source order
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/t6_material_source_order_proof_v1.py \
            /tmp/seal6_universal/common_mp.ff.expanded \
            manifests/nonmap/retail/seal6_common_packed_image_name_proof_v1.json \
            manifests/nonmap/retail/seal6_common_import_material_source_order_spec_v1.json \
            --out /tmp/seal6_universal/common_material_source_order_proof.json
          PYTHONPATH=tools python - <<'PY'
          import json
          d=json.load(open('/tmp/seal6_universal/common_material_source_order_proof.json',encoding='utf-8'))
          assert d['summary']['materialDefinitions']==3,d['summary']
          assert d['summary']['allSourceOrderPathsExact'] is True
          by={x['material']:x['definition'] for x in d['materials']}
          assert by['mc/mtl_gen_eye_cornea']['xassetIndex']==5907 and by['mc/mtl_gen_eye_cornea']['start']==80259822
          assert by['mc/mtl_c_gen_insidemouth']['xassetIndex']==5918 and by['mc/mtl_c_gen_insidemouth']['start']==80579573
          assert by['mc/mtl_c_gen_mp_datapad']['xassetIndex']==5925 and by['mc/mtl_c_gen_mp_datapad']['start']==80884450
          print(json.dumps(by,indent=2,sort_keys=True))
          PY

      - name: Add common definitions to persistent index
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/t6_material_source_order_proof_to_index_v1.py \
            /tmp/seal6_universal/common_material_source_order_proof.json \
            --index /tmp/seal6_universal/index.faction.json \
            --out-index /tmp/seal6_universal/index.json \
            --out-proof /tmp/seal6_universal/common_index_ingest.json

      - name: Resolve all 13 SEAL6 Materials through dependency order
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python - <<'PY'
          import json
          from pathlib import Path
          from t6_retail_asset_index_v1 import RetailAssetIndex
          graph=json.load(open('/tmp/seal6_universal/faction_material_graph.json',encoding='utf-8'))
          idx=RetailAssetIndex.load(Path('/tmp/seal6_universal/index.json'));order=['faction_seals_mp','common_mp']
          imports={x['material'] for x in graph['materials'] if x['classification']=='import_stub'};resolved=[]
          for row in graph['materials']:
              name=row['material'];d=idx.resolve('material',name,order);expected='common_mp' if name in imports else 'faction_seals_mp'
              assert d.zone==expected,(name,d.zone,expected);assert d.serialized_bytes>112,(name,d.serialized_bytes)
              resolved.append({'material':name,'zone':d.zone,'start':d.start,'bytes':d.serialized_bytes,'sha256':d.sha256})
          assert len(resolved)==13
          summary=idx.as_dict()['summary'];assert summary['zoneCount']==2 and summary['definitionCount']==13 and summary['referenceCount']==3,summary
          Path('/tmp/seal6_universal/all13_resolution.json').write_text(json.dumps({'order':order,'resolved':resolved,'indexSummary':summary},indent=2,sort_keys=True)+'\n')
          print(json.dumps({'resolved':len(resolved),'indexSummary':summary},indent=2,sort_keys=True))
          PY

      - name: Resolve exact TechniqueSets for faction and common Material definitions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/t6_material_techset_resolve_v1.py \
            /tmp/seal6_universal/faction_seals_mp.ff.expanded \
            /tmp/seal6_universal/faction_material_graph.json \
            --zone faction_seals_mp \
            --out /tmp/seal6_universal/faction_techsets.json
          PYTHONPATH=tools python tools/t6_material_techset_resolve_v1.py \
            /tmp/seal6_universal/common_mp.ff.expanded \
            /tmp/seal6_universal/common_material_source_order_proof.json \
            --zone common_mp \
            --out /tmp/seal6_universal/common_techsets.json
          python - <<'PY'
          import json
          f=json.load(open('/tmp/seal6_universal/faction_techsets.json'));c=json.load(open('/tmp/seal6_universal/common_techsets.json'))
          assert f['summary']['materials']==10 and f['summary']['allBindingsExact'] is True,f['summary']
          assert c['summary']['materials']==3 and c['summary']['allBindingsExact'] is True,c['summary']
          print(json.dumps({'faction':f['summary'],'common':c['summary']},indent=2,sort_keys=True))
          PY

      - name: Verify both cached zone fingerprints
        run: |
          PYTHONPATH=tools python tools/t6_retail_asset_index_v1.py verify \
            /tmp/seal6_universal/index.json \
            --expanded faction_seals_mp=/tmp/seal6_universal/faction_seals_mp.ff.expanded \
            --expanded common_mp=/tmp/seal6_universal/common_mp.ff.expanded

      - name: Upload dependency proof
        uses: actions/upload-artifact@v4
        with:
          name: SEAL6_UNIVERSAL_MATERIAL_DEPENDENCY_PROOF
          path: |
            /tmp/seal6_universal/faction_material_graph.json
            /tmp/seal6_universal/faction_index_ingest.json
            /tmp/seal6_universal/common_material_source_order_proof.json
            /tmp/seal6_universal/common_index_ingest.json
            /tmp/seal6_universal/index.json
            /tmp/seal6_universal/all13_resolution.json
            /tmp/seal6_universal/faction_techsets.json
            /tmp/seal6_universal/common_techsets.json
          if-no-files-found: error
          retention-days: 14
