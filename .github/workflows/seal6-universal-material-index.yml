name: SEAL6 universal Material index

on:
  push:
    branches:
      - reversal/nonmap-assets
    paths:
      - ".github/workflows/seal6-universal-material-index.yml"
      - "tools/t6_asset_types_v1.py"
      - "tools/t6_retail_asset_index_v1.py"
      - "tools/t6_material_techset_top_level_walk_v1.py"
      - "tools/t6_material_dependency_graph_v1.py"
      - "tools/t6_material_dependency_graph_to_index_v1.py"
      - "tools/bo2_t6_fastfile.py"
      - "manifests/nonmap/retail/seal6_smg_material_handle_alias_proof_v1.json"
      - "manifests/nonmap/retail/faction_seals_mp_seal6_smg_full_player_v1.json"
      - "manifests/nonmap/retail/seal6_common_packed_image_name_proof_v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile universal dependency path
        run: |
          python -m py_compile \
            tools/t6_asset_types_v1.py \
            tools/t6_retail_asset_index_v1.py \
            tools/t6_material_techset_top_level_walk_v1.py \
            tools/t6_material_dependency_graph_v1.py \
            tools/t6_material_dependency_graph_to_index_v1.py

      - name: Fetch and expand exact retail dependency zones
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/seal6_universal
          for zone in faction_seals_mp common_mp; do
            curl --fail --location --silent --show-error \
              --retry 6 --retry-delay 2 --retry-all-errors --connect-timeout 30 \
              "https://r2.houseofkublai.com/bo2/zone/all/${zone}.ff" \
              -o "/tmp/seal6_universal/${zone}.ff"
            python tools/bo2_t6_fastfile.py decrypt \
              "/tmp/seal6_universal/${zone}.ff" \
              --output "/tmp/seal6_universal/${zone}.ff.expanded"
          done

      - name: Verify exact retail identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected={
            'faction_seals_mp':(6245916,'21a11090990417faefa8c39282f499c7bdb87a7acf62f00082aa9b3811cced30'),
            'common_mp':(206493911,'fbd91d0ede8e27bcaaf7af9638a7118050f27519524be36e9234f980bd6170ce'),
          }
          for zone,(size,digest) in expected.items():
              p=Path(f'/tmp/seal6_universal/{zone}.ff.expanded')
              data=p.read_bytes(); actual=hashlib.sha256(data).hexdigest()
              assert (len(data),actual)==(size,digest),(zone,len(data),actual)
          print(json.dumps({z:{'bytes':s,'sha256':h} for z,(s,h) in expected.items()},indent=2))
          PY

      - name: Classify faction Material records as definitions or imports
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python tools/t6_material_dependency_graph_v1.py \
            /tmp/seal6_universal/faction_seals_mp.ff.expanded \
            manifests/nonmap/retail/seal6_smg_material_handle_alias_proof_v1.json \
            --direct-proof manifests/nonmap/retail/faction_seals_mp_seal6_smg_full_player_v1.json \
            --zone faction_seals_mp \
            --out /tmp/seal6_universal/faction_material_graph.json

      - name: Assert exact local/import split and seed persistent index
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python - <<'PY'
          import json
          p='/tmp/seal6_universal/faction_material_graph.json'
          d=json.load(open(p,encoding='utf-8'))
          s=d['summary']
          assert s['targetMaterials']==13,s
          assert s['localDefinitions']==10,s
          assert s['importStubs']==3,s
          assert s['allTargetMaterialRecordsExact'] is True
          assert s['allImportStubsStrictZeroBody'] is True
          imports={x['material'] for x in d['materials'] if x['classification']=='import_stub'}
          assert imports=={
              'mc/mtl_c_gen_insidemouth',
              'mc/mtl_gen_eye_cornea',
              'mc/mtl_c_gen_mp_datapad',
          },imports
          print(json.dumps({'summary':s,'imports':sorted(imports)},indent=2,sort_keys=True))
          PY
          PYTHONPATH=tools python tools/t6_material_dependency_graph_to_index_v1.py \
            /tmp/seal6_universal/faction_material_graph.json \
            --out-index /tmp/seal6_universal/index.json \
            --out-proof /tmp/seal6_universal/faction_index_ingest.json

      - name: Locate imported full definitions in exact common_mp bytes
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python - <<'PY'
          import json, struct
          from pathlib import Path
          from t6_asset_types_v1 import ASSET_TYPES, MATERIAL
          from t6_material_techset_top_level_walk_v1 import Cursor, parse_front

          data=Path('/tmp/seal6_universal/common_mp.ff.expanded').read_bytes()
          blocks,assets,body=parse_front(data)
          targets=['mc/mtl_c_gen_insidemouth','mc/mtl_gen_eye_cornea','mc/mtl_c_gen_mp_datapad']

          def canon(x): return x[1:] if x.startswith(',') else x
          def node_name(node):
              x=node.get('name')
              return x.get('value') if isinstance(x,dict) else x

          results=[]
          for target in targets:
              candidates=[]
              for spelling in (target,','+target):
                  needle=spelling.encode('ascii')+b'\0'; pos=0
                  while True:
                      at=data.find(needle,pos)
                      if at<0: break
                      st=at-112
                      if st>=body and struct.unpack_from('<I',data,st)[0] in (0xFFFFFFFF,0xFFFFFFFE):
                          try:
                              c=Cursor(data,st,blocks); node=c.material(); got=node_name(node)
                              if got and canon(got)==target:
                                  candidates.append({
                                      'start':st,'end':c.p,'serializedName':got,
                                      'textureCount':node['textureCount'],
                                      'constantCount':node['constantCount'],
                                      'stateBitsCount':node['stateBitsCount'],
                                      'techniqueSetPointer':node['techniqueSetPointer'],
                                  })
                          except Exception:
                              pass
                      pos=at+1
              unique={(x['start'],x['end']):x for x in candidates}
              results.append({'material':target,'candidates':list(unique.values())})

          type_window=[]
          for i in range(5898,5930):
              typ=assets[i]['type']; raw=assets[i]['headerRaw']
              type_window.append({'xassetIndex':i,'typeId':typ,'type':ASSET_TYPES[typ],'headerRaw':f'0x{raw:08X}'})

          # Retained source-order proof already pins the inside-mouth top-level Material anchor.
          retained=json.load(open('manifests/nonmap/retail/seal6_common_packed_image_name_proof_v1.json',encoding='utf-8'))
          anchor=next(g['anchor'] for g in retained['groups'] if g['name']=='inside_mouth_dependencies')
          inside=next(x for x in results if x['material']=='mc/mtl_c_gen_insidemouth')
          assert anchor['assetIndex']==5918 and anchor['xassetTypeIndex']==MATERIAL
          assert anchor['rawStart']==80579573
          assert any(x['start']==anchor['rawStart'] for x in inside['candidates']),inside

          # Every import must have exactly one valid full Material candidate in common_mp.
          for r in results:
              assert len(r['candidates'])==1,r
              c=r['candidates'][0]
              assert c['textureCount']>0,r
              assert c['techniqueSetPointer']['kind'] in ('packed','following','insert'),r
          out={'format':'t6-seal6-common-import-material-candidates-v1','assetBodyStart':body,'typeWindow':type_window,'materials':results}
          Path('/tmp/seal6_universal/common_material_candidates.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Verify faction cache fingerprint
        run: |
          PYTHONPATH=tools python tools/t6_retail_asset_index_v1.py verify \
            /tmp/seal6_universal/index.json \
            --expanded faction_seals_mp=/tmp/seal6_universal/faction_seals_mp.ff.expanded

      - name: Upload dependency proof
        uses: actions/upload-artifact@v4
        with:
          name: SEAL6_UNIVERSAL_MATERIAL_DEPENDENCY_PROOF
          path: |
            /tmp/seal6_universal/faction_material_graph.json
            /tmp/seal6_universal/faction_index_ingest.json
            /tmp/seal6_universal/index.json
            /tmp/seal6_universal/common_material_candidates.json
          if-no-files-found: error
          retention-days: 14
