name: T6 current client light custom constant candidate reduction v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_light_custom_constant_candidate_reduction_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_LIGHT_CUSTOM_CONSTANT_PRODUCER_LOCATOR_V1.json'
      - '.github/workflows/t6_current_client_light_custom_constant_candidate_reduction_v1.yml'
permissions:
  contents: write
jobs:
  reduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reduce exact command-shaped candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_light_custom_constant_candidate_reduction_v1.py             --locator proof/current_client/T6_CURRENT_CLIENT_LIGHT_CUSTOM_CONSTANT_PRODUCER_LOCATOR_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_LIGHT_CUSTOM_CONSTANT_CANDIDATE_REDUCTION_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_LIGHT_CUSTOM_CONSTANT_CANDIDATE_REDUCTION_V1.json'))
          assert d['summary']['reducedCandidateCount'] <= 837
          print(json.dumps(d['summary'],indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_LIGHT_CUSTOM_CONSTANT_CANDIDATE_REDUCTION_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist reduced light custom-constant candidates'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_LIGHT_CUSTOM_CONSTANT_CANDIDATE_REDUCTION_V1
          path: proof/current_client/T6_CURRENT_CLIENT_LIGHT_CUSTOM_CONSTANT_CANDIDATE_REDUCTION_V1.json
          if-no-files-found: error
