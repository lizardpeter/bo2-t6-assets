name: T6 Nuketown 444 XModel header census tmp
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/t6_nuketown_444_xmodel_header_census_tmp.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 -o /tmp/m.ff https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          gcc -O2 tools/t6_fastfile_expand_pc_v1.c -o /tmp/e -lz -lcrypto
          /tmp/e /tmp/m.ff /tmp/m.bin mp_nuketown_2020
          PYTHONPATH=tools python - <<'PY'
          import json
          from pathlib import Path
          from t6_clipmap_normalize_v5 import parse_top_level_xasset_table
          from t6_clipmap_normalize_v6 import walk_map_prefix_stringtable,scan_required_xmodels
          d=Path('/tmp/m.bin').read_bytes(); t=parse_top_level_xasset_table(d); p=walk_map_prefix_stringtable(d,t)
          class Fallback(dict):
            def get(self,k,default=None):
              v=super().get(k,None)
              return v if v is not None else f'@PACKED_VIRTUAL_{k}'
          recs=scan_required_xmodels(d,p['sourceEnd'],433,Fallback(p['logicalToText']))
          unresolved=[r for r in recs if r['nameSource']=='packed_virtual_stringtable_alias' and str(r['name']).startswith('@PACKED_')]
          print('RECOVERED',len(recs),'UNRESOLVED_PACKED',len(unresolved))
          print(json.dumps(unresolved,indent=2,sort_keys=True))
          # Also print the last 20 recovered records to show source ordering around
          # the added packed-name record without pretending they map 1:1 to XAsset
          # indices after an as-yet-unexplained skipped header.
          print('TAIL',json.dumps(recs[-20:],indent=2,sort_keys=True))
          PY
