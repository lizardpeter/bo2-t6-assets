name: T6 current client zone classifier semantics v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_zone_classifier_semantics_v1.py'
      - '.github/workflows/t6_current_client_zone_classifier_semantics_v1.yml'
      - 'proof/current_client/T6_CURRENT_CLIENT_ZONE_CORE_FUNCTION_PROBE_V1.json'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Project exact positional classifier semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_zone_classifier_semantics_v1.py             --core-proof proof/current_client/T6_CURRENT_CLIENT_ZONE_CORE_FUNCTION_PROBE_V1.json             --out proof/current_client/T6_CURRENT_CLIENT_ZONE_CLASSIFIER_SEMANTICS_V1.json | tee /tmp/summary.log
          python3 - <<'PY'
          import json
          j=json.load(open('proof/current_client/T6_CURRENT_CLIENT_ZONE_CLASSIFIER_SEMANTICS_V1.json'))
          assert j['proven']['plus4IsCurrentClientRecordOrderingKey'] is True
          assert j['proven']['plus4Threshold0x00400000ChangesOrderingDirection'] is True
          assert j['proven']['plus8DoesNotParticipateInRowComparator'] is True
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_ZONE_CLASSIFIER_SEMANTICS_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact current-client zone classifier semantics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_ZONE_CLASSIFIER_SEMANTICS_V1
          path: |
            proof/current_client/T6_CURRENT_CLIENT_ZONE_CLASSIFIER_SEMANTICS_V1.json
            /tmp/summary.log
          if-no-files-found: error
          compression-level: 9
