name: SUPERSEDED - T6 Nuketown q4-q14 OAT endpoint audit v1

# RETIRED 2026-09-06.
#
# This workflow previously asserted that OpenAssetTools' serialized-source byte
# counter could be converted to offsets in our expanded FastFile representation
# with one additive base. That assumption is invalid. The historical failing run
# is intentionally retained in GitHub Actions, while this workflow is disabled
# from repeating the bad assertion.
#
# See checkpoints/T6_STREAM_COORDINATE_SYSTEMS_CORRECTION_2026-09-06.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain retirement
        shell: bash
        run: |
          set -euo pipefail
          cat checkpoints/T6_STREAM_COORDINATE_SYSTEMS_CORRECTION_2026-09-06.md
          echo
          echo 'This audit is retired: OAT source-byte positions and expanded-FastFile offsets are distinct coordinate systems.'
