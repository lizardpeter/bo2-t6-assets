name: T6 Nuketown MaterialMemory ownership v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_nuketown_material_memory_ownership_v1.py'
      - '.github/workflows/t6_nuketown_material_memory_ownership_v1.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build exact T6 PC FastFile expander
        shell: bash
        run: |
          set -euo pipefail
          cc -O2 -Wall -Wextra -o /tmp/t6_expand tools/t6_fastfile_expand_pc_v1.c -lz -lcrypto

      - name: Fetch and expand exact retail Nuketown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source /tmp/proof
          curl -fL --retry 4 -o /tmp/source/mp_nuketown_2020.ff \
            https://r2.houseofkublai.com/bo2/zone/all/mp_nuketown_2020.ff
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/source/mp_nuketown_2020.ff' | sha256sum -c -
          /tmp/t6_expand /tmp/source/mp_nuketown_2020.ff /tmp/source/mp_nuketown_2020.expanded.bin mp_nuketown_2020 \
            2>&1 | tee /tmp/proof/expand.log
          echo '7e791fb90a085f3bff9e0df895e5a232fa91cc43bcd0027225fe811f7891d505  /tmp/source/mp_nuketown_2020.expanded.bin' | sha256sum -c -
          test "$(stat -c %s /tmp/source/mp_nuketown_2020.expanded.bin)" = 154653476

      - name: Fetch pinned OpenAssetTools loader authority
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/Laupetin/OpenAssetTools.git /tmp/oat
          git -C /tmp/oat checkout -q 9dca965366541504b71fa8cfb7ac049cb9b717e1
          test "$(git -C /tmp/oat rev-parse HEAD)" = 9dca965366541504b71fa8cfb7ac049cb9b717e1

      - name: Prove MaterialMemory ownership
        env:
          PYTHONPATH: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/t6_nuketown_material_memory_ownership_v1.py
          python3 tools/t6_nuketown_material_memory_ownership_v1.py \
            --expanded /tmp/source/mp_nuketown_2020.expanded.bin \
            --oat-root /tmp/oat \
            --out /tmp/proof/T6_NUKETOWN_MATERIAL_MEMORY_OWNERSHIP_V1.json \
            2>&1 | tee /tmp/proof/ownership.log
          python3 - <<'PY'
          import json
          p='/tmp/proof/T6_NUKETOWN_MATERIAL_MEMORY_OWNERSHIP_V1.json'
          d=json.load(open(p,encoding='utf-8')); m=d['materialMemory']; v=d['validation']
          assert d['source']['sha256']=='7e791fb90a085f3bff9e0df895e5a232fa91cc43bcd0027225fe811f7891d505'
          assert d['loader']['commit']=='9dca965366541504b71fa8cfb7ac049cb9b717e1'
          assert m['count']==327 and m['recordBytes']==8
          assert m['physicalStart']==84463050 and m['physicalEndExclusive']==84465666
          assert m['fixedArrayEndsAtFirstMaterialChild'] is True
          assert m['allMaterialChildrenFollowOwned'] is True
          assert m['virtualBlock']==5
          assert m['virtualStartOffset']==71642512
          assert m['virtualEndOffsetExclusive']==71645128
          assert m['surfaceAliasCount']==327 and m['surfaceAliasStride']==8
          assert v['strictMaterialCount']==327 and v['vertexGroupCount']==340
          assert v['groupFormatCounts']=={'0':220,'1':95,'2':7,'3':17,'6':1}
          assert v['mixedFormatGroupCount']==0 and v['unresolvedSurfaceMaterialCount']==0
          assert v['signatureScanRejectedAsOwnershipMethod'] is True
          print('GREEN NUKETOWN MATERIALMEMORY OWNERSHIP')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_MATERIAL_MEMORY_OWNERSHIP_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 0
