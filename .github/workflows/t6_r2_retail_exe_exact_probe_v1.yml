name: T6 R2 exact retail EXE probe v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/firstperson-weapons-closure
    paths:
      - '.github/workflows/t6_r2_retail_exe_exact_probe_v1.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require exact authoritative R2 retail executable
        shell: bash
        env:
          EXPECTED_SHA256: 11c7542fc571379da5b3dbb8967372c2f8283e8457ae4a78070e16d51824d5d1
          EXPECTED_BYTES: '12850328'
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof /tmp/candidates
          python3 - <<'PY'
          import hashlib,json,os,urllib.error,urllib.request
          from pathlib import Path

          expected_sha=os.environ['EXPECTED_SHA256'].lower()
          expected_bytes=int(os.environ['EXPECTED_BYTES'])
          bases=[
              'https://r2.houseofkublai.com/bo2',
              'https://r2.houseofkublai.com/bo2/pluto_t6_full_game',
              'https://r2.houseofkublai.com/bo2/Plutonium/pluto_t6_full_game',
              'https://r2.houseofkublai.com/bo2/game',
          ]
          names=['t6mp.exe','t6mp(1)(1).exe','t6mpv43.exe']
          urls=[f'{b}/{n}' for b in bases for n in names]
          rows=[]; winner=None; winner_bytes=None
          for url in urls:
              row={'url':url}
              try:
                  req=urllib.request.Request(url,headers={'Range':'bytes=0-0','User-Agent':'bo2-t6-assets-r2-retail-authority/1'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      hdr=dict(r.headers); r.read()
                      row.update(status=r.status,contentRange=hdr.get('Content-Range') or hdr.get('content-range'),contentLength=hdr.get('Content-Length') or hdr.get('content-length'),etag=hdr.get('ETag') or hdr.get('etag'))
                  total=None
                  cr=row.get('contentRange')
                  if cr and '/' in cr: total=int(cr.rsplit('/',1)[1])
                  elif row.get('contentLength'): total=int(row['contentLength'])
                  row['reportedBytes']=total
                  if total==expected_bytes:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'bo2-t6-assets-r2-retail-authority/1'}),timeout=60) as r:
                          raw=r.read()
                      digest=hashlib.sha256(raw).hexdigest()
                      row['actualBytes']=len(raw); row['actualSha256']=digest
                      row['identity']='exact_match' if len(raw)==expected_bytes and digest==expected_sha else 'identity_mismatch'
                      if row['identity']=='exact_match':
                          if winner is not None:
                              raise SystemExit('multiple exact R2 executable matches; authority path is ambiguous')
                          winner=row.copy(); winner_bytes=raw
                  else:
                      row['identity']='not_expected_size'
              except urllib.error.HTTPError as exc:
                  row.update(status=exc.code,identity='http_error')
              except Exception as exc:
                  row.update(identity='probe_error',error=repr(exc))
              rows.append(row)
          result={
              'format':'t6-r2-retail-exe-exact-probe-v2',
              'authority':'R2 retail file identity is authoritative for retail-client reversal; legacy dedicated-server EXE/PDB/MAP are guidance only.',
              'expectedBytes':expected_bytes,
              'expectedSha256':expected_sha,
              'candidates':rows,
              'exactMatch':winner,
              'summary':{'candidateCount':len(rows),'reachableCount':sum('status' in r and r['status'] in (200,206) for r in rows),'exactMatchCount':sum(r.get('identity')=='exact_match' for r in rows)},
              'proofBoundary':'Authoritative only if exactly one explicit R2 path matches both expected byte count and SHA-256. Legacy server artifacts cannot substitute for this retail-client identity.',
          }
          Path('/tmp/proof/T6_R2_RETAIL_EXE_EXACT_PROBE_V2.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if winner is None or winner_bytes is None:
              raise SystemExit('no exact authoritative R2 retail t6mp.exe match')
          # Retain exact retail bytes only ephemerally for downstream steps in this job.
          Path('/tmp/t6mp.exe').write_bytes(winner_bytes)
          PY
          echo "$EXPECTED_SHA256  /tmp/t6mp.exe" | sha256sum -c -
          test "$(stat -c '%s' /tmp/t6mp.exe)" = "$EXPECTED_BYTES"
      - name: Upload identity proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_R2_RETAIL_EXE_EXACT_PROBE_V2
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
