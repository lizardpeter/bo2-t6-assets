name: T6 current-client Ghidra thunks v1

on:
  push:
    paths:
      - '.github/workflows/t6_current_client_ghidra_thunks_v1.yml'

permissions:
  contents: write

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  GHIDRA_CACHE_KEY: t6-current-client-ghidra-12.1.3-77031817-v1

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors             -o /tmp/ghidra.zip             https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: Restore analyzed project
        id: ghidra-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-ghidra/projects
          key: ${{ env.GHIDRA_CACHE_KEY }}
      - name: Require analyzed project cache
        run: test "${{ steps.ghidra-cache.outputs.cache-hit }}" = true
      - name: Select all thunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-thunks/batch
          python3 tools/select_t6_current_client_low_hanging_v1.py             proof/current_client/ghidra_low_hanging_v1/catalog.tsv             --out /tmp/t6-thunks/selection.tsv             --tier thunk             --limit 0
      - name: Export/decompile thunk evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/t6-ghidra/config /tmp/t6-ghidra/cache
          export XDG_CONFIG_HOME=/tmp/t6-ghidra/config
          export XDG_CACHE_HOME=/tmp/t6-ghidra/cache
          export GHIDRA_HEADLESS_MAXMEM=4G
          "$GHIDRA_HOME/support/analyzeHeadless"             /tmp/t6-ghidra/projects t6-current-client             -process t6mp.exe -noanalysis -readOnly             -postScript ExportT6CurrentClientBatch.java               /tmp/t6-thunks/selection.tsv /tmp/t6-thunks/batch             -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 4
      - name: Package durable thunk evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=proof/current_client/ghidra_thunks_v1
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp /tmp/t6-thunks/selection.tsv "$OUT/selection.tsv"
          cp /tmp/t6-thunks/batch/results.tsv "$OUT/results.tsv"
          python3 - <<'PY'
          import csv,json,pathlib
          root=pathlib.Path('/tmp/t6-thunks')
          with (root/'selection.tsv').open(encoding='utf-8',newline='') as f:
              sel=list(csv.DictReader(f,dialect='excel-tab'))
          with (root/'batch/results.tsv').open(encoding='utf-8',newline='') as f:
              res=list(csv.DictReader(f,dialect='excel-tab'))
          summary={
            'format':'t6-current-client-ghidra-thunks-v1',
            'client_sha256':'770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf',
            'selected_functions':len(sel),
            'exact_functions_found':sum(r['found_exact']=='true' for r in res),
            'decompile_completed':sum(r['decompile_completed']=='true' for r in res),
            'decompile_failed_or_timed_out':sum(r['decompile_completed']!='true' for r in res),
            'proof_boundary':'Generated/unreviewed thunk evidence; thunks remain distinct from game semantic implementations.'
          }
          out=pathlib.Path('proof/current_client/ghidra_thunks_v1')
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          tar -C /tmp/t6-thunks -cf - batch | zstd -19 -T0 -o "$OUT/bundle.tar.zst"
          sha256sum "$OUT/bundle.tar.zst" | sed 's#  .*/#  #' > "$OUT/bundle.sha256"
          git diff --check
          git config user.name uregraph-re-bot
          git config user.email uregraph-re-bot@users.noreply.github.com
          git add "$OUT"
          git commit -m "Add T6 current-client Ghidra thunk evidence v1"
          git pull --rebase origin main
          git push origin HEAD:main
