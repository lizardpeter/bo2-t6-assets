name: T6 Nuketown five-root dynamic XAsset closure v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_oat_all_xasset_ordinal_name_trace_patch_v1.py'
      - 'tools/t6_oat_all_xasset_ordinal_name_binding_v1.py'
      - 'tools/t6_nuketown_dynamic_xasset_reference_closure_v1.py'
      - 'tools/t6_oat_9dca_gcc_compat_patch_v3.py'
      - 'tools/t6_fastfile_expand_pc_v1.c'
      - 'manifests/maps/mp_nuketown_2020/T6_NUKETOWN_MAPENTS_MODEL_ANIMATION_CENSUS_V1.json'
      - '.github/workflows/t6_nuketown_five_root_dynamic_xasset_closure_v1.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate typed join implementation
        run: python3 tools/test_t6_nuketown_dynamic_xasset_reference_closure_v1.py
      - name: Build source-closed FastFile expander
        run: cc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_ff_expand -lz -lcrypto
      - name: Restore all-XAsset instrumented pinned OAT
        id: oat-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/oat-all-xasset-name-cache
          key: oat-unlinker-t6-9dca965-compat-v3-all-xasset-name-v1-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py', 'tools/t6_oat_all_xasset_ordinal_name_trace_patch_v1.py') }}-ubuntu24-x86-debug
      - name: Build or verify all-XAsset instrumented pinned OAT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oat-all-xasset-name-cache /tmp/proof
          CACHE_BIN=/tmp/oat-all-xasset-name-cache/Unlinker
          CACHE_META=/tmp/oat-all-xasset-name-cache/source_identity.txt
          EXPECTED_COMMIT=9dca965366541504b71fa8cfb7ac049cb9b717e1
          COMPAT_SHA=$(sha256sum tools/t6_oat_9dca_gcc_compat_patch_v3.py | awk '{print $1}')
          TRACE_SHA=$(sha256sum tools/t6_oat_all_xasset_ordinal_name_trace_patch_v1.py | awk '{print $1}')
          if test "${{ steps.oat-cache.outputs.cache-hit }}" = 'true'; then
            test -x "$CACHE_BIN"
            grep -qx "oat_commit=$EXPECTED_COMMIT" "$CACHE_META"
            grep -qx "compat_patch_sha256=$COMPAT_SHA" "$CACHE_META"
            grep -qx "trace_patch_sha256=$TRACE_SHA" "$CACHE_META"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq g++-multilib >/dev/null
            git clone -q --recursive https://github.com/Laupetin/OpenAssetTools.git /tmp/oat
            git -C /tmp/oat checkout -q "$EXPECTED_COMMIT"
            git -C /tmp/oat submodule update -q --init --recursive
            python3 tools/t6_oat_9dca_gcc_compat_patch_v3.py /tmp/oat
            python3 tools/t6_oat_all_xasset_ordinal_name_trace_patch_v1.py /tmp/oat
            git -C /tmp/oat diff --check
            cd /tmp/oat
            PREMAKE_NO_PROMPT=1 ./generate.sh
            make -C build -j2 config=debug_x86 UnlinkerCli
            BIN=$(find build/bin -type f \( -name Unlinker -o -name unlinker \) | head -1)
            test -n "$BIN"
            install -m 0755 "$BIN" "$CACHE_BIN"
            printf 'oat_commit=%s\ncompat_patch_sha256=%s\ntrace_patch_sha256=%s\n' "$EXPECTED_COMMIT" "$COMPAT_SHA" "$TRACE_SHA" > "$CACHE_META"
          fi
          sha256sum "$CACHE_BIN" > /tmp/proof/unlinker_sha256.txt
      - name: Save all-XAsset instrumented OAT cache
        if: steps.oat-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/oat-all-xasset-name-cache
          key: oat-unlinker-t6-9dca965-compat-v3-all-xasset-name-v1-${{ hashFiles('tools/t6_oat_9dca_gcc_compat_patch_v3.py', 'tools/t6_oat_all_xasset_ordinal_name_trace_patch_v1.py') }}-ubuntu24-x86-debug
      - name: Fetch and verify exact five roots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/game/zone/all /tmp/xasset /tmp/proof/bindings /tmp/oat_out
          for f in mp_nuketown_2020.ff common_mp.ff common_patch_mp.ff patch_mp.ff code_post_gfx_mp.ff; do
            curl -fL --retry 4 --retry-delay 2 -o "/tmp/game/zone/all/$f" "https://r2.houseofkublai.com/bo2/zone/all/$f"
          done
          echo '6c026322a713c461a03de9815bf6eef0e959fb2ab5d82299b029b775fa1ab1e0  /tmp/game/zone/all/mp_nuketown_2020.ff' | sha256sum -c -
          echo '93fe48b0f0d8cc6844be875ccad94e0cfcf635f62eeff00ac33f2f668a77cb77  /tmp/game/zone/all/common_mp.ff' | sha256sum -c -
          echo '95622d93d4fb761db311a123cd073bed34ea48c9c711d2c11bce4170dd08bae9  /tmp/game/zone/all/common_patch_mp.ff' | sha256sum -c -
          echo '459077cda8e4a1457f7ee7d8f6c5e0abf30f41767a21ff6744df6a4307cbce1e  /tmp/game/zone/all/patch_mp.ff' | sha256sum -c -
          echo 'b7bce1dbe94692b1668ae9a1c83a4dcf008979ee5d5f79b3d2e619c23a1002b3  /tmp/game/zone/all/code_post_gfx_mp.ff' | sha256sum -c -
      - name: Native-bind every physical XAsset ordinal in each root
        shell: bash
        run: |
          set -euo pipefail
          BIN=/tmp/oat-all-xasset-name-cache/Unlinker
          for spec in map=mp_nuketown_2020 common=common_mp common_patch=common_patch_mp patch=patch_mp code_post=code_post_gfx_mp; do
            label=${spec%%=*}; zone=${spec#*=}; ff="/tmp/game/zone/all/$zone.ff"; exp="/tmp/xasset/$zone.expanded"; log="/tmp/proof/${label}_native.log"; binding="/tmp/proof/bindings/${label}.json"
            /tmp/t6_ff_expand "$ff" "$exp" "$zone"
            count=$(python3 - "$exp" <<'PY'
          import struct,sys
          d=open(sys.argv[1],'rb').read()
          print(struct.unpack_from('<I',d,56)[0])
          PY
            )
            set +e
            "$BIN" --no-color --verbose --include-assets image --output-folder "/tmp/oat_out/$label" "$ff" >"$log" 2>&1
            rc=$?
            set -e
            echo "$label native_rc=$rc asset_count=$count trace_count=$(grep -c '^T6_XASSET_ORDINAL_NAME' "$log" || true)" | tee -a /tmp/proof/root_results.txt
            test "$rc" -eq 0
            test "$(grep -c '^T6_XASSET_ORDINAL_NAME' "$log")" -eq "$count"
            python3 tools/t6_oat_all_xasset_ordinal_name_binding_v1.py --expanded "$exp" --native-log "$log" --oat-commit 9dca965366541504b71fa8cfb7ac049cb9b717e1 --out "$binding"
          done
      - name: Join exact MapEnt dynamic references to typed XAssets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_nuketown_dynamic_xasset_reference_closure_v1.py             --mapents manifests/maps/mp_nuketown_2020/T6_NUKETOWN_MAPENTS_MODEL_ANIMATION_CENSUS_V1.json             --binding map /tmp/proof/bindings/map.json             --binding common /tmp/proof/bindings/common.json             --binding common_patch /tmp/proof/bindings/common_patch.json             --binding patch /tmp/proof/bindings/patch.json             --binding code_post /tmp/proof/bindings/code_post.json             --out proof/T6_NUKETOWN_DYNAMIC_XASSET_REFERENCE_CLOSURE_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/T6_NUKETOWN_DYNAMIC_XASSET_REFERENCE_CLOSURE_V1.json'))
          s=d['summary']
          assert len(d['bindingRoots'])==5
          assert s['referenceIdentityCount']>0
          assert s['resolved']+s['absentFromSuppliedRoots']+s['inlineBrushModelTokenCount']==s['referenceIdentityCount']
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/T6_NUKETOWN_DYNAMIC_XASSET_REFERENCE_CLOSURE_V1.json
          git commit -m 'Persist five-root Nuketown dynamic XAsset closure' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: T6_NUKETOWN_FIVE_ROOT_DYNAMIC_XASSET_CLOSURE_V1
          path: |
            proof/T6_NUKETOWN_DYNAMIC_XASSET_REFERENCE_CLOSURE_V1.json
            /tmp/proof/root_results.txt
            /tmp/proof/bindings
          if-no-files-found: error
          compression-level: 9
