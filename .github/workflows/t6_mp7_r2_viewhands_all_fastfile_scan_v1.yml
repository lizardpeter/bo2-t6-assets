name: T6 MP7 R2 SEAL6 viewhands all-FastFile scan v1

on:
  workflow_dispatch:
  push:
    branches:
      - reversal/firstperson-weapons-closure
    paths:
      - '.github/workflows/t6_mp7_r2_viewhands_all_fastfile_scan_v1.yml'
      - 'tools/t6_remote_zip_range_v1.py'
      - 'tools/t6_fastfile_expand_pc_v1.c'

permissions:
  contents: read

jobs:
  scan-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build source-closed T6 FastFile expander
        shell: bash
        run: |
          set -euo pipefail
          gcc -O2 -Wall -Wextra tools/t6_fastfile_expand_pc_v1.c -o /tmp/t6_expand -lcrypto -lz
          mkdir -p /tmp/proof /tmp/work
          sha256sum /tmp/t6_expand | tee /tmp/proof/expander_sha256.txt

      - name: Scan exact shard of retail FastFiles
        shell: bash
        env:
          ZIP_URL: https://cdn.jordanlindsay.com.au/pluto_t6_full_game.zip
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: '8'
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          from t6_remote_zip_range_v1 import RemoteZip

          url=os.environ['ZIP_URL']
          shard=int(os.environ['SHARD'])
          shard_count=int(os.environ['SHARD_COUNT'])
          rz=RemoteZip(url,f'bo2-t6-assets-seal6-viewhands/{shard}')
          entries,meta=rz.central_directory()
          ff=[e for e in entries if e['name'].lower().endswith('.ff')]
          ff.sort(key=lambda e:e['name'].lower())
          selected=[(i,e) for i,e in enumerate(ff) if i % shard_count == shard]

          needles={
              'seal6LongViewhands':b'c_usa_mp_seal6_longsleeve_viewhands\x00',
              'seal6ShortViewhands':b'c_usa_mp_seal6_shortsleeve_viewhands\x00',
              'seal6SmgBody':b'c_usa_mp_seal6_smg_fb\x00',
              'seal6FamilyStem':b'c_usa_mp_seal6_',
              'viewhandsSuffix':b'_viewhands\x00',
          }
          rows=[]
          for ordinal,(global_index,e) in enumerate(selected):
              name=e['name']
              fname=name.rsplit('/',1)[-1]
              zone=fname[:-3]
              row={
                  'globalIndex':global_index,
                  'shardIndex':ordinal,
                  'zipPath':name,
                  'file':fname,
                  'zoneName':zone,
                  'zipCrc32':f"{e['crc32']:08x}",
                  'zipUncompressedBytes':e['uncompressedSize'],
              }
              ff_path=pathlib.Path('/tmp/work')/f'{global_index:03d}.ff'
              expanded=pathlib.Path('/tmp/work')/f'{global_index:03d}.expanded.bin'
              log=pathlib.Path('/tmp/proof')/f'expand_{global_index:03d}.log'
              try:
                  raw=rz.extract(e,verify_crc=True)
                  row['fastFileBytes']=len(raw)
                  row['fastFileSha256']=hashlib.sha256(raw).hexdigest()
                  ff_path.write_bytes(raw)
                  del raw
                  with log.open('wb') as lf:
                      proc=subprocess.run(['/tmp/t6_expand',str(ff_path),str(expanded),zone],stdout=lf,stderr=subprocess.STDOUT)
                  row['expandRc']=proc.returncode
                  if proc.returncode != 0 or not expanded.is_file():
                      row['status']='expand_failed'
                      row['hits']={}
                  else:
                      data=expanded.read_bytes()
                      row['status']='green'
                      row['expandedBytes']=len(data)
                      row['expandedSha256']=hashlib.sha256(data).hexdigest()
                      hits={}
                      for label,needle in needles.items():
                          offsets=[]; start=0
                          while True:
                              at=data.find(needle,start)
                              if at < 0: break
                              offsets.append(at); start=at+1
                          hits[label]={'count':len(offsets),'offsets':offsets[:256]}
                      row['hits']=hits
              except Exception as exc:
                  row['status']='exception'
                  row['error']=repr(exc)
                  row.setdefault('hits',{})
              finally:
                  for p in (ff_path,expanded):
                      try: p.unlink()
                      except FileNotFoundError: pass
              rows.append(row)
              print(global_index,row['status'],name,
                    row.get('hits',{}).get('seal6LongViewhands',{}).get('count',0),
                    row.get('hits',{}).get('seal6ShortViewhands',{}).get('count',0),
                    row.get('hits',{}).get('seal6SmgBody',{}).get('count',0),flush=True)

          def matches(label):
              return [r for r in rows if r.get('hits',{}).get(label,{}).get('count',0)]
          result={
              'format':'t6-mp7-r2-seal6-viewhands-all-fastfile-scan-shard-v1',
              'shard':shard,
              'shardCount':shard_count,
              'remoteZip':meta,
              'allFastFileCount':len(ff),
              'rows':rows,
              'summary':{
                  'selectedCount':len(rows),
                  'greenExpansionCount':sum(r['status']=='green' for r in rows),
                  'failedExpansionCount':sum(r['status']!='green' for r in rows),
                  'seal6LongViewhandsZones':[r['zipPath'] for r in matches('seal6LongViewhands')],
                  'seal6ShortViewhandsZones':[r['zipPath'] for r in matches('seal6ShortViewhands')],
                  'seal6SmgBodyZones':[r['zipPath'] for r in matches('seal6SmgBody')],
                  'seal6FamilyStemZones':[r['zipPath'] for r in matches('seal6FamilyStem')],
                  'viewhandsSuffixZones':[r['zipPath'] for r in matches('viewhandsSuffix')],
              },
              'proofBoundary':'Exact expanded-XFile byte/name census for this deterministic shard of the public retail FastFile archive. Every successful input is ZIP-CRC verified and SHA-256 pinned. Positive exact-name presence is only a physical-source locator, not XModel ownership. Negative claims are valid only for green-expanded rows until all eight shards are combined.'
          }
          out=pathlib.Path('/tmp/proof')/f'T6_MP7_R2_SEAL6_VIEWHANDS_ALL_FASTFILE_SCAN_SHARD_{shard}_V1.json'
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result['summary'],indent=2,sort_keys=True))
          if result['summary']['failedExpansionCount']:
              bad=[r['zipPath'] for r in rows if r['status']!='green']
              raise SystemExit(f'non-green FastFile rows: {bad}')
          PY

      - name: Upload shard proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T6_MP7_R2_SEAL6_VIEWHANDS_ALL_FASTFILE_SCAN_SHARD_${{ matrix.shard }}_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9

  aggregate:
    needs: scan-shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: T6_MP7_R2_SEAL6_VIEWHANDS_ALL_FASTFILE_SCAN_SHARD_*_V1
          path: /tmp/shards
          merge-multiple: true

      - name: Require complete 215-FastFile coverage and combine exact results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proof
          python3 - <<'PY'
          import glob,hashlib,json,pathlib
          files=sorted(glob.glob('/tmp/shards/T6_MP7_R2_SEAL6_VIEWHANDS_ALL_FASTFILE_SCAN_SHARD_*_V1.json'))
          if len(files) != 8:
              raise SystemExit(f'expected 8 shard JSON files, got {len(files)}')
          docs=[json.load(open(p,encoding='utf-8')) for p in files]
          rows=[]
          for d in docs:
              if d.get('format')!='t6-mp7-r2-seal6-viewhands-all-fastfile-scan-shard-v1':
                  raise SystemExit('unexpected shard format')
              rows.extend(d['rows'])
          rows.sort(key=lambda r:r['globalIndex'])
          expected=docs[0]['allFastFileCount']
          if expected != 215:
              raise SystemExit(f'archive FastFile population changed: {expected} != 215')
          if len(rows) != expected:
              raise SystemExit(f'coverage mismatch {len(rows)} != {expected}')
          if [r['globalIndex'] for r in rows] != list(range(expected)):
              raise SystemExit('global FastFile indices are not exact 0..214 coverage')
          bad=[r for r in rows if r['status']!='green']
          if bad:
              raise SystemExit(f'{len(bad)} non-green rows: {[r["zipPath"] for r in bad[:20]]}')

          def matching(label):
              return [r for r in rows if r.get('hits',{}).get(label,{}).get('count',0)]
          labels=['seal6LongViewhands','seal6ShortViewhands','seal6SmgBody','seal6FamilyStem','viewhandsSuffix']
          m={label:matching(label) for label in labels}
          result={
              'format':'t6-mp7-r2-seal6-viewhands-all-fastfile-scan-v1',
              'remoteZip':docs[0]['remoteZip'],
              'rows':rows,
              'summary':{
                  'fastFileCount':expected,
                  'greenExpansionCount':len(rows),
                  'failedExpansionCount':0,
                  'seal6LongViewhandsZoneCount':len(m['seal6LongViewhands']),
                  'seal6ShortViewhandsZoneCount':len(m['seal6ShortViewhands']),
                  'seal6SmgBodyZoneCount':len(m['seal6SmgBody']),
                  'seal6FamilyStemZoneCount':len(m['seal6FamilyStem']),
                  'viewhandsSuffixZoneCount':len(m['viewhandsSuffix']),
                  'seal6LongViewhandsZones':[r['zipPath'] for r in m['seal6LongViewhands']],
                  'seal6ShortViewhandsZones':[r['zipPath'] for r in m['seal6ShortViewhands']],
                  'seal6SmgBodyZones':[r['zipPath'] for r in m['seal6SmgBody']],
                  'seal6FamilyStemZones':[r['zipPath'] for r in m['seal6FamilyStem']],
                  'viewhandsSuffixZones':[r['zipPath'] for r in m['viewhandsSuffix']],
              },
              'targetRows':{
                  label:[{
                      'globalIndex':r['globalIndex'],
                      'zipPath':r['zipPath'],
                      'fastFileBytes':r['fastFileBytes'],
                      'fastFileSha256':r['fastFileSha256'],
                      'expandedBytes':r['expandedBytes'],
                      'expandedSha256':r['expandedSha256'],
                      'hitCount':r['hits'][label]['count'],
                      'offsets':r['hits'][label]['offsets'],
                  } for r in m[label]] for label in labels
              },
              'shardManifestSha256':[
                  {'file':pathlib.Path(p).name,'sha256':hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()}
                  for p in files
              ],
              'proofBoundary':'Complete exact-name census over all 215 FastFiles in the referenced public full-game ZIP. Every FastFile passed ZIP CRC verification, was SHA-256 pinned, and was successfully decrypted/inflated by the source-closed T6 PC expander. Positive exact-name hits locate physical source zones but do not by themselves establish XModel ownership; candidate zones must be independently dumped as physical XModels with no loaded dependencies before promotion.'
          }
          out=pathlib.Path('/tmp/proof/T6_MP7_R2_SEAL6_VIEWHANDS_ALL_FASTFILE_SCAN_V1.json')
          out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result['summary'],indent=2,sort_keys=True))
          PY
          sha256sum /tmp/proof/T6_MP7_R2_SEAL6_VIEWHANDS_ALL_FASTFILE_SCAN_V1.json | tee /tmp/proof/manifest_sha256.txt

      - name: Upload complete FastFile census
        uses: actions/upload-artifact@v4
        with:
          name: T6_MP7_R2_SEAL6_VIEWHANDS_ALL_FASTFILE_SCAN_V1
          path: /tmp/proof
          if-no-files-found: error
          compression-level: 9
