name: SEAL6 base IPAK identity diagnostic

on:
  workflow_dispatch:
  push:
    branches: [r2-fetch-test]
    paths:
      - '.github/workflows/seal6-ipak-index-diagnostic.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6650f942e7fdc6ba068816b64b4a4139011ee5f1
      - name: Audit retail key identities through HTTP Range
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,struct,urllib.request
          from collections import defaultdict
          from pathlib import Path
          url='https://r2.houseofkublai.com/bo2/zone/all/base.ipak'
          def read_at(off,n):
              req=urllib.request.Request(url,headers={'Range':f'bytes={off}-{off+n-1}','User-Agent':'bo2-t6-assets-audit/1'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  assert r.status==206,(r.status,r.headers)
                  b=r.read()
              assert len(b)==n,(off,n,len(b)); return b
          head=read_at(0,16)
          magic,ver,size,nsec=struct.unpack('<4sIII',head)
          secs=[struct.unpack_from('<IIII',read_at(16,nsec*16),i*16) for i in range(nsec)]
          idx=[s for s in secs if s[0]==1][0]
          typ,ioff,isz,icount=idx
          raw=read_at(ioff,icount*16)
          entries=[struct.unpack_from('<IIII',raw,i*16) for i in range(icount)]
          by_pair={}; by_name=defaultdict(list); by_data=defaultdict(list)
          for e in entries:
              dhraw,nh,rel,span=e; dh=dhraw&0x1fffffff
              by_pair.setdefault((nh,dh),[]).append(e); by_name[nh].append(e); by_data[dh].append(e)
          doc=json.loads(Path('manifests/nonmap/retail/seal6_smg_exact_base_ipak_keys_v4.json').read_text())
          def h(s):
              x=0
              for c in s.encode('latin1'): x=((33*x)^(c|0x20))&0xffffffff
              return x
          rows=[]
          for r in doc['exactBaseIpakKeys']:
              nh=int(r['nameHashHex'],0); dh=int(r['dataHashHex'],0)&0x1fffffff; sh=h(r['image'])
              row={
                'image':r['image'],'retainedNameHash':f'{nh:08x}','stringHash':f'{sh:08x}','dataHash':f'{dh:08x}',
                'retainedPairHits':len(by_pair.get((nh,dh),[])),
                'stringPairHits':len(by_pair.get((sh,dh),[])),
                'dataHashHits':len(by_data.get(dh,[])),
                'retainedNameHits':len(by_name.get(nh,[])),
                'stringNameHits':len(by_name.get(sh,[])),
              }
              rows.append(row)
          summary={k:sum(1 for r in rows if r[k]) for k in ['retainedPairHits','stringPairHits','dataHashHits','retainedNameHits','stringNameHits']}
          summary.update({'entries':len(entries),'declaredBytes':size,'indexOffset':ioff,'indexCount':icount})
          print(json.dumps(summary,indent=2))
          print(json.dumps(rows,indent=2))
          Path('ipak_identity_audit.json').write_text(json.dumps({'summary':summary,'rows':rows},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: seal6-ipak-identity-audit
          path: ipak_identity_audit.json
