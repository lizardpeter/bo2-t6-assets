name: SEAL6 IPAK identity diagnostic

on:
  workflow_dispatch:
  push:
    branches: [r2-fetch-test]
    paths:
      - '.github/workflows/seal6-ipak-index-diagnostic.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6650f942e7fdc6ba068816b64b4a4139011ee5f1
      - name: Audit retail key identities through HTTP Range
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,struct,urllib.request
          from collections import defaultdict
          from pathlib import Path
          roots=['base.ipak','mp.ipak','patch_mp.ipak','so.ipak']
          base='https://r2.houseofkublai.com/bo2/zone/all/'
          def read_at(url,off,n):
              req=urllib.request.Request(url,headers={'Range':f'bytes={off}-{off+n-1}','User-Agent':'bo2-t6-assets-audit/2'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  assert r.status==206,(url,r.status,r.headers)
                  b=r.read()
              assert len(b)==n,(url,off,n,len(b)); return b
          indexes={}
          for leaf in roots:
              url=base+leaf
              head=read_at(url,0,16)
              magic,ver,size,nsec=struct.unpack('<4sIII',head); assert magic==b'KAPI' and ver==0x50000
              secraw=read_at(url,16,nsec*16)
              secs=[struct.unpack_from('<IIII',secraw,i*16) for i in range(nsec)]
              typ,ioff,isz,icount=[s for s in secs if s[0]==1][0]
              raw=read_at(url,ioff,icount*16)
              entries=[struct.unpack_from('<IIII',raw,i*16) for i in range(icount)]
              by_pair=defaultdict(list); by_data=defaultdict(list)
              for e in entries:
                  dhraw,nh,rel,span=e; dh=dhraw&0x1fffffff
                  by_pair[(nh,dh)].append(e); by_data[dh].append(e)
              indexes[leaf]={'url':url,'size':size,'entries':entries,'by_pair':by_pair,'by_data':by_data}
              print(leaf,'bytes',size,'entries',icount)
          doc=json.loads(Path('manifests/nonmap/retail/seal6_smg_exact_base_ipak_keys_v4.json').read_text())
          def h(s):
              x=0
              for c in s.encode('latin1'): x=((33*x)^(c|0x20))&0xffffffff
              return x
          rows=[]
          for r in doc['exactBaseIpakKeys']:
              dh=int(r['dataHashHex'],0)&0x1fffffff; sh=h(r['image'])
              hits=[]; data_hits=[]
              for leaf,ix in indexes.items():
                  if ix['by_pair'].get((sh,dh)): hits.append({'ipak':leaf,'count':len(ix['by_pair'][(sh,dh)])})
                  if ix['by_data'].get(dh): data_hits.append({'ipak':leaf,'count':len(ix['by_data'][dh])})
              rows.append({'image':r['image'],'stringHash':f'0x{sh:08x}','dataHash':f'0x{dh:08x}','exactPairHits':hits,'dataHashHits':data_hits})
          missing=[r for r in rows if not r['exactPairHits']]
          ambiguous=[r for r in rows if sum(x['count'] for x in r['exactPairHits'])!=1]
          summary={'targets':len(rows),'resolvedExactPair':len(rows)-len(missing),'missingExactPair':len(missing),'nonUniqueExactPair':len(ambiguous),'perIpak':{leaf:sum(1 for r in rows if any(hh['ipak']==leaf for hh in r['exactPairHits'])) for leaf in roots}}
          print(json.dumps(summary,indent=2)); print('MISSING'); print(json.dumps(missing,indent=2)); print('ALL'); print(json.dumps(rows,indent=2))
          Path('ipak_identity_audit.json').write_text(json.dumps({'summary':summary,'missing':missing,'rows':rows},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: seal6-ipak-identity-audit
          path: ipak_identity_audit.json
