name: T6 current client five-root scalar relation v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_five_root_scalar_relation_v1.py'
      - '.github/workflows/t6_current_client_five_root_scalar_relation_v1.yml'
      - 'manifests/material/T6_NUKETOWN_PARENT_DEPENDENCY_CONFLICT_CENSUS_V2_FIVE_ROOT.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_ZONE_CLASSIFIER_ORDINAL_MAP_V1.json'
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Join exact conflict owners to exact current-client scalars
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_five_root_scalar_relation_v1.py \
            --conflicts manifests/material/T6_NUKETOWN_PARENT_DEPENDENCY_CONFLICT_CENSUS_V2_FIVE_ROOT.json \
            --ordinals proof/current_client/T6_CURRENT_CLIENT_ZONE_CLASSIFIER_ORDINAL_MAP_V1.json \
            --out proof/current_client/T6_CURRENT_CLIENT_FIVE_ROOT_SCALAR_RELATION_V1.json | tee /tmp/summary.log
          python3 - <<'PY'
          import json
          j=json.load(open('proof/current_client/T6_CURRENT_CLIENT_FIVE_ROOT_SCALAR_RELATION_V1.json'))
          assert j['summary']['conflictCount']==58
          assert j['summary']['relations']=={'owner0_lt_owner1':58}
          assert j['summary']['winnerCount']==0
          assert all(x['winner'] is None and x['winnerAuthority'] is False for x in j['conflicts'])
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_FIVE_ROOT_SCALAR_RELATION_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist current-client five-root scalar relations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T6_CURRENT_CLIENT_FIVE_ROOT_SCALAR_RELATION_V1
          path: |
            proof/current_client/T6_CURRENT_CLIENT_FIVE_ROOT_SCALAR_RELATION_V1.json
            /tmp/summary.log
          if-no-files-found: error
          compression-level: 9
