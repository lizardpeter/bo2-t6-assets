name: T6 current client clipMap MapEnt exact address join v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/t6_current_client_clipmap_mapents_exact_address_join_v1.py'
      - 'proof/current_client/T6_CURRENT_CLIENT_CLIPMAP_GLOBAL_LAYOUT_CANDIDATES_V1.json'
      - 'proof/current_client/T6_CURRENT_CLIENT_MAPENTS_ENTITYSTRING_ACCESSOR_CANDIDATES_V1.json'
      - '.github/workflows/t6_current_client_clipmap_mapents_exact_address_join_v1.yml'
permissions:
  contents: write
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Join exact current-client addresses
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t6_current_client_clipmap_mapents_exact_address_join_v1.py \
            --clipmap proof/current_client/T6_CURRENT_CLIENT_CLIPMAP_GLOBAL_LAYOUT_CANDIDATES_V1.json \
            --mapents proof/current_client/T6_CURRENT_CLIENT_MAPENTS_ENTITYSTRING_ACCESSOR_CANDIDATES_V1.json \
            --out proof/current_client/T6_CURRENT_CLIENT_CLIPMAP_MAPENTS_EXACT_ADDRESS_JOIN_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('proof/current_client/T6_CURRENT_CLIENT_CLIPMAP_MAPENTS_EXACT_ADDRESS_JOIN_V1.json'))
          s=d['summary']
          assert s['clipMapCandidateCount']==30
          print(json.dumps(s,indent=2,sort_keys=True))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add proof/current_client/T6_CURRENT_CLIENT_CLIPMAP_MAPENTS_EXACT_ADDRESS_JOIN_V1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist exact clipMap MapEnt address join'
            pushed=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then pushed=1; break; fi
              sleep "$attempt"
            done
            test "$pushed" = 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T6_CURRENT_CLIENT_CLIPMAP_MAPENTS_EXACT_ADDRESS_JOIN_V1
          path: proof/current_client/T6_CURRENT_CLIENT_CLIPMAP_MAPENTS_EXACT_ADDRESS_JOIN_V1.json
          if-no-files-found: error
          compression-level: 9
