name: T6 current-client structural fingerprints v1

on:
  push:
    paths:
      - '.github/workflows/t6_current_client_structural_fingerprints_v1.yml'
      - 'tools/ghidra_scripts/ExportT6StructuralFingerprints.java'
  workflow_dispatch:

permissions:
  contents: write

env:
  GHIDRA_ZIP_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
  GHIDRA_CACHE_KEY: t6-current-client-ghidra-12.1.3-77031817-v1
  CLIENT_SHA256: 770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -o /tmp/ghidra.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "$GHIDRA_ZIP_SHA256  /tmp/ghidra.zip" | sha256sum --check
          unzip -q /tmp/ghidra.zip -d /tmp
          GHIDRA_HOME="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.1.3_PUBLIC*' | head -1)"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Restore pristine analyzed current-client project
        id: ghidra-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t6-ghidra/projects
          key: ${{ env.GHIDRA_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Export whole-program structural fingerprints
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/t6-fingerprints
          mkdir -p /tmp/t6-fingerprints /tmp/t6-ghidra/config /tmp/t6-ghidra/cache
          export XDG_CONFIG_HOME=/tmp/t6-ghidra/config
          export XDG_CACHE_HOME=/tmp/t6-ghidra/cache
          export GHIDRA_HEADLESS_MAXMEM=8G
          "$GHIDRA_HOME/support/analyzeHeadless" \
            /tmp/t6-ghidra/projects t6-current-client \
            -process t6mp.exe -noanalysis -readOnly \
            -postScript ExportT6StructuralFingerprints.java /tmp/t6-fingerprints 8 \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra_scripts" -max-cpu 4
          python3 - <<'PY'
          import csv,hashlib,json,pathlib
          root=pathlib.Path('/tmp/t6-fingerprints')
          files=sorted(root.glob('fingerprints_*.tsv'))
          assert len(files)==8,len(files)
          count=0
          shards=[]
          for p in files:
              with p.open(encoding='utf-8',newline='') as f:
                  rows=list(csv.DictReader(f,dialect='excel-tab'))
              count+=len(rows)
              shards.append({'file':p.name,'rows':len(rows),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          assert count==24617,count
          summary={
            'format':'t6-structural-fingerprints-v1',
            'build':'current-client',
            'build_sha256':'770318175f0161aa7a1ff0f9a5530336836a99e72900d7608a63973e56004adf',
            'ghidra_version':'12.1.3',
            'function_rows':count,
            'shards':shards,
            'authority':'SHA-pinned current-client pristine Ghidra analysis',
            'proof_boundary':'Mechanical structural fingerprint evidence only. No cross-build identity is inferred by this export.'
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Commit compact fingerprint ledger
        shell: bash
        run: |
          set -euo pipefail
          OUT=proof/current_client/structural_fingerprints_v1
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp /tmp/t6-fingerprints/fingerprints_*.tsv /tmp/t6-fingerprints/summary.json "$OUT/"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "proof: export T6 current-client structural fingerprints"
          git pull --rebase origin main
          git push origin HEAD:main
